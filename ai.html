<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jake AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#080808;color:#fff;height:100vh;display:flex}
aside{width:260px;background:#101010;border-right:1px solid #292929;display:flex;flex-direction:column;padding:14px;gap:10px}
aside h2{color:#00ff88;font-size:16px}
#new-chat{background:#00ff88;color:#000;border:none;border-radius:8px;padding:11px;font-weight:bold;cursor:pointer}
#new-chat:hover{background:#fff}
#chat-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.chat-item{display:flex;align-items:center;gap:6px;background:#181818;border:1px solid #292929;border-radius:8px;padding:9px 10px;cursor:pointer;font-size:13px}
.chat-item.active{border-color:#00ff88}
.chat-item span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item button{background:none;border:none;color:#888;cursor:pointer;font-size:14px}
.chat-item button:hover{color:#ff5555}
main{flex:1;display:flex;flex-direction:column}
header{padding:16px 22px;border-bottom:1px solid #292929;display:flex;justify-content:space-between;align-items:center}
header a{color:#00ff88;text-decoration:none;font-size:13px}
#messages{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:12px;max-width:800px;width:100%;margin:auto}
.msg{padding:12px 15px;border-radius:12px;line-height:1.55;font-size:14px;white-space:pre-wrap;position:relative}
.code-wrap{margin:8px 0;background:#0a0a0a;border:1px solid #333;border-radius:10px;overflow:hidden;white-space:normal}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#1c1c1c;font-size:11px;color:#00ff88}
.copy-btn{background:#00ff88;border:none;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:bold;cursor:pointer;color:#000}
.copy-btn:hover{background:#fff}
.msg-copy{position:absolute;top:6px;right:6px;opacity:.4}
.msg:hover .msg-copy{opacity:1}
.code-block{margin:0;padding:12px;overflow-x:auto;font-family:Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;white-space:pre}
.inline-code{background:#000;border:1px solid #333;border-radius:4px;padding:1px 5px;font-family:Menlo,Consolas,monospace;font-size:12.5px;color:#00ff88}
.rich-text{white-space:pre-wrap;word-break:break-word}
.user{background:#00ff88;color:#000;align-self:flex-end;max-width:80%}
.ai{background:#161616;border:1px solid #2a2a2a;align-self:flex-start;max-width:85%}
.sys{color:#ff5555;font-size:13px;text-align:center}
#bar{padding:16px;border-top:1px solid #292929;display:flex;gap:10px;max-width:800px;width:100%;margin:auto}
#input{flex:1;background:#111;border:1px solid #333;color:#fff;border-radius:10px;padding:13px;outline:none;font-size:14px}
#input:focus{border-color:#00ff88}
#send{background:#00ff88;border:none;border-radius:10px;padding:0 22px;font-weight:bold;cursor:pointer}
#set-btn{background:#161616;border:1px solid #333;color:#fff;border-radius:8px;padding:11px;cursor:pointer;font-size:13px;width:100%}
#set-btn:hover{border-color:#00ff88}
#set-pop{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111;border:1px solid #00ff88;border-radius:14px;padding:0;width:360px;max-width:94vw;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,.6);overflow:hidden}
#set-tabs{display:flex;border-bottom:1px solid #2a2a2a}
#set-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 0;font-size:13px;font-weight:bold;color:#00ff88}
#set-x{background:none;border:none;color:#888;font-size:16px;cursor:pointer;padding:4px 8px}
#set-x:hover{color:#fff}
.set-tab{flex:1;background:none;border:none;color:#888;padding:12px;cursor:pointer;font-size:13px;font-weight:bold}
.set-tab.active{color:#00ff88;border-bottom:2px solid #00ff88}
#set-body{padding:12px;max-height:50vh;overflow-y:auto}
.model-opt{display:block;width:100%;text-align:left;background:#181818;border:1px solid #2a2a2a;color:#fff;border-radius:10px;padding:10px;margin-bottom:6px;cursor:pointer}
.model-opt.active{border-color:#00ff88}
.model-opt b{font-size:13px;display:block}
.model-opt small{color:#999;font-size:12px}
.len-opt{display:block;width:100%;text-align:left;background:#181818;border:1px solid #2a2a2a;color:#fff;border-radius:10px;padding:10px;margin-bottom:6px;cursor:pointer}
.len-opt.active{border-color:#00ff88}
.len-opt b{font-size:13px;display:block}
.len-opt small{color:#999;font-size:12px}
.toggle-row{display:flex;justify-content:space-between;align-items:center;background:#181818;border:1px solid #2a2a2a;border-radius:10px;padding:10px;margin-top:6px;font-size:13px}
.toggle{width:44px;height:24px;border-radius:12px;background:#333;border:none;cursor:pointer;position:relative;flex:none}
.toggle.on{background:#00ff88}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on::after{left:22px}
.think-line{font-size:12px;color:#00ff88;margin-bottom:6px}
.dots span{display:inline-block;font-size:20px;animation:bounce .9s infinite}
.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
#send.stop{background:#ff5555;color:#fff}
#mic{background:#161616;border:1px solid #333;color:#fff;border-radius:10px;padding:0 13px;cursor:pointer;font-size:17px}
#mic.listening{border-color:#ff5555;background:#331111}
#model-tag{font-size:11px;color:#00ff88;background:#10281c;border:1px solid #1f4d35;border-radius:20px;padding:3px 10px;margin-left:8px;white-space:nowrap}
@media(max-width:700px){
  body{flex-direction:column;height:100dvh}
  aside{width:100%;border-right:none;border-bottom:1px solid #292929;padding:10px;gap:8px}
  aside h2{display:flex;justify-content:space-between;align-items:center}
  #new-chat{order:2}
  #chat-list{order:3;flex-direction:row;overflow-x:auto;max-height:52px;flex:none}
  .chat-item{white-space:nowrap;flex:none;max-width:160px}
  header{padding:10px 12px}
  #messages{padding:12px}
  #bar{padding:10px;gap:6px;flex-wrap:nowrap}
  #input{flex:1;min-width:0;padding:11px}
  #send{padding:0 14px;flex:none}
  #set-pop{bottom:70px}
  #set-btn{position:fixed;bottom:14px;left:14px;width:auto;z-index:40;padding:10px 14px;border-radius:20px;background:#161616e6}
  main{padding-bottom:56px}
}
</style>
</head>
<body>
<aside>
  <h2><span>JAKE AI</span><a id="all-proj-m" href="index.html" style="color:#00ff88;text-decoration:none;font-size:12px">← ALL PROJECTS</a></h2>
  <button id="new-chat">+ New chat</button>
  <div id="chat-list"></div>
  <button id="set-btn">⚙️ Settings</button>
</aside>
<main>
  <header><span><strong id="title">New chat</strong><span id="model-tag">Balanced</span></span><a id="all-proj-d" href="index.html">← ALL PROJECTS</a></header>
  <div id="messages"></div>
  <div id="bar">
    <button id="mic" title="Voice input">🎤</button>
    <input id="input" placeholder="Ask anything..." autocomplete="off">
    <button id="send">Send</button>
  </div>
  <div id="set-pop" hidden>
    <div id="set-head"><span>Settings</span><button id="set-x" aria-label="Close">✕</button></div>
    <div id="set-tabs">
      <button class="set-tab active" data-tab="model">🤖 Model</button>
      <button class="set-tab" data-tab="general">⚙️ General</button>
    </div>
    <div id="set-body">
      <div id="tab-model"><div id="model-opts"></div></div>
      <div id="tab-general" hidden>
        <div style="font-size:12px;color:#00ff88;font-weight:bold;margin:4px 2px 8px">RESPONSE LENGTH</div>
        <div id="len-opts"></div>
        <div class="toggle-row"><span>👁️ Show AI thinking</span><button id="think-toggle" class="toggle" aria-label="toggle thinking"></button></div>
        <div style="font-size:11px;color:#666;margin-top:8px">Thinking shows live status (model + seconds) instead of frozen "...". True inner thoughts aren't exposed by these models.</div>
      </div>
    </div>
  </div>
</main>
<script>
const LS = "jake-ai-chats";
const MLS = "jake-ai-model";
const MODELS = [
  {id:"@cf/meta/llama-3.2-1b-instruct", label:"⚡ Very Fast", desc:"Not smart — instant answers, simple Q&A"},
  {id:"@cf/meta/llama-4-scout-17b-16e-instruct", label:"🚀 Fast", desc:"Fast, decent smarts — everyday use"},
  {id:"@cf/meta/llama-3.3-70b-instruct-fp8-fast", label:"⚖️ Balanced", desc:"Smart + still fast — recommended"},
  {id:"@cf/openai/gpt-oss-120b", label:"🧠 Very Smart", desc:"Very smart, slow (~10s) — hard code/reasoning"},
  {id:"@cf/deepseek-ai/deepseek-r1-distill-qwen-32b", label:"🐢 Genius Slow", desc:"Thinks step-by-step — math/logic, slowest"},
];
let curModel = localStorage.getItem(MLS) || MODELS[2].id;
let chats = {};
let current = null;
try { chats = JSON.parse(localStorage.getItem(LS) || "{}"); } catch(e){ chats = {}; }

function save(){ try{ localStorage.setItem(LS, JSON.stringify(chats)); }catch(e){} }
function uid(){ return "c" + Date.now().toString(36) + Math.floor(Math.random()*999); }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function renderList(){
  const list = document.getElementById("chat-list");
  list.innerHTML = "";
  const ids = Object.keys(chats).sort((a,b)=> (chats[b].updated||0)-(chats[a].updated||0));
  if(!ids.length){ list.innerHTML = '<div style="color:#555;font-size:13px">No chats yet</div>'; return; }
  ids.forEach(id=>{
    const d = document.createElement("div");
    d.className = "chat-item" + (id===current?" active":"");
    const s = document.createElement("span");
    s.textContent = chats[id].title || "New chat";
    s.onclick = ()=>{ current=id; renderAll(); };
    const del = document.createElement("button");
    del.textContent = "🗑";
    del.title = "Delete";
    del.onclick = (e)=>{ e.stopPropagation(); delete chats[id]; if(current===id) current=null; save(); renderAll(); };
    d.appendChild(s); d.appendChild(del);
    list.appendChild(d);
  });
}

function renderMsgs(){
  const box = document.getElementById("messages");
  box.innerHTML = "";
  const c = chats[current];
  document.getElementById("title").textContent = c ? (c.title||"Chat") : "New chat";
  if(!c || !c.msgs.length){ box.innerHTML = '<div class="msg ai">👋 Hi, I\'m Jake AI. Ask me anything.</div>'; return; }
  c.msgs.forEach(m=>{
    const d = document.createElement("div");
    d.className = "msg " + (m.role==="user"?"user":"ai");
    if(m.role==="user"){ d.textContent = m.content; }
    else { d.innerHTML = ""; renderRich(d, m.content); }
    box.appendChild(d);
  });
  box.scrollTop = box.scrollHeight;
}
function renderAll(){ renderList(); renderMsgs(); }
function escH(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function renderRich(el, text){
  const parts = String(text).split(/```/);
  parts.forEach((p, i)=>{
    if(i % 2 === 1){
      // code block: optional first line = language
      let lang = "", code = p;
      const nl = p.indexOf("\n");
      if(nl > -1 && nl < 20){ const maybe = p.slice(0, nl).trim(); if(/^[a-zA-Z0-9+#-]+$/.test(maybe)){ lang = maybe; code = p.slice(nl+1); } }
      const wrap = document.createElement("div"); wrap.className = "code-wrap";
      const head = document.createElement("div"); head.className = "code-head";
      const lb = document.createElement("span"); lb.textContent = lang || "code";
      const cb = document.createElement("button"); cb.className = "copy-btn"; cb.textContent = "📋 Copy";
      cb.onclick = async ()=>{ try{ await navigator.clipboard.writeText(code.replace(/\n$/,"")); cb.textContent = "✅ Copied!"; setTimeout(()=>cb.textContent="📋 Copy",1500);}catch(e){ cb.textContent = "❌ Failed"; } };
      head.appendChild(lb); head.appendChild(cb);
      const pre = document.createElement("pre"); pre.className = "code-block";
      const cd = document.createElement("code"); cd.textContent = code.replace(/\n$/,"");
      pre.appendChild(cd); wrap.appendChild(head); wrap.appendChild(pre);
      el.appendChild(wrap);
    } else {
      const div = document.createElement("div"); div.className = "rich-text";
      div.innerHTML = escH(p).replace(/`([^`\n]+)`/g, "<code class='inline-code'>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
      el.appendChild(div);
    }
  });
  // whole-message copy
  const all = document.createElement("button"); all.className = "copy-btn msg-copy"; all.textContent = "📋";
  all.title = "Copy full answer";
  all.onclick = async ()=>{ try{ await navigator.clipboard.writeText(text); all.textContent = "✅"; setTimeout(()=>all.textContent="📋",1500);}catch(e){} };
  el.appendChild(all);
}

function newChat(){
  current = uid();
  chats[current] = { title:"New chat", msgs:[], updated:Date.now() };
  save(); renderAll();
  document.getElementById("input").focus();
}

let aborter = null;
async function send(){
  const inp = document.getElementById("input");
  const btn = document.getElementById("send");
  if(aborter){ aborter.abort(); return; }
  const text = inp.value.trim();
  if(!text) return;
  if(!current) newChat();
  const c = chats[current];
  c.msgs.push({role:"user", content:text});
  if(c.msgs.length===1) c.title = text.slice(0,32);
  c.updated = Date.now();
  inp.value = "";
  btn.textContent = "■ Stop"; btn.classList.add("stop");
  aborter = new AbortController();
  save(); renderMsgs();
  const box = document.getElementById("messages");
  const t = document.createElement("div");
  t.className = "msg ai"; t.id="typing";
  const mLabel = (MODELS.find(x=>x.id===curModel)||{}).label || "AI";
  const t0 = Date.now();
  const renderThink = ()=>{
    const s = ((Date.now()-t0)/1000).toFixed(1);
    if(showThink){ t.innerHTML = ""; const l=document.createElement("div"); l.className="think-line"; l.textContent = "🧠 "+mLabel+" thinking… "+s+"s"; const d=document.createElement("div"); d.className="dots"; d.innerHTML="<span>.</span><span>.</span><span>.</span>"; t.appendChild(l); t.appendChild(d); }
    else { t.innerHTML = '<div class="dots"><span>.</span><span>.</span><span>.</span></div>'; }
  };
  renderThink();
  box.appendChild(t); box.scrollTop = box.scrollHeight;
  const thinkTimer = setInterval(renderThink, 400);

  const sys = LENGTHS[curLen] ? LENGTHS[curLen].sys : "";
  const payload = c.msgs.slice(-20);
  if(sys) payload.unshift({role:"system", content:sys});

  // live streaming bubble
  const live = document.createElement("div");
  live.className = "msg ai"; live.hidden = true;
  box.appendChild(live);
  let reply = "", gotStream = false, stopped = false;
  const flush = (done)=>{
    live.hidden = false; live.innerHTML = ""; renderRich(live, reply || (done ? "(empty reply)" : "…"));
    box.scrollTop = box.scrollHeight;
  };
  try {
    const r = await fetch("/api/chat?stream=1", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ messages: payload, model: curModel }),
      signal: aborter.signal
    });
    const ct = r.headers.get("content-type") || "";
    if(ct.includes("text/event-stream")){
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      document.getElementById("typing")?.remove();
      while(true){
        const {done, value} = await reader.read();
        if(done) break;
        buf += dec.decode(value, {stream:true});
        const lines = buf.split("\n"); buf = lines.pop();
        for(const ln of lines){
          const s = ln.trim();
          if(!s.startsWith("data:")) continue;
          const d = s.slice(5).trim();
          if(d === "[DONE]") break;
          try{
            const j = JSON.parse(d);
            const tok = j.response || j.result?.response || "";
            if(tok){ reply += tok; gotStream = true; flush(false); }
          }catch(e){}
        }
      }
    } else {
      const data = await r.json();
      reply = data.reply || ("Error: " + (data.error||r.status));
    }
  } catch(e) {
    if(e && e.name === "AbortError"){ stopped = true; reply = reply ? reply + "\n\n⏹ Stopped." : "⏹ Stopped."; }
    else if(!gotStream){ reply = "Offline demo reply: you said \"" + text + "\"."; }
  }
  clearInterval(thinkTimer);
  document.getElementById("typing")?.remove();
  live.remove();
  c.msgs.push({role:"assistant", content:reply});
  c.updated = Date.now();
  save(); renderMsgs();
  aborter = null; btn.textContent = "Send"; btn.classList.remove("stop");
}

document.getElementById("new-chat").onclick = newChat;
document.getElementById("send").onclick = send;
document.getElementById("input").addEventListener("keydown", e=>{ if(e.key==="Enter") send(); });
const LENGTHS = {
  short: {label:"✂️ Short", desc:"1-3 sentences, no fluff", sys:"Answer in 1-3 short sentences. Be extremely concise. No extra detail."},
  normal: {label:"📝 Normal", desc:"Balanced default answers", sys:"Answer normally with balanced detail."},
  long: {label:"📚 Long", desc:"Detailed, thorough responses", sys:"Give long, detailed, thorough answers with examples where helpful."},
};
let curLen = localStorage.getItem("jake-ai-len") || "normal";
let showThink = localStorage.getItem("jake-ai-think") !== "off";
function renderSettings(){
  const m = MODELS.find(x=>x.id===curModel) || MODELS[2];
  const mt = document.getElementById("model-tag"); if(mt) mt.textContent = m.label;
  const box = document.getElementById("model-opts");
  box.innerHTML = "";
  MODELS.forEach(m2=>{
    const b = document.createElement("button");
    b.className = "model-opt" + (m2.id===curModel?" active":"");
    const t = document.createElement("b"); t.textContent = m2.label;
    const s = document.createElement("small"); s.textContent = m2.desc;
    b.appendChild(t); b.appendChild(s);
    b.onclick = ()=>{ curModel = m2.id; try{localStorage.setItem(MLS,curModel);}catch(e){} renderSettings(); };
    box.appendChild(b);
  });
  const lb = document.getElementById("len-opts");
  lb.innerHTML = "";
  Object.keys(LENGTHS).forEach(k=>{
    const b = document.createElement("button");
    b.className = "len-opt" + (k===curLen?" active":"");
    const t = document.createElement("b"); t.textContent = LENGTHS[k].label;
    const s = document.createElement("small"); s.textContent = LENGTHS[k].desc;
    b.appendChild(t); b.appendChild(s);
    b.onclick = ()=>{ curLen = k; try{localStorage.setItem("jake-ai-len",k);}catch(e){} renderSettings(); };
    lb.appendChild(b);
  });
  document.getElementById("think-toggle").classList.toggle("on", showThink);
}
document.getElementById("think-toggle").onclick = ()=>{ showThink = !showThink; try{localStorage.setItem("jake-ai-think", showThink?"on":"off");}catch(e){} renderSettings(); };
document.querySelectorAll(".set-tab").forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll(".set-tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    document.getElementById("tab-model").hidden = t.dataset.tab !== "model";
    document.getElementById("tab-general").hidden = t.dataset.tab !== "general";
  };
});
document.getElementById("set-btn").onclick = (e)=>{ e.stopPropagation(); const p=document.getElementById("set-pop"); p.hidden=!p.hidden; };
document.getElementById("set-x").onclick = (e)=>{ e.stopPropagation(); document.getElementById("set-pop").hidden = true; };
document.getElementById("set-pop").addEventListener("click", (e)=> e.stopPropagation());
document.addEventListener("click", (e)=>{ const p=document.getElementById("set-pop"); if(!p.hidden && !p.contains(e.target) && e.target.id!=="set-btn" && !document.getElementById("set-btn").contains(e.target)) p.hidden=true; });
// voice input
document.getElementById("mic").onclick = ()=>{
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = document.getElementById("mic");
  if(!SR){ alert("Voice not supported in this browser — try Chrome on phone/desktop."); return; }
  const rec = new SR();
  rec.lang = "en-US"; rec.interimResults = false;
  mic.classList.add("listening");
  rec.onresult = (e)=>{ document.getElementById("input").value = e.results[0][0].transcript; document.getElementById("input").focus(); };
  rec.onend = ()=> mic.classList.remove("listening");
  rec.onerror = ()=> mic.classList.remove("listening");
  rec.start();
};
// mobile: ALL PROJECTS only at top, hide duplicate
if(window.matchMedia("(max-width:700px)").matches){ document.getElementById("all-proj-d")?.remove(); }
else { document.getElementById("all-proj-m")?.remove(); }
renderSettings();
renderAll();
</script>
</body>
</html>
