<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fortnite Grind</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --cyan: #00f6ff;
  --blue: #008cff;
  --purple: #8a2eff;
  --pink: #ff18d0;
  --green: #00ff9d;
  --text: #f5fbff;
}

html,
body {
  height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font-family: Inter, Arial, Helvetica, sans-serif;
  background:
    radial-gradient(circle at 12% 8%, rgba(0,255,157,.34), transparent 46%),
    radial-gradient(circle at 88% 12%, rgba(255,24,208,.32), transparent 46%),
    radial-gradient(circle at 78% 88%, rgba(138,46,255,.36), transparent 50%),
    radial-gradient(circle at 22% 80%, rgba(0,140,255,.32), transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(0,246,255,.14), transparent 62%),
    #01030a;
  overflow-x: hidden;
}

/* Slowly rotating neon wash so the colour never sits still */

body::before {
  content: "";
  position: fixed;
  inset: -45%;
  z-index: -3;
  pointer-events: none;
  opacity: .42;
  background: conic-gradient(
    from 0deg,
    rgba(0,255,157,.26),
    rgba(0,140,255,.26),
    rgba(138,46,255,.30),
    rgba(255,24,208,.26),
    rgba(0,255,157,.26)
  );
  filter: blur(80px);
  animation: neonSpin 26s linear infinite;
}

@keyframes neonSpin {
  to {
    transform: rotate(360deg) scale(1.08);
  }
}

/* =========================
   MATRIX RAIN
========================= */

/* Stacking order, bottom to top:
   body::before  neon wash          z-index -4
   #matrix       falling code       z-index -3
   #veil         readability shade  z-index -2
   #guard        opaque text backing z-index -1
   .app          real content       z-index auto
   The guard sits directly above the rain and directly below the words, so
   the code shows through every panel and button but never through a letter. */

#matrix {
  position: fixed;
  inset: 0;
  z-index: -3;
  pointer-events: none;
}

#guard {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
}

/* Just enough shade to keep the title legible, not enough to hide the rain */

#veil {
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background:
    linear-gradient(100deg, rgba(1,3,10,.72) 0%, rgba(1,3,10,.18) 42%, transparent 66%),
    radial-gradient(ellipse at center, transparent 45%, rgba(0,2,8,.5) 100%);
}

.app {
  position: relative;
  width: 100%;
  max-width: 1180px;
  margin: auto;
  padding: 24px 20px 70px;
}

/* =========================
   HEADER
========================= */

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  margin-bottom: 24px;
}

.title-area h1 {
  margin: 0;
  font-size: clamp(24px, 4.5vw, 32px);
  font-weight: 950;
  letter-spacing: -1.5px;
  background: linear-gradient(
    90deg,
    var(--cyan),
    white,
    var(--pink),
    var(--purple)
  );
  background-size: 250% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: titleFlow 5s linear infinite;
  filter: drop-shadow(0 0 16px rgba(0,246,255,.55));
}

@keyframes titleFlow {
  to {
    background-position: 250% center;
  }
}

/* Glassy enough to show the rain through it, dark text-shadow so the
   label stays readable over a bright column of falling code */

.grind-hub {
  text-decoration: none;
  color: white;
  font-weight: 900;
  padding: 13px 19px;
  border-radius: 13px;
  border: 1px solid rgba(0,246,255,.55);
  background: rgba(4,10,24,.26);
  -webkit-backdrop-filter: blur(7px);
  backdrop-filter: blur(7px);
  box-shadow:
    0 0 15px rgba(0,246,255,.14),
    inset 0 0 15px rgba(0,246,255,.05);
  text-shadow:
    0 1px 2px rgba(0,0,0,.95),
    0 0 12px rgba(0,0,0,.85);
  transition: .25s;
  white-space: nowrap;
}

.grind-hub:hover {
  transform: translateY(-2px) scale(1.03);
  border-color: var(--cyan);
  color: var(--cyan);
  background: rgba(4,10,24,.18);
  box-shadow:
    0 0 25px rgba(0,246,255,.45),
    0 0 50px rgba(138,46,255,.18);
  text-shadow:
    0 1px 2px rgba(0,0,0,.95),
    0 0 14px rgba(0,246,255,.6);
}

@media (max-width: 600px) {
  header {
    align-items: stretch;
    flex-direction: column;
  }

  .grind-hub {
    text-align: center;
  }
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>
<div id="veil"></div>
<canvas id="guard"></canvas>

<div class="app">

  <header>
    <div class="title-area">
      <h1>Fortnite Grind</h1>
    </div>

    <a class="grind-hub" href="MyGrindHub/index.html">
      Grind Hub
    </a>
  </header>

</div>

<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

/* The text guard: an opaque silhouette drawn exactly where the words are, so
   falling code can be seen through every panel but never through a letter. */
const guard = document.getElementById("guard");
const gctx = guard.getContext("2d");

const GUARD_INK = "#01030a";

/* Second, low-res canvas that only holds the bright bits. Compositing it
   back with a blur is what turns flat text into neon glow. */
const bloom = document.createElement("canvas");
const bctx = bloom.getContext("2d");

const BLOOM_SCALE = 0.5;

const reduceMotion =
  window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const SPEED_SCALE = reduceMotion ? 0.22 : 1;

let W = 0;
let H = 0;
let dpr = 1;

/* ---------- look ---------- */

const NEON = [
  { rgb: "0,255,170", weight: 40 },   /* green   */
  { rgb: "0,246,255", weight: 24 },   /* cyan    */
  { rgb: "60,150,255", weight: 15 },  /* blue    */
  { rgb: "160,90,255", weight: 12 },  /* purple  */
  { rgb: "255,60,220", weight: 9 }    /* pink    */
];

const NEON_TOTAL = NEON.reduce((s, c) => s + c.weight, 0);

function pickNeon() {
  let roll = Math.random() * NEON_TOTAL;

  for (const c of NEON) {
    roll -= c.weight;
    if (roll <= 0) return c.rgb;
  }

  return NEON[0].rgb;
}

/* ---------- layers ---------- */

/* Three depths so the field has parallax instead of looking like one
   flat sheet of text. Far is small, slow and dim; near is large and hot. */

const LAYERS = [
  { cell: 30, trail: 16, minSpeed: 0.16, maxSpeed: 0.42, dim: 0.20, bloom: 8 },
  { cell: 21, trail: 18, minSpeed: 0.28, maxSpeed: 0.62, dim: 0.40, bloom: 8 },
  { cell: 15, trail: 22, minSpeed: 0.44, maxSpeed: 0.95, dim: 0.70, bloom: 10 },
  { cell: 11, trail: 26, minSpeed: 0.62, maxSpeed: 1.50, dim: 1.00, bloom: 10 }
];

let layers = [];

function rand(min, max) {
  return min + Math.random() * (max - min);
}

function newColumn(layer, scattered) {

  return {
    y: scattered ? rand(-H, H * 0.7) : rand(-H * 0.3, H * 0.4),
    speed: rand(layer.minSpeed, layer.maxSpeed) * SPEED_SCALE,
    color: pickNeon(),
    glyphs: []
  };

}

function buildLayer(layer) {

  const count = Math.ceil(W / layer.cell) + 2;

  layer.columns = new Array(count).fill(null).map(() => newColumn(layer, true));

}

/* ---------- sizing ---------- */

function resize() {

  dpr = Math.min(window.devicePixelRatio || 1, 2);

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.textBaseline = "top";

  guard.width = W * dpr;
  guard.height = H * dpr;
  guard.style.width = W + "px";
  guard.style.height = H + "px";

  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.textBaseline = "top";

  bloom.width = Math.max(1, W * dpr * BLOOM_SCALE);
  bloom.height = Math.max(1, H * dpr * BLOOM_SCALE);

  bctx.setTransform(dpr * BLOOM_SCALE, 0, 0, dpr * BLOOM_SCALE, 0, 0);
  bctx.textBaseline = "top";

  const scale = W < 600 ? 0.8 : 1;

  layers = LAYERS.map((l) => {
    const layer = { ...l, cell: Math.max(9, Math.round(l.cell * scale)) };
    buildLayer(layer);
    return layer;
  });

  paintGuard();

}

/* ---------- painting ---------- */

function fontFor(layer) {
  return "600 " + layer.cell + "px 'SFMono-Regular', 'Cascadia Mono', Consolas, 'Courier New', monospace";
}

function paintLayer(g, layer, forBloom) {

  g.font = fontFor(layer);

  const cols = layer.columns;
  const cell = layer.cell;
  const dim = layer.dim;

  /* how much of each trail the bloom pass bothers with */
  const bloomDepth = forBloom ? layer.bloom : layer.trail;

  for (let i = 0; i < cols.length; i++) {

    const col = cols[i];
    const x = i * cell;
    const glyphs = col.glyphs;
    const limit = Math.min(glyphs.length, bloomDepth);

    for (let t = 0; t < limit; t++) {

      const gl = glyphs[t];
      const y = gl.y * cell;

      if (y < -cell || y > H) continue;

      if (t === 0) {
        /* the head — white hot, and it glows harder the nearer you get */
        g.fillStyle = forBloom
          ? "rgba(" + col.color + ",.85)"
          : "rgb(235,255,255)";
        g.fillText(gl.g, x, y);
        continue;
      }

      const fade = 1 - t / glyphs.length;
      const alpha = Math.pow(fade, 2) * 0.95 * dim;

      if (alpha < 0.015) continue;

      g.fillStyle = "rgba(" + col.color + "," + alpha.toFixed(3) + ")";
      g.fillText(gl.g, x, y);

    }

  }

}

/* ---------- text guard ---------- */

/* Elements whose text must stay readable. Anything with no direct text node
   is skipped, so this keeps working as the page grows. */
const SHIELD = ".title-area h1, .grind-hub";

function paintGuard() {

  gctx.clearRect(0, 0, W, H);

  const nodes = document.querySelectorAll(SHIELD);

  nodes.forEach((el) => {

    const cs = getComputedStyle(el);

    if (cs.display === "none" || cs.visibility === "hidden") return;
    if (parseFloat(cs.opacity) === 0) return;

    gctx.font =
      cs.fontStyle + " " +
      cs.fontWeight + " " +
      cs.fontSize + " " +
      cs.fontFamily;

    gctx.textBaseline = "top";
    gctx.textAlign = cs.textAlign === "center" ? "center"
                   : cs.textAlign === "right" ? "right"
                   : "left";

    /* Range rects give the real laid-out glyph boxes, which keeps the
       silhouette glued to the text even after a resize. */
    const range = document.createRange();
    range.selectNodeContents(el);

    const text = el.textContent.replace(/\s+/g, " ").trim();

    if (!text) return;

    const rects = Array.from(range.getClientRects()).filter(
      (r) => r.width > 0 && r.height > 0
    );

    const lineHeight = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.2;

    rects.forEach((r) => {

      /* centre the glyphs vertically inside the line box */
      const y = r.top + (r.height - lineHeight) / 2;

      let x = r.left;
      if (gctx.textAlign === "center") x = r.left + r.width / 2;
      if (gctx.textAlign === "right") x = r.right;

      /* dilated outline first so the code can't peek between the stroke
         and the letterform, then the solid body of the glyph */
      gctx.fillStyle = GUARD_INK;
      gctx.strokeStyle = GUARD_INK;
      gctx.lineJoin = "round";
      gctx.lineWidth = 3;
      gctx.strokeText(text, x, y);
      gctx.fillText(text, x, y);

    });

  });

}

/* ---------- cursor trail ---------- */

const light = {
  x: -9999,
  y: -9999,
  tx: -9999,
  ty: -9999,
  strength: 0
};

/* Short on purpose: 21 samples at 7px apart is under ~150px of tail, so it
   reads as a comet streak instead of a smear over the page. */
const TRAIL_MAX = 21;
const TRAIL_STEP = 7;
const TRAIL_FADE_MS = 260;

/* When the cursor goes still the tail dims but never disappears, so there is
   always a small coloured glow sitting under the pointer. */
const TRAIL_IDLE = 0.3;
const HEAD_R = 30;

const trail = [];
let trailAlpha = 1;
let lastMoveAt = 0;

const TRAIL_STOPS = [
  [0, 246, 255],
  [138, 46, 255],
  [255, 24, 208]
];

function trailColor(t, mul, alpha) {

  const n = TRAIL_STOPS.length - 1;
  const p = Math.min(t, 0.999) * n;
  const i = Math.floor(p);
  const f = p - i;
  const a = TRAIL_STOPS[i];
  const b = TRAIL_STOPS[i + 1];

  const r = Math.round(a[0] + (b[0] - a[0]) * f);
  const g = Math.round(a[1] + (b[1] - a[1]) * f);
  const bl = Math.round(a[2] + (b[2] - a[2]) * f);

  return "rgba(" + r + "," + g + "," + bl + "," + (alpha * mul).toFixed(3) + ")";

}

function pushTrail(x, y) {

  const last = trail[trail.length - 1];

  if (last) {

    const d = Math.hypot(x - last.x, y - last.y);

    if (d < TRAIL_STEP) return;

    /* long jumps (window snap, teleport) shouldn't draw a bar across the page */
    if (d > 260) {
      trail.length = 0;
    }

  }

  trail.push({ x, y });

  while (trail.length > TRAIL_MAX) trail.shift();

  window.__trailDebug = trail;

}

function paintTrail(g, now) {

  const idle = now - lastMoveAt >= TRAIL_FADE_MS;

  trailAlpha += ((idle ? TRAIL_IDLE : 1) - trailAlpha) * 0.1;

  const onPage = light.tx > -1000;

  /* the head follows the eased cursor, so the glow stays under the pointer
     even when the mouse has stopped dead */
  const hx = light.x;
  const hy = light.y;

  const boost = g === bctx ? 1.25 : 1;

  if (onPage && light.strength > 0.01) {

    const a = trailAlpha * light.strength * boost;

    g.save();
    g.globalCompositeOperation = "lighter";

    const dot = g.createRadialGradient(hx, hy, 0, hx, hy, HEAD_R);

    dot.addColorStop(0, "rgba(235,255,255," + (0.75 * a) + ")");
    dot.addColorStop(0.28, "rgba(0,246,255," + (0.45 * a) + ")");
    dot.addColorStop(0.62, "rgba(150,60,255," + (0.20 * a) + ")");
    dot.addColorStop(1, "rgba(255,24,208,0)");

    g.fillStyle = dot;
    g.fillRect(hx - HEAD_R, hy - HEAD_R, HEAD_R * 2, HEAD_R * 2);

    g.restore();

  }

  if (trailAlpha < 0.01 || trail.length < 2) return;

  g.save();
  g.globalCompositeOperation = "lighter";
  g.lineCap = "round";
  g.lineJoin = "round";

  /* wide soft pass, then a thin bright core on top */
  for (let pass = 0; pass < 2; pass++) {

    const wide = pass === 0;

    for (let i = 1; i < trail.length; i++) {

      const a = trail[i - 1];
      const b = trail[i];
      const t = i / (trail.length - 1);
      const alpha = Math.pow(t, 1.4) * trailAlpha * boost;

      if (alpha < 0.015) continue;

      g.lineWidth = wide ? 3 + t * 24 : 1.5 + t * 5;
      g.strokeStyle = trailColor(t, wide ? 0.42 : 0.95, alpha);

      g.beginPath();
      g.moveTo(a.x, a.y);
      g.lineTo(b.x, b.y);
      g.stroke();

    }

  }

  g.restore();

}



/* ---------- frame ---------- */

function draw(now) {

  ctx.clearRect(0, 0, W, H);

  for (const layer of layers) paintLayer(ctx, layer, false);

  /* bloom pass */
  bctx.clearRect(0, 0, W, H);

  for (const layer of layers) paintLayer(bctx, layer, true);

  /* the trail is drawn into the bloom buffer too, so it picks up the same
     blurred glow as the rain */
  paintTrail(bctx, now);

  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.filter = "blur(7px)";
  ctx.globalAlpha = 0.85;
  ctx.drawImage(bloom, 0, 0, W, H);
  ctx.restore();

  paintTrail(ctx, now);

}

/* ---------- loop ---------- */

let last = 0;

function frame(now) {

  const dt = last ? Math.min((now - last) / 16.666, 3) : 1;
  last = now;

  light.x += (light.tx - light.x) * 0.09;
  light.y += (light.ty - light.y) * 0.09;
  light.strength += ((light.tx > -1000 ? 1 : 0) - light.strength) * 0.06;

  for (const layer of layers) {

    const cell = layer.cell;
    const cols = layer.columns;

    for (let i = 0; i < cols.length; i++) {

      const col = cols[i];

      col.y += col.speed * dt;

      if (col.y * cell > H + cell) {
        cols[i] = newColumn(layer, false);
        continue;
      }

      col.glyphs.unshift({ y: col.y, g: randomGlyph() });

      while (col.glyphs.length > layer.trail) col.glyphs.pop();

      /* drop glyphs that have scrolled off the top so the loop stays cheap */
      while (
        col.glyphs.length > 1 &&
        col.glyphs[col.glyphs.length - 1].y * cell < -cell
      ) {
        col.glyphs.pop();
      }

    }

  }

  draw(now);

  requestAnimationFrame(frame);

}

function randomGlyph() {
  return Math.random() < 0.5 ? "0" : "1";
}

/* ---------- input ---------- */

window.addEventListener("mousemove", (e) => {
  light.tx = e.clientX;
  light.ty = e.clientY;
  lastMoveAt = performance.now();
  pushTrail(e.clientX, e.clientY);
});

window.addEventListener("touchmove", (e) => {
  if (!e.touches[0]) return;
  light.tx = e.touches[0].clientX;
  light.ty = e.touches[0].clientY;
  lastMoveAt = performance.now();
  pushTrail(e.clientX, e.clientY);
}, { passive: true });

document.addEventListener("mouseleave", () => {
  light.tx = -9999;
  light.ty = -9999;
  lastMoveAt = 0;
  trail.length = 0;
});

window.addEventListener("resize", resize);

/* ---------- start ---------- */

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
