<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Chat App</title>
  <style>
    body {font-family: Arial, sans-serif; margin: 0; padding: 0; background:#f4f4f4; color:#333;}
    .container {max-width: 800px; margin: 2rem auto; padding: 1rem;}
    .form-group {margin-bottom: 1rem;}
    .form-group label {display: block; margin-bottom: 0.5rem;}
    .btn {padding: 0.5rem 1rem; cursor: pointer; border:none; border-radius:4px; background:#0066cc; color:#fff;}
    .btn:hover {background:#0052a3;}
    #loginScreen, #appScreen {display: none;}
    #loginScreen.active {display: block;}
    #appScreen.active {display: block;}
    #friendsList {float: left; width: 200px; margin-right: 2rem;}
    #chatArea {margin-left: 220px; padding-left: 2rem; border-left: 2px solid #ccc;}
    #messages {height: 300px; overflow-y: auto; border:1px solid #ddd; padding:1rem; margin-bottom:1rem; background:#fff;}
    #formMessage {display:flex;} input {flex:1; padding:0.5rem;}
    .active {display: block !important;}
  </style>
</head>
<body>
  <div class="container">
    <!-- ==== LOGIN / SIGNUP SCREEN ==== -->
    <div id="loginScreen">
      <h2>Login / Signup</h2>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="usernameInput" placeholder="Enter username">
      </div>
      <button class="btn" onclick="attemptLogin()">Enter Chat</button>
    </div>

    <!-- ==== MAIN APP SCREEN ==== -->
    <div id="appScreen">
      <div id="friendsList">
        <h3>Friends</h3>
        <ul id="friendsUl"></ul>
        <div class="form-group" style="margin-top:1rem;">
          <label>Add Friend (username)</label>
          <input type="text" id="addFriendInput" placeholder="username">
          <button class="btn" onclick="addFriend()">Add</button>
        </div>
      </div>

      <div id="chatArea">
        <h3>Chat</h3>
        <div id="messages"></div>
        <form id="msgForm" onsubmit="sendMessage(event); return false;">
          <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off">
          <button type="submit" class="btn">Send</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // ==== CONFIGURATION ====
    const WS_PATH = 'ws://' + location.host + '/ws';
    let ws = null;
    let currentUser = null;
    let connectedUsers = {};
    let selectedFriend = null;

    // ==== UI HELPERS ====
    function showScreen(id) {
      document.querySelectorAll('#loginScreen, #appScreen').forEach(s=>s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // ==== LOGIN / SIGNUP ====
    async function attemptLogin() {
      const username = document.getElementById('usernameInput').value.trim();
      if (!username) return alert('Enter a username');
      const resp = await fetch('/api/login', {
        method: 'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({username})
      });
      const data = await resp.json();
      if (!resp.ok) return alert(data.message || 'Login failed');
      currentUser = data.user;
      ws = new WebSocket(WS_PATH);
      ws.onopen = () => {
        ws.send(JSON.stringify({type:'auth', username}));
      };
      ws.onmessage = evt => handleWsMessage(evt.data);
      showScreen('appScreen');
      loadFriends();
    }

    // ==== FRIENDS ====
    async function loadFriends() {
      const resp = await fetch(`/api/users/${currentUser.username}/friends`);
      const friends = await resp.json();
      const ul = document.getElementById('friendsUl');
      ul.innerHTML = '';
      friends.forEach(f => {
        const li = document.createElement('li');
        li.textContent = f.username;
        li.onclick = () => selectFriend(f.username);
        ul.appendChild(li);
      });
    }

    function addFriend() {
      const input = document.getElementById('addFriendInput');
      const friendName = input.value.trim();
      if (!friendName) return;
      fetch('/api/friends', {
        method: 'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({currentUser: currentUser.username, friend: friendName})
      }).then(r=>r.json()).then(d=>{ if(d.ok) loadFriends(); });
      input.value = '';
    }

    function selectFriend(name) {
      selectedFriend = name;
    }

    // ==== MESSAGES ====
    function handleWsMessage(raw) {
      const msg = JSON.parse(raw);
      if (msg.type === 'auth_ok') return;
      if (msg.type === 'new_message') {
        const div = document.createElement('div');
        div.textContent = `${msg.from}: ${msg.content}`;
        document.getElementById('messages').appendChild(div);
        div.scrollIntoView({behavior:'smooth'});
      }
    }

    function sendMessage(e) {
      e.preventDefault();
      const inp = document.getElementById('msgInput');
      const text = inp.value.trim();
      if (!text || !selectedFriend) return;
      ws.send(JSON.stringify({
        type:'private_message',
        to: selectedFriend,
        from: currentUser.username,
        content: text
      }));
      inp.value = '';
    }

    // ==== INITIAL FETCH ====
    // Populate "Add Friend" suggestions with all users
    fetch('/api/users')
      .then(r=>r.json())
      .then(users=>{ /* suggestions could be populated here */ });
  </script>
</body>
</html>
