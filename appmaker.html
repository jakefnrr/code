<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlimited HTML App Ideas Generator</title>
    <style>
        :root{--bg:#050706;--bg2:#090d0a;--panel:#0d120f;--panel2:#111812;--panel3:#172019;--border:#223027;--green:#00ff88;--green2:#00d873;--greenSoft:rgba(0,255,136,.12);--text:#f3f7f4;--muted:#87958b;--danger:#ff5268;--warning:#ffc857}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 30px 100px rgba(0,0,0,.6);
            overflow: hidden;
        }
        
        header {
            background: radial-gradient(circle at 30% 20%, rgba(0,255,136,.08), transparent 40%), var(--panel);
            color: var(--text);
            border-bottom: 1px solid var(--border);
            padding: 40px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: var(--green);
        }
        
        header p {
            font-size: 1.2em;
            color: var(--muted);
        }
        
        .filters {
            padding: 30px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }
        
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .filter-label {
            font-weight: bold;
            color: var(--green);
            margin-bottom: 10px;
            display: block;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 11px;
        }
        
        .filter-btn {
            padding: 10px 20px;
            border: 1px solid var(--border);
            background: var(--panel2);
            color: var(--muted);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        
        .filter-btn:hover {
            border-color: var(--green);
            color: var(--green);
        }
        
        .filter-btn.active {
            background: var(--greenSoft);
            color: var(--green);
            border-color: rgba(0,255,136,.3);
            font-weight: bold;
        }
        
        .controls {
            padding: 20px 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .generate-btn {
            padding: 15px 40px;
            background: var(--green);
            color: #001b0e;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        .generate-btn:hover {
            background: #19ff97;
            transform: translateY(-1px);
        }
        
        .count-selector {
            padding: 12px 20px;
            border: 1px solid var(--border);
            background: var(--panel2);
            color: var(--text);
            border-radius: 10px;
            font-size: 16px;
        }
        
        .count-selector:focus {
            outline: none;
            border-color: var(--green);
        }
        
        .ideas-container {
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            max-height: 600px;
            overflow-y: auto;
            scrollbar-color: var(--green) var(--bg);
        }
        
        .idea-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 25px;
            border-left: 4px solid var(--green);
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            text-align: left;
            font: inherit;
            color: inherit;
            display: block;
            cursor: pointer;
        }
        
        .idea-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0,0,0,.4);
            border-color: var(--green);
        }
        
        .idea-card:hover .expand-btn {
            background: var(--green);
            color: #001b0e;
        }
        
        .idea-card h3 {
            color: var(--green);
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .idea-card p {
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .idea-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .tag {
            background: var(--greenSoft);
            color: var(--green);
            border: 1px solid rgba(0,255,136,.2);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .stats {
            padding: 20px 30px;
            background: var(--panel);
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }
        
        .stats span {
            color: var(--green);
            font-weight: bold;
        }
        
        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            border: 1px solid var(--border);
            background: var(--panel2);
            color: var(--text);
            border-radius: 10px;
            font-size: 16px;
        }
        
        .search-box:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 3px var(--greenSoft);
        }
        
        .search-box::placeholder {
            color: var(--muted);
        }
        
        .expand-btn {
            margin-top: 18px;
            width: 100%;
            padding: 12px;
            background: var(--greenSoft);
            color: var(--green);
            border: 1px solid rgba(0,255,136,.3);
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all .2s;
            display: block;
            text-align: center;
        }
        
        .idea-card.modal-open {
            border-color: var(--green);
            box-shadow: 0 0 0 2px var(--greenSoft);
        }

        .modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,.75);
            backdrop-filter: blur(4px);
            z-index: 100;
            padding: 20px;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modalBox {
            width: 100%;
            max-width: 580px;
            max-height: 85vh;
            overflow-y: auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 30px 100px rgba(0,0,0,.7);
            scrollbar-color: var(--green) var(--bg);
        }
        
        .modalHeader {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 15px;
        }
        
        .modalHeader h2 {
            color: var(--green);
            font-size: 1.5em;
            line-height: 1.2;
        }
        
        .modalClose {
            background: none;
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 20px;
            border-radius: 8px;
            width: 34px;
            height: 34px;
            min-width: 34px;
            cursor: pointer;
        }
        
        .modalClose:hover {
            color: var(--danger);
            border-color: var(--danger);
        }
        
        .modalInfo {
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .modalInfo p {
            color: var(--muted);
            line-height: 1.6;
            font-size: 14px;
        }
        
        .modalInfo p strong {
            color: var(--text);
        }
        
        .modalTags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }
        
        .modalDivider {
            border: none;
            border-top: 1px dashed var(--border);
            margin: 0 0 15px;
        }
        
        .prompt-box {
            width: 100%;
            background: var(--panel2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            line-height: 1.5;
            resize: vertical;
            min-height: 150px;
        }
        
        .prompt-box:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 3px var(--greenSoft);
        }
        
        .detail-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        
        .mini-green {
            background: var(--greenSoft);
            color: var(--green);
            border: 1px solid rgba(0,255,136,.3);
            padding: 9px 16px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        
        .mini-green:hover {
            background: var(--green);
            color: #001b0e;
        }
    </style>
</head>
<body>
    <a href="index.html" class="all-projects" title="Back to all projects">ALL PROJECTS</a>
    <div class="container">
        <header>
            <h1>Unlimited HTML App Ideas</h1>
            <p>Billions of unique ideas, generated instantly</p>
        </header>
        
        <div class="filters">
            <span class="filter-label">Category:</span>
            <div class="filter-group" id="categoryFilters">
                <button class="filter-btn active" data-category="all">All</button>
                <button class="filter-btn" data-category="fun">Fun</button>
                <button class="filter-btn" data-category="work">Work</button>
                <button class="filter-btn" data-category="learning">Learning</button>
                <button class="filter-btn" data-category="productivity">Productivity</button>
                <button class="filter-btn" data-category="entertainment">Entertainment</button>
                <button class="filter-btn" data-category="social">Social</button>
                <button class="filter-btn" data-category="ecommerce">E-commerce</button>
                <button class="filter-btn" data-category="health">Health</button>
                <button class="filter-btn" data-category="finance">Finance</button>
                <button class="filter-btn" data-category="creative">Creative</button>
                <button class="filter-btn" data-category="utility">Utility</button>
            </div>
            
            <span class="filter-label">Complexity:</span>
            <div class="filter-group" id="complexityFilters">
                <button class="filter-btn active" data-complexity="all">All</button>
                <button class="filter-btn" data-complexity="beginner">Beginner</button>
                <button class="filter-btn" data-complexity="intermediate">Intermediate</button>
                <button class="filter-btn" data-complexity="advanced">Advanced</button>
            </div>
        </div>
        
        <div class="controls">
            <input type="text" class="search-box" id="searchBox" placeholder="Search ideas...">
            <select class="count-selector" id="countSelector">
                <option value="10">10 Ideas</option>
                <option value="25">25 Ideas</option>
                <option value="50">50 Ideas</option>
                <option value="100">100 Ideas</option>
                <option value="500">500 Ideas</option>
                <option value="1000">1000 Ideas</option>
            </select>
            <button class="generate-btn" onclick="generateIdeas()">Generate Ideas</button>
        </div>
        
        <div class="ideas-container" id="ideasContainer">
            <!-- Ideas will be generated here -->
        </div>
        
        <div class="stats">
            <p>Showing <span id="currentCount">0</span> of <span id="totalCount">0</span> ideas</p>
        </div>
    </div>

    <div id="ideaModal" class="modal" onclick="if(event.target===this)closeIdeaModal()">
        <div class="modalBox">
            <div class="modalHeader">
                <h2 id="modalTitle"></h2>
                <button class="modalClose" onclick="closeIdeaModal()">×</button>
            </div>
            <div class="modalInfo">
                <p id="modalBody"></p>
                <div class="modalTags" id="modalTags"></div>
            </div>
            <hr class="modalDivider">
            <label style="display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Prompt - paste this into your AI to build the app</label>
            <textarea id="modalPrompt" class="prompt-box" rows="6"></textarea>
            <div class="detail-actions">
                <button class="mini-green" onclick="selectPrompt()">Select All</button>
                <button class="mini-green" id="copyBtn" onclick="copyPrompt()">📋 Copy Prompt</button>
            </div>
        </div>
    </div>

        const CAT_FORMATS = {

        const CATEGORIES = Object.keys(CAT_FORMATS);
        const pick = arr => arr[Math.floor(Math.random() * arr.length)];
        const pickN = (arr, n) => {
            const shuffled = [...arr].sort(() => Math.random() - 0.5);
            return Array.from({ length: n }, (_, i) => shuffled[i % shuffled.length]);
        };

        function buildGeneratedIdea(category, complexity) {
            const cat = category || pick(CATEGORIES);
            const format = pick(CAT_FORMATS[cat]);
            const subject = pick(WORDS.subject);
            const audience = pick(WORDS.audience);
            const feature = pick(WORDS.feature);
            const perk = pick(WORDS.perk);
            const interaction = pick(WORDS.interaction);
            const theme = pick(WORDS.theme);

            const pattern = Math.random();
            let title, description;
            if (pattern < 0.4) {
                title = `${cap(subject)} ${format} for ${audience}`;
                description = `A ${theme} ${format.toLowerCase()} that ${interaction}. Built around ${subject} for ${audience}, with ${feature}, ${perk}, and more.`;
            } else if (pattern < 0.7) {
                title = `${cap(theme)} ${format} for ${audience}`;
                description = `A polished ${theme} ${format.toLowerCase()} that ${interaction}. Focused on ${subject}, with ${feature} plus ${perk}.`;
            } else {
                title = `${cap(subject)} ${format} (${cap(theme)})`;
                description = `A ${theme} take on ${subject}: a ${format.toLowerCase()} for ${audience} that ${interaction}. Ships with ${feature} and ${perk}.`;
            }

            return {
                title,
                description,
                category: cat,
                complexity: complexity || pickN(["beginner", "intermediate", "advanced"], 1)[0],
                tags: [audience.replace(/s$/, ""), theme, perk.split(" ").pop()]
            };
        }

        function cap(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function totalCombinations() {
            const perCategory = (WORDS.subject.length * WORDS.audience.length * WORDS.feature.length * WORDS.perk.length * WORDS.interaction.length * WORDS.theme.length * Math.max(...Object.values(CAT_FORMATS).map(a => a.length)));
            return perCategory * CATEGORIES.length;
        }

        let selectedCategories = ['all'];
        let selectedComplexities = ['all'];
        let filteredIdeas = [...appIdeas];

        // Filter button click handlers
        document.querySelectorAll('#categoryFilters .filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const category = btn.dataset.category;
                
                if (category === 'all') {
                    selectedCategories = ['all'];
                    document.querySelectorAll('#categoryFilters .filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                } else {
                    document.querySelector('#categoryFilters .filter-btn[data-category="all"]').classList.remove('active');
                    selectedCategories = selectedCategories.filter(c => c !== 'all');
                    
                    if (btn.classList.contains('active')) {
                        btn.classList.remove('active');
                        selectedCategories = selectedCategories.filter(c => c !== category);
                        if (selectedCategories.length === 0) {
                            selectedCategories = ['all'];
                            document.querySelector('#categoryFilters .filter-btn[data-category="all"]').classList.add('active');
                        }
                    } else {
                        btn.classList.add('active');
                        selectedCategories.push(category);
                    }
                }
                
                filterIdeas();
            });
        });

        document.querySelectorAll('#complexityFilters .filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const complexity = btn.dataset.complexity;
                
                if (complexity === 'all') {
                    selectedComplexities = ['all'];
                    document.querySelectorAll('#complexityFilters .filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                } else {
                    document.querySelector('#complexityFilters .filter-btn[data-complexity="all"]').classList.remove('active');
                    selectedComplexities = selectedComplexities.filter(c => c !== 'all');
                    
                    if (btn.classList.contains('active')) {
                        btn.classList.remove('active');
                        selectedComplexities = selectedComplexities.filter(c => c !== complexity);
                        if (selectedComplexities.length === 0) {
                            selectedComplexities = ['all'];
                            document.querySelector('#complexityFilters .filter-btn[data-complexity="all"]').classList.add('active');
                        }
                    } else {
                        btn.classList.add('active');
                        selectedComplexities.push(complexity);
                    }
                }
                
                filterIdeas();
            });
        });

        document.getElementById('searchBox').addEventListener('input', filterIdeas);

        function filterIdeas() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            
            filteredIdeas = appIdeas.filter(idea => {
                const categoryMatch = selectedCategories.includes('all') || selectedCategories.includes(idea.category);
                const complexityMatch = selectedComplexities.includes('all') || selectedComplexities.includes(idea.complexity);
                const searchMatch = idea.title.toLowerCase().includes(searchTerm) || 
                                   idea.description.toLowerCase().includes(searchTerm) ||
                                   idea.tags.some(tag => tag.toLowerCase().includes(searchTerm));
                
                return categoryMatch && complexityMatch && searchMatch;
            });
            
            generateIdeas();
        }

        const esc = t => String(t).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');

        const buildPrompt = idea => [
            `Build me a single-file HTML app: ${idea.title}.`,
            ``,
            `What it does: ${idea.description}`,
            ``,
            `Details:`,
            `- Category: ${idea.category}`,
            `- Complexity: ${idea.complexity}`,
            `- Style: dark theme with green accents (#00ff88 on near-black panels)`,
            `- Single index.html with embedded CSS and JS, no external dependencies`,
            `- Mobile responsive, clean modern UI`,
            `- No code comments`,
            ``,
            `Features to include: ${idea.tags.join(', ')}`,
            ``,
            `Make it complete and working out of the box.`
        ].join('\n');

        function generateIdeas() {
            const count = parseInt(document.getElementById('countSelector').value);
            const container = document.getElementById('ideasContainer');

            const cats = selectedCategories.includes('all') ? CATEGORIES.slice() : selectedCategories.slice();
            const complexities = selectedComplexities.includes('all') ? ["beginner", "intermediate", "advanced"] : selectedComplexities.slice();
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            
            const matchesSearch = idea =>
                !searchTerm ||
                idea.title.toLowerCase().includes(searchTerm) ||
                idea.description.toLowerCase().includes(searchTerm) ||
                idea.tags.some(tag => tag.toLowerCase().includes(searchTerm));
            
            // Start with hand-picked ideas that match the filters
            let ideasToShow = [...filteredIdeas].sort(() => Math.random() - 0.5).map(idea => ({
                ...idea,
                uniqueId: Math.random().toString(36).substr(2, 9)
            }));
            
            // Fill the rest with fresh combinations — effectively unlimited
            const usedTitles = new Set(ideasToShow.map(i => i.title));
            let attempts = 0;
            while (ideasToShow.length < count && attempts < 40000) {
                attempts++;
                const cat = pick(cats);
                const cplx = pick(complexities);
                const idea = buildGeneratedIdea(cat, cplx);
                if (usedTitles.has(idea.title)) continue;
                if (!matchesSearch(idea)) continue;
                usedTitles.add(idea.title);
                ideasToShow.push({ ...idea, uniqueId: Math.random().toString(36).substr(2, 9) });
            }
            
            if (ideasToShow.length > count) ideasToShow = ideasToShow.slice(0, count);
            
            window._ideaPool = {};
            container.innerHTML = ideasToShow.map(idea => {
                window._ideaPool[idea.uniqueId] = idea;
                return `
                <button class="idea-card" onclick="openIdeaModal('${idea.uniqueId}')">
                    <h3>${esc(idea.title)}</h3>
                    <p>${esc(idea.description)}</p>
                    <div class="idea-tags">
                        <span class="tag">${esc(idea.category)}</span>
                        <span class="tag">${esc(idea.complexity)}</span>
                        ${idea.tags.map(tag => `<span class="tag">${esc(tag)}</span>`).join('')}
                    </div>
                    <span class="expand-btn">Tap for details &amp; prompt</span>
                </button>`;
            }).join('');
            
            const possible = filteredIdeas.length + totalCombinations();
            document.getElementById('currentCount').textContent = ideasToShow.length;
            document.getElementById('totalCount').textContent = 'out of ~' + possible.toLocaleString() + ' possible ideas';
        }

        function openIdeaModal(id) {
            const idea = window._ideaPool && window._ideaPool[id];
            if (!idea) return;
            
            document.getElementById('modalTitle').textContent = idea.title;
            
            const body = document.getElementById('modalBody');
            const detailLine = `${idea.title} is a ${idea.category} app idea for the web. ${idea.description}.`;
            body.innerHTML = `<strong>${esc(idea.title)}</strong> is a <strong>${esc(idea.category)}</strong> idea — <strong>${esc(idea.complexity)}</strong> difficulty.<br><br>` +
                `This is a thing that makes ${esc(idea.description.toLowerCase().replace(/\.$/, ''))}. ` +
                `It's built for <strong>${esc(idea.tags.join(', '))}</strong> and works right in the browser as a single HTML file.`;
            
            document.getElementById('modalTags').innerHTML =
                `<span class="tag">${esc(idea.category)}</span>` +
                `<span class="tag">${esc(idea.complexity)}</span>` +
                idea.tags.map(tag => `<span class="tag">${esc(tag)}</span>`).join('');
            
            document.getElementById('modalPrompt').value = buildPrompt(idea);
            document.getElementById('copyBtn').textContent = '📋 Copy Prompt';
            document.getElementById('ideaModal').classList.add('show');
        }

        function closeIdeaModal() {
            document.getElementById('ideaModal').classList.remove('show');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeIdeaModal();
        });

        function selectPrompt() {
            const ta = document.getElementById('modalPrompt');
            if (!ta) return;
            ta.focus();
            ta.select();
        }

        function copyPrompt() {
            const ta = document.getElementById('modalPrompt');
            const btn = document.getElementById('copyBtn');
            if (!ta || !btn) return;
            const done = () => {
                const old = btn.textContent;
                btn.textContent = '✓ Copied!';
                setTimeout(() => btn.textContent = old, 2000);
            };
            const legacyCopy = () => {
                ta.select();
                try { document.execCommand('copy'); } catch (e) {}
                done();
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(ta.value).then(done).catch(legacyCopy);
            } else {
                legacyCopy();
            }
        }

        // Initialize
        generateIdeas();
    </script>
</body>
</html>
