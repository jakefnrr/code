<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlimited HTML App Ideas Generator</title>
    <style>
        :root{--bg:#050706;--bg2:#090d0a;--panel:#0d120f;--panel2:#111812;--panel3:#172019;--border:#223027;--green:#00ff88;--green2:#00d873;--greenSoft:rgba(0,255,136,.12);--text:#f3f7f4;--muted:#87958b;--danger:#ff5268;--warning:#ffc857;--purple:#a855f7;--purpleSoft:rgba(168,85,247,.12);--orange:#fb923c;--orangeSoft:rgba(251,146,60,.12)}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 30px 100px rgba(0,0,0,.6);
            overflow: hidden;
        }
        
        .tab-nav {
            display: flex;
            gap: 0;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }
        
        .tab-nav button {
            flex: 1;
            padding: 18px 30px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: var(--muted);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .tab-nav button:hover {
            color: var(--text);
            background: rgba(255,255,255,.03);
        }
        
        .tab-nav button.active {
            color: var(--green);
            border-bottom-color: var(--green);
        }
        
        .tab-nav button.tab-fortnite.active {
            color: var(--purple);
            border-bottom-color: var(--purple);
        }
        
        .tab-nav button.tab-rocketleague.active {
            color: var(--orange);
            border-bottom-color: var(--orange);
        }
        
        .tab-panel {
            display: none;
        }
        
        .tab-panel.active {
            display: block;
        }
        
        header {
            background: radial-gradient(circle at 30% 20%, rgba(0,255,136,.08), transparent 40%), var(--panel);
            color: var(--text);
            border-bottom: 1px solid var(--border);
            padding: 40px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: var(--green);
        }
        
        header p {
            font-size: 1.2em;
            color: var(--muted);
        }
        
        .filters {
            padding: 30px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }
        
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .filter-label {
            font-weight: bold;
            color: var(--green);
            margin-bottom: 10px;
            display: block;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 11px;
        }
        
        .panel-fortnite .filter-label {
            color: var(--purple);
        }
        
        .panel-rocketleague .filter-label {
            color: var(--orange);
        }
        
        .filter-btn {
            padding: 10px 20px;
            border: 1px solid var(--border);
            background: var(--panel2);
            color: var(--muted);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        
        .filter-btn:hover {
            border-color: var(--green);
            color: var(--green);
        }
        
        .panel-fortnite .filter-btn:hover {
            border-color: var(--purple);
            color: var(--purple);
        }
        
        .panel-rocketleague .filter-btn:hover {
            border-color: var(--orange);
            color: var(--orange);
        }
        
        .filter-btn.active {
            background: var(--greenSoft);
            color: var(--green);
            border-color: rgba(0,255,136,.3);
            font-weight: bold;
        }
        
        .panel-fortnite .filter-btn.active {
            background: var(--purpleSoft);
            color: var(--purple);
            border-color: rgba(168,85,247,.3);
        }
        
        .panel-rocketleague .filter-btn.active {
            background: var(--orangeSoft);
            color: var(--orange);
            border-color: rgba(251,146,60,.3);
        }
        
        .controls {
            padding: 20px 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .generate-btn {
            padding: 15px 40px;
            background: var(--green);
            color: #001b0e;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        .generate-btn:hover {
            background: #19ff97;
            transform: translateY(-1px);
        }
        
        .panel-fortnite .generate-btn {
            background: var(--purple);
        }
        
        .panel-fortnite .generate-btn:hover {
            background: #b06bff;
        }
        
        .panel-rocketleague .generate-btn {
            background: var(--orange);
        }
        
        .panel-rocketleague .generate-btn:hover {
            background: #ffab63;
        }
        
        .count-selector {
            padding: 12px 20px;
            border: 1px solid var(--border);
            background: var(--panel2);
            color: var(--text);
            border-radius: 10px;
            font-size: 16px;
        }
        
        .count-selector:focus {
            outline: none;
            border-color: var(--green);
        }
        
        .ideas-container {
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            max-height: 600px;
            overflow-y: auto;
            scrollbar-color: var(--green) var(--bg);
        }
        
        .panel-fortnite .ideas-container {
            scrollbar-color: var(--purple) var(--bg);
        }
        
        .panel-rocketleague .ideas-container {
            scrollbar-color: var(--orange) var(--bg);
        }
        
        .idea-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 25px;
            border-left: 4px solid var(--green);
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            text-align: left;
            font: inherit;
            color: inherit;
            display: block;
            cursor: pointer;
        }
        
        .panel-fortnite .idea-card {
            border-left-color: var(--purple);
        }
        
        .panel-rocketleague .idea-card {
            border-left-color: var(--orange);
        }
        
        .idea-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0,0,0,.4);
            border-color: var(--green);
        }
        
        .panel-fortnite .idea-card:hover {
            border-color: var(--purple);
        }
        
        .panel-rocketleague .idea-card:hover {
            border-color: var(--orange);
        }
        
        .idea-card:hover .expand-btn {
            background: var(--green);
            color: #001b0e;
        }
        
        .panel-fortnite .idea-card:hover .expand-btn {
            background: var(--purple);
        }
        
        .panel-rocketleague .idea-card:hover .expand-btn {
            background: var(--orange);
        }
        
        .idea-card h3 {
            color: var(--green);
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .panel-fortnite .idea-card h3 {
            color: var(--purple);
        }
        
        .panel-rocketleague .idea-card h3 {
            color: var(--orange);
        }
        
        .idea-card p {
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .idea-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .tag {
            background: var(--greenSoft);
            color: var(--green);
            border: 1px solid rgba(0,255,136,.2);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .panel-fortnite .tag {
            background: var(--purpleSoft);
            color: var(--purple);
            border-color: rgba(168,85,247,.2);
        }
        
        .panel-rocketleague .tag {
            background: var(--orangeSoft);
            color: var(--orange);
            border-color: rgba(251,146,60,.2);
        }
        
        .stats {
            padding: 20px 30px;
            background: var(--panel);
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }
        
        .stats span {
            color: var(--green);
            font-weight: bold;
        }
        
        .panel-fortnite .stats span {
            color: var(--purple);
        }
        
        .panel-rocketleague .stats span {
            color: var(--orange);
        }
        
        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            border: 1px solid var(--border);
            background: var(--panel2);
            color: var(--text);
            border-radius: 10px;
            font-size: 16px;
        }
        
        .search-box:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 3px var(--greenSoft);
        }
        
        .search-box::placeholder {
            color: var(--muted);
        }
        
        .expand-btn {
            margin-top: 18px;
            width: 100%;
            padding: 12px;
            background: var(--greenSoft);
            color: var(--green);
            border: 1px solid rgba(0,255,136,.3);
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all .2s;
            display: block;
            text-align: center;
        }
        
        .idea-card.modal-open {
            border-color: var(--green);
            box-shadow: 0 0 0 2px var(--greenSoft);
        }

        .modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,.75);
            backdrop-filter: blur(4px);
            z-index: 100;
            padding: 20px;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modalBox {
            width: 100%;
            max-width: 580px;
            max-height: 85vh;
            overflow-y: auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 30px 100px rgba(0,0,0,.7);
            scrollbar-color: var(--green) var(--bg);
        }
        
        .modalHeader {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 15px;
        }
        
        .modalHeader h2 {
            color: var(--green);
            font-size: 1.5em;
            line-height: 1.2;
        }
        
        .modalClose {
            background: none;
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 20px;
            border-radius: 8px;
            width: 34px;
            height: 34px;
            min-width: 34px;
            cursor: pointer;
        }
        
        .modalClose:hover {
            color: var(--danger);
            border-color: var(--danger);
        }
        
        .modalInfo {
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .modalInfo p {
            color: var(--muted);
            line-height: 1.6;
            font-size: 14px;
        }
        
        .modalInfo p strong {
            color: var(--text);
        }
        
        .modalTags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }
        
        .modalDivider {
            border: none;
            border-top: 1px dashed var(--border);
            margin: 0 0 15px;
        }
        
        .prompt-box {
            width: 100%;
            background: var(--panel2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            line-height: 1.5;
            resize: vertical;
            min-height: 150px;
        }
        
        .prompt-box:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 3px var(--greenSoft);
        }
        
        .detail-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        
        .mini-green {
            background: var(--greenSoft);
            color: var(--green);
            border: 1px solid rgba(0,255,136,.3);
            padding: 9px 16px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        
        .mini-green:hover {
            background: var(--green);
            color: #001b0e;
        }

        .all-projects {
            position: fixed;
            top: 6px;
            right: 7px;
            z-index: 50;
            padding: 8px 14px;
            border-radius: 7px;
            background: rgba(3,8,18,.9);
            border: 1px solid rgba(0,255,136,.25);
            color: var(--green);
            font-size: 10px;
            font-weight: 900;
            text-decoration: none;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all .2s;
            font-family: Arial, Helvetica, sans-serif;
        }

        .all-projects:hover {
            color: white;
            border-color: var(--green);
            box-shadow: 0 0 15px rgba(0,255,136,.25);
        }
    </style>
</head>
<body>
    <a href="index.html" class="all-projects" title="Back to all projects">ALL PROJECTS</a>
    <div class="container">
        <header>
            <h1>Unlimited HTML App Ideas</h1>
            <p>Billions of unique ideas, generated instantly</p>
        </header>
        
        <nav class="tab-nav">
            <button class="active" data-tab="main">Main</button>
            <button class="tab-fortnite" data-tab="fortnite">Fortnite</button>
            <button class="tab-rocketleague" data-tab="rocketleague">Rocket League</button>
        </nav>

        <div class="tab-panel active" id="panel-main">
            <div class="filters">
                <span class="filter-label">Category:</span>
                <div class="filter-group" id="categoryFilters-main">
                    <button class="filter-btn active" data-category="all">All</button>
                    <button class="filter-btn" data-category="fun">Fun</button>
                    <button class="filter-btn" data-category="work">Work</button>
                    <button class="filter-btn" data-category="learning">Learning</button>
                    <button class="filter-btn" data-category="productivity">Productivity</button>
                    <button class="filter-btn" data-category="entertainment">Entertainment</button>
                    <button class="filter-btn" data-category="social">Social</button>

                    <button class="filter-btn" data-category="health">Health</button>
                    <button class="filter-btn" data-category="finance">Finance</button>
                    <button class="filter-btn" data-category="creative">Creative</button>
                    <button class="filter-btn" data-category="utility">Utility</button>
                </div>
                
                <span class="filter-label">Complexity:</span>
                <div class="filter-group" id="complexityFilters-main">
                    <button class="filter-btn active" data-complexity="all">All</button>
                    <button class="filter-btn" data-complexity="beginner">Beginner</button>
                    <button class="filter-btn" data-complexity="intermediate">Intermediate</button>
                    <button class="filter-btn" data-complexity="advanced">Advanced</button>
                </div>
            </div>
            
            <div class="controls">
                <input type="text" class="search-box" id="searchBox-main" placeholder="Search ideas...">
                <select class="count-selector" id="countSelector-main">
                    <option value="10">10 Ideas</option>
                    <option value="25">25 Ideas</option>
                    <option value="50">50 Ideas</option>
                    <option value="100">100 Ideas</option>
                    <option value="500">500 Ideas</option>
                    <option value="1000">1000 Ideas</option>
                </select>
                <button class="generate-btn" onclick="generateIdeas('main')">Generate Ideas</button>
            </div>
            
            <div class="ideas-container" id="ideasContainer-main">
            </div>
            
            <div class="stats">
                <p>Showing <span id="currentCount-main">0</span> of <span id="totalCount-main">0</span> ideas</p>
            </div>
        </div>

        <div class="tab-panel panel-fortnite" id="panel-fortnite">
            <div class="filters">
                <span class="filter-label">Category:</span>
                <div class="filter-group" id="categoryFilters-fortnite">
                    <button class="filter-btn active" data-category="all">All</button>
                    <button class="filter-btn" data-category="improve">Improve</button>
                    <button class="filter-btn" data-category="fun">Fun</button>
                    <button class="filter-btn" data-category="creative">Creative</button>
                    <button class="filter-btn" data-category="weapons">Weapons</button>
                    <button class="filter-btn" data-category="movement">Movement</button>
                    <button class="filter-btn" data-category="strategy">Strategy</button>
                    <button class="filter-btn" data-category="stats">Stats</button>
                </div>
                
                <span class="filter-label">Complexity:</span>
                <div class="filter-group" id="complexityFilters-fortnite">
                    <button class="filter-btn active" data-complexity="all">All</button>
                    <button class="filter-btn" data-complexity="beginner">Beginner</button>
                    <button class="filter-btn" data-complexity="intermediate">Intermediate</button>
                    <button class="filter-btn" data-complexity="advanced">Advanced</button>
                </div>
            </div>
            
            <div class="controls">
                <input type="text" class="search-box" id="searchBox-fortnite" placeholder="Search Fortnite ideas...">
                <select class="count-selector" id="countSelector-fortnite">
                    <option value="10">10 Ideas</option>
                    <option value="25">25 Ideas</option>
                    <option value="50">50 Ideas</option>
                    <option value="100">100 Ideas</option>
                    <option value="500">500 Ideas</option>
                    <option value="1000">1000 Ideas</option>
                </select>
                <button class="generate-btn" onclick="generateIdeas('fortnite')">Generate Ideas</button>
            </div>
            
            <div class="ideas-container" id="ideasContainer-fortnite">
            </div>
            
            <div class="stats">
                <p>Showing <span id="currentCount-fortnite">0</span> of <span id="totalCount-fortnite">0</span> ideas</p>
            </div>
        </div>

        <div class="tab-panel panel-rocketleague" id="panel-rocketleague">
            <div class="filters">
                <span class="filter-label">Category:</span>
                <div class="filter-group" id="categoryFilters-rocketleague">
                    <button class="filter-btn active" data-category="all">All</button>
                    <button class="filter-btn" data-category="training">Training</button>
                    <button class="filter-btn" data-category="fun">Fun</button>
                    <button class="filter-btn" data-category="aerials">Aerials</button>
                    <button class="filter-btn" data-category="rotation">Rotation</button>
                    <button class="filter-btn" data-category="trading">Trading</button>
                    <button class="filter-btn" data-category="mechanics">Mechanics</button>
                    <button class="filter-btn" data-category="strategy">Strategy</button>
                    <button class="filter-btn" data-category="stats">Stats</button>
                </div>
                
                <span class="filter-label">Complexity:</span>
                <div class="filter-group" id="complexityFilters-rocketleague">
                    <button class="filter-btn active" data-complexity="all">All</button>
                    <button class="filter-btn" data-complexity="beginner">Beginner</button>
                    <button class="filter-btn" data-complexity="intermediate">Intermediate</button>
                    <button class="filter-btn" data-complexity="advanced">Advanced</button>
                </div>
            </div>
            
            <div class="controls">
                <input type="text" class="search-box" id="searchBox-rocketleague" placeholder="Search Rocket League ideas...">
                <select class="count-selector" id="countSelector-rocketleague">
                    <option value="10">10 Ideas</option>
                    <option value="25">25 Ideas</option>
                    <option value="50">50 Ideas</option>
                    <option value="100">100 Ideas</option>
                    <option value="500">500 Ideas</option>
                    <option value="1000">1000 Ideas</option>
                </select>
                <button class="generate-btn" onclick="generateIdeas('rocketleague')">Generate Ideas</button>
            </div>
            
            <div class="ideas-container" id="ideasContainer-rocketleague">
            </div>
            
            <div class="stats">
                <p>Showing <span id="currentCount-rocketleague">0</span> of <span id="totalCount-rocketleague">0</span> ideas</p>
            </div>
        </div>
    </div>

    <div id="ideaModal" class="modal" onclick="if(event.target===this)closeIdeaModal()">
        <div class="modalBox">
            <div class="modalHeader">
                <h2 id="modalTitle"></h2>
                <button class="modalClose" onclick="closeIdeaModal()">×</button>
            </div>
            <div class="modalInfo">
                <p id="modalBody"></p>
                <div class="modalTags" id="modalTags"></div>
            </div>
            <hr class="modalDivider">
            <label style="display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Prompt - paste this into your AI to build the app</label>
            <textarea id="modalPrompt" class="prompt-box" rows="6"></textarea>
            <div class="detail-actions">
                <button class="mini-green" onclick="selectPrompt()">Select All</button>
                <button class="mini-green" id="copyBtn" onclick="copyPrompt()">📋 Copy Prompt</button>
            </div>
        </div>
    </div>

    <script>
        // ---- Hand-picked idea packs per tab ----
        const MAIN_IDEAS = [
            { title: "Meme Generator", description: "Create and share custom memes with text overlays and filters", category: "fun", complexity: "beginner", tags: ["social", "creative"] },
            { title: "Quiz Game Platform", description: "Build interactive quizzes with multiple question types and scoring", category: "fun", complexity: "intermediate", tags: ["gaming", "education"] },
            { title: "Virtual Pet Simulator", description: "Care for a digital pet with feeding, playing, and health stats", category: "fun", complexity: "beginner", tags: ["gaming", "simulation"] },
            { title: "Music Visualizer", description: "Real-time audio visualization with colorful animations", category: "fun", complexity: "advanced", tags: ["music", "creative"] },
            { title: "Interactive Story Builder", description: "Create choose-your-own-adventure stories with branching paths", category: "fun", complexity: "intermediate", tags: ["creative", "writing"] },
            { title: "Retro Game Collection", description: "Classic arcade games like Snake, Tetris, and Pong", category: "fun", complexity: "intermediate", tags: ["gaming", "retro"] },
            { title: "Emoji Art Creator", description: "Make pixel art using emojis as building blocks", category: "fun", complexity: "beginner", tags: ["creative", "art"] },
            { title: "Reaction Time Tester", description: "Test and improve your reaction speed with various challenges", category: "fun", complexity: "beginner", tags: ["gaming", "health"] },
            { title: "Sound Board App", description: "Play sound effects with customizable buttons and mixing", category: "fun", complexity: "intermediate", tags: ["music", "entertainment"] },

            const W = generator.words;
            const cats = generator.categories || CATEGORIES;
            const perCategory = (W.subject.length * W.audience.length * W.feature.length * W.perk.length * W.interaction.length * W.theme.length * Math.max(...Object.values(CAT_FORMATS).map(a => a.length)));
            return perCategory * cats.length;
        }

        const esc = t => String(t).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');

        const buildPrompt = idea => [
            `Build me a single-file HTML app: ${idea.title}.`,
            ``,
            `What it does: ${idea.description}`,
            ``,
            `Details:`,
            `- Category: ${idea.category}`,
            `- Complexity: ${idea.complexity}`,
            `- Style: dark theme with green accents (#00ff88 on near-black panels)`,
            `- Single index.html with embedded CSS and JS, no external dependencies`,
            `- Mobile responsive, clean modern UI`,
            `- No code comments`,
            ``,
            `Features to include: ${idea.tags.join(', ')}`,
            ``,
            `Make it complete and working out of the box.`
        ].join('\n');

        // ---- Tab switching ----
        document.querySelectorAll('.tab-nav button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-nav button').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                const panel = document.getElementById('panel-' + btn.dataset.tab);
                if (panel) panel.classList.add('active');
            });
        });

        // ---- Per-tab state + wiring ----
        const tabs = ['main', 'fortnite', 'rocketleague'];

        function bindFilterGroup(baseId, kind, state) {
            const buttons = document.querySelectorAll('#' + baseId + ' .filter-btn');
            const allBtn = document.querySelector('#' + baseId + ' [data-' + kind + '="all"]');
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const sel = btn.dataset[kind];
                    if (sel === 'all') {
                        state[kind] = ['all'];
                        buttons.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                    } else {
                        allBtn.classList.remove('active');
                        state[kind] = state[kind].filter(v => v !== 'all');
                        if (btn.classList.contains('active')) {
                            btn.classList.remove('active');
                            state[kind] = state[kind].filter(v => v !== sel);
                            if (state[kind].length === 0) {
                                state[kind] = ['all'];
                                allBtn.classList.add('active');
                            }
                        } else {
                            btn.classList.add('active');
                            state[kind].push(sel);
                        }
                    }
                    filterIdeas(state);
                });
            });
        }

        window._ideaPool = window._ideaPool || {};

        function filterIdeas(state) {
            const searchTerm = document.getElementById('searchBox-' + state.tab).value.toLowerCase();
            state.filteredIdeas = state.generator.handpicked.filter(idea => {
                const categoryMatch = state.category.includes('all') || state.category.includes(idea.category);
                const complexityMatch = state.complexity.includes('all') || state.complexity.includes(idea.complexity);
                const searchMatch = !searchTerm ||
                    idea.title.toLowerCase().includes(searchTerm) ||
                    idea.description.toLowerCase().includes(searchTerm) ||
                    idea.tags.some(tag => tag.toLowerCase().includes(searchTerm));
                return categoryMatch && complexityMatch && searchMatch;
            });
            generateIdeas(state.tab);
        }

        function generateIdeas(tabKey) {
            const state = tabState[tabKey];
            const count = parseInt(document.getElementById('countSelector-' + tabKey).value);
            const container = document.getElementById('ideasContainer-' + tabKey);
            const generator = state.generator;

            const cats = state.category.includes('all') ? (generator.categories || CATEGORIES).slice() : state.category.slice();
            const complexities = state.complexity.includes('all') ? ["beginner", "intermediate", "advanced"] : state.complexity.slice();
            const searchTerm = document.getElementById('searchBox-' + tabKey).value.toLowerCase();

            const matchesSearch = idea =>
                !searchTerm ||
                idea.title.toLowerCase().includes(searchTerm) ||
                idea.description.toLowerCase().includes(searchTerm) ||
                idea.tags.some(tag => tag.toLowerCase().includes(searchTerm));

            let ideasToShow = [...state.filteredIdeas].sort(() => Math.random() - 0.5).map(idea => ({
                ...idea,
                uniqueId: Math.random().toString(36).substr(2, 9)
            }));

            const usedTitles = new Set(ideasToShow.map(i => i.title));
            let attempts = 0;
            while (ideasToShow.length < count && attempts < 40000) {
                attempts++;
                const cat = pick(cats);
                const cplx = pick(complexities);
                const idea = buildGeneratedIdea(cat, cplx, generator);
                if (usedTitles.has(idea.title)) continue;
                if (!matchesSearch(idea)) continue;
                usedTitles.add(idea.title);
                ideasToShow.push({ ...idea, uniqueId: Math.random().toString(36).substr(2, 9) });
            }

            if (ideasToShow.length > count) ideasToShow = ideasToShow.slice(0, count);

            const pool = window._ideaPool[tabKey] = {};
            container.innerHTML = ideasToShow.map(idea => {
                pool[idea.uniqueId] = idea;
                return `
                <button class="idea-card" onclick="openIdeaModal('${idea.uniqueId}','${tabKey}')">
                    <h3>${esc(idea.title)}</h3>
                    <p>${esc(idea.description)}</p>
                    <div class="idea-tags">
                        <span class="tag">${esc(idea.category)}</span>
                        <span class="tag">${esc(idea.complexity)}</span>
                        ${idea.tags.map(tag => `<span class="tag">${esc(tag)}</span>`).join('')}
                    </div>
                    <span class="expand-btn">Tap for details &amp; prompt</span>
                </button>`;
            }).join('');

            const possible = state.filteredIdeas.length + totalCombinations(generator);
            document.getElementById('currentCount-' + tabKey).textContent = ideasToShow.length;
            document.getElementById('totalCount-' + tabKey).textContent = 'out of ~' + possible.toLocaleString() + ' possible ideas';
        }

        function openIdeaModal(id, tabKey) {
            const pool = (window._ideaPool && window._ideaPool[tabKey]) || {};
            const idea = pool[id];
            if (!idea) return;

            document.getElementById('modalTitle').textContent = idea.title;

            const body = document.getElementById('modalBody');
            body.innerHTML = `<strong>${esc(idea.title)}</strong> is a <strong>${esc(idea.category)}</strong> idea — <strong>${esc(idea.complexity)}</strong> difficulty.<br><br>` +
                `This is a thing that makes ${esc(idea.description.toLowerCase().replace(/\.$/, ''))}. ` +
                `It's built for <strong>${esc(idea.tags.join(', '))}</strong> and works right in the browser as a single HTML file.`;

            document.getElementById('modalTags').innerHTML =
                `<span class="tag">${esc(idea.category)}</span>` +
                `<span class="tag">${esc(idea.complexity)}</span>` +
                idea.tags.map(tag => `<span class="tag">${esc(tag)}</span>`).join('');

            document.getElementById('modalPrompt').value = buildPrompt(idea);
            document.getElementById('copyBtn').textContent = '📋 Copy Prompt';
            document.getElementById('ideaModal').classList.add('show');
        }

        function closeIdeaModal() {
            document.getElementById('ideaModal').classList.remove('show');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeIdeaModal();
        });

        function selectPrompt() {
            const ta = document.getElementById('modalPrompt');
            if (!ta) return;
            ta.focus();
            ta.select();
        }

        function copyPrompt() {
            const ta = document.getElementById('modalPrompt');
            const btn = document.getElementById('copyBtn');
            if (!ta || !btn) return;
            const done = () => {
                const old = btn.textContent;
                btn.textContent = '✓ Copied!';
                setTimeout(() => btn.textContent = old, 2000);
            };
            const legacyCopy = () => {
                ta.select();
                try { document.execCommand('copy'); } catch (e) {}
                done();
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(ta.value).then(done).catch(legacyCopy);
            } else {
                legacyCopy();
            }
        }

        // Initialize each tab
        const tabState = {};
        tabs.forEach(tabKey => {
            tabState[tabKey] = {
                tab: tabKey,
                generator: GENERATORS[tabKey],
                category: ['all'],
                complexity: ['all'],
                filteredIdeas: [...GENERATORS[tabKey].handpicked]
            };
            bindFilterGroup('categoryFilters-' + tabKey, 'category', tabState[tabKey]);
            bindFilterGroup('complexityFilters-' + tabKey, 'complexity', tabState[tabKey]);
            document.getElementById('searchBox-' + tabKey).addEventListener('input', () => filterIdeas(tabState[tabKey]));
            generateIdeas(tabKey);
        });
    </script>
</body>
</html>
