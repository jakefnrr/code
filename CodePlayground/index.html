<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Playground</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050708;
  --bg2:#080b0c;
  --pane:#0a0d0e;
  --pane2:#0d1112;
  --line:#161d1f;
  --line2:#1f282a;
  --green:#00ff88;
  --green2:#00b862;
  --green-dim:#0b7a48;
  --green-glow:rgba(0,255,136,.18);
  --text:#d7e3df;
  --txt:#d7e3df;
  --muted:#6e817c;
  --txt2:#6e817c;
  --dim:#3d4b48;
  --red:#ff5f56;
  --err:#ff5f56;
  --amber:#ffb020;
  --warn:#ffb020;
  --blue:#4ea8ff;
  --info:#4ea8ff;
  --purple:#4ea8ff;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --w0:250px;--h:46vh;
}
body{
  background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  height:100dvh;display:flex;flex-direction:column;overflow:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 15% -10%,rgba(0,255,136,.07),transparent 60%),
             radial-gradient(700px 400px at 100% 110%,rgba(0,196,106,.05),transparent 60%);
}
button,input,textarea{font:inherit;color:inherit}
button{
  appearance:none;cursor:pointer;
  font-family:var(--ui);font-size:12.5px;font-weight:550;
  color:var(--text);
  background:#111617;
  border:1px solid var(--line2);
  padding:7px 12px;border-radius:8px;
  display:inline-flex;align-items:center;gap:6px;
  transition:border-color .15s,background .15s,color .15s,transform .08s;
  white-space:nowrap;
}
button:hover{border-color:#2c3a3c;background:#151c1d;color:#eafff5}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:not-allowed}
button.g{background:linear-gradient(180deg,#00ff88,#00cf74);color:#032014;border-color:#00e07e;font-weight:700;box-shadow:0 0 18px var(--green-glow)}
button.g:hover{background:linear-gradient(180deg,#4dffae,#00e07e);color:#032014}
button.ghost{background:transparent}
button.sm{padding:5px 9px;font-size:11.5px;border-radius:7px}
input[type=text]{background:#0b110c;border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
input[type=text]:focus{outline:none;border-color:var(--green2);box-shadow:0 0 0 3px rgba(0,255,136,.12)}
select{background:#0b110c;border:1px solid var(--line);border-radius:7px;padding:4px 7px;font-size:11px}
h1{font-size:14px;letter-spacing:.6px;font-weight:650}
h1 span{color:var(--green)}
h1 i{font-style:normal;color:var(--dim);font-weight:400}
.top{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:9px 12px;background:rgba(10,14,10,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top .sp{flex:1}
.tabs{display:flex;gap:2px;background:#0b110c;border:1px solid var(--line);border-radius:9px;padding:2px}
.tabs button{border:0;background:transparent;padding:6px 13px;font-size:13px;border-radius:7px;color:var(--txt2)}
.tabs button.on{background:var(--pane2);color:var(--green);box-shadow:inset 0 0 0 1px var(--line)}
.wrap{position:relative;z-index:1;flex:1;display:flex;min-height:0}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--pane)}
.pane+.pane{border-left:1px solid var(--line)}
.ph{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--pane2);border-bottom:1px solid var(--line);flex:0 0 auto}
.ph b{font:600 11px var(--mono);color:var(--txt2);letter-spacing:.7px;text-transform:uppercase}
.ph .sp{flex:1}
.ph .info{font:11px var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
#files{width:var(--w0);flex:0 0 var(--w0);resize:none}
#tree{flex:1;overflow:auto;padding:6px 4px;font:12px/1.45 var(--mono)}
#tree::-webkit-scrollbar,#edwrap::-webkit-scrollbar{width:9px;height:9px}
#tree::-webkit-scrollbar-thumb,#edwrap::-webkit-scrollbar-thumb{background:#1e2c21;border-radius:9px;border:2px solid var(--pane)}
#tree::-webkit-scrollbar-thumb:hover{background:var(--green2)}
#tree::-webkit-scrollbar-track{background:transparent}
.row{display:flex;align-items:center;gap:2px;border-radius:6px;padding:1px 2px 1px 0;white-space:nowrap}
.row:hover{background:#141d15}
.row.on{background:rgba(0,255,136,.11);box-shadow:inset 0 0 0 1px rgba(0,255,136,.25)}
.row .tw{flex:0 0 14px;width:14px;height:18px;border:0;background:transparent;padding:0;color:var(--dim);font:10px/1 var(--mono);cursor:pointer;visibility:hidden}
.row:hover .tw,.row.open .tw{visibility:visible}
.row .tw:hover{color:var(--green)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;padding:3px 2px;cursor:pointer;background:transparent;border:0;text-align:left;font:12px var(--mono);color:var(--txt2)}
.row.on .nm{color:var(--green)}
.row.dir .nm{color:var(--txt);font-weight:600}
.row .act{flex:0 0 auto;opacity:0;padding:0 3px;font-size:10px;background:transparent;border:0;color:var(--dim);border-radius:4px;line-height:1.5}
.row:hover .act,.row.on .act{opacity:1}
.row .act:hover{color:var(--green);background:#1a2a1d}
.row .act.del:hover{color:var(--red);background:#2a1414}
.empty{padding:16px 10px;color:var(--muted);font:12px/1.6 var(--mono);text-align:center}
.empty b{display:block;color:var(--text);font-size:13px;margin-bottom:8px}
.empty .act{margin:8px 4px 0}
#edwrap{flex:1;position:relative;display:flex;min-height:0;background:#0a0f0b}
#gut{flex:0 0 46px;padding:10px 8px 10px 0;text-align:right;font:12.5px/20px var(--mono);color:#33472f;background:#080c08;overflow:hidden;user-select:none;border-right:1px solid var(--line)}
#ed{flex:1;padding:10px 12px;background:transparent;border:0;outline:0;resize:none;font:12.5px/20px var(--mono);color:#dff5e6;tab-size:2;white-space:pre;overflow:auto;caret-color:var(--green)}
#ed::placeholder{color:#3a4f36}
#ghost{position:absolute;pointer-events:none;font:12.5px/20px var(--mono);white-space:pre;color:#4e7a5b;left:0;top:0;padding:10px 12px;z-index:2}
.edbox{position:relative;display:flex;flex:1;min-height:0}
.sp1{flex:0 0 5px;cursor:col-resize;background:transparent;position:relative;z-index:5}
.sp1::after{content:"";position:absolute;inset:0 2px;background:var(--line);transition:.12s}
.sp1:hover::after,.sp1.on::after{background:var(--green2);box-shadow:0 0 8px rgba(0,255,136,.5)}
.sp2{flex:0 0 5px;cursor:row-resize;background:transparent;position:relative;z-index:5}
.sp2::after{content:"";position:absolute;inset:2px 0;background:var(--line);transition:.12s}
.sp2:hover::after,.sp2.on::after{background:var(--green2);box-shadow:0 0 8px rgba(0,255,136,.5)}
.mid{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#right{flex:1;display:flex;flex-direction:column;border-left:0;border-top:1px solid var(--line)}
#pv{flex:1;min-height:0;display:flex;flex-direction:column}
#term{flex:1;display:none;flex-direction:column;min-height:0;background:#060a06}
#term.on{display:flex}
#frame{flex:1;width:100%;border:0;background:#fff;display:block}
#tout{flex:1;overflow:auto;padding:9px 11px;font:12.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}
#tout .i{color:#9fe8b8}
#tout .o{color:#cde8d7}
#tout .e{color:var(--red)}
#tout .t{color:var(--amber)}
#tout .d{color:#5f9f78}
#tout .w{color:#7fc9ff}
#tout .m{color:var(--purple)}
#tin{display:none;gap:6px;padding:7px 9px;border-top:1px solid var(--line);background:#0a100b;align-items:center;flex:0 0 auto}
#tin.on{display:flex}
#tin span{font:11px var(--mono);color:var(--green);text-shadow:0 0 8px rgba(0,255,136,.6)}
#tin input{flex:1;font:12.5px var(--mono);padding:4px 8px}
#pyout{flex:0 0 auto;max-height:34%;overflow:auto;border-bottom:1px solid var(--line);background:#0b120c;display:none}
#pyout.on{display:block}
#pyout .hd{padding:5px 10px;font:600 10px var(--mono);letter-spacing:.8px;text-transform:uppercase;color:var(--green);background:#0e160f;border-bottom:1px solid var(--line)}
.statusbar{position:relative;z-index:3;display:flex;align-items:center;gap:14px;padding:5px 14px;background:#080b0c;border-top:1px solid var(--line);font:11px var(--mono);color:var(--muted);flex-wrap:wrap}
.statusbar .sp{flex:1}
#cnt{color:var(--muted)}
#hint{color:var(--dim)}
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(4,8,4,.72);backdrop-filter:blur(3px);padding:20px}
#modal.on{display:flex}
.mbox{background:var(--pane2);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(440px,100%);box-shadow:0 22px 60px rgba(0,0,0,.6)}
.mbox h2{font-size:15px;margin-bottom:4px}
.mbox p{font-size:12px;color:var(--dim);margin-bottom:11px}
.mbox input{font-family:var(--mono);font-size:13px}
.mbox .er{color:var(--red);font:11.5px var(--mono);min-height:16px;margin-top:6px}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
#toast{position:fixed;left:50%;bottom:52px;transform:translateX(-50%) translateY(14px);z-index:60;background:#182218;border:1px solid var(--green2);color:var(--green);padding:8px 16px;border-radius:9px;font:12px var(--mono);opacity:0;pointer-events:none;transition:.22s;box-shadow:0 8px 26px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#mobtabs{display:none;position:relative;z-index:3;gap:2px;padding:5px;background:rgba(10,14,10,.9);border-top:1px solid var(--line)}
#mobtabs button{flex:1;border:0;background:transparent;padding:8px;font-size:12.5px;color:var(--dim);border-radius:8px}
#mobtabs button.on{background:var(--pane2);color:var(--green);box-shadow:inset 0 0 0 1px var(--line)}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(180deg,#0c1011,#080b0c);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;padding-right:6px;margin-right:2px}
.logo{width:26px;height:26px;border-radius:7px;flex:0 0 auto;background:linear-gradient(145deg,var(--green),#00b862);display:grid;place-items:center;color:#04120b;font-weight:800;font-size:11px;font-family:var(--mono);box-shadow:0 0 16px var(--green-glow)}
.brand h1{font-size:14.5px;font-weight:650;letter-spacing:-.2px;white-space:nowrap}
.brand span{color:var(--dim);font-size:11px;font-family:var(--mono)}
.spacer{flex:1 1 auto;min-width:0}
.status{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-family:var(--mono);color:var(--muted);padding:6px 10px;border-radius:20px;border:1px solid var(--line);background:#0a0e0f;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:0 0 auto}
.status.ok .dot{background:var(--green);box-shadow:0 0 9px var(--green)}
.status.ok{color:var(--green)}
.status.err .dot{background:var(--err);box-shadow:0 0 9px var(--err)}
.status.err{color:var(--err);border-color:rgba(255,95,86,.35)}
select{
  appearance:none;cursor:pointer;
  font-family:var(--ui);font-size:12.5px;color:var(--text);
  background:#111617 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' fill='none' stroke='%236e817c' stroke-width='1.4' stroke-linecap='round'/></svg>") no-repeat right 10px center;
  border:1px solid var(--line2);border-radius:8px;padding:7px 28px 7px 11px;max-width:180px;text-overflow:ellipsis;
}
select:hover{border-color:#2c3a3c}
.mbox{background:var(--pane2);border:1px solid var(--line-2);border-radius:14px;padding:18px;width:min(440px,100%);box-shadow:0 22px 60px rgba(0,0,0,.6)}
.mbox.wide{width:min(620px,100%)}
#plist{max-height:min(58vh,460px);overflow:auto;display:flex;flex-direction:column;gap:6px;margin-top:4px}
.prow{display:flex;align-items:center;gap:4px;padding:4px 6px;border:1px solid var(--line);border-radius:10px;background:#0a0e0f}
.prow.on{border-color:var(--green-dim);background:rgba(0,255,136,.05)}
.pmain{flex:1;min-width:0;background:transparent;border:0;text-align:left;padding:6px 8px;cursor:pointer;display:block}
.pmain b{display:block;font:600 13px var(--mono);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmain small{display:block;font:10.5px var(--mono);color:var(--muted);margin-top:2px}
.pmain small em{color:var(--green);font-style:normal}
.pact{flex:0 0 auto;background:transparent;border:0;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:12px;cursor:pointer}
.pact:hover{color:var(--green);background:#151c1d}
.pact.del:hover{color:var(--err);background:#1a0f0f}
#pmodal{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;background:rgba(2,4,3,.78);padding:20px}
#pmodal.on{display:flex}
@media(max-width:860px){
  :root{--w0:200px}
  #files{position:absolute;left:0;top:0;bottom:0;z-index:10;box-shadow:14px 0 30px rgba(0,0,0,.5);width:70vw;flex-basis:70vw}
  #files.hide{display:none}
  .wrap.main>.pane,.mid>.pane{display:none}
  .wrap.main>.pane.on,.mid>.pane.on{display:flex}
  .wrap.main{display:block;position:relative}
  .sp1{display:none}
  #mobtabs{display:flex}
  #gut{flex-basis:34px;font-size:12px}
  .topbar{gap:7px;padding:8px 10px}
  .brand{width:100%}
  #hint{display:none}
  .statusbar{gap:9px;font-size:10px;padding:4px 8px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">&lt;/&gt;</div>
    <h1>Code Playground</h1>
    <span>html · css · js · py</span>
  </div>
  <button class="sm ghost" id="pname" title="Rename this project">my project</button>
  <select id="ex" title="Load an example"><option value="">Examples…</option></select>
  <button class="ghost" id="addf" title="Add a new file — you name it">＋ File</button>
  <button class="ghost" id="addd" title="Add a new folder">＋ Folder</button>
  <button class="ghost" id="reset" title="Delete every file and start from zero">⟳ Reset</button>
  <span class="spacer"></span>
  <div class="status" id="statuspill"><span class="dot"></span><span id="stat">ready</span></div>
  <button class="g" id="run" title="Run — Ctrl/Cmd+Enter">▶ Run</button>
  <select id="pyv" title="Python version"><option value="">python v…</option></select>
  <button class="ghost" id="newproj" title="Start a brand new empty project">＋ New</button>
  <button class="ghost" id="allproj" title="Open, rename, duplicate or delete any saved project">▤ ALL PROJECTS</button>
</header>

<div class="wrap main" id="mainwrap">
  <aside class="pane" id="files">
    <div class="ph">
      <b>Files</b><span class="sp"></span>
      <button class="sm ghost" id="addf2" title="New file">+F</button>
      <button class="sm ghost" id="addd2" title="New folder">+D</button>
      <button class="sm ghost" id="reset2" title="Reset project to 0 files">⟳</button>
    </div>
    <div id="tree"></div>
  </aside>

  <div class="sp1" id="sp1a"></div>

  <div class="mid">
  <section class="pane" id="code">
    <div class="ph">
      <b>Code</b>
      <span class="info" id="fname">—</span>
      <span class="sp"></span>
      <label class="ph" style="border:0;background:transparent;padding:0;gap:4px;cursor:pointer" title="Predictive autocomplete">
        <input type="checkbox" id="ghost" checked><span style="font:11px var(--mono);color:var(--dim)">ghost</span>
      </label>
      <button class="sm ghost" id="ren" title="Rename">✎</button>
      <button class="sm ghost" id="del" title="Delete file">✕</button>
    </div>
    <div class="edbox" id="edwrap">
      <div id="gut"></div>
      <textarea id="ed" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off" placeholder="// no file open — add one with + File"></textarea>
      <div id="ghost"></div>
    </div>
  </section>

  <div class="sp2" id="sp2"></div>

  <section class="pane" id="right">
    <div id="pv">
      <div class="ph">
        <b id="pvname">Terminal</b>
        <span class="sp"></span>
        <span class="info" id="pvinfo"></span>
        <button class="sm ghost" id="clr" title="Clear output">clear</button>
      </div>
      <div id="pyout"><div class="hd">python output</div><div id="pyoutb" style="padding:8px 10px;font:12.5px/1.5 var(--mono);color:#9fe8b8;white-space:pre-wrap"></div></div>
      <iframe id="frame" title="preview" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups"></iframe>
      <div id="term">
        <div id="tout"></div>
        <div id="tin"><span>&gt;</span><input type="text" id="tinp" placeholder="type here, then press Run" autocomplete="off" spellcheck="false"></div>
      </div>
    </div>
  </section>
  </div>
</div>
<nav id="mobtabs">
  <button data-m="files" class="on">Files</button>
  <button data-m="code">Code</button>
  <button data-m="preview">Preview</button>
</nav>
<footer class="statusbar">
  <span id="cnt">0 files</span>
  <span class="sp"></span>
  <span id="hint">Ctrl+Enter run · Tab indent · Esc dismiss suggestions</span>
</footer>

<div id="modal"><div class="mbox">
  <h2 id="mtitle">New file</h2>
  <p id="mp"></p>
  <input type="text" id="min" placeholder="index.html" autocomplete="off" spellcheck="false">
  <div class="er" id="mer"></div>
  <div class="mrow"><button class="ghost" id="mcancel">Cancel</button><button class="g" id="mok">Create</button></div>
</div></div>
<div id="pmodal"><div class="mbox wide">
  <h2>▤ All projects</h2>
  <p>every project lives in this browser. click one to open it.</p>
  <div id="plist"></div>
  <div class="mrow"><button class="ghost" id="pclose">Close</button><button class="g" id="pnew">＋ New project</button></div>
</div></div>
<div id="toast"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const el=$("#ed"),tree=$("#tree"),gut=$("#gut"),ghostBox=$("#ghost"),frame=$("#frame"),
      term=$("#term"),tout=$("#tout"),tin=$("#tin"),tinp=$("#tinp"),pyout=$("#pyout"),
      statusEl=$("#stat"),fname=$("#fname"),pvname=$("#pvname"),pvinfo=$("#pvinfo"),
      modal=$("#modal"),min=$("#min"),mer=$("#mer"),mtitle=$("#mtitle"),mp=$("#mp"),toastEl=$("#toast");

const KEY="cp.project.v2";
const PK="cp.projects.v3";
let S={files:{},dirs:{},active:"",open:{},w0:250,h:0,ghost:true,pyv:"0.28.3"};
let PROJECTS=[];
let PID="";
const uid=()=>"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const cur=()=>PROJECTS.find(p=>p.id===PID)||null;
function normProj(p){
  if(!p||typeof p!=="object") return null;
  return {
    id:p.id||uid(),
    name:p.name||"untitled project",
    files:p.files&&typeof p.files==="object"?p.files:{},
    dirs:p.dirs&&typeof p.dirs==="object"?p.dirs:{},
    open:p.open&&typeof p.open==="object"?p.open:{},
    active:typeof p.active==="string"?p.active:"",
    w0:+p.w0>130?+p.w0:250,
    h:+p.h>110?+p.h:0,
    ghost:p.ghost!==false,
    pyv:p.pyv||"0.28.3",
    created:+p.created||Date.now(),
    updated:+p.updated||Date.now()
  };
}
function loadAll(){
  try{
    const raw=localStorage.getItem(PK);
    if(raw){
      const d=JSON.parse(raw);
      if(d&&Array.isArray(d.list)&&d.list.length){
        PROJECTS=d.list.map(normProj).filter(Boolean);
        PID=PROJECTS.some(p=>p.id===d.active)?d.active:PROJECTS[0].id;
        return PROJECTS.length>1?"projects":"one";
      }
    }
  }catch(e){}
  try{
    const raw2=localStorage.getItem(KEY);
    if(raw2){
      const d=JSON.parse(raw2);
      const pr=normProj(Object.assign({},d,{id:uid(),name:"my project",created:Date.now(),updated:Date.now()}));
      if(Object.keys(pr.files).length||Object.keys(pr.dirs).length){
        PROJECTS=[pr]; PID=pr.id;
        return "migrated";
      }
    }
  }catch(e){}
  PROJECTS=[]; PID="";
  return "new";
}
function applyProj(){
  const p=cur();
  if(!p){ S.files={}; S.dirs={}; S.active=""; S.open={}; return }

  }

  for(const ln of lines){
    const i=ln.search(/\S/);

    const m=/^\s*(?:def|class)\s+([A-Za-z_]\w*)/.exec(ln);

  const fs=Object.keys(S.files);
  if(!fs.length){
    showTerm(true);
    termLine("w","no files yet — press + File and name one (e.g. main.py or index.html)");
    $("#run").classList.remove("busy");
    return;
  }
  const pyF=fs.filter(f=>ext(f)===".py").sort();
  const entry=pickEntry();
  status("running…");
  $("#run").classList.add("busy");
  if(pyF.length){
    termClear();
    clearHtml();
    showTerm(true);
    termLine("d","$ python "+pyF.map(f=>f.split("/").pop()).join(" "));
    try{
      const out=await runPy();
      if(entry){
        pyout.classList.add("on");
        pyout.classList.remove("hide");
        const r=build();
        if(r) frame.srcdoc=r.doc;
      }
    }catch(e){
      termLine("e","python could not start: "+String(e.message||e));
      termLine("w","python needs internet the first time (it downloads ~10MB).");
    }
  }else if(entry){
    showTerm(false);
    serve();
  }else{
    showTerm(true);
    termClear();
    termLine("w","nothing to run — this project has no .py and no .html file");
  }
  updateCounts();
  status("ready");
  $("#run").classList.remove("busy");
}

function ago(t){
  const d=Math.max(0,Date.now()-(+t||0));
  if(d<60000) return "just now";
  if(d<3600000) return Math.floor(d/60000)+"m ago";
  if(d<86400000) return Math.floor(d/3600000)+"h ago";
  return Math.floor(d/86400000)+"d ago";
}
function renderProjects(){
  plist.textContent="";
  if(!PROJECTS.length){
    const e=document.createElement("div");
    e.className="empty";
    e.textContent="no saved projects yet";
    plist.appendChild(e);
    return;
  }
  for(const pr of PROJECTS){
    const nf=Object.keys(pr.files).length, nd=Object.keys(pr.dirs).length;
    const r=document.createElement("div");
    r.className="prow"+(pr.id===PID?" on":"");
    const m=document.createElement("button");
    m.className="pmain";
    const b=document.createElement("b");
    b.textContent=pr.name;
    const sm=document.createElement("small");
    sm.textContent=nf+" file"+(nf===1?"":"s")+(nd?" \u00b7 "+nd+" folder"+(nd===1?"":"s"):"")+" \u00b7 edited "+ago(pr.updated);
    if(pr.id===PID){
      const em=document.createElement("em");
      em.textContent="  (open)";
      sm.appendChild(em);
    }
    m.append(b,sm);
    m.onclick=()=>{ if(pr.id!==PID) switchProject(pr.id); closeProjects() };
    r.appendChild(m);
    const mk=(t,tip,fn,cls)=>{
      const x=document.createElement("button");
      x.className="pact"+(cls?" "+cls:"");
      x.textContent=t;
      x.title=tip;
      x.onclick=fn;
      return x;
    };
    r.append(
      mk("\u270e","Rename",()=>askText("Rename project","what should it be called?",pr.name,v=>{ pr.name=v; saveNow(); syncTitle(); renderProjects() })),
      mk("\u29c9","Duplicate",()=>{
        saveNow();
        const c=normProj(Object.assign({},pr,{id:uid(),name:pr.name+" copy",created:Date.now(),updated:Date.now()}));
        PROJECTS.unshift(c);
        saveNow();
        renderProjects();
        toast("duplicated \u2192 "+c.name);
      }),
      mk("\u2715","Delete",()=>{
        if(PROJECTS.length<2){ toast("keep at least one project"); return }
        if(!confirm("delete project \""+pr.name+"\"?")) return;
        PROJECTS=PROJECTS.filter(x=>x.id!==pr.id);
        if(PID===pr.id){
          PID=PROJECTS[0].id;
          applyProj();
          gcb.checked=S.ghost;
          syncPySel();
          applySizes();
          openFile(S.active);
          termClear();
          termLine("d","opened project: "+cur().name);
        }
        saveNow();
        renderProjects();
        toast("project deleted");
      },"del")
    );
    plist.appendChild(r);
  }
}
