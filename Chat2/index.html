<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Neon Background -->
    <div class="background">
        <div class="grid-overlay"></div>
        <div class="glow-lines">
            <div class="line" style="top: 20%; left: -10%; width: 30%; animation-delay: 0s;"></div>
            <div class="line" style="top: 40%; right: -10%; width: 40%; animation-delay: 5s;"></div>
            <div class="line" style="bottom: 30%; left: -10%; width: 35%; animation-delay: 10s;"></div>
        </div>
        <div class="circles" style="width: 200px; height: 200px; top: 10%; left: 10%; animation-delay: 2s;"></div>
        <div class="circles" style="width: 150px; height: 150px; bottom: 10%; right: 10%; animation-delay: 7s;"></div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo" id="logo" data-i18n="neon_chat">NEON CHAT</div>
            <div class="nav">
                <button class="nav-btn" data-nav="chats" aria-label="Chats" data-i18n="nav_chats">Chats</button>
                <button class="nav-btn" data-nav="friends" aria-label="Friends" data-i18n="nav_friends">Friends</button>
                <button class="nav-btn" data-nav="requests" aria-label="Requests" data-i18n="nav_requests">Requests</button>
                <button class="nav-btn" data-nav="search" aria-label="Search" data-i18n="nav_search">Search</button>
                <button class="nav-btn" data-nav="settings" aria-label="Settings" data-i18n="nav_settings">Settings</button>
            </div>
        </div>
    </header>

    <main class="main" id="main">
        <!-- Welcome Screen -->
        <section class="hero" id="welcome-screen">
            <h1 data-i18n="app_title">NEON CHAT</h1>
            <p data-i18n="welcome_message">Enter your username to begin</p>
            
            <div class="auth-container" id="auth-container">
                <h2 data-i18n="enter_username">Enter Username</h2>
                <div class="form-group">
                    <input type="text" id="username-input" placeholder="Username" maxlength="24" data-i18n-placeholder="username_placeholder">
                </div>
                <button class="btn" id="login-btn" data-i18n="enter_chat">ENTER NEON CHAT</button>
                <div class="status" id="auth-status" data-i18n></div>
            </div>
        </section>

        <!-- Chat Interface -->
        <section class="chat-interface" id="chat-interface">
            <div class="chat-header">
                <span class="conversation-title" id="conversation-title" data-i18n="select_conversation">Select a conversation</span>
                <div class="conversation-switch">
                    <button class="switch-btn active" data-view="list" data-i18n="view_list">Conversation List</button>
                    <button class="switch-btn" data-view="grid" data-i18n="view_grid">Chat Grid</button>
                </div>
            </div>

            <div class="messages-list" id="messages-list">
                <p class="loading" id="loading-messages" data-i18n="loading_chats">LOADING CHATS...</p>
            </div>

            <div class="message-input" id="message-input">
                <input type="text" id="message-input-field" placeholder="Type a message..." autocomplete="off" data-i18n-placeholder="type_message">
                <button class="btn" id="send-btn" data-i18n="send">SEND</button>
            </div>
        </section>

        <!-- Friends Section -->
        <section class="friends-section" id="friends-section">
            <h2 data-i18n="friends">FRIENDS</h2>
            <div class="friends-grid" id="friends-grid">
                <p class="loading" id="loading-friends" data-i18n="loading_friends">LOADING FRIENDS...</p>
            </div>
        </section>

        <!-- Requests Section -->
        <section class="requests-section" id="requests-section">
            <h2 data-i18n="requests">FRIEND REQUESTS</h2>
            <div class="requests-list" id="requests-list">
                <p class="loading" id="loading-requests" data-i18n="loading_requests">LOADING REQUESTS...</p>
            </div>
        </section>

        <!-- Search Section -->
        <section class="search-section" id="search-section">
            <div class="search-section" data-i18n="search">
                <h3 data-i18n="search_title">SEARCH USERNAME</h3>
                <input type="text" class="search-input" id="search-input" placeholder="Enter username to search" data-i18n-placeholder="search_placeholder">
                <div class="search-results" id="search-results"></div>
            </div>
        </section>

        <!-- Settings Section -->
        <section class="settings-section" id="settings-section">
            <h2 data-i18n="settings">SETTINGS</h2>
            
            <div class="settings-section" id="account-settings">
                <h3 data-i18n="account">ACCOUNT</h3>
                <div class="setting-group">
                    <label data-i18n="current_username">Current Username</label>
                    <input type="text" id="username-display" readonly data-i18n>
                </div>
                <div class="setting-group">
                    <label data-i18n="change_username">Change Username</label>
                    <input type="text" id="new-username" placeholder="New username" data-i18n-placeholder="new_username">
                    <button class="btn" id="change-username-btn" data-i18n="change_username">CHANGE USERNAME</button>
                    <div class="status" id="change-username-status" data-i18n></div>
                </div>
                <button class="btn" id="logout-btn" data-i18n="logout">LOG OUT</button>
            </div>

            <div class="settings-section" id="language-settings" style="display: none;">
                <h3 data-i18n="language">LANGUAGE</h3>
                <select id="language-select">
                    <option value="en" data-i18n="english">English</option>
                    <option value="fr" data-i18n="french">Français</option>
                    <option value="th" data-i18n="thai">ไทย</option>
                    <option value="ja" data-i18n="japanese">日本語</option>
                </select>
            </div>
        </section>
    </main>

    <!-- Status Message -->
    <div class="status" id="status-message" data-i18n></div>

    <!-- Loading Overlay -->
    <div class="loading" id="loading-overlay">
        <div data-i18n="initializing">INITIALIZING NEON CHAT...</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
