<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario Bros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <div id="hud">
            <div id="hud-left"><span id="hud-lives"></span></div>
            <div id="hud-center">
                <span id="hud-score">SCORE: 000000</span>
                <span id="hud-coins">COINS: 00</span>
            </div>
            <div id="hud-right"><span id="hud-time">TIME: 300</span></div>
        </div>

        <div id="world-select" class="screen active">
            <div class="menu-content">
                <h1 class="game-title">SUPER MARIO BROS</h1>
                <div id="world-grid"></div>
            </div>
        </div>

        <div id="level-select" class="screen">
            <div class="screen-content">
                <h2 id="level-world-name"></h2>
                <div id="level-grid"></div>
                <button class="menu-btn" id="btn-back-worlds">BACK</button>
            </div>
        </div>

        <div id="pause-screen" class="screen">
            <div class="screen-content">
                <h2>PAUSED</h2>
                <div class="menu-buttons">
                    <button class="menu-btn" id="btn-resume">RESUME</button>
                    <button class="menu-btn" id="btn-restart">RESTART LEVEL</button>
                    <button class="menu-btn" id="btn-quit">WORLD SELECT</button>
                </div>
            </div>
        </div>

        <div id="level-complete-screen" class="screen">
            <div class="screen-content">
                <h2>LEVEL COMPLETE!</h2>
                <div id="complete-stats"></div>
                <button class="menu-btn" id="btn-next-level">NEXT LEVEL</button>
            </div>
        </div>

        <div id="world-complete-screen" class="screen">
            <div class="screen-content">
                <h2 id="world-complete-title"></h2>
                <button class="menu-btn" id="btn-world-continue">CONTINUE</button>
            </div>
        </div>

        <div id="game-over-screen" class="screen">
            <div class="screen-content">
                <h2>GAME OVER</h2>
                <div class="menu-buttons">
                    <button class="menu-btn" id="btn-retry">RETRY</button>
                    <button class="menu-btn" id="btn-gameover-menu">WORLD SELECT</button>
                </div>
            </div>
        </div>

        <div id="time-up-screen" class="screen">
            <div class="screen-content">
                <h2>TIME UP!</h2>
                <div class="menu-buttons">
                    <button class="menu-btn" id="btn-timeup-retry">RETRY</button>
                    <button class="menu-btn" id="btn-timeup-menu">WORLD SELECT</button>
                </div>
            </div>
        </div>

        <div id="mobile-controls">
            <div class="mobile-btn-group left-group">
                <button class="mobile-btn" id="mobile-left" aria-label="Left">◀</button>
                <button class="mobile-btn" id="mobile-right" aria-label="Right">▶</button>
            </div>
            <div class="mobile-btn-group right-group">
                <button class="mobile-btn jump-btn" id="mobile-jump" aria-label="Jump">A</button>
            </div>
        </div>

        <button id="pause-btn">❚❚</button>
    </div>

    <script src="audio.js"></script>
    <script src="levels.js"></script>
    <script src="game.js"></script>
</body>
</html>
