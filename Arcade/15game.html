<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15 Puzzle Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            touch-action: manipulation;
        }
        h1 {
            margin-bottom: 10px;
            color: #333;
            font-size: 1.8rem;
        }
        #board {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            grid-template-rows: repeat(4, 80px);
            gap: 6px;
            background-color: #bbada0;
            padding: 6px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .tile {
            background-color: #eee4da;
            color: #776e65;
            font-size: 1.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }
        .tile.empty {
            background-color: #bbada0;
            cursor: default;
        }
        .tile:not(.empty):active {
            background-color: #d8ccc4;
        }
        .btn-container {
            display: flex;
            gap: 10px;
        }
        .btn {
            background-color: #8f7a66;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .btn:active {
            background-color: #7f6a56;
        }
    </style>
</head>
<body>

    <h1>15 Puzzle</h1>
    <div id="board"></div>
    
    <div class="btn-container">
        <button class="btn" onclick="shuffle()">Shuffle</button>
        <a href="index.html" class="btn">Back to Hub</a>
    </div>

    <script>
        const board = document.getElementById('board');
        let tiles = [];
        let emptyIndex = 15;

        function initGame() {
            tiles = Array.from({length: 16}, (_, i) => i === 15 ? '' : i + 1);
            shuffle();
        }

        function render() {
            board.innerHTML = '';
            tiles.forEach((val, idx) => {
                const tile = document.createElement('div');
                tile.classList.add('tile');
                if (val === '') {
                    tile.classList.add('empty');
                } else {
                    tile.textContent = val;
                    tile.addEventListener('click', () => moveTile(idx));
                    tile.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        moveTile(idx);
                    });
                }
                board.appendChild(tile);
            });
        }

        function moveTile(idx) {
            const row = Math.floor(idx / 4);
            const col = idx % 4;
            const emptyRow = Math.floor(emptyIndex / 4);
            const emptyCol = emptyIndex % 4;

            const isAdjacent = (Math.abs(row - emptyRow) + Math.abs(col - emptyCol)) === 1;

            if (isAdjacent) {
                tiles[emptyIndex] = tiles[idx];
                tiles[idx] = '';
                emptyIndex = idx;
                render();
                checkWin();
            }
        }

        function shuffle() {
            for (let i = 0; i < 100; i++) {
                const validMoves = [];
                const row = Math.floor(emptyIndex / 4);
                const col = emptyIndex % 4;

                if (row > 0) validMoves.push(emptyIndex - 4);
                if (row < 3) validMoves.push(emptyIndex + 4);
                if (col > 0) validMoves.push(emptyIndex - 1);
                if (col < 3) validMoves.push(emptyIndex + 1);

                const randomMove = validMoves[Math.floor(Math.random() * validMoves.length)];
                tiles[emptyIndex] = tiles[randomMove];
                tiles[randomMove] = '';
                emptyIndex = randomMove;
            }
            render();
        }

        function checkWin() {
            const win = tiles.slice(0, 15).every((val, i) => val === i + 1);
            if (win) {
                setTimeout(() => alert('You Win!'), 100);
            }
        }

        initGame();
    </script>
<a href="../TeamChat/index.html" title="Team chat" style="position:fixed;right:14px;bottom:14px;z-index:99999;display:inline-block;background:#00ff88;color:#06130c;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:800;letter-spacing:.6px;text-decoration:none;padding:11px 16px;border-radius:99px;box-shadow:0 4px 20px rgba(0,255,136,.45)">TEAMCHAT</a>
</body>
</html>
