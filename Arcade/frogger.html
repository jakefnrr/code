<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Frogger</title>
<style>
button,[role="button"]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cyan: #00f5ff;
  --magenta: #ff00aa;
  --gold: #ffaa00;
  --navy: #0d0d1a;
  --text: #c0c0e0;
  --dim: #555577;
}

html, body {
  height: 100%;
  background: var(--navy);
  color: var(--text);
  font-family: "Courier New", Courier, monospace;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.12) 2px,
    rgba(0,0,0,0.12) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

#screen-game {
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

#hud {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 7px 14px;
  background: rgba(0,0,0,0.7);
  border-bottom: 1px solid rgba(0,245,255,0.2);
  flex-shrink: 0;
}

.hud-btn {
  background: transparent;
  border: 1px solid var(--dim);
  color: var(--dim);
  font-family: inherit;
  font-size: 0.78em;
  padding: 4px 10px;
  cursor: pointer;
  touch-action: manipulation;
  transition: border-color 0.15s, color 0.15s;
}

.hud-btn:hover { border-color: var(--magenta); color: var(--magenta); }

.hud-center {
  display: flex;
  gap: 20px;
  align-items: center;
}

.hud-game-name { color: var(--magenta); font-weight: bold; letter-spacing: 2px; font-size: 0.85em; }
.hud-score { color: var(--cyan); font-size: 0.9em; }
.hud-best  { color: var(--gold); font-size: 0.9em; }
.hud-timer { color: #44ff88; font-size: 0.9em; font-variant-numeric: tabular-nums; }
.hud-controls { color: var(--dim); font-size: 0.72em; white-space: nowrap; }

#game-container {
  flex: 1;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  overflow: auto;
  position: relative;
  padding: 0 12px clamp(190px, 42vh, 300px);
}

#game-container canvas {
  display: block;
  max-width: 100%;
  max-height: calc(100vh - 56px - clamp(190px, 42vh, 300px));
  object-fit: contain;
  touch-action: none;
}

#mobile-controls {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  height: clamp(190px, 42vh, 300px);
  width: 100vw;
  max-width: 800px;
  min-height: 0;
  margin: 0 auto;
  flex-direction: row;
  user-select: none;
  -webkit-user-select: none;
  z-index: 500;
}

.dpad {
  display: flex;
  flex: 1 1 auto;
  width: 100%;
  min-height: 0;
}

.dpad-left,
.dpad-right {
  flex: 1;
  display: flex;
  min-height: 0;
  overflow: hidden;
}

.dpad-center {
  flex: 0 0 200px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

.dpad-btn {
  flex: 1;
  border: 2px solid rgba(0,245,255,0.55);
  background: rgba(0,0,0,0.45);
  color: #fff;
  font-family: inherit;
  font-size: 36px;
  line-height: 1;
  cursor: pointer;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
}

.dpad-btn:active,
.dpad-btn.is-pressed {
  background: var(--cyan);
  color: var(--navy);
}

.dpad-up {
  border-bottom: none;
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
}

.dpad-down {
  border-top: none;
  border-top-left-radius: 0;
  border-top-right-radius: 0;
}

.dpad-divider {
  flex: 0 0 2px;
  background: rgba(255,255,255,0.5);
}

.dpad-left .dpad-btn {
  border-right: none;
  border-top-right-radius: 0;
  border-bottom-right-radius: 0;
}

.dpad-right .dpad-btn {
  border-left: none;
  border-top-left-radius: 0;
  border-bottom-left-radius: 0;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.82);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
}

.overlay.hidden { display: none !important; }

#game-over-modal {
  align-items: flex-start;
  padding: clamp(56px, 8vh, 90px) 12px clamp(190px, 42vh, 300px);
  z-index: 700;
}

.overlay-box {
  background: #08081a;
  border: 2px solid var(--cyan);
  box-shadow: 0 0 50px rgba(0,245,255,0.3);
  padding: 40px 56px;
  text-align: center;
  min-width: 280px;
}

.overlay-box h2 {
  color: var(--cyan);
  font-size: 2em;
  letter-spacing: 4px;
  text-shadow: 0 0 20px var(--cyan);
  margin-bottom: 16px;
}

.overlay-box p {
  color: var(--text);
  margin-bottom: 20px;
}

.overlay-btns {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 20px;
}

.overlay-box button, .overlay-btns button {
  background: rgba(0,245,255,0.1);
  border: 1px solid var(--cyan);
  color: var(--cyan);
  font-family: inherit;
  font-size: 0.95em;
  letter-spacing: 1px;
  padding: 10px 22px;
  cursor: pointer;
  touch-action: manipulation;
  transition: background 0.15s, color 0.15s;
}

.overlay-box button:hover, .overlay-btns button:hover {
  background: var(--cyan);
  color: var(--navy);
}

kbd {
  background: rgba(0,245,255,0.1);
  border: 1px solid rgba(0,245,255,0.4);
  padding: 2px 7px;
  border-radius: 3px;
}

.go-score-label { font-size: 0.8em; color: var(--dim); margin-bottom: 4px; letter-spacing: 2px; }
.go-score-val   { font-size: 3em; color: var(--magenta); font-weight: bold; text-shadow: 0 0 20px var(--magenta); margin-bottom: 8px; }
.go-new-best    { color: var(--gold); font-size: 1em; letter-spacing: 2px; margin-bottom: 6px; animation: pulse 0.6s infinite alternate; }
.go-new-best.hidden { display: none; }
.go-best-line   { font-size: 0.85em; color: var(--dim); }

@keyframes pulse {
  from { transform: scale(0.97); opacity: 0.8; }
  to   { transform: scale(1.03); opacity: 1; }
}

@media (max-width: 900px), (hover: none) and (pointer: coarse) {
  :root {
    --mobile-dpad-height: clamp(142px, 30vh, 210px);
    --mobile-board-lift: clamp(12px, 4vh, 34px);
  }

  #hud {
    align-items: flex-start;
    gap: 8px;
    padding: 8px;
  }

  .hud-center {
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 14px;
  }

  .hud-controls {
    display: none;
  }

  #game-container {
    align-items: flex-start;
    padding: 0 0 var(--mobile-dpad-height);
    overflow: hidden;
  }

  #game-container canvas {
    max-height: calc(100vh - 56px - var(--mobile-dpad-height) + var(--mobile-board-lift));
    transform: translateY(calc(-1 * var(--mobile-board-lift)));
  }

  #mobile-controls {
    height: var(--mobile-dpad-height);
  }

  #game-over-modal {
    padding-bottom: var(--mobile-dpad-height);
  }

  .overlay-box {
    width: min(92vw, 360px);
    padding: 30px 22px;
  }
}

</style>
</head>
<body>
<section id="screen-game">
  <div id="hud">
    <button id="hud-back" class="hud-btn">BACK TO HUB</button>
    <div class="hud-center">
      <span id="hud-game-name" class="hud-game-name">FROGGER</span>
      <span id="hud-score" class="hud-score">Score: 0</span>
      <span id="hud-best" class="hud-best">Best: 0</span>
      <span id="hud-timer" class="hud-timer">0:00</span>
    </div>
    <div class="hud-controls"><kbd>P</kbd> Pause <kbd>R</kbd> Restart <kbd>Esc</kbd> Hub</div>
  </div>
  <div id="game-container"></div>
  <div id="mobile-controls" aria-label="Touch controls">
    <div class="dpad">
      <div class="dpad-left">
        <button class="dpad-btn" type="button" data-dir="left" aria-label="Move left">◀</button>
      </div>
      <div class="dpad-center">
        <button class="dpad-btn dpad-up" type="button" data-dir="up" aria-label="Move up">▲</button>
        <div class="dpad-divider"></div>
        <button class="dpad-btn dpad-down" type="button" data-dir="down" aria-label="Move down">▼</button>
      </div>
      <div class="dpad-right">
        <button class="dpad-btn" type="button" data-dir="right" aria-label="Move right">▶</button>
      </div>
    </div>
  </div>
</section>

<div id="pause-overlay" class="overlay hidden">
  <div class="overlay-box">
    <h2>PAUSED</h2>
    <p>Press <kbd>P</kbd> to resume</p>
    <div class="overlay-btns">
      <button id="btn-resume">RESUME</button>
      <button id="btn-lobby-pause">BACK TO HUB</button>
    </div>
  </div>
</div>

<div id="game-over-modal" class="overlay hidden">
  <div class="overlay-box">
    <h2 id="go-title">GAME OVER</h2>
    <div class="go-score-label">SCORE</div>
    <div id="go-score" class="go-score-val">0</div>
    <div id="go-new-best" class="go-new-best hidden">NEW BEST</div>
    <div class="go-best-line">Best: <span id="go-best-val">0</span></div>
    <div class="go-best-line">Time: <span id="go-time-val">0:00</span></div>
    <div class="overlay-btns">
      <button id="btn-play-again">PLAY AGAIN</button>
      <button id="btn-lobby-over">BACK TO HUB</button>
    </div>
  </div>
</div>

<script>
"use strict";

window.ArcadeGames = window.ArcadeGames || {};

const AudioEngine = (() => {
  let ctx;
  let master;
  let musicGain;
  let musicTimer = null;
  let step = 0;
  const melody = [392, 494, 587, 523, 659, 587, 494, 440, 392, 330, 392, 494, 523, 587, 659, 784];
  const bass = [98, 123.47, 146.83, 130.81];

  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.45;
      master.connect(ctx.destination);
      musicGain = ctx.createGain();
      musicGain.gain.value = 0.12;
      musicGain.connect(master);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function tone(freq, duration, type = "square", volume = 0.18, target = master, start = 0) {
    const ac = ensure();
    if (!ac) return;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    const t = ac.currentTime + start;
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(volume, t + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain);
    gain.connect(target);
    osc.start(t);
    osc.stop(t + duration + 0.03);
  }

  function sweep(from, to, duration, type = "sawtooth", volume = 0.18) {
    const ac = ensure();
    if (!ac) return;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    const t = ac.currentTime;
    osc.type = type;
    osc.frequency.setValueAtTime(from, t);
    osc.frequency.exponentialRampToValueAtTime(to, t + duration);
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain);
    gain.connect(master);
    osc.start(t);
    osc.stop(t + duration + 0.03);
  }

  function playMusicStep() {
    if (!ctx || !musicGain) return;
    tone(melody[step % melody.length], 0.12, "triangle", 0.08, musicGain);
    if (step % 4 === 0) tone(bass[(step / 4) % bass.length], 0.18, "sine", 0.08, musicGain);
    step++;
  }

  return {
    startMusic() {
      ensure();
      if (musicTimer) return;
      playMusicStep();
      musicTimer = setInterval(playMusicStep, 210);
    },
    stopMusic() {
      clearInterval(musicTimer);
      musicTimer = null;
    },
    move() {
      ensure();
      tone(520, 0.045, "square", 0.16);
      tone(780, 0.055, "square", 0.1, master, 0.035);
    },
    loseHeart() {
      ensure();
      sweep(260, 95, 0.24, "sawtooth", 0.22);
      tone(72, 0.18, "triangle", 0.14, master, 0.08);
    },
    goal() {
      ensure();
      [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.11, "triangle", 0.16, master, i * 0.08));
    },
    gameOver() {
      ensure();
      [330, 247, 196, 123].forEach((f, i) => tone(f, 0.22, "sawtooth", 0.18, master, i * 0.16));
      sweep(180, 45, 0.75, "triangle", 0.16);
    }
  };
})();

(function () {
  const CELL = 32, COLS = 12, ROWS = 14;
  const W = CELL * COLS, H = CELL * ROWS;

  let canvas, ctx, raf, frog, lanes, score, lives, alive, paused, cbs, bestRow;

  function makeLanes() {
    lanes = [];
    for (let r = 1; r <= 5; r++) {
      const speed = (1.4 + r * 0.4) * (r % 2 === 0 ? 1 : -1);
      const gap = 120 + Math.random() * 40;
      const w = 40 + Math.random() * 20;
      const objs = [];
      for (let x = -gap; x < W + gap; x += gap) objs.push({ x });
      lanes.push({ r, type: "road", speed, w, objs, h: 18 });
    }
    for (let r = 7; r <= 11; r++) {
      const speed = (0.9 + r * 0.15) * (r % 2 === 0 ? -1 : 1);
      const gap = 140 + Math.random() * 40;
      const w = 70 + Math.random() * 30;
      const objs = [];
      for (let x = -gap; x < W + gap; x += gap) objs.push({ x });
      lanes.push({ r, type: "log", speed, w, objs, h: 22 });
    }
  }

  function resetFrog() { frog = { r: 13, c: Math.floor(COLS / 2), onLog: null }; }

  function reset() {
    score = 0;
    lives = 3;
    alive = true;
    paused = false;
    bestRow = 13;
    resetFrog();
    makeLanes();
  }

  function laneAt(r) { return lanes.find(l => l.r === r); }

  function loseLife() {
    lives--;
    if (lives > 0) AudioEngine.loseHeart();
    resetFrog();
    if (lives <= 0) {
      alive = false;
      setTimeout(() => cbs.onGameOver(score), 400);
      return true;
    }
    return false;
  }

  function tick() {
    if (!alive) return;
    if (paused) {
      raf = requestAnimationFrame(tick);
      return;
    }

    lanes.forEach(l => {
      l.objs.forEach(o => o.x += l.speed * 0.5);
      l.objs.forEach(o => {
        if (l.speed > 0 && o.x > W + 60) o.x -= W + 200;
        if (l.speed < 0 && o.x < -60 - l.w) o.x += W + 200;
      });
    });

    const lane = laneAt(frog.r);
    if (lane && lane.type === "log") {
      const fx = frog.c * CELL + CELL / 2;
      const onLog = lane.objs.some(o => fx > o.x && fx < o.x + lane.w);
      if (!onLog) {
        if (loseLife()) return;
      } else {
        frog.c += (lane.speed * 0.5) / CELL;
        if (frog.c < 0 || frog.c > COLS - 1) {
          if (loseLife()) return;
        }
      }
    }

    if (lane && lane.type === "road") {
      const fx = frog.c * CELL + CELL / 2;
      const hit = lane.objs.some(o => fx > o.x - 2 && fx < o.x + lane.w + 2);
      if (hit && loseLife()) return;
    }

    if (frog.r === 0) {
      score += 100;
      AudioEngine.goal();
      cbs.onScoreUpdate(score);
      resetFrog();
      bestRow = 13;
    }

    draw();
    raf = requestAnimationFrame(tick);
  }

  function draw() {
    ctx.fillStyle = "#0a0a18";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#0a3a1a";
    ctx.fillRect(0, 0, W, CELL);
    ctx.fillStyle = "#0a2a0a";
    ctx.fillRect(0, 6 * CELL, W, CELL);
    ctx.fillRect(0, 12 * CELL, W, CELL);
    ctx.fillStyle = "#181828";
    ctx.fillRect(0, 1 * CELL, W, 5 * CELL);
    ctx.fillStyle = "#0a1a3a";
    ctx.fillRect(0, 7 * CELL, W, 5 * CELL);

    lanes.forEach(l => {
      l.objs.forEach(o => {
        ctx.fillStyle = l.type === "road" ? "#ff4444" : "#7a5230";
        ctx.fillRect(o.x, l.r * CELL + (CELL - l.h) / 2, l.w, l.h);
      });
    });

    ctx.fillStyle = "#44ff66";
    const fx = frog.c * CELL + CELL / 2, fy = frog.r * CELL + CELL / 2;
    ctx.beginPath();
    ctx.arc(fx, fy, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#06060f";
    ctx.beginPath();
    ctx.arc(fx - 4, fy - 4, 2, 0, Math.PI * 2);
    ctx.arc(fx + 4, fy - 4, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#555577";
    ctx.font = "12px Courier New";
    ctx.fillText("Lives: " + "❤".repeat(Math.max(0, lives)), 8, H - 8);

    ctx.strokeStyle = "rgba(0,245,255,0.2)";
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, W - 2, H - 2);
  }

  function move(direction) {
    if (!alive || paused) return false;
    let moved = false;
    if (direction === "up") { frog.r = Math.max(0, frog.r - 1); moved = true; }
    if (direction === "down") { frog.r = Math.min(13, frog.r + 1); moved = true; }
    if (direction === "left") { frog.c = Math.max(0, frog.c - 1); moved = true; }
    if (direction === "right") { frog.c = Math.min(COLS - 1, frog.c + 1); moved = true; }
    if (moved) {
      AudioEngine.startMusic();
      AudioEngine.move();
      if (frog.r < bestRow) {
        bestRow = frog.r;
        score += 5;
        cbs.onScoreUpdate(score);
      }
    }
    return moved;
  }

  function onKey(e) {
    const keys = {
      ArrowUp: "up",
      ArrowDown: "down",
      ArrowLeft: "left",
      ArrowRight: "right"
    };
    const direction = keys[e.key];
    if (!direction) return;
    if (move(direction)) {
      e.preventDefault();
    }
  }

  window.ArcadeGames.frogger = {
    start(container, callbacks) {
      cbs = callbacks;
      canvas = document.createElement("canvas");
      canvas.width = W;
      canvas.height = H;
      container.appendChild(canvas);
      ctx = canvas.getContext("2d");
      reset();
      document.addEventListener("keydown", onKey);
      draw();
      raf = requestAnimationFrame(tick);
    },
    pause() { paused = true; },
    resume() { paused = false; },
    move,
    destroy() {
      alive = false;
      paused = false;
      if (raf) cancelAnimationFrame(raf);
      document.removeEventListener("keydown", onKey);
    }
  };
})();

let highScore = Number(localStorage.getItem("froggerBest") || 0);
let currentGame = null;
let isPaused = false;
let sessionSeconds = 0;
let timerInterval = null;
let gameEnded = false;

function formatTime(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return m + ":" + String(s).padStart(2, "0");
}

function updateTimerDisplay() {
  document.getElementById("hud-timer").textContent = formatTime(sessionSeconds);
}

function startTimer() {
  clearInterval(timerInterval);
  sessionSeconds = 0;
  gameEnded = false;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    if (!isPaused && !gameEnded) {
      sessionSeconds++;
      updateTimerDisplay();
    }
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}

function setHUD(score) {
  document.getElementById("hud-score").textContent = "Score: " + score;
  document.getElementById("hud-best").textContent = "Best: " + highScore;
}

function showOverlay(id) { document.getElementById(id).classList.remove("hidden"); }
function hideOverlay(id) { document.getElementById(id).classList.add("hidden"); }

function showGameOver(score) {
  gameEnded = true;
  AudioEngine.gameOver();
  AudioEngine.stopMusic();
  if (score > highScore) {
    highScore = score;
    localStorage.setItem("froggerBest", String(score));
    document.getElementById("go-new-best").classList.remove("hidden");
  } else {
    document.getElementById("go-new-best").classList.add("hidden");
  }
  document.getElementById("go-score").textContent = score;
  document.getElementById("go-best-val").textContent = highScore;
  document.getElementById("go-time-val").textContent = formatTime(sessionSeconds);
  setHUD(score);
  showOverlay("game-over-modal");
}

function restartGame() {
  hideOverlay("pause-overlay");
  hideOverlay("game-over-modal");
  isPaused = false;
  if (currentGame) currentGame.destroy();
  const container = document.getElementById("game-container");
  container.innerHTML = "";
  setHUD(0);
  startTimer();
  AudioEngine.startMusic();
  currentGame = window.ArcadeGames.frogger;
  currentGame.start(container, {
    onScoreUpdate(score) { setHUD(score); },
    onGameOver(score) { showGameOver(score); }
  });
}

function togglePause() {
  if (!currentGame) return;
  if (!document.getElementById("game-over-modal").classList.contains("hidden")) return;
  isPaused = !isPaused;
  if (isPaused) {
    currentGame.pause();
    showOverlay("pause-overlay");
  } else {
    currentGame.resume();
    hideOverlay("pause-overlay");
  }
}

function goToHub() {
  if (currentGame) currentGame.destroy();
  AudioEngine.stopMusic();
  stopTimer();
  location.href = "index.html";
}

function bindTap(el, handler) {
  if (!el) return;
  let lastPointerTime = 0;
  if (window.PointerEvent) {
    el.addEventListener("pointerup", e => {
      lastPointerTime = Date.now();
      e.preventDefault();
      handler(e);
    });
  }
  el.addEventListener("touchend", e => {
    if (window.PointerEvent) return;
    e.preventDefault();
    handler(e);
  }, { passive: false });
  el.addEventListener("click", e => {
    if (Date.now() - lastPointerTime < 450) return;
    handler(e);
  });
}

document.addEventListener("keydown", e => {
  switch (e.key) {
    case "Escape": e.preventDefault(); goToHub(); break;
    case "p":
    case "P": e.preventDefault(); togglePause(); break;
    case "r":
    case "R": e.preventDefault(); restartGame(); break;
  }
});

document.querySelectorAll(".dpad-btn").forEach(btn => {
  let lastPointerTime = 0;
  const activate = e => {
    e.preventDefault();
    btn.classList.add("is-pressed");
    if (currentGame) currentGame.move(btn.dataset.dir);
  };
  const release = () => btn.classList.remove("is-pressed");

  if (window.PointerEvent) {
    btn.addEventListener("pointerdown", e => {
      lastPointerTime = Date.now();
      activate(e);
    });
    btn.addEventListener("pointerup", release);
    btn.addEventListener("pointercancel", release);
    btn.addEventListener("pointerleave", release);
  }
  btn.addEventListener("touchstart", e => {
    if (window.PointerEvent) return;
    activate(e);
  }, { passive: false });
  btn.addEventListener("touchend", release);
  btn.addEventListener("click", e => {
    if (Date.now() - lastPointerTime < 450) return;
    activate(e);
    release();
  });
});

bindTap(document.getElementById("hud-back"), goToHub);
bindTap(document.getElementById("btn-resume"), togglePause);
bindTap(document.getElementById("btn-lobby-pause"), goToHub);
bindTap(document.getElementById("btn-play-again"), restartGame);
bindTap(document.getElementById("btn-lobby-over"), goToHub);

setHUD(0);
restartGame();
</script>
