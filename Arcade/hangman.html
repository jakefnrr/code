<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hangman</title>
<style>
button,[role="button"]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#050505;
    color:#f4ffff;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.game{
    width:min(96vw, 900px);
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:16px;
}

h1{
    margin:0;
    color:#00ffff;
    font-size:clamp(34px, 7vw, 58px);
    line-height:1;
    text-shadow:0 0 16px #00ffff, 0 0 34px rgba(0,255,255,.4);
}

.hub{
    border:2px solid #00ffff;
    background:#001b1b;
    color:#dfffff;
    border-radius:6px;
    padding:10px 13px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.hud{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
    margin-bottom:14px;
}

.stat{
    background:#151515;
    border:1px solid #303030;
    border-radius:8px;
    padding:10px 8px;
    text-align:center;
    min-width:0;
}

.label{
    display:block;
    color:#a7baba;
    font-size:12px;
    font-weight:bold;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin-bottom:5px;
}

.value{
    color:#00ffff;
    font-size:clamp(18px, 4vw, 24px);
    font-weight:900;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.stage{
    display:grid;
    grid-template-columns:minmax(240px, 340px) 1fr;
    gap:16px;
    align-items:stretch;
}

.gallows,
.panel{
    background:#101010;
    border:3px solid #00ffff;
    border-radius:8px;
    box-shadow:0 0 25px rgba(0,255,255,.22);
}

.gallows{
    min-height:310px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px;
}

svg{
    width:100%;
    height:auto;
    max-height:310px;
}

.line{
    stroke:#00ffff;
    stroke-width:8;
    stroke-linecap:round;
    filter:drop-shadow(0 0 5px #00ffff);
}

.body-part{
    stroke:#ffef7d;
    stroke-width:7;
    stroke-linecap:round;
    fill:none;
    filter:drop-shadow(0 0 5px rgba(255,239,125,.65));
    opacity:0;
    transition:opacity .15s ease;
}

.body-part.show{
    opacity:1;
}

.panel{
    padding:18px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:18px;
}

.word{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    min-height:84px;
    align-items:center;
}

.slot{
    width:clamp(34px, 7vw, 52px);
    height:clamp(46px, 9vw, 66px);
    border-bottom:5px solid #00ffff;
    color:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(28px, 6vw, 44px);
    font-weight:900;
    text-shadow:0 0 10px rgba(255,255,255,.55);
}

.space{
    width:22px;
    border:0;
}

.message{
    min-height:30px;
    color:#ffef7d;
    text-align:center;
    font-size:clamp(18px, 4vw, 24px);
    font-weight:900;
}

.setup{
    display:none;
    gap:10px;
    grid-template-columns:1fr auto;
    align-items:center;
    margin-top:12px;
}

.setup.active{
    display:grid;
}

.setup label{
    grid-column:1 / -1;
    color:#00ffff;
    font-size:18px;
    font-weight:900;
    text-align:center;
}

.setup input{
    min-height:44px;
    border:2px solid #00ffff;
    border-radius:7px;
    background:#050505;
    color:#ffffff;
    font-size:18px;
    font-weight:bold;
    padding:8px 10px;
    text-transform:uppercase;
}

.setup button{
    min-height:44px;
    border:0;
    border-radius:7px;
    background:#00ffff;
    color:#031414;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
}

.keyboard{
    display:grid;
    grid-template-columns:repeat(13, 1fr);
    gap:7px;
}

.key{
    aspect-ratio:1;
    border:0;
    border-radius:7px;
    background:#00ffff;
    color:#031414;
    font-size:clamp(14px, 2.8vw, 20px);
    font-weight:900;
    cursor:pointer;
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.22);
}

.key:hover:not(:disabled),
.key:focus:not(:disabled){
    outline:3px solid #ffffff;
    outline-offset:-4px;
    filter:brightness(1.12);
}

.key:disabled{
    cursor:default;
    background:#2a2a2a;
    color:#777;
    box-shadow:none;
}

.key.correct:disabled{
    background:#27e887;
    color:#031408;
}

.key.wrong:disabled{
    background:#e43f5a;
    color:#fff;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
}

.action{
    min-height:46px;
    border:0;
    border-radius:8px;
    background:#00ffff;
    color:#030303;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.action.secondary{
    background:#242424;
    color:#f5f5f5;
    border:1px solid #444;
}

@media (max-width:760px){
    .stage{
        grid-template-columns:1fr;
    }

    .gallows{
        min-height:230px;
    }

    svg{
        max-height:230px;
    }
}

@media (max-width:520px){
    body{
        padding:12px;
    }

    .hud{
        grid-template-columns:repeat(2, 1fr);
    }

    .keyboard{
        grid-template-columns:repeat(7, 1fr);
    }

    .controls,
    .setup{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>
<main class="game">
    <div class="topbar">
        <h1>Hangman</h1>
        <button class="hub" id="hubButton">Back to Hub</button>
    </div>

    <section class="hud" aria-label="Game stats">
        <div class="stat">
            <span class="label">Category</span>
            <span class="value" id="category">Arcade</span>
        </div>
        <div class="stat">
            <span class="label">Wrong</span>
            <span class="value" id="wrong">0/6</span>
        </div>
        <div class="stat">
            <span class="label">Wins</span>
            <span class="value" id="wins">0</span>
        </div>
        <div class="stat">
            <span class="label">Streak</span>
            <span class="value" id="streak">0</span>
        </div>
    </section>

    <section class="stage">
        <div class="gallows" aria-hidden="true">
            <svg viewBox="0 0 260 300" role="img">
                <line class="line" x1="36" y1="278" x2="224" y2="278"></line>
                <line class="line" x1="72" y1="278" x2="72" y2="30"></line>
                <line class="line" x1="72" y1="30" x2="180" y2="30"></line>
                <line class="line" x1="180" y1="30" x2="180" y2="66"></line>
                <circle class="body-part" id="part0" cx="180" cy="88" r="22"></circle>
                <line class="body-part" id="part1" x1="180" y1="110" x2="180" y2="180"></line>
                <line class="body-part" id="part2" x1="180" y1="128" x2="142" y2="156"></line>
                <line class="body-part" id="part3" x1="180" y1="128" x2="218" y2="156"></line>
                <line class="body-part" id="part4" x1="180" y1="180" x2="148" y2="232"></line>
                <line class="body-part" id="part5" x1="180" y1="180" x2="212" y2="232"></line>
            </svg>
        </div>

        <div class="panel">
            <div>
                <div class="word" id="word" aria-label="Word"></div>
                <div class="message" id="message" aria-live="polite"></div>
                <form class="setup" id="setupForm" autocomplete="off">
                    <label for="secretWord">Enter a word:</label>
                    <input id="secretWord" type="password" inputmode="latin" maxlength="24" placeholder="Arcade">
                    <button type="submit">Start</button>
                </form>
            </div>

            <div class="keyboard" id="keyboard" aria-label="Keyboard"></div>

            <div class="controls">
                <button class="action" id="newGame">New Game</button>
                <button class="action secondary" id="pvp">PvP</button>
                <button class="action secondary" id="reveal">Reveal</button>
            </div>
        </div>
    </section>
</main>

<script>
const WORDS = [
    { word:"ARCADE", category:"Games" },
    { word:"PIXEL", category:"Games" },
    { word:"JOYSTICK", category:"Games" },
    { word:"BUTTON", category:"Games" },
    { word:"LEVEL", category:"Games" },
    { word:"VICTORY", category:"Games" },
    { word:"CHECKERS", category:"Arcade Hub" },
    { word:"FROGGER", category:"Arcade Hub" },
    { word:"NEON DASH", category:"Arcade Hub" },
    { word:"MEMORY", category:"Arcade Hub" },
    { word:"STACK TOWER", category:"Arcade Hub" },
    { word:"TIC TAC TOE", category:"Arcade Hub" },
    { word:"JAVASCRIPT", category:"Code" },
    { word:"TERMINAL", category:"Code" },
    { word:"EXTENSION", category:"Code" },
    { word:"KEYBOARD", category:"Code" },
    { word:"PUZZLE", category:"Challenge" },
    { word:"MYSTERY", category:"Challenge" },
    { word:"CHAMPION", category:"Challenge" },
    { word:"THUNDER", category:"Challenge" }
];

const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const MAX_WRONG = 6;
const wordEl = document.getElementById("word");
const keyboardEl = document.getElementById("keyboard");
const categoryEl = document.getElementById("category");
const wrongEl = document.getElementById("wrong");
const winsEl = document.getElementById("wins");
const streakEl = document.getElementById("streak");
const messageEl = document.getElementById("message");
const newGameBtn = document.getElementById("newGame");
const pvpBtn = document.getElementById("pvp");
const revealBtn = document.getElementById("reveal");
const hubButton = document.getElementById("hubButton");
const setupForm = document.getElementById("setupForm");
const secretWordInput = document.getElementById("secretWord");

let answer = "";
let mode = "arcade";
let guessed = new Set();
let wrongLetters = new Set();
let gameOver = false;
let paused = false;
let settingWord = false;
let wins = Number(localStorage.getItem("hangmanWins") || 0);
let streak = Number(localStorage.getItem("hangmanStreak") || 0);

function pickWord(){
    return WORDS[Math.floor(Math.random() * WORDS.length)];
}

function drawWord(){
    wordEl.innerHTML = "";

    if(settingWord){
        const prompt = document.createElement("span");
        prompt.className = "message";
        prompt.textContent = "PvP setup";
        wordEl.appendChild(prompt);
        return;
    }

    answer.split("").forEach(letter => {
        const slot = document.createElement("span");
        slot.className = letter === " " ? "slot space" : "slot";
        slot.textContent = letter === " " || guessed.has(letter) || gameOver ? letter : "";
        wordEl.appendChild(slot);
    });
}

function drawKeyboard(){
    keyboardEl.innerHTML = "";

    ALPHABET.forEach(letter => {
        const key = document.createElement("button");
        key.className = "key";
        key.type = "button";
        key.textContent = letter;
        key.disabled = settingWord || guessed.has(letter) || wrongLetters.has(letter) || gameOver || paused;
        if(guessed.has(letter)){
            key.classList.add("correct");
        }
        if(wrongLetters.has(letter)){
            key.classList.add("wrong");
        }
        key.addEventListener("click", () => guess(letter));
        keyboardEl.appendChild(key);
    });
}

function drawGallows(){
    for(let i = 0; i < MAX_WRONG; i++){
        document.getElementById(`part${i}`).classList.toggle("show", i < wrongLetters.size);
    }
}

function updateHud(){
    wrongEl.textContent = `${wrongLetters.size}/${MAX_WRONG}`;
    winsEl.textContent = wins;
    streakEl.textContent = streak;
    pvpBtn.textContent = mode === "pvp" ? "Arcade" : "PvP";
    revealBtn.disabled = settingWord || gameOver;
    newGameBtn.textContent = mode === "pvp" ? "New Word" : "New Game";
    setupForm.classList.toggle("active", settingWord);
}

function render(){
    drawWord();
    drawKeyboard();
    drawGallows();
    updateHud();
}

function didWin(){
    return answer.split("").every(letter => letter === " " || guessed.has(letter));
}

function finish(won){
    gameOver = true;
    if(won){
        wins++;
        streak++;
        localStorage.setItem("hangmanWins", String(wins));
        localStorage.setItem("hangmanStreak", String(streak));
        messageEl.textContent = mode === "pvp" ? "Guesser wins!" : "You win!";
    }else{
        streak = 0;
        localStorage.setItem("hangmanStreak", "0");
        messageEl.textContent = mode === "pvp" ? `Word maker wins: ${answer}` : `Game over: ${answer}`;
    }
    render();
}

function guess(letter){
    if(gameOver || paused || guessed.has(letter) || wrongLetters.has(letter)){
        return;
    }

    if(answer.includes(letter)){
        guessed.add(letter);
    }else{
        wrongLetters.add(letter);
    }

    if(didWin()){
        finish(true);
        return;
    }

    if(wrongLetters.size >= MAX_WRONG){
        finish(false);
        return;
    }

    messageEl.textContent = "";
    render();
}

function resetRound(selected){
    answer = selected.word;
    categoryEl.textContent = selected.category;
    guessed = new Set();
    wrongLetters = new Set();
    gameOver = false;
    paused = false;
    settingWord = false;
    messageEl.textContent = "";
    secretWordInput.value = "";
    render();
}

function newGame(){
    if(mode === "pvp"){
        beginPvpSetup();
        return;
    }

    const selected = pickWord();
    resetRound(selected);
}

function beginPvpSetup(){
    mode = "pvp";
    answer = "";
    categoryEl.textContent = "PvP";
    guessed = new Set();
    wrongLetters = new Set();
    gameOver = false;
    paused = false;
    settingWord = true;
    messageEl.textContent = "Enter a word, then hand it to the guesser.";
    render();
    secretWordInput.focus();
}

function submitPvpWord(event){
    event.preventDefault();
    const cleaned = secretWordInput.value.toUpperCase().replace(/[^A-Z ]/g, "").replace(/\s+/g, " ").trim();

    if(!cleaned || !/[A-Z]/.test(cleaned)){
        messageEl.textContent = "Enter a word with letters.";
        secretWordInput.focus();
        return;
    }

    resetRound({ word:cleaned, category:"PvP" });
}

function revealAnswer(){
    if(gameOver){
        return;
    }
    finish(false);
}

function togglePause(){
    if(gameOver || settingWord){
        return;
    }
    paused = !paused;
    messageEl.textContent = paused ? "Paused" : "";
    render();
}

document.addEventListener("keydown", event => {
    if(event.target === secretWordInput){
        return;
    }

    if(event.key === "Escape"){
        event.preventDefault();
        window.location.href = "index.html";
        return;
    }

    if(event.key === "r" || event.key === "R"){
        event.preventDefault();
        newGame();
        return;
    }

    if(event.key === "p" || event.key === "P"){
        event.preventDefault();
        togglePause();
        return;
    }

    const letter = event.key.toUpperCase();
    if(!settingWord && /^[A-Z]$/.test(letter)){
        guess(letter);
    }
});

newGameBtn.addEventListener("click", newGame);
pvpBtn.addEventListener("click", () => {
    if(mode === "pvp"){
        mode = "arcade";
        newGame();
    }else{
        beginPvpSetup();
    }
});
revealBtn.addEventListener("click", revealAnswer);
setupForm.addEventListener("submit", submitPvpWord);
hubButton.addEventListener("click", () => {
    window.location.href = "index.html";
});

newGame();
</script>

</body>
</html>
