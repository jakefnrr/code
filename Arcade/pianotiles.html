<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Neon Piano Tiles</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#070912;color:white;font-family:Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
    button,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-family:inherit}
    .screen{position:relative;width:100vw;height:100dvh;overflow:hidden;background:radial-gradient(circle at top,#172554 0,#070912 58%)}
    .hud{position:absolute;left:10px;right:10px;top:8px;z-index:5;pointer-events:none}
    .hud-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .stats{display:flex;gap:8px;flex-wrap:wrap}
    .pill{min-width:78px;padding:8px 10px;border:1px solid rgba(125,211,252,.26);border-radius:8px;background:rgba(3,7,18,.76);text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.28)}
    .label{display:block;font-size:11px;color:#93c5fd;font-weight:bold;text-transform:uppercase}
    .value{display:block;margin-top:2px;font-size:20px;font-weight:bold}
    .score-top{position:absolute;left:50%;top:0;transform:translateX(-50%);min-width:130px;padding:8px 16px;border:1px solid rgba(56,189,248,.36);border-radius:8px;background:rgba(3,7,18,.84);text-align:center;box-shadow:0 0 24px rgba(56,189,248,.2)}
    .score-top .value{font-size:28px}
    #hubButton{border:0;border-radius:8px;background:#38bdf8;color:#082f49;font-weight:bold;padding:10px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
    #hubButton:hover{background:white}
    .song-name{position:absolute;left:50%;top:74px;transform:translateX(-50%);padding:6px 12px;border-radius:8px;background:rgba(3,7,18,.58);color:#bfdbfe;font-size:13px;font-weight:bold;white-space:nowrap;pointer-events:none}
    .board{position:absolute;left:50%;top:0;bottom:0;transform:translateX(-50%);width:min(100vw,520px);display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid rgba(255,255,255,.12);border-right:1px solid rgba(255,255,255,.12);background:rgba(2,6,23,.5);touch-action:none}
    .lane{position:relative;border-left:1px solid rgba(255,255,255,.13);border-right:1px solid rgba(255,255,255,.05);overflow:hidden}
    .lane.hit{background:rgba(56,189,248,.18)}
    .lane.holding{background:rgba(250,204,21,.13)}
    .key-label{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:2;color:rgba(255,255,255,.42);font-size:18px;font-weight:bold}
    .target{position:absolute;left:0;right:0;bottom:148px;height:92px;border-top:2px solid rgba(56,189,248,.7);border-bottom:2px solid rgba(56,189,248,.35);background:rgba(14,165,233,.08)}
    .tile{position:absolute;left:8px;right:8px;height:132px;border-radius:8px;background:linear-gradient(180deg,#111827,#020617);border:1px solid rgba(255,255,255,.22);box-shadow:0 0 18px rgba(56,189,248,.18),inset 0 -8px 0 rgba(0,0,0,.25)}
    .tile.hold{background:linear-gradient(180deg,#fde047,#f59e0b);box-shadow:0 0 22px rgba(250,204,21,.58),inset 0 -8px 0 rgba(0,0,0,.18)}
    .tile.hold::after{content:"HOLD";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#422006;font-size:13px;font-weight:bold}
    .tile.active{outline:3px solid white}
    .spark{position:absolute;width:10px;height:10px;border-radius:50%;background:#38bdf8;pointer-events:none}
    .overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(2,6,23,.78);padding:18px;text-align:center}
    .panel{width:min(94vw,520px);max-height:92dvh;overflow:auto;border:1px solid rgba(125,211,252,.3);border-radius:8px;background:rgba(3,7,18,.96);padding:20px;box-shadow:0 18px 44px rgba(0,0,0,.45)}
    .panel h1{margin:0 0 8px;color:#38bdf8;font-size:38px;text-shadow:0 0 18px rgba(56,189,248,.5)}
    .panel p{margin:8px 0;color:#dbeafe;line-height:1.35}
    .song-select{width:100%;margin:12px 0 8px;padding:11px;border:1px solid rgba(125,211,252,.36);border-radius:8px;background:#0f172a;color:white;font-size:16px;font-weight:bold}
    .song-meta{min-height:22px;margin:8px 0 2px;color:#fde68a;font-weight:bold}
    .panel button{margin-top:12px;border:0;border-radius:8px;background:#22c55e;color:#052e16;font-weight:bold;font-size:17px;padding:12px 24px;cursor:pointer}
    .panel #hubButton{background:#38bdf8;color:#082f49;margin-left:8px}
    .hidden{display:none}
    @media (max-width:560px){
      .hud{left:7px;right:7px;top:7px}
      .pill{min-width:64px;padding:7px 7px}
      .value{font-size:17px}
      .score-top{top:58px;padding:6px 13px}
      .score-top .label{font-size:10px}
      .score-top .value{font-size:24px}
      .song-name{top:112px;font-size:12px;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
      .tile{left:5px;right:5px;height:120px}
      .target{bottom:126px;height:86px}
      .key-label{bottom:15px;font-size:16px}
    }
  </style>
</head>
<body>
  <main class="screen">
    <div class="hud">
      <div class="hud-row">
        <div class="stats">
          <div class="pill"><span class="label">Best</span><span id="best" class="value">0</span></div>
          <div class="pill"><span class="label">Combo</span><span id="combo" class="value">0</span></div>
        </div>
      </div>
      <div class="score-top"><span class="label">Score</span><span id="score" class="value">0</span></div>
    </div>
    <div id="songName" class="song-name">Choose a song</div>

    <section id="board" class="board" aria-label="Neon Piano Tiles board">
      <div class="lane" data-lane="0"><div class="target"></div><div class="key-label">D</div></div>
      <div class="lane" data-lane="1"><div class="target"></div><div class="key-label">F</div></div>
      <div class="lane" data-lane="2"><div class="target"></div><div class="key-label">J</div></div>
      <div class="lane" data-lane="3"><div class="target"></div><div class="key-label">K</div></div>
    </section>

    <div id="overlay" class="overlay">
      <div class="panel">
        <h1>Neon Piano Tiles</h1>
        <p>Pick a song. Tap black tiles, hold long yellow tiles, and build combo.</p>
        <p>Use D-F-J-K, or tap and hold lanes on mobile.</p>
        <select id="songSelect" class="song-select" aria-label="Song select"></select>
        <div id="songMeta" class="song-meta"></div>
        <button id="startBtn">Start Song</button>
        <button id="hubButton" onclick="location.href='index.html'">Back to Hub</button>
      </div>
    </div>
  </main>

  <script>
    const board = document.getElementById('board');
    const lanes = Array.from(document.querySelectorAll('.lane'));
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const comboEl = document.getElementById('combo');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const songSelect = document.getElementById('songSelect');
    const songMeta = document.getElementById('songMeta');
    const songNameEl = document.getElementById('songName');
    const bestKey = 'neonPianoTilesBest';
    const keys = {d:0, f:1, j:2, k:3};
    const tileHeight = 126;
    const hitWindow = 0.24;

    const scaleLibrary = [
      [261.63,329.63,392.00,523.25],
      [293.66,349.23,440.00,587.33],
      [246.94,311.13,369.99,493.88],
      [220.00,277.18,329.63,440.00],
      [329.63,392.00,493.88,659.25],
      [196.00,246.94,293.66,392.00],
      [277.18,349.23,415.30,554.37],
      [233.08,293.66,349.23,466.16],
      [174.61,220.00,261.63,349.23],
      [311.13,392.00,466.16,622.25]
    ];
    const waveLibrary = ['sine','triangle','square','sawtooth'];

    const songDefs = [
      ['Starter Sparks','Easy',92,42,[0,1,2,3,2,1],0.10],
      ['Soft Circuit','Easy',98,48,[0,2,1,3,1,2],0.12],
      ['Blue Lantern','Easy',104,53,[0,0,1,2,3,2,1,3],0.14],
      ['Cloud Keys','Easy',108,58,[1,2,3,2,0,1,2,1],0.14],
      ['Night Arcade','Medium',124,47,[0,1,3,2,1,0,2,3],0.18],
      ['Crystal Rush','Medium',132,55,[0,2,3,1,2,0,1,3,2,1],0.20],
      ['Laser Waltz','Medium',138,63,[0,3,1,2,0,1,3,2],0.22],
      ['Pixel Parade','Medium',144,71,[1,0,2,1,3,2,0,3],0.24],
      ['Thunder Run','Hard',156,46,[0,1,2,3,1,3,2,0,2,1],0.26],
      ['Turbo Metro','Hard',162,52,[0,2,1,3,2,0,3,1,0,2,3,1],0.28],
      ['Firewire','Hard',168,59,[3,2,1,0,2,3,1,0,1,3,2,0],0.30],
      ['Chrome Pulse','Hard',174,66,[0,3,0,2,1,3,2,0,1,2,3,1],0.32],
      ['Nova Sprint','Hard',180,73,[0,1,3,2,0,2,1,3,0,3,2,1],0.34],
      ['Hyper Keys','Hard',188,81,[0,2,0,3,1,3,1,2,0,1,2,3],0.36],
      ['Volt Storm','Hard',196,88,[3,1,2,0,1,3,0,2,3,2,1,0],0.38],
      ['Midnight Overdrive','Hard',204,76,[0,3,2,1,3,0,1,2,0,2,3,1],0.40],
      ['Panic Pattern','Expert',212,50,[0,1,2,1,3,2,0,3,1,0,2,3,2,1],0.42],
      ['Neon Punisher','Expert',224,62,[3,2,0,1,3,0,2,1,0,3,1,2,3,0],0.45],
      ['Final Voltage','Expert',236,79,[0,2,3,1,0,3,2,1,3,0,1,2,0,3],0.48],
      ['Boss Rush Keys','Expert',248,90,[0,3,1,2,3,1,0,2,1,3,2,0,3,2,1,0],0.52]
    ];

    const songs = songDefs.map(([name, difficulty, bpm, targetLength, pattern, holdRate], index) => ({
      name,
      difficulty,
      bpm,
      targetLength,
      sound: makeSoundProfile(index, bpm),
      chart: makeChart(index + 3, bpm, targetLength, pattern, holdRate)
    }));

    let running = false;
    let lastTime = 0;
    let songTime = 0;
    let score = 0;
    let combo = 0;
    let best = Number(localStorage.getItem(bestKey)) || 0;
    let currentSong = songs[0];
    let nextIndex = 0;
    let tiles = [];
    let activeHolds = [null,null,null,null];
    let pressed = [false,false,false,false];
    let sparks = [];
    let audioCtx = null;
    let musicTimer = null;
    let musicStartTime = 0;
    let nextMusicIndex = 0;
    let nextBeatIndex = 0;
    let nextBassIndex = 0;
    let activeAudioNodes = [];

    function makeSoundProfile(index, bpm){
      const baseScale = scaleLibrary[index % scaleLibrary.length];
      const transpose = [1, 1.05946, 0.94387, 1.12246, 0.8909][index % 5];
      const octave = index % 6 === 0 ? 0.75 : index % 4 === 0 ? 1.25 : 1;
      const scale = baseScale.map(freq => Number((freq * transpose * octave).toFixed(2)));
      return {
        name: ['Glass','Bell','Chip','Laser','Pluck','Bass','Crystal','Robot','Dream','Voltage'][index % 10] + ' ' + (Math.floor(index / 10) + 1),
        scale,
        wave: waveLibrary[index % waveLibrary.length],
        backing: waveLibrary[(index + 1 + Math.floor(index / 3)) % waveLibrary.length],
        bass: waveLibrary[(index + 2) % waveLibrary.length],
        hatWave: waveLibrary[(index + 3) % waveLibrary.length],
        hitVolume: 0.10 + (index % 5) * 0.012,
        backingVolume: 0.032 + (index % 4) * 0.006,
        kick: 62 + (index * 9) % 76,
        hat: 5600 + (index * 670) % 5200,
        arp: [
          [0,1,2,3],
          [0,2,1,3],
          [3,1,2,0],
          [1,3,0,2],
          [2,0,3,1]
        ][index % 5],
        drum: index % 4,
        noteEvery: index % 3 === 0 ? 1 : index % 3 === 1 ? 2 : 3,
        bassEvery: index % 5 === 0 ? 3 : 4
      };
    }

    function makeChart(seed, bpm, targetLength, pattern, holdRate){
      const beat = 60 / bpm;
      const chart = [];
      const laneFreeAt = [0,0,0,0];
      let time = 1.5;
      let i = 0;
      while(time < targetLength){
        time += beat * ((i + seed) % 7 === 0 && i > 8 ? 0.56 : 1);
        let lane = pattern[(i + seed) % pattern.length];
        if(time < laneFreeAt[lane]){
          lane = laneFreeAt.findIndex(freeAt => time >= freeAt);
          if(lane === -1){
            time = Math.min(...laneFreeAt) + beat * 0.38;
            lane = laneFreeAt.findIndex(freeAt => time >= freeAt);
          }
        }

        const hold = i > 5 && (i + seed) % Math.max(3, Math.round(1 / holdRate)) === 0;
        const duration = hold ? beat * (1.45 + ((i + seed) % 3) * 0.38) : 0;
        chart.push({
          lane,
          time,
          duration,
          hit:false,
          started:false,
          done:false,
          missed:false
        });
        laneFreeAt[lane] = time + (duration ? duration + 0.36 : Math.max(0.36, beat * 0.86));

        if(i > 10 && (i + seed) % 9 === 0){
          const secondLane = (lane + 2 + seed) % 4;
          const secondTime = time + beat * 0.52;
          if(secondTime >= laneFreeAt[secondLane]){
            chart.push({
              lane: secondLane,
              time: secondTime,
              duration: 0,
              hit:false,
              started:false,
              done:false,
              missed:false
            });
            laneFreeAt[secondLane] = secondTime + Math.max(0.34, beat * 0.74);
          }
        }
        i++;
      }
      return chart.sort((a, b) => a.time - b.time);
    }

    function cloneChart(chart){
      return chart.map(note => ({...note}));
    }

    function populateSongs(){
      songSelect.innerHTML = '';
      songs.forEach((song, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `${song.name} - ${song.difficulty} - ${song.bpm} BPM - ${song.targetLength}s`;
        songSelect.appendChild(option);
      });
      updateSongMeta();
    }

    function updateSongMeta(){
      const song = songs[Number(songSelect.value) || 0];
      songMeta.textContent = `${song.difficulty} • ${song.bpm} BPM • ${song.targetLength}s • ${song.chart.length} notes • ${song.sound.name}`;
    }

    function startGame(){
      currentSong = songs[Number(songSelect.value) || 0];
      currentSong = {...currentSong, chart: cloneChart(currentSong.chart)};
      running = true;
      overlay.classList.add('hidden');
      lastTime = performance.now();
      songTime = 0;
      score = 0;
      combo = 0;
      nextIndex = 0;
      tiles = [];
      activeHolds = [null,null,null,null];
      pressed = [false,false,false,false];
      sparks = [];
      songNameEl.textContent = currentSong.name + ' - ' + currentSong.difficulty;
      updateHud();
      startBackingTrack();
      requestAnimationFrame(loop);
    }

    function loop(now){
      if(!running) return;
      const dt = Math.min(0.033, (now - lastTime) / 1000);
      lastTime = now;
      songTime += dt;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    function update(dt){
      const lead = 1.62;
      while(nextIndex < currentSong.chart.length && currentSong.chart[nextIndex].time - songTime < lead){
        tiles.push(currentSong.chart[nextIndex]);
        nextIndex++;
      }

      activeHolds.forEach((tile, lane) => {
        if(!tile) return;
        score += dt * 18;
        if(songTime >= tile.time + tile.duration - hitWindow){
          finishHold(lane);
        }
      });

      tiles.forEach(tile => {
        if(tile.done || tile.missed) return;
        const lateBy = songTime - (tile.time + tile.duration);
        if(!tile.duration && !tile.hit && songTime - tile.time > hitWindow){
          tile.missed = true;
          endGame('Missed tile.');
        } else if(tile.duration && !tile.started && songTime - tile.time > hitWindow){
          tile.missed = true;
          endGame('Missed hold tile.');
        } else if(tile.duration && tile.started && lateBy > hitWindow && !tile.done){
          finishHold(tile.lane);
        }
      });

      sparks.forEach(spark => {
        spark.x += spark.vx * dt;
        spark.y += spark.vy * dt;
        spark.life -= dt;
      });
      sparks = sparks.filter(spark => spark.life > 0);
      tiles = tiles.filter(tile => !tile.done && !tile.missed);

      if(nextIndex >= currentSong.chart.length && tiles.length === 0){
        finishSong();
      }
      updateHud();
    }

    function render(){
      const targetY = getTargetTop();
      const speed = board.clientHeight / 1.62;
      lanes.forEach(lane => lane.querySelectorAll('.tile,.spark').forEach(el => el.remove()));

      tiles.forEach(tile => {
        if(tile.done || tile.missed) return;
        const height = tile.duration ? tileHeight + tile.duration * speed : tileHeight;
        const y = targetY - (tile.time - songTime) * speed - (tile.duration ? height - tileHeight : 0);
        const el = document.createElement('div');
        el.className = 'tile' + (tile.duration ? ' hold' : '') + (tile.started ? ' active' : '');
        el.style.height = height + 'px';
        el.style.transform = `translateY(${y}px)`;
        lanes[tile.lane].appendChild(el);
      });

      sparks.forEach(spark => {
        const el = document.createElement('div');
        el.className = 'spark';
        el.style.left = spark.x + 'px';
        el.style.top = spark.y + 'px';
        el.style.opacity = Math.max(0, spark.life * 2);
        lanes[spark.lane].appendChild(el);
      });
    }

    function getTargetTop(){
      const boardRect = board.getBoundingClientRect();
      const targetRect = lanes[0].querySelector('.target').getBoundingClientRect();
      return targetRect.top - boardRect.top;
    }

    function pressLane(lane){
      pressed[lane] = true;
      if(!running){
        startGame();
        return;
      }

      flashLane(lane);
      const tile = findHittableTile(lane);
      if(!tile){
        endGame('Wrong tap.');
        return;
      }

      if(tile.duration){
        tile.started = true;
        activeHolds[lane] = tile;
        lanes[lane].classList.add('holding');
        combo++;
        score += 20 + combo;
        playNote(lane, true, tile.duration);
      } else {
        tile.hit = true;
        tile.done = true;
        combo++;
        score += 10 + combo;
        playNote(lane, false, 0.16);
        burst(lane, '#38bdf8');
      }
      updateHud();
    }

    function releaseLane(lane){
      pressed[lane] = false;
      lanes[lane].classList.remove('holding');
      const tile = activeHolds[lane];
      if(tile && running){
        finishHold(lane);
      }
    }

    function findHittableTile(lane){
      return tiles.find(tile => {
        if(tile.lane !== lane || tile.done || tile.missed || tile.started) return false;
        return Math.abs(songTime - tile.time) <= hitWindow;
      });
    }

    function finishHold(lane){
      const tile = activeHolds[lane];
      if(!tile) return;
      tile.hit = true;
      tile.done = true;
      activeHolds[lane] = null;
      lanes[lane].classList.remove('holding');
      score += 35 + combo * 2;
      burst(lane, '#facc15');
    }

    function flashLane(lane){
      lanes[lane].classList.add('hit');
      setTimeout(() => lanes[lane].classList.remove('hit'), 90);
    }

    function burst(lane, color){
      const width = lanes[lane].clientWidth;
      const height = lanes[lane].clientHeight;
      for(let i = 0; i < 12; i++){
        sparks.push({
          lane,
          x: width * (0.22 + Math.random() * 0.56),
          y: height - 114,
          vx:(Math.random() - 0.5) * 100,
          vy:-45 - Math.random() * 120,
          life:0.35 + Math.random() * 0.25,
          color
        });
      }
    }

    function playNote(lane, hold, duration){
      const audio = getAudioContext();
      if(!audio) return;
      const now = audio.currentTime;
      const sound = currentSong.sound;
      playSynthNote(sound.scale[lane] * (hold ? 1.5 : 1), now, Math.min(1.5, Math.max(0.18, duration + 0.05)), hold ? sound.backing : sound.wave, hold ? sound.hitVolume * 1.15 : sound.hitVolume);
    }

    function ensureAudioContext(){
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if(!AudioContext) return null;
      if(!audioCtx) audioCtx = new AudioContext();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function getAudioContext(){
      return ensureAudioContext();
    }

    function trackNode(node){
      activeAudioNodes.push(node);
      node.addEventListener('ended', () => {
        activeAudioNodes = activeAudioNodes.filter(active => active !== node);
      });
    }

    function playSynthNote(frequency, startTime, duration, type, volume){
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(frequency, startTime);
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(volume, startTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.03);
      trackNode(osc);
    }

    function startBackingTrack(){
      const audio = ensureAudioContext();
      if(!audio) return;
      stopBackingTrack();
      musicStartTime = audio.currentTime - songTime;
      nextMusicIndex = 0;
      nextBeatIndex = 0;
      nextBassIndex = 0;
      musicTimer = setInterval(scheduleMusic, 90);
      scheduleMusic();
    }

    function scheduleMusic(){
      if(!running || !audioCtx) return;
      const lookAhead = 0.85;
      const audioSongTime = audioCtx.currentTime - musicStartTime;
      const beat = 60 / currentSong.bpm;

      while(nextMusicIndex < currentSong.chart.length && currentSong.chart[nextMusicIndex].time <= audioSongTime + lookAhead){
        const note = currentSong.chart[nextMusicIndex];
        const start = musicStartTime + note.time;
        const duration = note.duration ? Math.min(1.4, note.duration) : Math.min(0.22, beat * 0.45);
        const sound = currentSong.sound;
        const arpLane = sound.arp[nextMusicIndex % sound.arp.length];
        const frequency = sound.scale[(note.lane + arpLane) % 4] * (note.duration ? 1 : 2);
        if(nextMusicIndex % sound.noteEvery === 0 || note.duration){
          playSynthNote(frequency, start, duration, note.duration ? sound.backing : sound.wave, note.duration ? sound.backingVolume * 1.35 : sound.backingVolume);
        }
        nextMusicIndex++;
      }

      while(nextBeatIndex * beat <= audioSongTime + lookAhead){
        const start = musicStartTime + nextBeatIndex * beat;
        if(shouldPlayKick(nextBeatIndex, currentSong.sound.drum)){
          playKick(start);
        }
        if(shouldPlayHat(nextBeatIndex, currentSong.sound.drum)){
          playHat(start + beat * 0.5);
        }
        nextBeatIndex++;
      }

      while(nextBassIndex * beat * currentSong.sound.bassEvery <= audioSongTime + lookAhead){
        const start = musicStartTime + nextBassIndex * beat * currentSong.sound.bassEvery;
        const lane = currentSong.sound.arp[nextBassIndex % currentSong.sound.arp.length];
        playSynthNote(currentSong.sound.scale[lane] * 0.5, start, Math.min(beat * 1.35, 0.55), currentSong.sound.bass, 0.035);
        nextBassIndex++;
      }
    }

    function shouldPlayKick(index, drum){
      if(drum === 0) return index % 2 === 0;
      if(drum === 1) return index % 4 === 0 || index % 4 === 3;
      if(drum === 2) return index % 3 === 0;
      return index % 4 !== 2;
    }

    function shouldPlayHat(index, drum){
      if(drum === 0) return index % 2 === 1;
      if(drum === 1) return index % 4 === 1 || index % 4 === 2;
      if(drum === 2) return index % 3 !== 0;
      return index % 2 === 0;
    }

    function playKick(startTime){
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const sound = currentSong.sound;
      osc.type = sound.bass;
      osc.frequency.setValueAtTime(sound.kick, startTime);
      osc.frequency.exponentialRampToValueAtTime(Math.max(36, sound.kick * 0.45), startTime + 0.12);
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(0.09, startTime + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.17);
      trackNode(osc);
    }

    function playHat(startTime){
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const sound = currentSong.sound;
      osc.type = sound.hatWave;
      osc.frequency.setValueAtTime(sound.hat, startTime);
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(0.025, startTime + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.045);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.055);
      trackNode(osc);
    }

    function stopBackingTrack(){
      if(musicTimer){
        clearInterval(musicTimer);
        musicTimer = null;
      }
      activeAudioNodes.forEach(node => {
        try { node.stop(0); } catch(e) {}
      });
      activeAudioNodes = [];
    }

    function playAlienExplosion(){
      const audio = ensureAudioContext();
      if(!audio) return;
      const now = audio.currentTime;
      const osc = audio.createOscillator();
      const wobble = audio.createOscillator();
      const wobbleGain = audio.createGain();
      const gain = audio.createGain();

      osc.type = 'sawtooth';
      wobble.type = 'sine';
      osc.frequency.setValueAtTime(720, now);
      osc.frequency.exponentialRampToValueAtTime(55, now + 0.62);
      wobble.frequency.setValueAtTime(42, now);
      wobbleGain.gain.setValueAtTime(180, now);

      wobble.connect(wobbleGain);
      wobbleGain.connect(osc.frequency);
      osc.connect(gain);
      gain.connect(audio.destination);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.28, now + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
      osc.start(now);
      wobble.start(now);
      osc.stop(now + 0.72);
      wobble.stop(now + 0.72);
      trackNode(osc);
      trackNode(wobble);
    }

    function updateHud(){
      scoreEl.textContent = Math.floor(score);
      comboEl.textContent = combo;
      bestEl.textContent = best;
    }

    function endGame(reason){
      if(!running) return;
      running = false;
      stopBackingTrack();
      playAlienExplosion();
      activeHolds = [null,null,null,null];
      pressed = [false,false,false,false];
      lanes.forEach(lane => lane.classList.remove('holding'));
      best = Math.max(best, Math.floor(score));
      localStorage.setItem(bestKey, String(best));
      updateHud();
      overlay.classList.remove('hidden');
      overlay.querySelector('h1').textContent = 'Song Failed';
      overlay.querySelector('p').textContent = reason + ' Score: ' + Math.floor(score);
      overlay.querySelectorAll('p')[1].textContent = 'Choose a song or restart this one.';
      startBtn.textContent = 'Restart Song';
    }

    function finishSong(){
      running = false;
      stopBackingTrack();
      best = Math.max(best, Math.floor(score));
      localStorage.setItem(bestKey, String(best));
      updateHud();
      overlay.classList.remove('hidden');
      overlay.querySelector('h1').textContent = 'Song Clear';
      overlay.querySelector('p').textContent = currentSong.name + ' complete. Score: ' + Math.floor(score);
      overlay.querySelectorAll('p')[1].textContent = 'Pick another song or replay for a better combo.';
      startBtn.textContent = 'Play Again';
    }

    lanes.forEach(lane => {
      const laneNumber = Number(lane.dataset.lane);
      lane.addEventListener('pointerdown', event => {
        event.preventDefault();
        if(lane.setPointerCapture){
          lane.setPointerCapture(event.pointerId);
        }
        pressLane(laneNumber);
      });
      lane.addEventListener('pointerup', event => {
        event.preventDefault();
        if(lane.hasPointerCapture && lane.hasPointerCapture(event.pointerId)){
          lane.releasePointerCapture(event.pointerId);
        }
        releaseLane(laneNumber);
      });
      lane.addEventListener('pointercancel', () => releaseLane(laneNumber));
    });

    window.addEventListener('keydown', event => {
      const key = event.key.toLowerCase();
      if(key in keys && !pressed[keys[key]]){
        event.preventDefault();
        pressLane(keys[key]);
      }
    });

    window.addEventListener('keyup', event => {
      const key = event.key.toLowerCase();
      if(key in keys){
        event.preventDefault();
        releaseLane(keys[key]);
      }
    });

    songSelect.addEventListener('change', updateSongMeta);
    startBtn.addEventListener('click', startGame);
    populateSongs();
    updateHud();
  </script>
