<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>The Floor Is Lava</title>
<style>
button,[role="button"]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#190d12;color:#fff;font-family:Arial,sans-serif;overflow:hidden;touch-action:none;-webkit-touch-callout:none}
body{display:flex;justify-content:center}#app{width:100%;height:100vh;display:grid;grid-template-rows:auto 1fr 50vh;background:#2a1320}
#hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:8px 10px;background:#10070b;border-bottom:3px solid #ff7b22}#title{font-weight:900;color:#ffb11f;text-shadow:2px 2px #c72d18}.stats{display:flex;justify-content:center;gap:14px;font-size:14px;font-weight:900}button{border:0;border-radius:8px;background:#ffb11f;color:#211100;font-weight:900;min-height:34px;padding:6px 12px;cursor:pointer}#back{background:#38d7ff;color:#06151d}
#wrap{position:relative;min-height:0;overflow:hidden;display:flex;align-items:flex-start;justify-content:center;background:#261226;width:100%;max-width:900px;margin:0 auto}canvas{display:block;width:100%;max-width:900px;max-height:100%;aspect-ratio:16/9;background:#261226;image-rendering:pixelated;touch-action:none}
#msg{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);border:3px solid #ffb11f;border-radius:8px;padding:18px 22px;text-align:center;font-size:clamp(18px,4vw,32px);font-weight:900}#msg.hidden{display:none}.modalBtns{display:none;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}#msg.over .modalBtns{display:flex}#playAgain,#shopBtn,#closeShop{background:#38d7ff;color:#06151d;font-size:16px;padding:10px 18px}#shopBtn{background:#ffb11f;color:#211100}
#shop{display:none;position:absolute;inset:10px;margin:auto;max-width:560px;max-height:calc(100% - 20px);overflow:auto;background:rgba(11,5,9,.94);border:3px solid #38d7ff;border-radius:8px;padding:16px;text-align:center;z-index:4}#shop.open{display:block}#shop h2{margin:0 0 8px;color:#38d7ff;text-shadow:2px 2px #000}.shopWallet{color:#ffb11f;font-weight:900;margin-bottom:12px}.skins{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.skin{border:2px solid #4d3a45;border-radius:8px;padding:10px;background:#1d1019}.swatch{width:36px;height:36px;margin:0 auto 8px;border:3px solid #fff}.skinName{font-weight:900}.skinCost{color:#ffc88a;font-size:13px;margin:5px 0}.skin button{width:100%;font-size:13px}
#dpad{display:flex;height:50vh;width:100%;max-width:900px;margin:0 auto;flex-direction:row;user-select:none;-webkit-user-select:none;gap:0;min-height:0;background:#10070b;touch-action:none}#dpad-left,#dpad-right{flex:1;display:flex;min-height:0;overflow:hidden}#dpad-center{flex:0 0 200px;display:flex;flex-direction:column;min-height:0;overflow:hidden}.dbtn{background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.35);color:#fff;font-size:36px;text-align:center;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}.dbtn *{pointer-events:none}#dbu{flex:1;border-bottom:none;border-bottom-left-radius:0;border-bottom-right-radius:0}#dbd{flex:1;border-top:none;border-top-left-radius:0;border-top-right-radius:0}#dpad-divider{flex:0 0 2px;background:rgba(255,255,255,.5);position:relative;z-index:1}#dbl{flex:1;border-right:none;border-top-right-radius:0;border-bottom-right-radius:0}#dbr{flex:1;border-left:none;border-top-left-radius:0;border-bottom-left-radius:0}.dbtn.down{background:#ffb11f;color:#120804}
@media(max-width:620px){#hud{grid-template-columns:1fr auto}.stats{grid-column:1/-1;order:3;font-size:12px;gap:8px;flex-wrap:wrap}#title{font-size:15px}#back{font-size:11px;min-height:28px;padding:5px 8px}#dpad-center{flex-basis:34vw}}
</style>
</head>
<body>
<main id="app">
<header id="hud"><div id="title">THE FLOOR IS LAVA</div><div class="stats"><span id="height">Height 0</span><span id="best">Best 0</span><span id="gems">Gems 0</span></div><button id="back">Back to Hub</button></header>
<section id="wrap"><canvas id="game" width="900" height="506"></canvas><div id="msg"><div id="msgText">Climb before the lava rises!</div><div class="modalBtns"><button id="playAgain">Play Again</button><button id="shopBtn">Shop</button></div></div><div id="shop"><h2>Skin Shop</h2><div class="shopWallet" id="walletText">Gems 0</div><div class="skins" id="skins"></div><button id="closeShop">Close</button></div></section>
<section id="dpad" aria-label="Touch controls"><div id="dpad-left"><div class="dbtn" id="dbl" data-k="left">◀</div></div><div id="dpad-center"><div class="dbtn" id="dbu" data-k="jump">▲</div><div id="dpad-divider"></div><div class="dbtn" id="dbd" data-k="down">▼</div></div><div id="dpad-right"><div class="dbtn" id="dbr" data-k="right">▶</div></div></section>
</main>
<script>
const c=document.getElementById('game'),d=c.getContext('2d'),heightEl=document.getElementById('height'),bestEl=document.getElementById('best'),gemsEl=document.getElementById('gems'),msg=document.getElementById('msg'),msgText=document.getElementById('msgText'),playAgain=document.getElementById('playAgain'),shopBtn=document.getElementById('shopBtn'),shop=document.getElementById('shop'),skinsEl=document.getElementById('skins'),walletText=document.getElementById('walletText'),closeShop=document.getElementById('closeShop');
const W=c.width,H=c.height,START_PLATFORM_Y=Math.floor(H/2)+68,START_PLAYER_Y=START_PLATFORM_Y-34;let p,plats,gems,lava,camera,climbed,startedAt,best=+localStorage.floorislava_best||0,gemCount,state='ready',lastDir=1,keys={left:false,right:false,jump:false,down:false};
let audioCtx,musicTimer,musicStep=0;
const SKINS=[{id:'cyan',name:'Cave Runner',color:'#38d7ff',cost:0},{id:'ember',name:'Ember Suit',color:'#ff7b22',cost:24},{id:'toxic',name:'Toxic Glow',color:'#5ee078',cost:40},{id:'royal',name:'Royal Dash',color:'#a78bfa',cost:70},{id:'ghost',name:'Ghost Ash',color:'#f4f4ff',cost:100}];
let wallet=+localStorage.floorislava_wallet||0,owned=JSON.parse(localStorage.floorislava_skins||'["cyan"]'),skinId=localStorage.floorislava_skin||'cyan';
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function audio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(f,dur,type='sine',vol=.06,delay=0,end){
 const a=audio(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;
 o.type=type;o.frequency.setValueAtTime(f,t);if(end)o.frequency.exponentialRampToValueAtTime(end,t+dur);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur);
}
function startMusic(){
 audio();if(musicTimer)return;
 const bass=[55,55,65.41,55,82.41,73.42,65.41,49],lead=[220,246.94,261.63,293.66,261.63,246.94,196,174.61];
 musicTimer=setInterval(()=>{if(state==='play'||state==='ready'){const i=musicStep++%bass.length;tone(bass[i],.28,'sawtooth',.026,0,bass[i]/2);if(i%2===1)tone(lead[i],.12,'square',.018,.04)}},230);
}
function jumpSound(){tone(330,.12,'triangle',.055,0,520)}
function gemSound(){tone(880,.08,'sine',.05);tone(1320,.1,'triangle',.04,.06)}
function dashSound(){tone(95,.06,'sawtooth',.055,0,760);tone(1240,.09,'square',.03,.025,420)}
function deathSound(){tone(180,.18,'sawtooth',.06,0,90);tone(70,.36,'sine',.07,.12,35)}
function reset(withAudio=true){if(withAudio)startMusic();p={x:W/2-14,y:START_PLAYER_Y,w:28,h:34,vx:0,vy:0,on:false,dash:true};plats=[{x:W/2-115,y:START_PLATFORM_Y,w:230,h:18}];gems=[];lava=H+40;camera=0;climbed=0;startedAt=Date.now();gemCount=0;state='play';lastDir=1;keys.down=false;msg.className='hidden';for(let y=START_PLATFORM_Y-82;y>-2600;y-=70)spawn(y);hud()}
function spawn(y){const w=95+Math.random()*105,x=24+Math.random()*(W-w-48);plats.push({x,y,w,h:16,move:Math.random()<.28,v:(Math.random()<.5?-1:1)*(1+Math.random()*1.1)});if(Math.random()<.75)gems.push({x:x+w/2-10,y:y-28,w:20,h:20,t:false})}
function saveShop(){localStorage.floorislava_wallet=wallet;localStorage.floorislava_skins=JSON.stringify(owned);localStorage.floorislava_skin=skinId}
function skin(){return SKINS.find(s=>s.id===skinId)||SKINS[0]}
function hud(){heightEl.textContent='Height '+Math.floor(climbed);bestEl.textContent='Best '+best;gemsEl.textContent='Gems '+wallet}
function renderShop(){walletText.textContent='Gems '+wallet;skinsEl.innerHTML='';SKINS.forEach(s=>{const bought=owned.includes(s.id),equipped=skinId===s.id,card=document.createElement('div');card.className='skin';card.innerHTML=`<div class="swatch" style="background:${s.color}"></div><div class="skinName">${s.name}</div><div class="skinCost">${s.cost} gems</div><button>${equipped?'Equipped':bought?'Equip':'Buy'}</button>`;const btn=card.querySelector('button');btn.disabled=equipped||(!bought&&wallet<s.cost);btn.onclick=()=>{if(bought){skinId=s.id}else if(wallet>=s.cost){wallet-=s.cost;owned.push(s.id);skinId=s.id}saveShop();hud();renderShop()};skinsEl.appendChild(card)})}
function end(){if(state==='over')return;state='over';deathSound();saveShop();best=Math.max(best,Math.floor(climbed));localStorage.floorislava_best=best;msg.className='over';msgText.textContent='Lava got you';hud();renderShop()}
function update(){
 if(state!=='play')return;
 if(keys.left)lastDir=-1;if(keys.right)lastDir=1;
 p.vx+=(keys.left?-.55:0)+(keys.right?.55:0);if(!keys.left&&!keys.right)p.vx*=.84;p.vx=Math.max(-5,Math.min(5,p.vx));if(keys.jump&&p.on){p.vy=-13.5;p.on=false;p.dash=true;jumpSound()}if(keys.down&&!p.on&&p.dash){p.vx=lastDir*90;p.vy=Math.min(p.vy,.5);p.dash=false;dashSound()}
 p.vy+=.58;p.x+=p.vx;p.y+=p.vy;p.on=false;if(p.x<0){p.x=0;p.vx=0}if(p.x+p.w>W){p.x=W-p.w;p.vx=0}
 plats.forEach(o=>{if(o.move){o.x+=o.v;if(o.x<20||o.x+o.w>W-20)o.v*=-1}if(p.vy>=0&&p.x+p.w>o.x&&p.x<o.x+o.w&&p.y+p.h>=o.y&&p.y+p.h<=o.y+18){p.y=o.y-p.h;p.vy=0;p.on=true;p.dash=true;if(o.move)p.x+=o.v}});
 if(p.y-camera<170)camera=p.y-170;while(plats[plats.length-1].y>camera-700)spawn(plats[plats.length-1].y-70-Math.random()*25);
 const lavaSpeed=(.42+Math.floor((Date.now()-startedAt)/5000)*.08)*3;lava-=lavaSpeed;if(lava-camera>H+80)lava=camera+H+80;climbed=Math.max(climbed,Math.max(0,Math.floor((START_PLAYER_Y-p.y)/10)));
 gems.forEach(g=>{if(!g.t&&hit(p,g)){g.t=true;gemCount++;wallet++;saveShop();climbed+=5;gemSound()}});plats=plats.filter(o=>o.y<camera+H+100);gems=gems.filter(o=>o.y<camera+H+100&&!o.t);
 if(p.y+p.h>lava)end();hud()
}
function draw(){
 d.fillStyle='#241327';d.fillRect(0,0,W,H);d.fillStyle='#351b3b';for(let y=(( -camera*.25)%80)-80;y<H;y+=80)d.fillRect(0,y,W,3);
 plats.forEach(o=>{const y=o.y-camera;d.fillStyle=o.move?'#9f7aea':'#5ee078';d.fillRect(o.x,y,o.w,o.h);d.fillStyle='rgba(255,255,255,.45)';d.fillRect(o.x,y,o.w,4)});
 gems.forEach(g=>{const y=g.y-camera;d.fillStyle='#38d7ff';d.beginPath();d.moveTo(g.x+10,y);d.lineTo(g.x+20,y+10);d.lineTo(g.x+10,y+20);d.lineTo(g.x,y+10);d.closePath();d.fill()});
 const ly=lava-camera;d.fillStyle='#ff481f';d.fillRect(0,ly,W,H-ly);d.fillStyle='#ffb11f';for(let i=0;i<W;i+=38)d.beginPath(),d.arc(i+(Date.now()/40)%38,ly+8,18,0,Math.PI),d.fill();
 const py=p.y-camera,pc=skin().color;d.fillStyle='rgba(0,0,0,.28)';d.fillRect(p.x+3,py+31,p.w-2,5);d.fillStyle=pc;d.fillRect(p.x+5,py+9,18,20);d.fillRect(p.x+8,py,14,12);d.fillStyle='rgba(255,255,255,.45)';d.fillRect(p.x+8,py+3,9,3);d.fillStyle='#101014';d.fillRect(p.x+17,py+5,4,4);d.fillStyle='#ffd7a6';d.fillRect(p.x+13,py+9,9,8);d.fillStyle='#20120c';d.fillRect(p.x+4,py+29,8,5);d.fillRect(p.x+18,py+29,8,5);d.fillStyle='#fff';d.fillRect(p.x+19,py+6,2,2);
 if(state==='ready'){msg.className='';msgText.textContent='Climb before the lava rises!'}
 requestAnimationFrame(draw)
}
setInterval(update,1000/60);requestAnimationFrame(draw);
document.addEventListener('keydown',e=>{startMusic();if(e.key==='Escape')location.href='index.html';if(e.key==='r'||e.key==='R'){if(state!=='over')reset();return}if(state==='ready')reset();if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=true;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=true;if(e.key==='ArrowUp'||e.key===' '||e.key==='w'||e.key==='W')keys.jump=true;if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')keys.down=true});
document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false;if(e.key==='ArrowUp'||e.key===' '||e.key==='w'||e.key==='W')keys.jump=false;if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')keys.down=false});
function clearTouchKeys(){keys.left=false;keys.right=false;keys.jump=false;keys.down=false;document.querySelectorAll('.dbtn').forEach(b=>b.classList.remove('down'))}
document.querySelectorAll('.dbtn').forEach(b=>{
 const k=b.dataset.k;
 const set=v=>{if(v)startMusic();if(v&&state==='ready')reset();if(state==='over')return;keys[k]=v;b.classList.toggle('down',v)};
 const press=e=>{e.preventDefault();if(e.pointerId!==undefined&&b.setPointerCapture)b.setPointerCapture(e.pointerId);set(true)};
 const release=e=>{e.preventDefault();if(e.pointerId!==undefined&&b.releasePointerCapture)try{b.releasePointerCapture(e.pointerId)}catch(err){}set(false)};
 b.addEventListener('pointerdown',press,{passive:false});
 b.addEventListener('pointerup',release,{passive:false});
 b.addEventListener('pointercancel',release,{passive:false});
 b.addEventListener('lostpointercapture',release,{passive:false});
 b.addEventListener('touchstart',press,{passive:false});
 b.addEventListener('touchend',release,{passive:false});
 b.addEventListener('touchcancel',release,{passive:false});
});
window.addEventListener('blur',clearTouchKeys);
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTouchKeys()});
playAgain.onclick=()=>reset();
shopBtn.onclick=()=>{renderShop();shop.classList.add('open')};
closeShop.onclick=()=>shop.classList.remove('open');
document.getElementById('back').onclick=()=>location.href='index.html';reset(false);state='ready';
</script>
<a href="../TeamChat/index.html" title="Team chat" style="position:fixed;right:14px;bottom:14px;z-index:99999;display:inline-block;background:#00ff88;color:#06130c;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:800;letter-spacing:.6px;text-decoration:none;padding:11px 16px;border-radius:99px;box-shadow:0 4px 20px rgba(0,255,136,.45)">TEAMCHAT</a>
</body>
</html>
