<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Breakout</title>
<style>
button,[role="button"]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#101014;color:#fff;font-family:Arial,sans-serif;overflow:hidden;touch-action:none}
body{display:flex;justify-content:center}#app{width:100%;max-width:900px;height:100vh;display:grid;grid-template-rows:auto 1fr 30vh;background:#151522}
#hud{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 10px;background:#080814;border-bottom:3px solid #facc15}#title{font-weight:900;color:#facc15}.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-weight:900;font-size:13px}
button{border:0;border-radius:8px;background:#facc15;color:#211700;font-weight:900;min-height:34px;padding:7px 12px;cursor:pointer}#back{background:#38bdf8;color:#061522}#newGame{background:#22c55e;color:#04180c}
#wrap{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;background:#111827}canvas{display:block;width:100%;max-height:100%;aspect-ratio:16/9;background:#111827;image-rendering:pixelated;touch-action:none}
#msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);border:3px solid #facc15;border-radius:8px;padding:16px 20px;text-align:center;font-weight:900;font-size:clamp(18px,4vw,30px)}#msg.hidden{display:none}
#mobile{display:flex;gap:0;min-height:0;position:relative}#mobile::after{content:'';position:absolute;top:0;bottom:0;left:50%;width:3px;transform:translateX(-50%);background:rgba(255,255,255,.65);z-index:1}.arrow{flex:1;border-radius:0;background:#0b1220;color:#fff;border-top:3px solid rgba(255,255,255,.35);font-size:42px;touch-action:none}.arrow.down{background:#facc15;color:#211700}
@media(max-width:620px){#hud{grid-template-columns:1fr auto}.stats{grid-column:1/-1;order:3;font-size:12px;gap:7px}#title{font-size:15px}button{font-size:12px;min-height:30px;padding:5px 8px}#app{grid-template-rows:auto 1fr 34vh}}
</style>
</head>
<body>
<main id="app"><header id="hud"><div id="title">BREAKOUT</div><div class="stats"><span id="score">Score 0</span><span id="best">Best 0</span><span id="lives">Lives 3</span><span id="level">Level 1</span></div><div><button id="newGame">New Game</button><button id="back">Back to Hub</button></div></header><section id="wrap"><canvas id="game" width="900" height="506"></canvas><div id="msg">Press New Game</div></section><section id="mobile"><button class="arrow" id="left">◀</button><button class="arrow" id="right">▶</button></section></main>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),livesEl=document.getElementById('lives'),levelEl=document.getElementById('level'),msg=document.getElementById('msg'),leftBtn=document.getElementById('left'),rightBtn=document.getElementById('right'),newGameBtn=document.getElementById('newGame'),backBtn=document.getElementById('back'),W=c.width,H=c.height;
let paddle={x:W/2-65,y:H-48,w:130,h:16,s:12,slowUntil:0,growUntil:0},balls=[{x:W/2,y:H-75,r:9,vx:0,vy:0}],bricks=[],drops=[],score=0,best=+localStorage.breakout_best||0,lives=3,level=1,state='ready',keys={left:false,right:false},audioCtx,musicTimer,musicStep=0;
function audio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(f,d,t='triangle',v=.05,delay=0,end){const a=audio(),o=a.createOscillator(),g=a.createGain(),s=a.currentTime+delay;o.type=t;o.frequency.setValueAtTime(f,s);if(end)o.frequency.exponentialRampToValueAtTime(end,s+d);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d)}
function bounce(){tone(520,.045,'square',.035)}function brickSound(){tone(700,.06,'triangle',.045,0,980)}function powerSound(){tone(560,.08,'triangle',.055);tone(960,.08,'sine',.04,.05)}function badDropSound(){tone(150,.13,'sawtooth',.055,0,80)}function loseLife(){tone(180,.16,'sawtooth',.055,0,90)}function gameOverSound(){tone(220,.18,'sawtooth',.06,0,120);tone(110,.25,'sine',.06,.13,65)}
function music(on){if(on){audio();if(musicTimer)return;musicTimer=setInterval(()=>{const seq=[196,246.94,293.66,392,293.66,246.94];tone(seq[musicStep++%seq.length],.11,'triangle',.025)},210)}else{clearInterval(musicTimer);musicTimer=null}}
function hud(){scoreEl.textContent='Score '+score;bestEl.textContent='Best '+best;livesEl.textContent='Lives '+lives;levelEl.textContent='Level '+level}
function makeBricks(){bricks=[];const rows=4+Math.min(3,level),cols=10,bw=78,bh=20,gap=8,ox=(W-cols*bw-(cols-1)*gap)/2,types=['ball','grow','nuke','slowball','life','points'];for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){let drop=null;if(Math.random()<.32)drop=types[Math.floor(Math.random()*types.length)];bricks.push({x:ox+col*(bw+gap),y:56+r*(bh+gap),w:bw,h:bh,hp:1,drop,color:['#ef4444','#f97316','#facc15','#22c55e','#38bdf8','#a855f7','#ec4899'][r%7]})}}
function reset(){music(true);paddle={x:W/2-65,y:H-48,w:130,h:16,s:12,slowUntil:0,growUntil:0};balls=[{x:W/2,y:H-75,r:9,vx:4*(Math.random()<.5?-1:1),vy:-5.2}];drops=[];score=0;lives=3;level=1;makeBricks();state='play';msg.className='hidden';hud()}
function nextLevel(){level++;makeBricks();drops=[];balls=[{x:W/2,y:H-75,r:9,vx:4.4*(Math.random()<.5?-1:1),vy:-5.4-level*.25}];paddle.x=W/2-paddle.w/2;hud()}
function end(){state='over';music(false);gameOverSound();best=Math.max(best,score);localStorage.breakout_best=best;hud();msg.className='';msg.textContent='Game Over - Press New Game'}
function spawnDrop(b){if(!b.drop)return;drops.push({type:b.drop,x:b.x+b.w/2-15,y:b.y+b.h/2,w:30,h:24,vy:2.2,color:{ball:'#38bdf8',grow:'#22c55e',nuke:'#ef4444',slowball:'#a78bfa',life:'#facc15',points:'#fb7185'}[b.drop]})}
function addBall(){const base=balls[0]||{x:paddle.x+paddle.w/2,y:paddle.y-20};if(balls.length<5)balls.push({x:base.x,y:base.y,r:9,vx:4.5*(Math.random()<.5?-1:1),vy:-5.4})}
function collectDrop(d){if(d.type==='ball'){addBall();powerSound()}else if(d.type==='grow'){paddle.w=Math.min(210,paddle.w+34);paddle.growUntil=Date.now()+12000;powerSound()}else if(d.type==='nuke'){paddle.s=6;paddle.slowUntil=Date.now()+7000;badDropSound()}else if(d.type==='slowball'){balls.forEach(b=>{b.vx*=.75;b.vy*=.75});powerSound()}else if(d.type==='life'){lives=Math.min(6,lives+1);powerSound()}else if(d.type==='points'){score+=50;powerSound()}hud()}
function update(){if(state!=='play')return;if(paddle.growUntil&&Date.now()>paddle.growUntil){paddle.w=Math.max(130,paddle.w-2);if(paddle.w<=130)paddle.growUntil=0}if(paddle.slowUntil&&Date.now()>paddle.slowUntil){paddle.s=12;paddle.slowUntil=0}if(keys.left)paddle.x-=paddle.s;if(keys.right)paddle.x+=paddle.s;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));for(const ball of balls){ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<ball.r||ball.x>W-ball.r){ball.vx*=-1;ball.x=Math.max(ball.r,Math.min(W-ball.r,ball.x));bounce()}if(ball.y<ball.r){ball.vy*=-1;ball.y=ball.r;bounce()}if(ball.y+ball.r>paddle.y&&ball.y-ball.r<paddle.y+paddle.h&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w&&ball.vy>0){const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=hit*7;ball.vy=-Math.abs(ball.vy)-.15;bounce()}for(const b of bricks){if(!b.hp)continue;if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.hp=0;score+=10;ball.vy*=-1;spawnDrop(b);brickSound();hud();break}}}balls=balls.filter(b=>b.y<H+35);if(!balls.length){lives--;loseLife();if(lives<=0){end();return}balls=[{x:W/2,y:H-75,r:9,vx:4*(Math.random()<.5?-1:1),vy:-5}];hud()}drops.forEach(d=>d.y+=d.vy);for(const d of drops){if(d.x+d.w>paddle.x&&d.x<paddle.x+paddle.w&&d.y+d.h>paddle.y&&d.y<paddle.y+paddle.h){d.hit=true;collectDrop(d)}}drops=drops.filter(d=>!d.hit&&d.y<H+40);if(bricks.every(b=>!b.hp))nextLevel()}
function drawDrop(d){ctx.fillStyle=d.color;ctx.fillRect(d.x,d.y,d.w,d.h);ctx.fillStyle='#061522';ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText({ball:'●',grow:'+',nuke:'!',slowball:'S',life:'♥',points:'$'}[d.type],d.x+d.w/2,d.y+d.h/2)}
function draw(){ctx.fillStyle='#111827';ctx.fillRect(0,0,W,H);ctx.fillStyle='#23334d';for(let y=0;y<H;y+=42)ctx.fillRect(0,y,W,2);bricks.forEach(b=>{if(!b.hp)return;ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(b.x,b.y,b.w,4);if(b.drop){ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(b.x+b.w-15,b.y+4,10,10)}});drops.forEach(drawDrop);ctx.fillStyle=paddle.slowUntil?'#ef4444':'#facc15';ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);ctx.fillStyle='#fff';balls.forEach(ball=>{ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill()});requestAnimationFrame(draw)}
setInterval(update,1000/60);requestAnimationFrame(draw);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=true;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=true;if(e.key===' '&&state!=='play')reset()});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false});
c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();paddle&&(paddle.x=(e.clientX-r.left)/r.width*W-paddle.w/2)});function bind(btn,key){const press=e=>{e.preventDefault();keys[key]=true;btn.classList.add('down');if(state!=='play')reset()},rel=e=>{e.preventDefault();keys[key]=false;btn.classList.remove('down')};btn.addEventListener('pointerdown',press,{passive:false});btn.addEventListener('pointerup',rel,{passive:false});btn.addEventListener('pointercancel',rel,{passive:false});btn.addEventListener('pointerleave',rel,{passive:false});btn.addEventListener('touchstart',press,{passive:false});btn.addEventListener('touchend',rel,{passive:false});btn.addEventListener('touchcancel',rel,{passive:false})}bind(leftBtn,'left');bind(rightBtn,'right');
newGameBtn.onclick=reset;backBtn.onclick=()=>location.href='index.html';hud();
</script></body>
</html>
