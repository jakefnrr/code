<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedcube Timer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Top Right Hub Button */
        .hub-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
            z-index: 10;
        }

        .hub-btn:hover {
            background-color: #444;
        }

        /* Main Layout */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Timer Display */
        .timer-display {
            font-size: 18vw;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
            transition: color 0.1s;
            z-index: 2;
        }

        .timer-display.ready {
            color: #00ff66;
        }

        .timer-display.holding {
            color: #ff3333;
        }

        /* Scores Sidebar/Bottom Panel */
        .scores-panel {
            position: absolute;
            bottom: 40px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            z-index: 2;
        }

        .scores-title {
            font-size: 18px;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 10px;
            cursor: pointer;
            display: inline-block;
            transition: color 0.2s;
        }

        .scores-title:hover {
            color: #ff3333;
        }

        .scores-list {
            display: flex;
            justify-content: center;
            gap: 12px;
            list-style: none;
            flex-wrap: wrap;
            max-height: 80px;
            overflow-y: auto;
            padding: 5px;
        }

        .score-item {
            background: #222;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 16px;
            font-variant-numeric: tabular-nums;
            border: 1px solid #333;
        }

        /* Background interaction overlay to catch clicks/touches anywhere */
        .touch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <a href="index.html" class="hub-btn">Back to Hub</a>

    <div class="container">
        <div class="touch-overlay" id="overlay"></div>
        <div class="timer-display" id="timer">0.00</div>
        
        <div class="scores-panel">
            <div class="scores-title" id="scores-label">SCORES</div>
            <ul class="scores-list" id="scores-list"></ul>
        </div>
    </div>

    <script>
        const timerDisplay = document.getElementById('timer');
        const scoresList = document.getElementById('scores-list');
        const scoresLabel = document.getElementById('scores-label');
        const overlay = document.getElementById('overlay');

        let startTime = 0;
        let elapsedInterval = null;
        let timerState = 'idle'; // idle, holding, running
        let scores = JSON.parse(localStorage.getItem('cube_scores')) || [];

        // Initialize display
        renderScores();

        // --- Core Timer Logic ---
        function handleTriggerDown(e) {
            // Prevent browser scrolling or zooming on space/touch
            if (e.type === 'keydown' && e.code !== 'Space') return;
            if (e.target.closest('.hub-btn') || e.target.closest('#scores-label')) return; 
            e.preventDefault();

            if (timerState === 'running') {
                stopTimer();
            } else if (timerState === 'idle') {
                timerState = 'holding';
                timerDisplay.classList.add('holding');
            }
        }

        function handleTriggerUp(e) {
            if (e.type === 'keyup' && e.code !== 'Space') return;
            if (e.target.closest('.hub-btn') || e.target.closest('#scores-label')) return;
            e.preventDefault();

            if (timerState === 'holding') {
                startTimer();
            }
        }

        function startTimer() {
            timerState = 'running';
            timerDisplay.classList.remove('holding');
            timerDisplay.classList.add('ready');
            startTime = performance.now();
            
            elapsedInterval = setInterval(() => {
                const now = performance.now();
                timerDisplay.textContent = formatTime(now - startTime);
            }, 10);
        }

        function stopTimer() {
            clearInterval(elapsedInterval);
            const finalTimeStr = timerDisplay.textContent;
            timerState = 'idle';
            timerDisplay.classList.remove('ready');
            
            // Save Score
            scores.unshift(finalTimeStr);
            if (scores.length > 5) scores.pop(); // Keep latest 5 scores
            localStorage.setItem('cube_scores', JSON.stringify(scores));
            renderScores();
        }

        function formatTime(ms) {
            const seconds = Math.floor(ms / 1000);
            const hundredths = Math.floor((ms % 1000) / 10);
            return `${seconds}.${hundredths.toString().padStart(2, '0')}`;
        }

        function renderScores() {
            scoresList.innerHTML = '';
            scores.forEach(score => {
                const li = document.createElement('li');
                li.className = 'score-item';
                li.textContent = score;
                scoresList.appendChild(li);
            });
        }

        // --- Event Listeners ---

        // Keyboard Input
        window.addEventListener('keydown', handleTriggerDown);
        window.addEventListener('keyup', handleTriggerUp);

        // Mouse Input (Everywhere except menu items)
        window.addEventListener('mousedown', handleTriggerDown);
        window.addEventListener('mouseup', handleTriggerUp);

        // Mobile Touch Input
        window.addEventListener('touchstart', handleTriggerDown, { passive: false });
        window.addEventListener('touchend', handleTriggerUp, { passive: false });

        // --- Reset functionality ---
        scoresLabel.addEventListener('click', (e) => {
            e.stopPropagation(); // Avoid triggering the timer
            const confirmReset = confirm("Do you wan't to reset all of your scores? yes or no.");
            if (confirmReset) {
                scores = [];
                localStorage.removeItem('cube_scores');
                renderScores();
                timerDisplay.textContent = "0.00";
            }
        });
    </script>
<a href="../TeamChat/index.html" title="Team chat" style="position:fixed;right:14px;bottom:14px;z-index:99999;display:inline-block;background:#00ff88;color:#06130c;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:800;letter-spacing:.6px;text-decoration:none;padding:11px 16px;border-radius:99px;box-shadow:0 4px 20px rgba(0,255,136,.45)">TEAMCHAT</a>
</body>
</html>
