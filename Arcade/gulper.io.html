<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gulper.io</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101820;
      color: #f4f7fb;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      width: 100%;
      height: 100%;
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      background: #17212b;
      border-bottom: 1px solid #314151;
      flex-wrap: wrap;
    }

    .title {
      min-width: 0;
      margin-right: 4px;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 260px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    button,
    a.button {
      height: 32px;
      padding: 0 12px;
      border: 1px solid #4d6276;
      border-radius: 6px;
      background: #223142;
      color: #f4f7fb;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      touch-action: manipulation;
    }

    button.active {
      background: #f4f7fb;
      color: #17212b;
      border-color: #f4f7fb;
      font-weight: 700;
    }

    button:hover,
    a.button:hover {
      background: #2f4358;
    }

    .frame-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    .fallback {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(430px, calc(100% - 32px));
      padding: 18px;
      border: 1px solid #4d6276;
      border-radius: 8px;
      background: #17212b;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }

    .fallback h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .fallback p {
      margin: 0 0 14px;
      color: #c9d4df;
      line-height: 1.4;
    }

    .fallback a {
      pointer-events: auto;
    }

    iframe.loaded + .fallback {
      display: none;
    }

    @media (max-width: 620px) {
      .bar {
        gap: 8px;
        padding: 8px;
      }

      .title {
        width: 100%;
      }

      .tabs {
        order: 2;
        flex-basis: 100%;
        min-width: 0;
      }

      button,
      a.button {
        height: 36px;
        padding: 0 10px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="bar">
      <div class="title">Gulper.io</div>
      <div class="tabs">
        <button class="active" type="button" data-game="gulper">Gulper.io</button>
      </div>
      <button type="button" onclick="reloadGame()">Refresh</button>
      <button type="button" onclick="goFullscreen()">Fullscreen</button>
      <a class="button" id="openButton" href="https://gulper.io" target="_blank" rel="noopener">Open</a>
      <a class="button" href="index.html">Back to Hub</a>
    </div>

    <div class="frame-wrap" id="frameWrap">
      <iframe
        id="gameFrame"
        src="https://gulper.io"
        title="Gulper.io"
        allow="fullscreen; autoplay; gamepad; pointer-lock"
        referrerpolicy="no-referrer"
      ></iframe>

      <section class="fallback">
        <h1 id="fallbackTitle">Loading Gulper.io</h1>
        <p>If the game does not appear, the site is probably blocking iframe play. Use Open to launch the selected game page directly.</p>
        <a class="button" id="fallbackOpenButton" href="https://gulper.io" target="_blank" rel="noopener">Open Game</a>
      </section>
    </div>
  </main>

  <script>
    const games = {
      gulper: {
        name: "Gulper.io",
        url: "https://gulper.io"
      }
    };

    const gameFrame = document.getElementById("gameFrame");
    const frameWrap = document.getElementById("frameWrap");
    const openButton = document.getElementById("openButton");
    const fallbackTitle = document.getElementById("fallbackTitle");
    const fallbackOpenButton = document.getElementById("fallbackOpenButton");
    const tabButtons = document.querySelectorAll("[data-game]");
    let currentGame = "gulper";

    gameFrame.addEventListener("load", () => {
      gameFrame.classList.add("loaded");
    });

    tabButtons.forEach((button) => {
      button.addEventListener("click", () => {
        loadGame(button.dataset.game);
      });
    });

    function loadGame(gameKey) {
      const game = games[gameKey];

      if (!game) {
        return;
      }

      currentGame = gameKey;
      gameFrame.classList.remove("loaded");
      gameFrame.src = game.url;
      openButton.href = game.url;
      fallbackOpenButton.href = game.url;
      fallbackTitle.textContent = "Loading " + game.name;

      tabButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.game === gameKey);
      });
    }

    function reloadGame() {
      const game = games[currentGame];
      gameFrame.classList.remove("loaded");
      gameFrame.src = game.url;
    }

    function goFullscreen() {
      if (frameWrap.requestFullscreen) {
        frameWrap.requestFullscreen();
      }
    }

    loadGame(currentGame);
  </script>
<a href="../TeamChat/index.html" title="Team chat" style="position:fixed;right:14px;bottom:14px;z-index:99999;display:inline-block;background:#00ff88;color:#06130c;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:800;letter-spacing:.6px;text-decoration:none;padding:11px 16px;border-radius:99px;box-shadow:0 4px 20px rgba(0,255,136,.45)">TEAMCHAT</a>
</body>
</html>
