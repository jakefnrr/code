<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Fruit Slice</title>
<style>
button,[role="button"]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#160b12;color:#fff;font-family:Arial,sans-serif;overflow:hidden;touch-action:none;user-select:none}
body{display:flex;justify-content:center}#app{width:100%;max-width:920px;height:100vh;display:grid;grid-template-rows:auto 1fr;background:#160b12}
#hud{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 10px;background:#0b0709;border-bottom:3px solid #ef4444}#title{font-weight:900;color:#fb7185}.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;font-weight:900;font-size:13px}
button{border:0;border-radius:8px;background:#fb7185;color:#2b0610;font-weight:900;min-height:34px;padding:7px 12px;cursor:pointer}#back{background:#38bdf8;color:#061522}#newGame{background:#22c55e;color:#04180c}
#wrap{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;background:#1d1019}canvas{display:block;width:100%;max-height:100%;aspect-ratio:16/9;background:radial-gradient(circle at 50% 20%,#342044,#160b12);touch-action:none}
#msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.76);border:3px solid #fb7185;border-radius:8px;padding:16px 20px;text-align:center;font-weight:900;font-size:clamp(18px,4vw,30px)}#msg.hidden{display:none}
@media(max-width:620px){#hud{grid-template-columns:1fr auto}.stats{grid-column:1/-1;order:3;font-size:12px;gap:7px}#title{font-size:15px}button{font-size:12px;min-height:30px;padding:5px 8px}}
</style>
</head>
<body>
<main id="app"><header id="hud"><div id="title">FRUIT SLICE</div><div class="stats"><span id="score">Score 0</span><span id="best">Best 0</span><span id="lives">Lives 3</span><span id="combo">Combo x1</span></div><div><button id="newGame">New Game</button><button id="back">Back to Hub</button></div></header><section id="wrap"><canvas id="game" width="920" height="518"></canvas><div id="msg">Press New Game</div></section></main>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),livesEl=document.getElementById('lives'),comboEl=document.getElementById('combo'),msg=document.getElementById('msg'),newGameBtn=document.getElementById('newGame'),backBtn=document.getElementById('back'),W=c.width,H=c.height;
let items=[],slashes=[],score=0,best=+localStorage.fruitninja_best||0,lives=3,combo=1,comboTimer=0,state='ready',spawnTimer=0,drag=false,lastPt=null,audioCtx,musicTimer,musicStep=0;
function audio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(f,d,t='triangle',v=.05,delay=0,end){const a=audio(),o=a.createOscillator(),g=a.createGain(),s=a.currentTime+delay;o.type=t;o.frequency.setValueAtTime(f,s);if(end)o.frequency.exponentialRampToValueAtTime(end,s+d);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d)}
function music(on){if(on){audio();if(musicTimer)return;const seq=[220,261.63,329.63,392,329.63,261.63,196,246.94];musicTimer=setInterval(()=>{tone(seq[musicStep%seq.length],.12,'triangle',.028);if(musicStep%4===0)tone(110,.18,'sine',.03,0,70);musicStep++},180)}else{clearInterval(musicTimer);musicTimer=null}}
function sliceSound(){tone(620,.06,'sawtooth',.045,0,1300)}function fruitSound(){tone(900,.08,'triangle',.055);tone(1300,.06,'sine',.035,.04)}function bombSound(){tone(120,.22,'sawtooth',.08,0,45)}function endSound(){tone(220,.16,'sawtooth',.06,0,90);tone(90,.3,'sine',.07,.12,40)}
function hud(){scoreEl.textContent='Score '+score;bestEl.textContent='Best '+best;livesEl.textContent='Lives '+lives;comboEl.textContent='Combo x'+combo}
function reset(){music(true);items=[];slashes=[];score=0;lives=3;combo=1;comboTimer=0;spawnTimer=0;state='play';msg.className='hidden';hud()}
function spawn(){const fruit=Math.random()>.18,x=80+Math.random()*(W-160);items.push({x,y:H+35,vx:(Math.random()-.5)*4,vy:-10-Math.random()*6,r:fruit?24:22,type:fruit?'fruit':'bomb',color:['#ef4444','#f97316','#facc15','#22c55e','#a855f7'][Math.floor(Math.random()*5)],cut:false,rot:Math.random()*6})}
function end(){if(state==='over')return;state='over';music(false);endSound();best=Math.max(best,score);localStorage.fruitninja_best=best;hud();msg.className='';msg.textContent='Game Over - Press New Game'}
function update(){if(state!=='play')return;spawnTimer--;if(spawnTimer<=0){spawn();spawnTimer=24+Math.random()*26}if(comboTimer>0)comboTimer--;else combo=1;items.forEach(o=>{o.x+=o.vx;o.y+=o.vy;o.vy+=.26;o.rot+=.08});items.forEach(o=>{if(!o.cut&&o.type==='fruit'&&o.y-o.r>H){o.cut=true;lives--;combo=1;bombSound();if(lives<=0)end()}});items=items.filter(o=>o.y-o.r<H+80&&!o.cut);slashes=slashes.filter(s=>--s.life>0);hud()}
function lineHit(a,b,o){const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((o.x-a.x)*dx+(o.y-a.y)*dy)/l2)),px=a.x+t*dx,py=a.y+t*dy;return Math.hypot(o.x-px,o.y-py)<o.r+8}
function slashTo(pt){if(state!=='play')return;if(lastPt){slashes.push({a:lastPt,b:pt,life:12});for(const o of items){if(o.cut)continue;if(lineHit(lastPt,pt,o)){o.cut=true;sliceSound();if(o.type==='bomb'){bombSound();end();return}else{score+=10*combo;combo=Math.min(9,combo+1);comboTimer=55;fruitSound()}}}}lastPt=pt}
function pos(e){const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)/r.width*W,y:(p.clientY-r.top)/r.height*H}}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#241126';ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(251,113,133,.16)';for(let i=0;i<12;i++){ctx.beginPath();ctx.arc((i*83+Date.now()/40)%W,70+i*31,38,0,Math.PI*2);ctx.fill()}items.forEach(o=>{ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);if(o.type==='bomb'){ctx.fillStyle='#111827';ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f97316';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='#facc15';ctx.fillRect(6,-o.r-9,4,12)}else{ctx.fillStyle=o.color;ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(-7,-8,7,0,Math.PI*2);ctx.fill()}ctx.restore()});slashes.forEach(s=>{ctx.globalAlpha=s.life/12;ctx.strokeStyle='#e0f2fe';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(s.a.x,s.a.y);ctx.lineTo(s.b.x,s.b.y);ctx.stroke();ctx.globalAlpha=1});requestAnimationFrame(draw)}
setInterval(update,1000/60);requestAnimationFrame(draw);
c.addEventListener('pointerdown',e=>{e.preventDefault();drag=true;lastPt=pos(e);if(c.setPointerCapture)c.setPointerCapture(e.pointerId);if(state!=='play')reset()},{passive:false});c.addEventListener('pointermove',e=>{e.preventDefault();if(drag)slashTo(pos(e))},{passive:false});function stop(e){e.preventDefault();drag=false;lastPt=null}c.addEventListener('pointerup',stop,{passive:false});c.addEventListener('pointercancel',stop,{passive:false});c.addEventListener('touchstart',e=>{e.preventDefault();drag=true;lastPt=pos(e);if(state!=='play')reset()},{passive:false});c.addEventListener('touchmove',e=>{e.preventDefault();if(drag)slashTo(pos(e))},{passive:false});c.addEventListener('touchend',stop,{passive:false});
newGameBtn.onclick=reset;backBtn.onclick=()=>location.href='index.html';hud();
</script></body>
</html>
