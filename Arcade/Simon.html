<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simon Game</title>
    <style>
        :root {
            --bg-color: #1a1a2e; --panel-bg: #16161d;
            --green: #00e676; --red: #ff1744; --yellow: #ffea00; --blue: #2979ff;
        }
        body {
            margin: 0; padding: 0; background-color: var(--bg-color);
            font-family: sans-serif; display: flex; justify-content: center;
            align-items: center; height: 100vh; overflow: hidden;
            user-select: none; -webkit-user-select: none; touch-action: manipulation;
        }
        .hub-btn {
            position: absolute; top: 20px; right: 20px; padding: 10px 20px;
            background-color: #303443; color: white; text-decoration: none;
            border-radius: 25px; font-weight: bold; font-size: 0.9rem;
            border: 1px solid #4e54c8; z-index: 10;
        }
        .simon-container {
            position: relative; width: 400px; height: 400px;
            max-width: 90vw; max-height: 90vw; transform: rotate(45deg);
        }
        .simon-ring {
            width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
            display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
            gap: 12px; background-color: var(--panel-bg); padding: 12px;
            box-sizing: border-box; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .pad { cursor: pointer; opacity: 0.6; filter: brightness(0.8); -webkit-tap-highlight-color: transparent; }
        .pad:active { opacity: 1 !important; filter: brightness(1.3) !important; }
        .pad.active { opacity: 1; filter: brightness(1.4); box-shadow: 0 0 30px currentColor; }
        .green { background-color: var(--green); border-top-left-radius: 100%; color: var(--green); }
        .red { background-color: var(--red); border-top-right-radius: 100%; color: var(--red); }
        .yellow { background-color: var(--yellow); border-bottom-left-radius: 100%; color: var(--yellow); }
        .blue { background-color: var(--blue); border-bottom-right-radius: 100%; color: var(--blue); }
        .center-hub {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-45deg);
            width: 150px; height: 150px; background-color: var(--panel-bg); border-radius: 50%;
            border: 12px solid var(--bg-color); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; text-align: center; z-index: 5;
        }
        .score-label { font-size: 0.75rem; text-transform: uppercase; color: #8b8fbc; }
        .score-display { font-size: 2.2rem; font-weight: bold; font-family: monospace; }
        .status-btn {
            margin-top: 8px; padding: 6px 14px; background: #4e54c8; border: none;
            color: white; border-radius: 15px; font-size: 0.75rem; font-weight: bold;
            cursor: pointer; text-transform: uppercase; -webkit-tap-highlight-color: transparent;
        }
        .disabled { pointer-events: none; }
    </style>
</head>
<body>
    <a href="index.html" class="hub-btn">Back to Hub</a>
    <div class="simon-container">
        <div class="simon-ring" id="board">
            <div class="pad green" data-color="0"></div>
            <div class="pad red" data-color="1"></div>
            <div class="pad yellow" data-color="2"></div>
            <div class="pad blue" data-color="3"></div>
        </div>
        <div class="center-hub">
            <div class="score-label">Score</div>
            <div class="score-display" id="score">00</div>
            <button class="status-btn" id="start-btn">Start</button>
        </div>
    </div>
    <script>
        let sequence = [], playerSequence = [], score = 0, isPlayingSequence = false, gameActive = false;
        const frequencies = [329.63, 440.00, 261.63, 392.00], audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const startBtn = document.getElementById('start-btn'), scoreDisplay = document.getElementById('score'), pads = document.querySelectorAll('.pad'), board = document.getElementById('board');

        function playTone(colorIndex, duration = 300) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.value = frequencies[colorIndex];
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration / 1000);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration / 1000);
            } catch(e){}
        }

        function activatePad(colorIndex, speedDuration = 300) {
            pads[colorIndex].classList.add('active');
            playTone(colorIndex, speedDuration);
            setTimeout(() => pads[colorIndex].classList.remove('active'), speedDuration);
        }

        async function playSequence() {
            isPlayingSequence = true;
            board.classList.add('disabled');
            const flashDuration = Math.max(160, 350 - (score * 15));
            const gapDuration = Math.max(100, 200 - (score * 10));
            for (let i = 0; i < sequence.length; i++) {
                await new Promise(r => setTimeout(r, gapDuration));
                activatePad(sequence[i], flashDuration);
                await new Promise(r => setTimeout(r, flashDuration));
            }
            isPlayingSequence = false;
                        board.classList.remove('disabled'); // Allow player to type
        }

        function nextRound() {
            playerSequence = [];
            scoreDisplay.textContent = score < 10 ? '0' + score : score;
            const randomColor = Math.floor(Math.random() * 4);
            sequence.push(randomColor);
            playSequence();
        }

        function handlePadClick(event) {
            if (isPlayingSequence || !gameActive) return;
            const clickedColor = parseInt(event.target.getAttribute('data-color'));
            const dynamicSpeed = Math.max(160, 350 - (score * 15));
            activatePad(clickedColor, dynamicSpeed);
            playerSequence.push(clickedColor);
            checkPlayerInput(playerSequence.length - 1);
        }

        function handleKeyDown(event) {
            if (isPlayingSequence || !gameActive) return;
            let colorIndex = -1;
            switch(event.key) {
                case 'ArrowUp': colorIndex = 0; break;    // Green
                case 'ArrowRight': colorIndex = 1; break; // Red
                case 'ArrowLeft': colorIndex = 2; break;  // Yellow
                case 'ArrowDown': colorIndex = 3; break;  // Blue
                default: return;
            }
            if (colorIndex !== -1) {
                event.preventDefault();
                const dynamicSpeed = Math.max(160, 350 - (score * 15));
                activatePad(colorIndex, dynamicSpeed);
                playerSequence.push(colorIndex);
                checkPlayerInput(playerSequence.length - 1);
            }
        }

        function checkPlayerInput(currentIndex) {
            if (playerSequence[currentIndex] !== sequence[currentIndex]) {
                gameOver();
                return;
            }
            if (playerSequence.length === sequence.length) {
                score++;
                setTimeout(nextRound, 800);
            }
        }

        function gameOver() {
            gameActive = false;
            startBtn.textContent = 'Restart';
            startBtn.style.visibility = 'visible';
            scoreDisplay.textContent = '!!';
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                osc.type = 'sawtooth'; osc.frequency.value = 110;
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } catch(e){}
        }

        function startGame() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            sequence = []; score = 0; gameActive = true;
            startBtn.style.visibility = 'hidden';
            nextRound();
        }

        startBtn.addEventListener('click', startGame);
        pads.forEach(pad => pad.addEventListener('click', handlePadClick));
        window.addEventListener('keydown', handleKeyDown);
    </script></body>
</html>
