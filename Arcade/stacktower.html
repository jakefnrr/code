<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stack Tower</title>
<style>
button,[role="button"]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#141824;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
    touch-action:none;
    user-select:none;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 18%, rgba(255,255,255,0.10), transparent 22%),
        linear-gradient(180deg, #242d4e 0%, #161827 54%, #11131d 100%);
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#hud{
    position:absolute;
    left:0;
    right:0;
    top:0;
    z-index:3;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:14px;
    pointer-events:none;
}

#score{
    position:absolute;
    left:50%;
    top:18px;
    transform:translateX(-50%);
    color:#fff;
    font-size:64px;
    line-height:1;
    font-weight:900;
    text-shadow:0 4px 18px rgba(0,0,0,0.35);
}

#best{
    padding:8px 10px;
    border:2px solid rgba(255,255,255,0.28);
    border-radius:6px;
    background:rgba(8,10,18,0.36);
    color:#dbe9ff;
    font-size:13px;
    line-height:1.25;
    min-width:74px;
    text-align:center;
    backdrop-filter:blur(6px);
}

#back{
    pointer-events:auto;
    border:0;
    border-radius:6px;
    background:cyan;
    color:#05070d;
    padding:10px 13px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

#back:hover{
    background:white;
}

#overlay{
    position:absolute;
    inset:0;
    z-index:4;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:22px;
    background:rgba(6,8,15,0.22);
    pointer-events:none;
}

#panel{
    width:min(340px, 88vw);
    border:2px solid rgba(255,255,255,0.26);
    border-radius:8px;
    background:rgba(9,12,23,0.66);
    box-shadow:0 18px 50px rgba(0,0,0,0.28);
    backdrop-filter:blur(10px);
    padding:22px 20px;
    pointer-events:auto;
}

#panel h1{
    margin:0 0 8px;
    font-size:34px;
    line-height:1;
}

#panel p{
    margin:8px 0 18px;
    color:#dbe9ff;
    line-height:1.45;
    font-size:15px;
}

#panel button{
    width:100%;
    min-height:48px;
    border:0;
    border-radius:6px;
    background:cyan;
    color:#05070d;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
}

#panel button:hover{
    background:white;
}

#hint{
    position:absolute;
    left:50%;
    bottom:24px;
    z-index:3;
    transform:translateX(-50%);
    color:rgba(255,255,255,0.72);
    font-weight:bold;
    font-size:14px;
    text-align:center;
    width:min(420px, 90vw);
    text-shadow:0 2px 12px rgba(0,0,0,0.45);
    pointer-events:none;
}

@media (max-width:560px){
    #score{
        font-size:52px;
        top:18px;
    }

    #hud{
        padding:10px;
    }

    #best{
        font-size:12px;
        min-width:66px;
    }

    #back{
        padding:9px 11px;
        font-size:13px;
    }
}
</style>
</head>
<body>
<div id="game">
    <canvas id="canvas"></canvas>
    <div id="hud">
        <div id="best">BEST<br><span id="bestValue">0</span></div>
        <button id="back" type="button">Back to Hub</button>
    </div>
    <div id="score">0</div>
    <div id="hint">Tap, click, or press Space to stack</div>
    <div id="overlay">
        <div id="panel">
            <h1>Stack Tower</h1>
            <p>Drop each moving block squarely on the tower. Miss the stack and the tower falls.</p>
            <button id="start" type="button">Start</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestValueEl = document.getElementById('bestValue');
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');
const startBtn = document.getElementById('start');
const hint = document.getElementById('hint');
const back = document.getElementById('back');

const colors = [
    ['#ff616d', '#cb2842'],
    ['#ffb75e', '#ed8f03'],
    ['#fceabb', '#f8b500'],
    ['#65d6ce', '#1eaaa3'],
    ['#4facfe', '#0072ff'],
    ['#a18cd1', '#6656c8'],
    ['#f093fb', '#d64fc9']
];

let dpr = 1;
let w = 0;
let h = 0;
let blocks = [];
let falling = [];
let current = null;
let axis = 'x';
let score = 0;
let best = Number(localStorage.getItem('stackTowerBest') || 0);
let cameraY = 0;
let targetCameraY = 0;
let state = 'ready';
let lastTime = 0;
let shake = 0;
let audioCtx = null;
let musicTimer = null;
let musicStep = 0;

const iso = {
    x: 0.86,
    y: 0.43,
    z: 0.86
};

const settings = {
    baseWidth: 184,
    baseDepth: 184,
    height: 34,
    startSpeed: 150,
    speedGain: 8,
    perfect: 9
};

bestValueEl.textContent = best;

function initAudio(){
    if(audioCtx){
        if(audioCtx.state === 'suspended'){
            audioCtx.resume();
        }
        return;
    }

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    startMusic();
}

function playTone(freq, duration, type, volume, when, endFreq){
    if(!audioCtx){
        return;
    }

    const start = audioCtx.currentTime + (when || 0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, start);
    if(endFreq){
        osc.frequency.exponentialRampToValueAtTime(endFreq, start + duration);
    }
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(volume, start + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + duration + 0.03);
}

function playNoise(duration, volume){
    if(!audioCtx){
        return;
    }

    const length = Math.floor(audioCtx.sampleRate * duration);
    const buffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i = 0; i < length; i++){
        data[i] = (Math.random() * 2 - 1) * (1 - i / length);
    }

    const source = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    source.buffer = buffer;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    source.connect(gain);
    gain.connect(audioCtx.destination);
    source.start();
}

function startMusic(){
    if(!audioCtx || musicTimer){
        return;
    }

    const notes = [196, 247, 294, 247, 220, 262, 330, 262];
    musicTimer = setInterval(() => {
        if(!audioCtx || audioCtx.state !== 'running'){
            return;
        }
        const note = notes[musicStep % notes.length];
        playTone(note, 0.18, 'triangle', 0.035, 0);
        if(musicStep % 2 === 0){
            playTone(note / 2, 0.25, 'sine', 0.025, 0);
        }
        musicStep++;
    }, 260);
}

function stopMusic(){
    if(musicTimer){
        clearInterval(musicTimer);
        musicTimer = null;
    }
}

function placeSound(perfect){
    initAudio();
    playTone(perfect ? 740 : 560, 0.09, 'square', 0.075, 0, perfect ? 980 : 700);
    playTone(perfect ? 1110 : 840, 0.08, 'triangle', 0.045, 0.04);
}

function loseSound(){
    initAudio();
    playTone(180, 0.38, 'sawtooth', 0.09, 0, 58);
    playTone(92, 0.52, 'square', 0.055, 0.08, 35);
    playNoise(0.28, 0.08);
}

function resize(){
    dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
    w = Math.floor(window.innerWidth);
    h = Math.floor(window.innerHeight);
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function project(x, y, z){
    return {
        x: w / 2 + (x - y) * iso.x,
        y: h * 0.72 + cameraY + (x + y) * iso.y - z * iso.z
    };
}

function shade(hex, amount){
    const num = parseInt(hex.slice(1), 16);
    const r = Math.max(0, Math.min(255, (num >> 16) + amount));
    const g = Math.max(0, Math.min(255, ((num >> 8) & 255) + amount));
    const b = Math.max(0, Math.min(255, (num & 255) + amount));
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function drawPoly(points, fill){
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for(let i = 1; i < points.length; i++){
        ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
}

function drawBlock(block){
    const x1 = block.x - block.width / 2;
    const x2 = block.x + block.width / 2;
    const y1 = block.y - block.depth / 2;
    const y2 = block.y + block.depth / 2;
    const z1 = block.z;
    const z2 = block.z + block.height;

    const p000 = project(x1, y1, z1);
    const p100 = project(x2, y1, z1);
    const p110 = project(x2, y2, z1);
    const p010 = project(x1, y2, z1);
    const p001 = project(x1, y1, z2);
    const p101 = project(x2, y1, z2);
    const p111 = project(x2, y2, z2);
    const p011 = project(x1, y2, z2);

    drawPoly([p010, p110, p111, p011], shade(block.color, -26));
    drawPoly([p100, p110, p111, p101], shade(block.color, -48));
    drawPoly([p001, p101, p111, p011], block.color);

    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    [p001, p101, p111, p011].forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.closePath();
    ctx.stroke();
}

function reset(){
    blocks = [];
    falling = [];
    current = null;
    axis = 'x';
    score = 0;
    cameraY = 0;
    targetCameraY = 0;
    shake = 0;
    scoreEl.textContent = '0';

    blocks.push({
        x: 0,
        y: 0,
        z: 0,
        width: settings.baseWidth,
        depth: settings.baseDepth,
        height: settings.height,
        color: '#3a425e'
    });
    spawnBlock();
}

function spawnBlock(){
    const top = blocks[blocks.length - 1];
    const color = colors[(blocks.length - 1) % colors.length][0];
    const distance = Math.max(250, top.width + top.depth + 70);
    const speed = settings.startSpeed + score * settings.speedGain;

    axis = axis === 'x' ? 'y' : 'x';
    current = {
        x: axis === 'x' ? -distance : top.x,
        y: axis === 'y' ? -distance : top.y,
        z: top.z + settings.height,
        width: top.width,
        depth: top.depth,
        height: settings.height,
        color,
        dir: 1,
        speed,
        distance
    };
}

function startGame(){
    initAudio();
    startMusic();
    state = 'playing';
    overlay.style.display = 'none';
    hint.style.display = 'block';
    reset();
}

function placeBlock(){
    if(state === 'ready' || state === 'over'){
        startGame();
        return;
    }

    if(state !== 'playing' || !current){
        return;
    }

    const previous = blocks[blocks.length - 1];
    const movingSize = axis === 'x' ? current.width : current.depth;
    const previousSize = axis === 'x' ? previous.width : previous.depth;
    const currentPos = axis === 'x' ? current.x : current.y;
    const previousPos = axis === 'x' ? previous.x : previous.y;
    const offset = currentPos - previousPos;
    const overlap = previousSize / 2 + movingSize / 2 - Math.abs(offset);

    if(overlap <= 0){
        current.vz = 0;
        current.vx = axis === 'x' ? Math.sign(offset || 1) * 110 : 0;
        current.vy = axis === 'y' ? Math.sign(offset || 1) * 110 : 0;
        current.rot = 0;
        falling.push(current);
        current = null;
        loseSound();
        gameOver();
        return;
    }

    let next = {...current};
    const perfect = Math.abs(offset) <= settings.perfect;
    const newSize = perfect ? previousSize : overlap;
    const newPos = perfect ? previousPos : previousPos + offset / 2;

    if(axis === 'x'){
        next.x = newPos;
        next.width = newSize;
    }else{
        next.y = newPos;
        next.depth = newSize;
    }

    if(!perfect){
        const cutSize = movingSize - overlap;
        const cutCenter = previousPos + Math.sign(offset) * (previousSize / 2 + cutSize / 2);
        const cut = {...current};
        cut.vz = 0;
        cut.vx = axis === 'x' ? Math.sign(offset) * 120 : 0;
        cut.vy = axis === 'y' ? Math.sign(offset) * 120 : 0;
        if(axis === 'x'){
            cut.x = cutCenter;
            cut.width = cutSize;
        }else{
            cut.y = cutCenter;
            cut.depth = cutSize;
        }
        falling.push(cut);
    }else{
        next.x = previous.x;
        next.y = previous.y;
        pulseScore();
    }

    placeSound(perfect);
    blocks.push(next);
    score += 1;
    scoreEl.textContent = score;
    if(score > best){
        best = score;
        bestValueEl.textContent = best;
        localStorage.setItem('stackTowerBest', String(best));
    }

    targetCameraY = (blocks.length - 6) * settings.height * iso.z;
    current = null;
    spawnBlock();
}

function pulseScore(){
    scoreEl.animate([
        {transform:'translateX(-50%) scale(1)'},
        {transform:'translateX(-50%) scale(1.16)'},
        {transform:'translateX(-50%) scale(1)'}
    ], {duration:180, easing:'ease-out'});
}

function gameOver(){
    state = 'over';
    stopMusic();
    shake = 14;
    hint.style.display = 'none';
    setTimeout(() => {
        panel.innerHTML = '<h1>Game Over</h1><p>Score: ' + score + '<br>Best: ' + best + '</p><button id="again" type="button">Play Again</button>';
        document.getElementById('again').onclick = startGame;
        overlay.style.display = 'flex';
    }, 560);
}

function update(dt){
    if(state === 'playing' && current){
        current[axis] += current.dir * current.speed * dt;
        if(current[axis] > current.distance){
            current[axis] = current.distance;
            current.dir = -1;
        }else if(current[axis] < -current.distance){
            current[axis] = -current.distance;
            current.dir = 1;
        }
    }

    cameraY += (targetCameraY - cameraY) * Math.min(1, dt * 5.5);

    for(const block of falling){
        block.vz -= 850 * dt;
        block.x += (block.vx || 0) * dt;
        block.y += (block.vy || 0) * dt;
        block.z += block.vz * dt;
    }
    falling = falling.filter(block => project(block.x, block.y, block.z).y < h + 180);

    if(shake > 0){
        shake = Math.max(0, shake - dt * 42);
    }
}

function drawBackground(){
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#27345f');
    grad.addColorStop(0.55, '#161827');
    grad.addColorStop(1, '#10121b');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    for(let i = 0; i < 28; i++){
        const x = (i * 173) % w;
        const y = (i * 97) % Math.max(1, h * 0.58);
        const r = 1 + (i % 3);
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
    }
}

function draw(){
    ctx.save();
    drawBackground();

    if(shake > 0){
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    const allBlocks = blocks.concat(current ? [current] : [], falling);
    allBlocks
        .slice()
        .sort((a, b) => (a.z - b.z) || ((a.x + a.y) - (b.x + b.y)))
        .forEach(drawBlock);

    ctx.restore();
}

function loop(time){
    const dt = Math.min(0.033, (time - lastTime) / 1000 || 0);
    lastTime = time;
    update(dt);
    draw();
    requestAnimationFrame(loop);
}

function goHub(){
    const unlockTime = parseInt(localStorage.getItem('globalUnlockTime')) || 0;
    if(Date.now() < unlockTime){
        location.href = 'index.html';
    }else{
        location.href = 'index.html?needauth=1';
    }
}

startBtn.onclick = startGame;
back.onclick = goHub;

window.addEventListener('resize', resize);
window.addEventListener('keydown', e => {
    if(e.code === 'Space' || e.code === 'Enter'){
        e.preventDefault();
        placeBlock();
    }
    if(e.key.toLowerCase() === 'r'){
        startGame();
    }
    if(e.key === 'Escape'){
        goHub();
    }
});
window.addEventListener('pointerdown', e => {
    if(e.target.closest('button')){
        return;
    }
    placeBlock();
});

resize();
reset();
requestAnimationFrame(loop);
</script></body>
</html>
