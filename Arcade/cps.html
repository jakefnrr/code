<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPS Test Game</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #6b7280;
            --secondary-hover: #4b5563;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            margin-top: 0;
            font-size: 2rem;
            color: var(--text);
        }

        .mode-selector {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 8px 4px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid #d1d5db;
            background: #f9fafb;
            color: var(--text);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #f9fafb;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }

        .stat-label {
            font-size: 0.875rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 5px;
        }

        #click-area {
            width: 100%;
            height: 180px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.05s, background-color 0.2s;
            user-select: none;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        #click-area:hover {
            background-color: var(--primary-hover);
        }

        #click-area:active {
            transform: scale(0.98);
        }

        #click-area:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .nav-buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-size: 1rem;
            text-align: center;
            display: inline-block;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            background-color: var(--secondary-hover);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CPS Test</h1>
        
        <!-- Mode Selector Buttons (1 to 10 seconds) -->
        <div class="mode-selector" id="mode-selector">
            <button class="mode-btn" data-time="1">1s</button>
            <button class="mode-btn" data-time="2">2s</button>
            <button class="mode-btn" data-time="3">3s</button>
            <button class="mode-btn" data-time="4">4s</button>
            <button class="mode-btn" data-time="5">5s</button>
            <button class="mode-btn" data-time="6">6s</button>
            <button class="mode-btn" data-time="7">7s</button>
            <button class="mode-btn" data-time="8">8s</button>
            <button class="mode-btn" data-time="9">9s</button>
            <button class="mode-btn active" data-time="10">10s</button>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">Time Left</div>
                <div class="stat-value" id="time-left">5.0s</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">CPS</div>
                <div class="stat-value" id="cps">0.00</div>
            </div>
        </div>

        <button id="click-area">Click Here to Start</button>

        <div class="nav-buttons">
            <button class="btn btn-primary" id="reset-btn">Reset</button>
            <a href="index.html" class="btn btn-secondary">Back to Hub</a>
        </div>
    </div>

    <script>
        let selectedTime = 5; // Default starting time
        let timeLeft = selectedTime;
        let clicks = 0;
        let isPlaying = false;
        let timer = null;

        const clickArea = document.getElementById('click-area');
        const timeLeftDisplay = document.getElementById('time-left');
        const cpsDisplay = document.getElementById('cps');
        const resetBtn = document.getElementById('reset-btn');
        const modeButtons = document.querySelectorAll('.mode-btn');

        // Highlight default 5s or active setting visually on load
        updateTimerDisplay();

        // Handle time selection buttons (1-10 sec)
        modeButtons.forEach(button => {
            button.addEventListener('click', () => {
                if (isPlaying) return; // Don't change mode mid-game
                modeButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                selectedTime = parseInt(button.getAttribute('data-time'));
                timeLeft = selectedTime;
                updateTimerDisplay();
            });
        });

        function updateTimerDisplay() {
            timeLeftDisplay.textContent = timeLeft.toFixed(1) + 's';
        }

        clickArea.addEventListener('click', () => {
            if (!isPlaying && timeLeft === selectedTime) {
                // Start game on first click
                isPlaying = true;
                clicks = 0;
                cpsDisplay.textContent = '0.00';
                
                // Disable mode selector during game
                modeButtons.forEach(btn => btn.disabled = true);

                let startTime = Date.now();
                timer = setInterval(() => {
                    let elapsed = (Date.now() - startTime) / 1000;
                    timeLeft = Math.max(0, selectedTime - elapsed);
                    timeLeftDisplay.textContent = timeLeft.toFixed(1) + 's';
                    
                    let currentCPS = elapsed > 0 ? (clicks / elapsed) : 0;
                    cpsDisplay.textContent = currentCPS.toFixed(2);

                    if (timeLeft <= 0) {
                        endGame();
                    }
                }, 50);
            }

            if (isPlaying) {
                clicks++;
                let elapsed = (selectedTime - timeLeft);
                if (elapsed > 0) {
                    cpsDisplay.textContent = (clicks / elapsed).toFixed(2);
                }
            }
        });

        function endGame() {
            isPlaying = false;
            clearInterval(timer);
            let finalCPS = clicks / selectedTime;
            cpsDisplay.textContent = finalCPS.toFixed(2);
            timeLeftDisplay.textContent = '0.0s';
            clickArea.disabled = true;
            clickArea.textContent = `Score: ${finalCPS.toFixed(2)} CPS`;
        }

        resetBtn.addEventListener('click', resetGame);

        function resetGame() {
            isPlaying = false;
            clearInterval(timer);
            timeLeft = selectedTime;
            clicks = 0;
            clickArea.disabled = false;
            clickArea.textContent = 'Click Here to Start';
            timeLeftDisplay.textContent = selectedTime.toFixed(1) + 's';
            cpsDisplay.textContent = '0.00';
            modeButtons.forEach(btn => btn.disabled = false);
        }
    </script>
<a href="../TeamChat/index.html" title="Team chat" style="position:fixed;right:14px;bottom:14px;z-index:99999;display:inline-block;background:#00ff88;color:#06130c;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:800;letter-spacing:.6px;text-decoration:none;padding:11px 16px;border-radius:99px;box-shadow:0 4px 20px rgba(0,255,136,.45)">TEAMCHAT</a>
</body>
</html>
