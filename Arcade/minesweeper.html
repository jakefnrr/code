<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Minesweeper</title>
  <style>
    button,[role="button"]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0;background:#172033;color:#f8fafc;font-family:Arial,sans-serif}
    body{display:flex;justify-content:center;align-items:stretch;overflow:hidden}
    #app{width:min(100vw,980px);height:100vh;display:grid;grid-template-rows:auto auto auto auto 1fr;padding:8px 10px;gap:7px}
    header{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
    h1{margin:0;font-size:26px;color:#67e8f9;text-shadow:0 0 14px rgba(103,232,249,.45)}
    #stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
    .stat{min-width:68px;background:#222b42;border:1px solid #3d4868;border-radius:7px;padding:5px 8px;text-align:center}
    .stat strong{display:block;font-size:17px}.stat span{display:block;font-size:10px;color:#b9c4dc}
    button{border:0;border-radius:7px;background:#38bdf8;color:#062135;font-weight:bold;font-size:14px;min-height:34px;cursor:pointer;padding:7px 12px}
    button:hover{filter:brightness(1.08)}button.active{background:#facc15;color:#2b1c00}
    #back{justify-self:end;background:cyan;color:#000;font-size:12px;min-height:30px}
    #topControls{display:flex;justify-content:center;gap:7px;align-items:center;flex-wrap:wrap}
    #status{justify-self:center;width:min(100%,360px);background:#222b42;border:1px solid #3d4868;border-radius:7px;padding:8px 12px;text-align:center;font-size:16px;min-height:36px;font-weight:bold}
    #flagMode{justify-self:center;width:min(100%,360px);min-height:96px;margin-bottom:-5px;background:#22c55e;color:#03150a;font-size:24px;letter-spacing:0}
    #flagMode.flagging{background:#f97316;color:#220b02}
    #boardWrap{display:flex;align-items:flex-start;justify-content:center;min-height:0;overflow:auto;padding:0 2px 2px}
    #board{display:grid;gap:2px;background:#0f172a;border:4px solid #334155;box-shadow:0 12px 30px rgba(0,0,0,.35);padding:4px;max-width:100%;max-height:100%}
    .cell{width:clamp(25px,5.8vmin,38px);height:clamp(25px,5.8vmin,38px);min-height:0;padding:0;border-radius:5px;background:linear-gradient(#5eead4,#14b8a6);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(15,118,110,.45);display:grid;place-items:center;font-weight:900;font-size:clamp(15px,3.5vmin,23px);color:#0f172a}
    .cell.revealed{background:#dbeafe;border-color:#b7c8df;box-shadow:inset 0 1px 4px rgba(15,23,42,.18);cursor:default}
    .cell.mine{background:#fecaca;color:#7f1d1d}.cell.flag{background:linear-gradient(#fde68a,#f59e0b)}
    .n1{color:#2563eb}.n2{color:#16a34a}.n3{color:#dc2626}.n4{color:#7c3aed}.n5{color:#be123c}.n6{color:#0891b2}.n7{color:#111827}.n8{color:#64748b}
    @media(max-width:620px){#app{padding:7px;gap:5px}header{grid-template-columns:1fr auto}h1{font-size:22px}#stats{grid-column:1 / -1;order:3}.stat{min-width:58px;padding:4px 6px}.stat strong{font-size:15px}#topControls{gap:5px}button{font-size:12px;min-height:30px;padding:5px 8px}#status{font-size:14px}#flagMode{min-height:88px;font-size:22px;margin-bottom:-4px}.cell{border-radius:4px}}
  </style>
</head>
<body>
<main id="app">
  <header>
    <h1>💣 Minesweeper</h1>
    <div id="stats">
      <div class="stat"><strong id="wins">0</strong><span>Wins</span></div>
      <div class="stat"><strong id="games">0</strong><span>Games</span></div>
      <div class="stat"><strong id="best">--</strong><span>Best</span></div>
      <div class="stat"><strong id="streak">0</strong><span>Streak</span></div>
    </div>
    <button id="back" onclick="location.href='index.html'">Back to Hub</button>
  </header>
  <div id="topControls">
    <button class="active" data-level="easy">Easy</button>
    <button data-level="medium">Medium</button>
    <button data-level="hard">Hard</button>
    <button id="newGame">New Game</button>
  </div>
  <div id="status">Click a square. First click is always safe.</div>
  <button id="flagMode">Flag Mode</button>
  <section id="boardWrap"><div id="board"></div></section>
</main>
<script>
const LEVELS={easy:{rows:9,cols:9,mines:10},medium:{rows:12,cols:14,mines:24},hard:{rows:16,cols:18,mines:45}};
const boardEl=document.getElementById('board'),statusEl=document.getElementById('status'),flagBtn=document.getElementById('flagMode'),winsEl=document.getElementById('wins'),gamesEl=document.getElementById('games'),bestEl=document.getElementById('best'),streakEl=document.getElementById('streak');
const levelButtons=[...document.querySelectorAll('[data-level]')];
let level='easy',cfg=LEVELS[level],cells=[],firstClick=true,gameOver=false,flagMode=false,revealed=0,flags=0,startTime=0,timer=null,seconds=0,audioCtx;
let stats=JSON.parse(localStorage.getItem('minesweeper_stats')||'{"wins":0,"games":0,"streak":0,"best":{}}');
function ctx(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(f,d,type='sine',v=.06,delay=0,end){const c=ctx(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,s);if(end)o.frequency.exponentialRampToValueAtTime(end,s+d);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d)}
function clickSound(){tone(440,.045,'triangle',.045,0,620)}function flagSound(){tone(330,.06,'square',.035,0,220)}function boomSound(){tone(140,.22,'sawtooth',.06,0,55)}function winSound(){[523,659,784,1046].forEach((f,i)=>tone(f,.13,'triangle',.07,i*.08))}
function saveStats(){localStorage.setItem('minesweeper_stats',JSON.stringify(stats));winsEl.textContent=stats.wins;gamesEl.textContent=stats.games;streakEl.textContent=stats.streak;bestEl.textContent=stats.best[level]?formatTime(stats.best[level]):'--'}
function newGame(){cfg=LEVELS[level];cells=[];firstClick=true;gameOver=false;flagMode=false;revealed=0;flags=0;seconds=0;clearInterval(timer);timer=null;flagBtn.classList.remove('flagging');boardEl.style.gridTemplateColumns=`repeat(${cfg.cols},1fr)`;for(let r=0;r<cfg.rows;r++)for(let c=0;c<cfg.cols;c++)cells.push({r,c,mine:false,revealed:false,flag:false,count:0});draw();setStatus()}
function draw(){boardEl.innerHTML='';for(const cell of cells){const btn=document.createElement('button');btn.className='cell';btn.dataset.i=index(cell.r,cell.c);btn.oncontextmenu=e=>{e.preventDefault();toggleFlag(cell)};btn.onclick=()=>cellAction(cell);boardEl.appendChild(btn)}render()}
function render(){[...boardEl.children].forEach((btn,i)=>{const cell=cells[i];btn.className='cell';btn.textContent='';if(cell.revealed){btn.classList.add('revealed');if(cell.mine){btn.classList.add('mine');btn.textContent='💥'}else if(cell.count){btn.classList.add('n'+cell.count);btn.textContent=cell.count}}else if(cell.flag){btn.classList.add('flag');btn.textContent='🚩'}})}
function setStatus(extra=''){const left=cfg.mines-flags;statusEl.textContent=extra||`Mines left: ${left} | Time: ${formatTime(seconds)}`}
function startTimer(){if(timer)return;startTime=Date.now();timer=setInterval(()=>{seconds=Math.floor((Date.now()-startTime)/1000);setStatus()},1000)}
function placeMines(safe){const banned=new Set(neighbors(safe.r,safe.c).concat([safe]).map(x=>index(x.r,x.c)));const spots=cells.filter(c=>!banned.has(index(c.r,c.c)));shuffle(spots);spots.slice(0,cfg.mines).forEach(c=>c.mine=true);for(const c of cells)c.count=neighbors(c.r,c.c).filter(n=>cellAt(n.r,n.c).mine).length}
function cellAction(cell){if(gameOver||cell.revealed)return;if(flagMode){toggleFlag(cell);return}if(cell.flag)return;if(firstClick){placeMines(cell);firstClick=false;startTimer()}if(cell.mine){lose(cell);return}reveal(cell);clickSound();render();if(revealed===cfg.rows*cfg.cols-cfg.mines)win();else setStatus()}
function toggleFlag(cell){if(gameOver||cell.revealed)return;cell.flag=!cell.flag;flags+=cell.flag?1:-1;flagSound();render();setStatus()}
function reveal(cell){if(cell.revealed||cell.flag)return;cell.revealed=true;revealed++;if(cell.count===0)neighbors(cell.r,cell.c).forEach(n=>reveal(cellAt(n.r,n.c)))}
function lose(hit){gameOver=true;clearInterval(timer);cells.forEach(c=>{if(c.mine)c.revealed=true});hit.revealed=true;stats.games++;stats.streak=0;saveStats();boomSound();render();setStatus('Boom. New Game to try again.')}
function win(){gameOver=true;clearInterval(timer);cells.forEach(c=>{if(c.mine)c.flag=true});stats.games++;stats.wins++;stats.streak++;if(!stats.best[level]||seconds<stats.best[level])stats.best[level]=seconds;saveStats();winSound();render();setStatus(`Cleared in ${formatTime(seconds)}.`)}
function neighbors(r,c){let out=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const nr=r+dr,nc=c+dc;if(nr>=0&&nr<cfg.rows&&nc>=0&&nc<cfg.cols)out.push({r:nr,c:nc})}return out}
function cellAt(r,c){return cells[index(r,c)]}function index(r,c){return r*cfg.cols+c}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function formatTime(s){const m=Math.floor(s/60),ss=String(s%60).padStart(2,'0');return `${m}:${ss}`}
levelButtons.forEach(btn=>btn.onclick=()=>{level=btn.dataset.level;levelButtons.forEach(b=>b.classList.toggle('active',b===btn));saveStats();newGame()});
flagBtn.onclick=()=>{flagMode=!flagMode;flagBtn.classList.toggle('flagging',flagMode);flagBtn.textContent=flagMode?'Flagging On':'Flag Mode'};
document.getElementById('newGame').onclick=newGame;saveStats();newGame();
</script>
<a href="../TeamChat/index.html" title="Team chat" style="position:fixed;right:14px;bottom:14px;z-index:99999;display:inline-block;background:#00ff88;color:#06130c;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:800;letter-spacing:.6px;text-decoration:none;padding:11px 16px;border-radius:99px;box-shadow:0 4px 20px rgba(0,255,136,.45)">TEAMCHAT</a>
</body>
</html>
