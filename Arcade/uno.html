    document.querySelector("[data-host]").onclick=()=>this.hostRoom();
    document.querySelector("[data-join]").onclick=()=>this.promptJoinRoom();
    document.querySelector("[data-close]").onclick=()=>this.closeDialog();
  }
  renderLobby(){
    const slots=[0,1,2,3].map(i=>this.lobby.players[i]);
    const me=this.currentLobbyPlayer();
    const isHost=me?.host;
    this.dialog(`<h2>Online Lobby</h2><p>${isHost?"Tell other players this room code.":"Waiting for the host to start."}</p>
      <label class="field-label">Your username
        <input class="field" id="usernameInput" maxlength="18" placeholder="Username" enterkeyhint="done" autocomplete="nickname" value="${this.escapeHTML(this.username)}">
      </label>
      ${this.keyboardDoneHTML()}
      <div class="code">${this.lobby.code}</div>
      <div class="lobby-list">${slots.map((p,i)=>`<div class="slot ${p?.ready?"ready":""}"><strong>${p?this.escapeHTML(p.name)+(p.host?" (Host)":""):`Player ${i+1}`}</strong><span>${p?(p.host?"Host":p.ready?"Ready":"Not ready"):"Waiting for player..."}</span></div>`).join("")}</div>
      <div class="small">${this.onlineStatus || (isHost?"Waiting for players.":"Connected to host.")}</div>
      <div class="row">${isHost?`<button class="primary-btn" data-start-lobby ${this.canStartLobby()?"":"disabled"}>Start Game</button>`:`<button class="primary-btn ${me?.ready?"ready-btn":""}" data-ready ${me?.ready?"disabled":""}>${me?.ready?"Ready":"Ready"}</button>`}<button class="ghost-btn" data-join>Join Different Room</button><button class="ghost-btn" data-close>Back</button></div>`);
    this.bindUsernameInput(true);
    document.querySelector("[data-ready]")?.addEventListener("click",()=>{this.updateLobbyPlayer({ready:true});this.renderLobby()});
    document.querySelector("[data-start-lobby]")?.addEventListener("click",()=>this.askAIFill());
    document.querySelector("[data-join]").onclick=()=>this.promptJoinRoom();
    document.querySelector("[data-close]").onclick=()=>this.closeDialog();
  }
  bindUsernameInput(updateLobby=false){
    const input=document.getElementById("usernameInput");
    if(!input) return;
    input.oninput=e=>{
      this.setUsername(e.target.value);
      if(!updateLobby) return;
      clearTimeout(this.usernameUpdateTimer);
      this.usernameUpdateTimer=setTimeout(()=>this.updateLobbyPlayer({name:this.username}),220);
    };
    input.onkeydown=e=>{
      if(e.key==="Enter"){
        this.dismissKeyboard();
        if(updateLobby) this.updateLobbyPlayer({name:this.username});
      }
    };
  }
  keyboardDoneHTML(){
    return `<button class="chip-btn keyboard-done active" type="button" data-keyboard-done>Keyboard down</button>`;
  }
  dismissKeyboard(){
    const active=document.activeElement;
    if(active && active.matches?.("input, textarea, select")) active.blur();
  }
  shouldDeferFocusedInputRender(){
    const active=document.activeElement;
    return !!active?.matches?.("#usernameInput, #joinCodeInput, #chatInput");
  }
  hostRoom(){
    this.syncLobbyUsername();
    if(typeof Peer==="undefined"){this.onlineStatus="Online library could not load.";return this.renderOnlineHome()}
    this.resetOnlineConnection();
    const code=this.roomCode();
    this.chatMessages=[];
    this.lobby={code,players:[{id:this.clientId,name:this.username,host:true,ready:true,connected:true}],role:"host",status:"lobby",version:0};
    this.onlineStatus="Opening room...";
    this.peer=new Peer(this.roomPeerId(code));
    this.peer.on("open",()=>{this.onlineStatus="Room ready. Share this code.";this.renderLobby();this.broadcastLobby()});
    this.peer.on("connection",conn=>this.bindHostConnection(conn));
    this.peer.on("error",err=>{this.onlineStatus=err?.type==="unavailable-id"?"That code is busy. Host again for a new code.":"Could not host. Try again.";this.toast(this.onlineStatus);this.renderLobby()});
    this.renderLobby();
  }
  promptJoinRoom(){
    this.syncLobbyUsername();
    this.dialog(`<h2>Join Room</h2><p>Paste the room code from the host.</p>
      <input class="field" id="joinCodeInput" maxlength="3" inputmode="numeric" pattern="[0-9]*" placeholder="Room code" enterkeyhint="go">
      ${this.keyboardDoneHTML()}
      <div class="row" style="margin-top:14px"><button class="primary-btn" data-confirm-join>Join Room</button><button class="ghost-btn" data-back-online>Back</button></div>`);
    document.getElementById("joinCodeInput").focus();
    document.getElementById("joinCodeInput").oninput=e=>e.target.value=e.target.value.replace(/\D/g,"").slice(0,3);
    document.getElementById("joinCodeInput").onkeydown=e=>{if(e.key==="Enter"){this.dismissKeyboard();this.joinRoom(e.target.value)}};
    document.querySelector("[data-confirm-join]").onclick=()=>this.joinRoom(document.getElementById("joinCodeInput").value);
    document.querySelector("[data-back-online]").onclick=()=>this.renderOnlineHome();
  }
  joinRoom(code){
    code=(code || "").trim().replace(/\D/g,"").slice(0,3);
    if(code.length<1) return this.toast("Enter a room code");
    if(typeof Peer==="undefined"){this.onlineStatus="Online library could not load.";return this.renderOnlineHome()}
    this.resetOnlineConnection();
    this.chatMessages=[];
    this.lobby={code,players:[{id:this.clientId,name:this.username,host:false,ready:false,connected:true}],role:"guest",status:"joining"};
    this.onlineStatus="Joining room...";
    this.renderLobby();
    this.peer=new Peer();
    this.peer.on("open",()=>{
      const conn=this.peer.connect(this.roomPeerId(code),{reliable:true});
      this.hostConn=conn;
      this.bindGuestConnection(conn);
    });
    this.peer.on("error",()=>{this.onlineStatus="Could not join. Check the code and try again.";this.toast(this.onlineStatus);this.renderLobby()});
    setTimeout(()=>{
      if(this.lobby?.role==="guest" && this.lobby.status==="joining"){
        this.onlineStatus="Room not found. Make sure the host is on the lobby screen.";
        this.toast(this.onlineStatus);
        this.renderLobby();
      }
    },5500);
  }
  syncLobbyUsername(){
    const input=document.getElementById("usernameInput");
    if(input && input.value !== undefined) this.setUsername(input.value);
    const me=this.currentLobbyPlayer();
    if(me) me.name=this.username;
  }
  setUsername(value){
    const clean=this.cleanName(value);
    this.username=clean;
    localStorage.setItem("unoUsername",clean);
  }
  cleanName(value){return (value || "").trim().slice(0,18) || "Player 1"}
  setBackendURL(value){
    this.backendURL=(value || "").trim();
    localStorage.setItem("unoBackendURL",this.backendURL);
  }
  currentLobbyPlayer(){return this.lobby?.players.find(p=>p.id===this.clientId)}
  updateLobbyPlayer(fields){
    const p=this.currentLobbyPlayer();
    if(!p) return;
    Object.assign(p,fields);
    if(this.lobby.role==="host") this.broadcastLobby();
    else this.sendToHost({type:"lobbyUpdate",playerId:this.clientId,fields});
  }
  resetOnlineConnection(){
    this.peerConnections.forEach(conn=>conn.close());
    this.peerConnections.clear();
    if(this.hostConn) this.hostConn.close();
    if(this.peer) this.peer.destroy();
    this.hostConn=null;
    this.peer=null;
  }
  roomPeerId(code){return ONLINE_PREFIX + String(code).trim()}
  sendToHost(message){
    if(this.hostConn?.open) this.hostConn.send(message);
    else this.toast("Not connected to host");
  }
  sendToGuests(message){
    this.peerConnections.forEach(conn=>{if(conn.open) conn.send(message)});
  }
  publicLobby(){
    return {...this.roomPayload(),gameState:this.lobby?.status==="started"?this.lobby.gameState:null};
  }
  broadcastLobby(){
    if(!this.lobby || this.lobby.role!=="host") return;
    this.lobby.version=(this.lobby.version || 0)+1;
    this.sendToGuests({type:"lobby",lobby:this.publicLobby()});
    if(document.getElementById("dialogLayer").classList.contains("active") && !this.shouldDeferFocusedInputRender()) this.renderLobby();
  }
  bindHostConnection(conn){
    conn.on("data",data=>this.handleHostMessage(conn,data));
    conn.on("close",()=>this.removePeerPlayer(conn._unoPlayerId));
    conn.on("error",()=>this.removePeerPlayer(conn._unoPlayerId));
  }
  handleHostMessage(conn,data){
    if(!data || !this.lobby || this.lobby.role!=="host") return;
    if(data.type==="join"){
      if(this.lobby.status==="started"){conn.send({type:"reject",reason:"Game already started"});conn.close();return}
      const existing=this.lobby.players.find(p=>p.id===data.player.id);
      if(!existing && this.lobby.players.length>=4){conn.send({type:"reject",reason:"Room is full"});conn.close();return}
      const player={id:data.player.id,name:this.cleanName(data.player.name),host:false,ready:false,connected:true};
      if(existing) Object.assign(existing,player);
      else this.lobby.players.push(player);
      conn._unoPlayerId=player.id;
      this.peerConnections.set(player.id,conn);
      this.onlineStatus=`${player.name} joined.`;
      this.broadcastLobby();
      return;
    }
    if(data.type==="lobbyUpdate"){
      const player=this.lobby.players.find(p=>p.id===data.playerId);
      if(!player || player.host) return;
      if(data.fields.name!==undefined) player.name=this.cleanName(data.fields.name);
      if(data.fields.ready!==undefined) player.ready=!!data.fields.ready;
      this.broadcastLobby();
      return;
    }
    if(data.type==="chat"){this.handleIncomingChat(data);return}
    if(data.type==="move") this.handleOnlineMove(data);
  }
  bindGuestConnection(conn){
    conn.on("open",()=>{
      conn.send({type:"join",player:{id:this.clientId,name:this.username}});
      this.onlineStatus="Connected. Waiting for lobby.";
      this.renderLobby();
    });
    conn.on("data",data=>this.handleGuestMessage(data));
    conn.on("close",()=>{this.onlineStatus="Disconnected from host.";this.toast(this.onlineStatus);this.renderOnlineHome()});
    conn.on("error",()=>{this.onlineStatus="Connection failed.";this.toast(this.onlineStatus);this.renderLobby()});
  }
  handleGuestMessage(data){
    if(!data) return;
    if(data.type==="toast"){this.toast(data.message || "Move rejected");return}
    if(data.type==="reject"){this.onlineStatus=data.reason || "Could not join room";this.toast(this.onlineStatus);this.renderOnlineHome();return}
    if(data.type==="lobby"){
      this.lobby={...data.lobby,role:"guest"};
      this.chatMessages=this.lobby.chatMessages || this.chatMessages;
      this.onlineStatus="Connected to host.";
      if(this.lobby.status==="started" && this.lobby.gameState) this.startSyncedLobbyGame();
      else if(document.getElementById("dialogLayer").classList.contains("active") && !this.shouldDeferFocusedInputRender()) this.renderLobby();
      return;
    }
    if(data.type==="gameState") this.applyOnlineGameState(data);
    if(data.type==="chat") this.addChatMessage(data.message);
  }
  removePeerPlayer(playerId){
    if(!playerId || !this.lobby || this.lobby.role!=="host" || this.lobby.status==="started") return;
    this.peerConnections.delete(playerId);
    const player=this.lobby.players.find(p=>p.id===playerId);
    if(player) this.onlineStatus=`${player.name} left.`;
    this.lobby.players=this.lobby.players.filter(p=>p.host || p.id!==playerId);
    this.broadcastLobby();
  }
  isOnlineGuest(){return this.syncedGame && this.lobby?.role==="guest"}
  isOnlineHost(){return this.syncedGame && this.lobby?.role==="host"}
  requestOnlineMove(action,fields={}){
    this.sendToHost({type:"move",action,playerId:this.clientId,...fields});
  }
  showChat(){
    if(!this.syncedGame) return this.toast("Game chat is for online games");
    const layer=this.dialog(`<h2>Game Chat</h2><div class="chat-dialog">
      <div class="chat-input-row"><input class="field" id="chatInput" maxlength="180" placeholder="Message" enterkeyhint="send" autocomplete="off"><button class="primary-btn" data-send-chat>Send</button></div>
      ${this.keyboardDoneHTML()}
      <div class="small">Press Enter to send.</div>
    </div>`);
    layer.onclick=e=>{if(e.target===layer)this.closeDialog()};
    const input=document.getElementById("chatInput");
    input.focus();
    input.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();this.sendChat(input.value);input.value=""}};
    document.querySelector("[data-send-chat]").onclick=()=>{this.sendChat(input.value);input.value="";input.focus()};
  }
  sendChat(text){
    const clean=(text || "").trim().replace(/\s+/g," ").slice(0,180);
    if(!clean) return;
    const data={type:"chat",id:uid(),playerId:this.clientId,text:clean,time:Date.now()};
    if(this.isOnlineHost()) this.handleIncomingChat(data);
    else this.sendToHost(data);
  }
  handleIncomingChat(data){
    if(!this.isOnlineHost() || !this.engine || !data?.text) return;
    const player=this.engine.players.find(p=>p.id===data.playerId);
    if(!player) return;
    const index=this.engine.players.indexOf(player);
    const message={id:data.id || uid(),playerId:player.id,name:player.name,color:PLAYER_LIGHTS[index] || "#fff",text:String(data.text).trim().slice(0,180),time:data.time || Date.now()};
    this.addChatMessage(message);
    this.sendToGuests({type:"chat",message});
  }
  addChatMessage(message){
    if(!message || this.chatMessages.some(m=>m.id===message.id)) return;
    this.chatMessages.push(message);
    this.chatMessages=this.chatMessages.slice(-30);
    if(this.lobby) this.lobby.chatMessages=this.chatMessages;
    this.renderChat();
  }
  handleOnlineMove(data){
    if(!this.isOnlineHost() || !this.engine) return;
    const player=this.engine.players.find(p=>p.id===data.playerId);
    const index=this.engine.players.indexOf(player);
    if(!player) return;
    if(data.action==="play" && (this.engine.current===index || (data.jumpIn && this.engine.canJumpIn(player.hand.find(c=>c.id===data.cardId))))){
      if(data.jumpIn && this.engine.current!==index){this.engine.current=index;this.log(`${player.name} jumped in`)}
      this.clearDrawPlayWindow();
      const result=this.engine.playCard(index,data.cardId,data.color || null);
      if(!result.ok) this.sendOne(player.id,{type:"toast",message:result.reason});
      this.afterHostOnlineMove();
    }
    if(data.action==="draw" && this.engine.current===index){
      this.clearDrawPlayWindow();
      const result=this.engine.drawForCurrent();
      if(result?.drawnCard && !result.penalty) this.startDrawPlayWindow(result.drawnCard.id,player.id);
      this.afterHostOnlineMove();
    }
    if(data.action==="uno"){
      if(this.engine.callUno(player)) this.clearUnoWindow(player.id);
      this.afterHostOnlineMove(false);
    }
    if(data.action==="challengeUno"){
      const target=this.engine.players.find(p=>p.id===data.targetId);
      if(target && target.id!==player.id) this.challengeUno(target);
      else this.afterHostOnlineMove(false);
    }
  }
  sendOne(playerId,message){
    const conn=this.peerConnections.get(playerId);
    if(conn?.open) conn.send(message);
  }
  afterHostOnlineMove(runAI=true){
    this.syncGameState();
    this.render();
    if(runAI) this.scheduleAI();
  }
  applyOnlineGameState(data){
    this.lobby={...data.lobby,role:this.lobby?.role || "guest"};
    this.chatMessages=this.lobby.chatMessages || this.chatMessages;
    const event=this.lobby.gameState?.lastEvent;
    this.startSyncedLobbyGame();
    this.playRemoteEvent(event);
  }
  playRemoteEvent(event){
    if(!event || event.id===this.seenRemoteEventId) return;
    this.seenRemoteEventId=event.id;
    let sound=event.sound;
    if(event.type==="card") sound=event.cardType===TYPES.WILD || event.cardType===TYPES.WILD4 ? "wild" : event.playerId===this.clientId ? "playSelf" : "playOther";
    if(event.type==="draw") sound=event.playerId===this.clientId ? "drawSelf" : "drawOther";
    if(sound) this.audio.play(sound);
  }
  async saveLobby(){
    if(!this.lobby?.code) return;
    this.lobby.version=(this.lobby.version || 0)+1;
    const room=this.roomPayload();
    localStorage.setItem(`unoRoom_${this.lobby.code}`,JSON.stringify(room));
    if(this.cloudEnabled()){
      try{
        await fetch(this.roomURL(this.lobby.code),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(room)});
      }catch{
        this.toast("Cloud room save failed");
      }
    }
  }
  async loadLobby(code){
    if(this.cloudEnabled()){
      try{
        const res=await fetch(this.roomURL(code));
        if(res.ok){
          const room=await res.json();
          if(room) return room;
        }
      }catch{
        this.toast("Cloud room lookup failed");
      }
    }
    try{return JSON.parse(localStorage.getItem(`unoRoom_${code}`)||"null")}catch{return null}
  }
  roomPayload(){return {code:this.lobby.code,players:this.lobby.players,status:this.lobby.status || "lobby",gameDefs:this.lobby.gameDefs || null,gameState:this.lobby.gameState || null,chatMessages:this.chatMessages,version:this.lobby.version}}
  cloudURL(){return (this.backendURL || ONLINE_BACKEND.firebaseDatabaseURL || "").trim()}
  cloudEnabled(){return /^https:\/\/.+(?:firebaseio\.com|firebasedatabase\.app)\/?$/.test(this.cloudURL())}
  roomURL(code){return `${this.cloudURL().replace(/\/$/,"")}/unoRooms/${code}.json`}
  serializeCard(card){return {id:card.id,color:card.color,type:card.type,value:card.value}}
  reviveCard(card){return new Card(card.color,card.type,card.value,card.id)}
  serializeEngine(){
    if(!this.engine) return null;
    const e=this.engine;
    return {
      settings:{...e.settings},
      players:e.players.map(p=>({id:p.id,name:p.name,isHuman:p.isHuman,difficulty:p.difficulty,host:p.host,hand:p.hand.map(c=>this.serializeCard(c)),calledUno:p.calledUno,ready:p.ready,stats:p.stats})),
      deck:e.deck.cards.map(c=>this.serializeCard(c)),
      discard:e.discard.map(c=>this.serializeCard(c)),
      current:e.current,direction:e.direction,activeColor:e.activeColor,pendingDraw:e.pendingDraw,pendingKind:e.pendingKind,lastDrawn:e.lastDrawn?this.serializeCard(e.lastDrawn):null,winnerId:e.winner?.id || null,unoCatchableId:this.unoCatchableId,drawPlayCardId:this.drawPlayCardId,drawPlayPlayerId:this.drawPlayPlayerId,lastEvent:this.lastEvent
    };
  }
  hydrateEngine(state){
    this.suppressSync=true;
    this.clearDrawPlayWindow();
    const engine=new GameEngine(state.settings || this.settings,e=>this.onEvent(e));
    engine.players=state.players.map(data=>{
      const p=new Player(data.name,data.isHuman,data.difficulty,data.host,data.id);
      p.hand=data.hand.map(c=>this.reviveCard(c));p.calledUno=data.calledUno;p.ready=data.ready;p.stats=data.stats || {drawn:0,played:0};p.sortHand();
      return p;
    });
    engine.deck=Object.create(Deck.prototype);
    engine.deck.cards=state.deck.map(c=>this.reviveCard(c));
    engine.discard=state.discard.map(c=>this.reviveCard(c));
    engine.current=state.current;engine.direction=state.direction;engine.activeColor=state.activeColor;engine.pendingDraw=state.pendingDraw;engine.pendingKind=state.pendingKind;engine.lastDrawn=state.lastDrawn?this.reviveCard(state.lastDrawn):null;engine.started=true;
    engine.winner=state.winnerId ? engine.players.find(p=>p.id===state.winnerId) : null;
    this.engine=engine;
    this.unoCatchableId=state.unoCatchableId || null;
    this.drawPlayCardId=state.drawPlayCardId || null;
    this.drawPlayPlayerId=state.drawPlayPlayerId || null;
    this.suppressSync=false;
  }
  syncGameState(){
    if(!this.syncedGame || this.suppressSync || !this.lobby?.code || !this.engine) return;
    this.lobby.status="started";
    this.lobby.gameState=this.serializeEngine();
    if(this.lobby.role==="host"){
      this.lobby.version=(this.lobby.version || 0)+1;
      this.sendToGuests({type:"gameState",lobby:this.publicLobby()});
      return;
    }
    if(this.lobby.role==="guest") return;
    this.saveLobby();
  }
  handleLobbyStorage(e){
    if(this.lobby?.role==="host" || this.lobby?.role==="guest") return;
    if(!this.lobby?.code || e.key!==`unoRoom_${this.lobby.code}` || !e.newValue) return;
    this.applyLobbyUpdate(JSON.parse(e.newValue));
  }
  async pollLobby(){
    if(this.lobby?.role==="host" || this.lobby?.role==="guest") return;
    if(!this.lobby?.code) return;
    const room=await this.loadLobby(this.lobby.code);
    if(room) this.applyLobbyUpdate(room);
  }
  applyLobbyUpdate(room){
    if(!room || room.version===(this.lobby?.version || 0)) return;
    const role=this.lobby?.role;
    this.lobby={...room,role};
    this.chatMessages=this.lobby.chatMessages || this.chatMessages;
    if(this.lobby.status==="started" && this.lobby.gameState){
      this.startSyncedLobbyGame();
      return;
    }
    if(document.getElementById("dialogLayer").classList.contains("active") && !this.shouldDeferFocusedInputRender()) this.renderLobby();
  }
  canStartLobby(){return this.lobby.players.length>0 && this.lobby.players.every(p=>p.host || p.ready)}
  askAIFill(){
    if(!this.canStartLobby()) return this.toast("All connected players must be ready");
    this.dialog(`<h2>Fill remaining seats?</h2><p>Empty seats can become AI players when the host starts.</p><div class="choice-grid">
      <button class="chip-btn" data-fill="none">No AI</button><button class="chip-btn" data-fill="easy">Easy AI</button><button class="chip-btn" data-fill="medium">Medium AI</button><button class="chip-btn" data-fill="hard">Hard AI</button>
    </div>`);
    document.querySelectorAll("[data-fill]").forEach(b=>b.onclick=()=>this.startLobbyGame(b.dataset.fill));
  }
  startLobbyGame(fill){
    this.syncLobbyUsername();
    const defs=this.lobby.players.map((p,i)=>({id:p.id,name:i===0?this.username:p.name,isHuman:true,host:p.host,difficulty:"medium"}));
    if(fill!=="none") while(defs.length<4) defs.push({id:`ai-${defs.length}-${uid()}`,name:`${this.cap(fill)} AI ${defs.length}`,isHuman:false,difficulty:fill});
    this.startGame(defs,true);
    this.lobby.status="started";
    this.lobby.gameDefs=defs;
    this.lobby.gameState=this.serializeEngine();
    this.sendToGuests({type:"gameState",lobby:this.publicLobby()});
    this.closeDialog();
  }
  startSyncedLobbyGame(){
    if(!this.lobby?.gameState) return;
    this.syncedGame=true;
    this.hydrateEngine(this.lobby.gameState);
    this.closeDialog();
    this.screen("gameScreen");
    this.render();
    if(this.engine.winner && this.shownWinnerId!==this.engine.winner.id) this.win(this.engine.winner);
    this.scheduleAI();
  }
  showSettings(){
    this.dialog(`<h2>Settings</h2><p>House rules are saved in this browser.</p><div class="stack">
      ${this.toggleHTML("stackDraw2","Stack Draw Twos","Draw Two cards can be stacked.")}
      ${this.toggleHTML("stackDraw4","Stack Draw Fours","Wild Draw Four cards can be stacked.")}
      ${this.toggleHTML("stackMixedDraw","Stack +2 and +4 Together","Draw Two and Wild Draw Four can stack together.")}
      ${this.toggleHTML("jumpIn","Jump In","Matching exact cards can be played out of turn.")}
      ${this.toggleHTML("sevenZero","Seven-Zero","Sevens swap hands, zeros rotate all hands.")}
      ${this.toggleHTML("forcePlay","Force Play","Playable drawn cards must be played before passing.")}
      ${this.toggleHTML("drawUntilPlayable","Draw Until Playable","Draw repeatedly until a playable card appears.")}
    </div><div class="row" style="margin-top:16px"><button class="primary-btn" data-save-settings>Save</button><button class="ghost-btn" data-close>Close</button></div>`);
    document.querySelector("[data-save-settings]").onclick=()=>{document.querySelectorAll("[data-setting]").forEach(i=>this.settings[i.dataset.setting]=i.checked);this.saveSettings();if(this.engine)this.engine.settings={...this.settings};this.closeDialog();this.toast("Settings saved")};
    document.querySelector("[data-close]").onclick=()=>this.closeDialog();
  }
  toggleHTML(key,title,desc){return `<label class="toggle-row"><div><strong>${title}</strong><br><span>${desc}</span></div><span class="switch"><input type="checkbox" data-setting="${key}" ${this.settings[key]?"checked":""}><span class="slider"></span></span></label>`}
  showStats(){
    this.dialog(`<h2>Stats</h2><p>Local results on this device.</p><div class="stats-grid">
      <div class="stat"><strong>${this.stats.games}</strong><span>Games</span></div><div class="stat"><strong>${this.stats.wins}</strong><span>Wins</span></div>
      <div class="stat"><strong>${this.stats.cardsPlayed}</strong><span>Cards Played</span></div><div class="stat"><strong>${Math.round(this.stats.winRate)}%</strong><span>Win Rate</span></div>
    </div><div class="row" style="margin-top:16px"><button class="danger-btn" data-reset-stats>Reset</button><button class="ghost-btn" data-close>Close</button></div>`);
    document.querySelector("[data-reset-stats]").onclick=()=>{this.stats={games:0,wins:0,cardsPlayed:0,winRate:0};this.saveStats();this.showStats()};
    document.querySelector("[data-close]").onclick=()=>this.closeDialog();
  }
  win(player){
    if(this.shownWinnerId===player.id && document.getElementById("dialogLayer").classList.contains("active")) return;
    this.shownWinnerId=player.id;
    this.stats.games++;if(player===this.localPlayer())this.stats.wins++;
    this.stats.cardsPlayed+=this.engine.players.reduce((n,p)=>n+p.stats.played,0);this.stats.winRate=this.stats.games?this.stats.wins/this.stats.games*100:0;this.saveStats();
    this.confetti();
    setTimeout(()=>this.dialog(`<h2>${player.name} Wins</h2><p>The round is complete.</p><div class="row">${this.isOnlineGuest()?"":`<button class="primary-btn" data-play-again>Play Again</button>`}<button class="ghost-btn" data-menu>Return to Main Menu</button></div>`),350);
    setTimeout(()=>{
      document.querySelector("[data-play-again]")?.addEventListener("click",()=>{const defs=this.engine.players.map((p,i)=>({id:p.id,name:p.name,isHuman:p.isHuman,difficulty:p.difficulty,host:i===0}));this.closeDialog();this.startGame(defs,this.syncedGame);this.syncGameState()});
      document.querySelector("[data-menu]")?.addEventListener("click",()=>{this.closeDialog();this.engine=null;this.screen("mainMenu")});
    },360);
  }
  confirmLeave(){this.dialog(`<h2>Leave Game?</h2><p>The current round will end.</p><div class="row"><button class="danger-btn" data-yes>Leave</button><button class="ghost-btn" data-close>Cancel</button></div>`);document.querySelector("[data-yes]").onclick=()=>{this.closeDialog();this.engine=null;this.screen("mainMenu")};document.querySelector("[data-close]").onclick=()=>this.closeDialog()}
  log(msg){const box=document.getElementById("gameLog");if(!box)return;box.insertAdjacentHTML("afterbegin",`<div>${msg}</div>`);while(box.children.length>6)box.lastElementChild.remove()}
  toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.getElementById("app").appendChild(t);setTimeout(()=>t.remove(),2000);this.audio.play("bad")}
  animateCard(id){const el=document.querySelector(`.card[data-id="${id}"]`), target=document.getElementById("discardPile");if(!el||!target)return;const a=el.getBoundingClientRect(),b=target.getBoundingClientRect(),clone=el.cloneNode(true);clone.classList.add("floating-card");clone.style.left=a.left+"px";clone.style.top=a.top+"px";clone.style.margin=0;clone.style.setProperty("--fly-transform",`translate(${b.left-a.left}px,${b.top-a.top}px) scale(1.18) rotate(8deg)`);document.body.appendChild(clone);setTimeout(()=>clone.remove(),500)}
  confetti(){for(let i=0;i<90;i++){const p=document.createElement("div");p.className="confetti";p.style.left=50+Math.random()*8-4+"vw";p.style.top="44vh";p.style.background=[COLOR_CSS.red,COLOR_CSS.yellow,COLOR_CSS.green,COLOR_CSS.blue][i%4];p.style.setProperty("--x",(Math.random()*900-450)+"px");p.style.setProperty("--y",(Math.random()*-520-80)+"px");document.body.appendChild(p);setTimeout(()=>p.remove(),1500)}this.audio.play("win")}
  loadSettings(){
    const saved = JSON.parse(localStorage.getItem("unoSettings")||"{}");
    if(localStorage.getItem("unoSettingsVersion")!=="3"){
      saved.stackDraw2 = true;
      saved.stackDraw4 = true;
      saved.stackMixedDraw = true;
      saved.jumpIn = false;
      saved.sevenZero = false;
      saved.forcePlay = false;
      saved.drawUntilPlayable = false;
      localStorage.setItem("unoSettings",JSON.stringify(saved));
      localStorage.setItem("unoSettingsVersion","3");
    }
    return {...DEFAULT_SETTINGS,...saved};
  }
  saveSettings(){localStorage.setItem("unoSettings",JSON.stringify(this.settings));localStorage.setItem("unoSettingsVersion","3")}
  loadStats(){return {games:0,wins:0,cardsPlayed:0,winRate:0,...JSON.parse(localStorage.getItem("unoStats")||"{}")}}
  saveStats(){localStorage.setItem("unoStats",JSON.stringify(this.stats))}
  loadUsername(){return (localStorage.getItem("unoUsername") || "Player 1").slice(0,18)}
  loadBackendURL(){return (localStorage.getItem("unoBackendURL") || ONLINE_BACKEND.firebaseDatabaseURL || "").trim()}
  loadClientId(){
    let id=sessionStorage.getItem("unoClientId");
    if(!id){id=uid();sessionStorage.setItem("unoClientId",id)}
    return id;
  }
  escapeHTML(value){return String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
  roomCode(){return String(Math.floor(Math.random()*1000)).padStart(3,"0")}
  async availableRoomCode(){
    for(let i=0;i<40;i++){
      const code=this.roomCode();
      if(!await this.loadLobby(code)) return code;
    }
    return this.roomCode();
  }
  cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
}

window.addEventListener("DOMContentLoaded",()=>new UnoApp());
</script>
