<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jake's Arcade Hub - Free To Play!</title>

<style>
button,[role="button"]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 25000px; 
    overflow-y: auto;
}

/* TOTAL CONTAINER */
.sidebar {
    width: 100%;
    min-height: 100vh;
    background: black;
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
}

/* TOP RIGHT ALL PROJECTS BUTTON */
.all-projects-button {
    position: absolute;
    top: 20px;
    right: 20px;

    padding: 10px 18px;
    min-height: auto;

    background: #111;
    color: cyan;
    border: 2px solid cyan;
    border-radius: 10px;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;
    transition: 0.2s;
}

.all-projects-button:hover {
    background: cyan;
    color: black;
    transform: scale(1.03);
}

.sidebar h1 {
    margin-top: 0;
    margin-bottom: 10px;
}

/* FREE TO PLAY BANNER */
.free-banner {
    text-align: center;
    padding: 12px;
    background: linear-gradient(90deg, transparent, rgba(0,255,136,0.1), transparent);
    border-bottom: 2px solid rgba(0,255,136,0.3);
    margin-bottom: 20px;
}

.free-banner h2 {
    color: #00ff88;
    font-size: 18px;
    margin: 0;
    text-shadow: 0 0 10px #00ff88;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.free-banner p {
    color: #88ccaa;
    font-size: 13px;
    margin: 5px 0 0 0;
}

/* INFINITE GRID CONTAINER */
.games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    width: 100%;
    box-sizing: border-box;
    align-content: start;
}

/* HUGE INVISIBLE SPACER */
.infinite-space-driver {
    height: 22000px; 
    width: 100%;
    pointer-events: none;
}

/* WEB GAMES SECTION AT THE DEEP BOTTOM */
.web-games-bottom {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    padding-top: 40px;
    padding-bottom: 80px;
    border-top: 2px dashed #333;
    width: 100%;
    margin-top: auto;
}

.web-games-bottom button {
    width: min(320px, 100%);
    background: #ff00ff;
    color: white;
}

.web-games-bottom button:hover {
    background: white;
    color: black;
}

/* GLOWING HEADERS */
h1 {
    color: cyan;
    text-align: center;
    text-shadow: 0 0 15px cyan;
}

/* BUTTONS */
button {
    padding: 12px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    background: cyan;
    color: black;
    cursor: pointer;
    transition: 0.2s;
    min-height: 50px;
}

button:hover {
    background: white;
    transform: scale(1.03);
}

/* SPECIAL BUTTONS */
.btn-leveldevil {
    background: #8b0000 !important;
    color: #ffcc00 !important;
}

.btn-leveldevil:hover {
    background: #cc0000 !important;
    color: white !important;
}

@media (max-width:480px) {
    .sidebar {
        padding: 14px;
    }

    .all-projects-button {
        top: 14px;
        right: 14px;
        padding: 8px 12px;
        font-size: 12px;
    }

    .games-grid {
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 8px;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="sidebar">

    <!-- ALL PROJECTS BUTTON -->
    <button
        class="all-projects-button"
        onclick="location.href='../index.html'">
        ALL PROJECTS
    </button>


    <h1>🎮 Arcade Hub</h1>

    <div class="free-banner">
        <h2>🕹️ FREE TO PLAY FOREVER 🕹️</h2>
        <p>No password required. Just pick a game and play!</p>
    </div>

    <!-- MAIN GRID CONTAINER -->
    <div class="games-grid">
        <button onclick="location.href='cps.html'">         🖱️ cps test </button>
        <button onclick="location.href='Simon.html'">       🟥 Simon Game </button>
        <button onclick="location.href='24.html'">          ❷❹ game </button>
        <button onclick="location.href='pacman.html'">      🟡 Pac-Man </button>
        <button onclick="location.href='speedcube.html'">  speed cube timer </button>
        <button onclick="location.href='15game.html'">      15 Game </button>
        <button onclick="location.href='neondash.html'">    ⚡ Neon Dash </button>
        <button onclick="location.href='pianotiles.html'">  🎵 Neon Piano Tiles </button>
        <button onclick="location.href='Snake.html'">       🐍 Snake </button>
        <button onclick="location.href='connect4.html'">    🔴 Connect 4 </button>
        <button onclick="location.href='connectpips.html'"> 🔧 Connect Pipes </button>
        <button onclick="location.href='breakout.html'">    🧱 Breakout </button>
        <button onclick="location.href='blockblast.html'">  🟦 Block Blast </button>
        <button onclick="location.href='fruitninja.html'">  🍉 Fruit Slice </button>
        <button onclick="location.href='balloon.html'">     🎈 Balloon Pop </button>
        <button onclick="location.href='floorislava.html'"> 🌋 Floor Is Lava </button>
        <button onclick="location.href='jetpackcave.html'"> 🚀 Jetpack Cave </button>
        <button onclick="location.href='crossyroad.html'">  🚗 crossy road </button>
        <button onclick="location.href='frogger.html'">     🐸 Frogger </button>
        <button onclick="location.href='flappybird.html'">  🐤 Flappy Bird </button>
        <button onclick="location.href='doodlejump.html'">  🛸 Doodle Jump </button>
        <button onclick="location.href='stacktower.html'">  🏗️ Stack Tower </button>
        <button onclick="location.href='memory.html'">      🃏 Memory </button>
        <button onclick="location.href='uno.html'">         🔴 UNO </button>
        <button onclick="location.href='slap.html'">        🃏 Slap </button>
        <button onclick="location.href='mole.html'">        🔨 Whack-a-Mole </button>
        <button onclick="location.href='hangman.html'">     🔤 Hangman </button>
        <button onclick="location.href='tictactoe.html'">   ⭕ Tic-Tac-Toe </button>
        <button onclick="location.href='2048.html'">        🧩 2048 </button>
        <button onclick="location.href='minesweeper.html'"> 💣 Minesweeper </button>
        <button onclick="location.href='Caro.html'">        ⭕ Caro </button>
        <button onclick="location.href='checkers.html'">    🔴 Checkers </button>
        <button onclick="location.href='chess.html'">       ♟️ Chess </button>
        <button class="btn-leveldevil" onclick="location.href='LevelDevil/index.html'">  🥷 Level Devil </button>
    </div>

    <!-- THIS MAKES THE PAGE CRAZY LONG -->
    <div class="infinite-space-driver"></div>

    <!-- WEB GAMES LOCATED AT THE EXTREME BOTTOM -->
    <div class="web-games-bottom">
        <button onclick="location.href='gulper.io.html'">🌐 Gulper.io</button>
        <button onclick="location.href='paper.io.html'">📄 paper.io</button>
    </div>

</div>

</body>
</html>
