<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Balloon Pop Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
        }

        /* Nav Button Style */
        .hub-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 10px 18px;
            background-color: #ff4757;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            font-size: 14px;
            z-index: 10;
            transition: transform 0.1s;
        }
        .hub-btn:active {
            transform: scale(0.95);
        }

        /* Overlay Screens */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            z-index: 5;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #fff;
            text-shadow: 0 4px 8px rgba(0,0,0,0.4);
            text-align: center;
        }

        .menu-btn {
            width: 220px;
            padding: 15px 25px;
            margin: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        .menu-btn:active {
            transform: scale(0.95);
        }

        .pop-btn { background: #2ed573; color: white; }

        .hidden {
            display: none !important;
        }

        .game-text {
            position: absolute;
            left: 0;
            right: 0;
            text-align: center;
            pointer-events: none;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            font-family: sans-serif;
        }
        #score-display { top: 15px; font-size: 24px; color: #333; }
        #lives-display { top: 15px; left: 15px; right: auto; font-size: 20px; color: #d63031; }
    </style>
</head>
<body>

    <!-- Top Right Hub Navigation -->
    <a href="index.html" class="hub-btn">Back to Hub</a>

    <!-- UI Overlay Displays -->
    <div id="lives-display" class="game-text hidden">Lives: 3</div>
    <div id="score-display" class="game-text hidden">Score: 0</div>

    <!-- Main Menu / Game Over Screen -->
    <div id="menu-screen" class="overlay">
        <h1 id="menu-title">Balloon Pop!</h1>
        <button class="menu-btn pop-btn" onclick="startGame()">Start Game</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const menuScreen = document.getElementById('menu-screen');
        const menuTitle = document.getElementById('menu-title');
        const scoreDisplay = document.getElementById('score-display');
        const livesDisplay = document.getElementById('lives-display');

        // Game Configuration & State
        let isPlaying = false;
        let score = 0;
        let lives = 3;
        let balloons = [];
        let baseSpeed = 1.0; 
        
        const START_SPEED = 1.0;
        const MAX_SPEED = 3.8;      // Balanced speed cap reached at 13 score
        const MAX_BALLOONS = 13;     // Total balloon quantity cap

        const colors = [
            { name: 'Red', hex: '#ff4757' },
            { name: 'Blue', hex: '#1e90ff' },
            { name: 'Green', hex: '#2ed573' },
            { name: 'Yellow', hex: '#ffa502' },
            { name: 'Purple', hex: '#9b59b6' },
            { name: 'Orange', hex: '#ff7f50' }
        ];

        // Match physical layout bounds
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Balloon {
            constructor(isInitial = false) {
                this.radius = Math.random() * 15 + 25; // Size between 25 and 40
                this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
                // Stagger starting positions if it's the game start
                this.y = isInitial ? Math.random() * canvas.height * 0.7 + canvas.height * 0.1 : canvas.height + this.radius + Math.random() * 100;
                
                const colorObj = colors[Math.floor(Math.random() * colors.length)];
                this.color = colorObj.hex;
                
                // Scale individual balloon speeds slightly past the current baseline speed config
                this.speed = baseSpeed + Math.random() * 0.3;
                
                this.swaySpeed = Math.random() * 0.02 + 0.01;
                this.swayRange = Math.random() * 2 + 1;
                this.wobble = Math.random() * 100;
            }

            update() {
                this.y -= this.speed;
                this.wobble += this.swaySpeed;
                this.x += Math.sin(this.wobble) * this.swayRange * 0.3;

                // If balloon flies past the screen top undetected
                if (this.y < -this.radius) {
                    lives--;
                    livesDisplay.textContent = "Lives: " + lives; // Dynamically decrement lives display text layout
                    
                    if (lives <= 0) {
                        gameOver();
                    } else {
                        this.replace();
                    }
                }
            }

            draw() {
                ctx.save();
                // Balloon body string
                ctx.beginPath();
                ctx.moveTo(this.x, this.y + this.radius);
                ctx.lineTo(this.x, this.y + this.radius + 15);
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Balloon Main Body
                ctx.beginPath();
                ctx.ellipse(this.x, this.y, this.radius * 0.85, this.radius, 0, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();

                // Bottom knot
                ctx.beginPath();
                ctx.moveTo(this.x, this.y + this.radius);
                ctx.lineTo(this.x - 5, this.y + this.radius + 5);
                ctx.lineTo(this.x + 5, this.y + this.radius + 5);
                ctx.closePath();
                ctx.fillStyle = this.color;
                ctx.fill();

                // Shiny Highlight spot
                ctx.beginPath();
                ctx.ellipse(this.x - this.radius * 0.3, this.y - this.radius * 0.4, this.radius * 0.2, this.radius * 0.3, Math.PI / 4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fill();
                ctx.restore();
            }

            replace() {
                const index = balloons.indexOf(this);
                if (index !== -1) {
                    balloons[index] = new Balloon(false);
                }
            }
        }

        function startGame() {
            isPlaying = true;
            score = 0;
            lives = 3;
            baseSpeed = START_SPEED; // Initial slow start speed
            balloons = [];

            // UI Adjustments
            menuScreen.classList.add('hidden');
            scoreDisplay.classList.remove('hidden');
            livesDisplay.classList.remove('hidden');
            scoreDisplay.textContent = "Score: " + score;
            livesDisplay.textContent = "Lives: " + lives;

            // Start small: Spawn exactly 2 balloons at beginner pace
            for (let i = 0; i < 2; i++) {
                balloons.push(new Balloon(true));
            }
        }

        function gameOver() {
            isPlaying = false;
            menuScreen.classList.remove('hidden');
            menuTitle.innerHTML = `Game Over!<br><span style="font-size:1.5rem;">Final Score: ${score}</span>`;
        }

        // Consolidated Core Event Handlers for Mobile Taps and Clicks
        function handleInput(clientX, clientY) {
            if (!isPlaying) return;

            // Loop backward so top visual balloons are processed first
            for (let i = balloons.length - 1; i >= 0; i--) {
                const b = balloons[i];
                const dist = Math.hypot(clientX - b.x, clientY - b.y);

                // Check distance against clickable boundary radius
                if (dist < b.radius + 15) {
                    b.replace();
                    score++;
                    scoreDisplay.textContent = "Score: " + score;
                    
                    // Linear scale speed up to 13 score, then stay totally locked at MAX_SPEED
                    if (score <= 13) {
                        baseSpeed = START_SPEED + ((MAX_SPEED - START_SPEED) * (score / 13));
                        
                        // Gentle spawn scaling: Adds 1 balloon every 3 pops up to max 13 balloons
                        if (score % 3 === 0 && balloons.length < MAX_BALLOONS) {
                            balloons.push(new Balloon(false));
                        }
                    }
                    // Beyond score 13, speed and balloon count are completely locked. Only the score increments.
                    break; 
                }
            }
        }

        // Mobile Touch Engine Binding
        window.addEventListener('touchstart', (e) => {
            if (e.changedTouches.length > 0) {
                const touch = e.changedTouches[0];
                handleInput(touch.clientX, touch.clientY);
            }
        }, { passive: true });

        // Desktop Fallback Binding
        window.addEventListener('mousedown', (e) => {
            handleInput(e.clientX, e.clientY);
        });

        // Core Game Engine Loop Animation
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isPlaying) {
                balloons.forEach(balloon => {
                    balloon.update();
                    balloon.draw();
                });
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
<a href="../TeamChat/index.html" title="Team chat" style="position:fixed;right:14px;bottom:14px;z-index:99999;display:inline-block;background:#00ff88;color:#06130c;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:800;letter-spacing:.6px;text-decoration:none;padding:11px 16px;border-radius:99px;box-shadow:0 4px 20px rgba(0,255,136,.45)">TEAMCHAT</a>
</body>
</html>
