<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Connect 4</title>
<style>
button,[role="button"]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#101820;color:#f8fbff;font-family:Arial,sans-serif;overflow:hidden}
body{display:flex;justify-content:center}#app{width:min(100vw,860px);height:100vh;display:grid;grid-template-rows:auto auto auto 1fr;padding:8px;gap:7px}
header{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}h1{margin:0;color:#38bdf8;font-size:25px}.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.stat{background:#1c2d3e;border:1px solid #33506c;border-radius:7px;padding:5px 8px;text-align:center}.stat strong{display:block;font-size:17px}.stat span{font-size:10px;color:#bfd0e5}
button{border:0;border-radius:7px;background:#38bdf8;color:#07131d;font-weight:900;min-height:32px;padding:6px 12px;cursor:pointer}button.active{background:#facc15}button:hover{filter:brightness(1.08)}
#sideBtns{display:flex;flex-direction:column;gap:6px;align-items:flex-end}#back{background:cyan;color:#001018}#pvp{background:#a78bfa;color:#160f32}#colorsBtn{background:#34d399;color:#052e1d}
#controls{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}#status{background:#1c2d3e;border:1px solid #33506c;border-radius:7px;min-height:32px;padding:7px;text-align:center;font-weight:900}.playerDot{width:15px;height:15px;border-radius:50%;display:inline-block;background:var(--piece);vertical-align:-2px;border:2px solid rgba(255,255,255,.5)}
#wrap{display:flex;align-items:center;justify-content:center;min-height:0}.board{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);gap:min(1vw,7px);width:min(96vw,calc(100vh - 166px),730px);aspect-ratio:7/6;background:#1261b8;border:5px solid #073b73;border-radius:8px;padding:min(1.5vw,10px);box-shadow:0 14px 34px rgba(0,0,0,.38)}
.cell{border-radius:50%;background:#081820;border:3px solid #073b73;display:grid;place-items:center;padding:0}.disc{width:82%;height:82%;border-radius:50%;background:var(--piece);box-shadow:inset 0 -8px 14px rgba(0,0,0,.35),inset 0 5px 10px rgba(255,255,255,.2),0 4px 9px rgba(0,0,0,.35)}
#colorModal{position:fixed;inset:0;background:rgba(4,8,13,.75);display:none;align-items:center;justify-content:center;padding:14px;z-index:5}#colorModal.open{display:flex}#colorPanel{width:min(92vw,370px);background:#1c2d3e;border:1px solid #456886;border-radius:8px;padding:16px}#colorPanel h2{margin:0 0 12px}.colorRow{display:grid;grid-template-columns:82px 1fr;gap:9px;align-items:center;margin:10px 0}.swatches{display:flex;gap:7px;flex-wrap:wrap}.swatch{width:30px;min-width:30px;height:30px;min-height:30px;border-radius:50%;background:var(--swatch);border:3px solid var(--swatch);box-shadow:0 0 0 2px rgba(255,255,255,.55);padding:0}.swatch.active{outline:3px solid var(--swatch);outline-offset:3px}.err{min-height:18px;color:#fecaca;font-size:13px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.secondary{background:#64748b;color:#fff}
@media(max-width:560px){#app{gap:5px;padding:6px}h1{font-size:20px}.stat{padding:4px 6px}.stat strong{font-size:14px}button{font-size:12px;padding:5px 8px;min-height:28px}.board{width:min(98vw,calc(100vh - 150px))}header{gap:5px}}
</style>
</head>
<body>
<main id="app">
<header><div><h1>Connect 4</h1><button id="newGame">New Game</button></div><div class="stats"><div class="stat"><strong id="wins">0</strong><span>Wins</span></div><div class="stat"><strong id="total">0</strong><span>Total</span></div><div class="stat"><strong id="streak">0</strong><span>Streak</span></div></div><div id="sideBtns"><button id="back">Back to Hub</button><button id="pvp">PvP</button><button id="colorsBtn">Colors</button></div></header>
<div id="controls"><button class="active" data-diff="easy">Easy</button><button data-diff="medium">Medium</button><button data-diff="hard">Hard</button></div>
<div id="status">Press New Game to start</div>
<section id="wrap"><div id="board" class="board"></div></section>
</main>
<div id="colorModal"><div id="colorPanel"><h2>Colors</h2><div class="colorRow"><strong>You:</strong><div id="p1Colors" class="swatches"></div></div><div class="colorRow"><strong>Other:</strong><div id="p2Colors" class="swatches"></div></div><div id="colorError" class="err"></div><div class="actions"><button id="cancelColors" class="secondary">Cancel</button><button id="saveColors">Save</button></div></div></div>
<script>
const ROWS=6,COLS=7,EMPTY=0,P1=1,P2=2,boardEl=document.getElementById('board'),statusEl=document.getElementById('status'),winsEl=document.getElementById('wins'),totalEl=document.getElementById('total'),streakEl=document.getElementById('streak'),pvpBtn=document.getElementById('pvp'),newGameBtn=document.getElementById('newGame'),backBtn=document.getElementById('back'),colorsBtn=document.getElementById('colorsBtn'),colorModal=document.getElementById('colorModal'),p1Colors=document.getElementById('p1Colors'),p2Colors=document.getElementById('p2Colors'),colorError=document.getElementById('colorError'),cancelColorsBtn=document.getElementById('cancelColors'),saveColorsBtn=document.getElementById('saveColors');
const colors=[['Red','#ef4444'],['Yellow','#facc15'],['Blue','#2563eb'],['Green','#22c55e'],['Purple','#a855f7'],['Orange','#f97316'],['Pink','#ec4899'],['Cyan','#06b6d4'],['White','#f8fafc'],['Black','#111827'],['Teal','#14b8a6'],['Gray','#64748b']];
let grid=[],turn=P1,game=false,pvp=false,diff='easy',selectedCol=3,stats=JSON.parse(localStorage.connect4_stats||'{"wins":0,"total":0,"streak":0}'),pieceColors=loadColors(),draft={...pieceColors},audioCtx;
function audio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(f,d,t='triangle',v=.07,delay=0,end){const a=audio(),o=a.createOscillator(),g=a.createGain(),s=a.currentTime+delay;o.type=t;o.frequency.setValueAtTime(f,s);if(end)o.frequency.exponentialRampToValueAtTime(end,s+d);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d)}
function dropSound(){tone(220,.08,'triangle',.06,0,150)}function winSound(){[392,523,659,784].forEach((f,i)=>tone(f,.13,'triangle',.07,i*.08))}function loseSound(){tone(220,.18,'sawtooth',.06,0,120);tone(110,.24,'sine',.07,.12,70)}
function loadColors(){try{const s=JSON.parse(localStorage.connect4_colors||'{}');if(s.p1&&s.p2&&s.p1!==s.p2)return s}catch(e){}return{p1:'#ef4444',p2:'#facc15'}}
function savePieceColors(){localStorage.connect4_colors=JSON.stringify(pieceColors)}function saveStats(){localStorage.connect4_stats=JSON.stringify(stats);winsEl.textContent=stats.wins;totalEl.textContent=stats.total;streakEl.textContent=stats.streak}
function makeBoard(){boardEl.innerHTML='';for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const cell=document.createElement('button');cell.className='cell';cell.onclick=()=>play(c);boardEl.appendChild(cell)}}
function newGame(){grid=Array.from({length:ROWS},()=>Array(COLS).fill(EMPTY));turn=P1;game=true;selectedCol=3;render();status('Your turn');}
function status(s){statusEl.innerHTML=s+' <span class="playerDot" style="--piece:'+(turn===P1?pieceColors.p1:pieceColors.p2)+'"></span>'}
function render(){[...boardEl.children].forEach((cell,i)=>{const r=Math.floor(i/COLS),c=i%COLS,v=grid[r][c];cell.innerHTML=v?'<span class="disc" style="--piece:'+(v===P1?pieceColors.p1:pieceColors.p2)+'"></span>':''})}
function rowFor(c,b=grid){for(let r=ROWS-1;r>=0;r--)if(!b[r][c])return r;return-1}
function play(c){if(!game||(!pvp&&turn===P2))return;const r=rowFor(c);if(r<0)return;grid[r][c]=turn;dropSound();afterMove(r,c)}
function afterMove(r,c){render();const w=winner(grid);if(w||full(grid)){end(w);return}turn=turn===P1?P2:P1;status(pvp?(turn===P1?'Player 1 turn':'Player 2 turn'):'AI thinking...');if(!pvp&&turn===P2)setTimeout(aiMove,260)}
function end(w){game=false;stats.total++;if(w===P1){stats.wins++;stats.streak++;winSound();statusEl.textContent=pvp?'Player 1 wins!':'You win!'}else if(w===P2){stats.streak=0;pvp?winSound():loseSound();statusEl.textContent=pvp?'Player 2 wins!':'AI wins!'}else{stats.streak=0;statusEl.textContent='Draw!'}saveStats()}
function full(b){return b[0].every(Boolean)}
function winner(b){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const v=b[r][c];if(!v)continue;for(const[dr,dc]of[[1,0],[0,1],[1,1],[1,-1]]){let n=1;for(let k=1;k<4;k++){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>=ROWS||cc<0||cc>=COLS||b[rr][cc]!==v)break;n++}if(n>=4)return v}}return 0}
function legal(b=grid){return Array.from({length:COLS},(_,c)=>c).filter(c=>rowFor(c,b)>=0)}
function copy(b){return b.map(r=>r.slice())}function put(b,c,p){const r=rowFor(c,b);if(r>=0)b[r][c]=p;return r}
function aiMove(){if(!game)return;let c=chooseAi();const r=put(grid,c,P2);dropSound();afterMove(r,c)}
function chooseAi(){const moves=legal();if(diff==='easy')return moves[Math.floor(Math.random()*moves.length)];for(const c of moves){const b=copy(grid);put(b,c,P2);if(winner(b)===P2)return c}for(const c of moves){const b=copy(grid);put(b,c,P1);if(winner(b)===P1)return c}if(diff==='medium')return moves.sort((a,b)=>Math.abs(a-3)-Math.abs(b-3))[0];let best=moves[0],score=-1e9;for(const c of moves){const b=copy(grid);put(b,c,P2);let s=scoreBoard(b);s-=Math.abs(c-3)*2;if(s>score){score=s;best=c}}return best}
function scoreBoard(b){let s=0;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)for(const[dr,dc]of[[1,0],[0,1],[1,1],[1,-1]]){let a=0,h=0,ok=true;for(let k=0;k<4;k++){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>=ROWS||cc<0||cc>=COLS){ok=false;break}if(b[rr][cc]===P2)a++;if(b[rr][cc]===P1)h++}if(ok&&!h)s+=a*a*a;if(ok&&!a)s-=h*h*h*1.3}return s}
function makeSwatches(el,key){el.innerHTML='';colors.forEach(([name,val])=>{const b=document.createElement('button');b.className='swatch';b.title=name;b.style.setProperty('--swatch',val);b.onclick=()=>{draft[key]=val;paintSwatches()};el.appendChild(b)})}
function paintSwatches(){[...p1Colors.children].forEach((b,i)=>b.classList.toggle('active',colors[i][1]===draft.p1));[...p2Colors.children].forEach((b,i)=>b.classList.toggle('active',colors[i][1]===draft.p2))}
colorsBtn.onclick=()=>{draft={...pieceColors};colorError.textContent='';paintSwatches();colorModal.classList.add('open')};cancelColorsBtn.onclick=()=>colorModal.classList.remove('open');saveColorsBtn.onclick=()=>{if(draft.p1===draft.p2){colorError.textContent='Players cannot be the same color.';return}pieceColors={...draft};savePieceColors();render();colorModal.classList.remove('open')};colorModal.onclick=e=>{if(e.target===colorModal)colorModal.classList.remove('open')};
document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{diff=b.dataset.diff;pvp=false;document.querySelectorAll('[data-diff]').forEach(x=>x.classList.toggle('active',x===b));pvpBtn.textContent='PvP';game=false;statusEl.textContent='Press New Game to start'});pvpBtn.onclick=()=>{pvp=!pvp;pvpBtn.textContent=pvp?'AI Mode':'PvP';game=false;statusEl.textContent='Press New Game to start'};newGameBtn.onclick=newGame;backBtn.onclick=()=>location.href='index.html';
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')selectedCol=Math.max(0,selectedCol-1);if(e.key==='ArrowRight')selectedCol=Math.min(COLS-1,selectedCol+1);if(e.key==='Enter'||e.key===' ')play(selectedCol)});
makeSwatches(p1Colors,'p1');makeSwatches(p2Colors,'p2');makeBoard();grid=Array.from({length:ROWS},()=>Array(COLS).fill(EMPTY));saveStats();render();
</script>
<a href="../TeamChat/index.html" title="Team chat" style="position:fixed;right:14px;bottom:14px;z-index:99999;display:inline-block;background:#00ff88;color:#06130c;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:800;letter-spacing:.6px;text-decoration:none;padding:11px 16px;border-radius:99px;box-shadow:0 4px 20px rgba(0,255,136,.45)">TEAMCHAT</a>
</body>
</html>
