name = "bluechat-api"
main = "worker.js"
compatibility_date = "2024-01-01"

# Reuses the existing shared-store KV namespace from the main site.
# Namespace ID: d726fc2081e044f7b7ed1bc7b9b9d543
# Binding: SHARED_KV
[[kv_namespaces]]
binding = "SHARED_KV"
id = "d726fc2081e044f7b7ed1bc7b9b9d543"

# Durable Object for realtime WebSocket fan-out
[[durable_objects]]
bindings = [{ name = "ChatRoom", class_name = "ChatRoom" }]