<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07110b">
    <title>Zoo</title>

    <style>
        /* =====================================================
           RESET
        ===================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #060a07;
            color: white;
            line-height: 1.6;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        :root {
            --green: #00ff88;
            --green-dark: #00c96b;
            --green-glow: rgba(0, 255, 136, 0.25);
            --black: #060a07;
            --dark: #0a120c;
            --card: #0e1710;
            --border: #1d2a20;
            --gray: #9aa79e;
        }

        /* =====================================================
           HEADER (floating, always visible)
        ===================================================== */
        .site-header {
            position: fixed;
            top: 12px;
            left: 0;
            right: 0;
            z-index: 9999;
            padding: 0 16px;
            pointer-events: none;
        }

        .header-inner {
            max-width: 1320px;
            margin: auto;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;

            background: rgba(10, 18, 12, 0.88);
            border: 1px solid var(--border);
            border-radius: 999px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55), 0 0 18px rgba(0, 255, 136, 0.06);
            backdrop-filter: blur(14px);

            pointer-events: auto;
        }

        /* ---- Language toggle: Th | En ---- */
        .lang-toggle {
            display: flex;
            align-items: center;
            gap: 0;
            background: var(--dark);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 4px;
            overflow: hidden;
            flex-shrink: 0;
            user-select: none;
        }

        .lang-toggle .opt {
            padding: 5px 14px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--gray);
            transition: 0.25s;
            cursor: pointer;
        }

        .lang-toggle .pipe {
            color: #3a4a3f;
            font-weight: 900;
            font-size: 14px;
            pointer-events: none;
        }

        .lang-toggle .opt.active {
            color: #02130a;
            background: var(--green);
            box-shadow: 0 0 12px var(--green), 0 0 26px var(--green-glow);
        }

        /* ---- Logo ---- */
        .logo {
            color: white;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .logo span {
            color: var(--green);
            text-shadow: 0 0 10px var(--green), 0 0 24px var(--green-glow);
        }

        /* ---- All projects button (pushed right) ---- */
        .all-projects {
            margin-left: auto;
            color: var(--green);
            border: 1px solid var(--green);
            border-radius: 999px;
            padding: 9px 20px;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1px;
            white-space: nowrap;
            transition: 0.2s;
        }

        .all-projects:hover {
            background: var(--green);
            color: #02130a;
            box-shadow: 0 0 18px var(--green-glow);
        }

        /* =====================================================
           HERO (full screen)
        ===================================================== */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 24px;
            background:
                linear-gradient(180deg, rgba(6, 10, 7, 0.72), rgba(6, 10, 7, 0.88)),
                url('pictures/1.jpg') center / cover no-repeat;
        }

        .hero-inner {
            max-width: 900px;
            z-index: 1;
        }

        .hero .eyebrow {
            display: inline-block;
            color: var(--green);
            border: 1px solid var(--green);
            border-radius: 999px;
            padding: 6px 18px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 26px;
            text-transform: uppercase;
        }

        .hero h1 {
            font-size: clamp(42px, 8vw, 96px);
            font-weight: 900;
            line-height: 1.05;
            margin-bottom: 18px;
        }

        .hero h1 span {
            color: var(--green);
            text-shadow: 0 0 18px var(--green), 0 0 40px var(--green-glow);
        }

        .hero p {
            color: #cfd9d2;
            font-size: clamp(16px, 2.4vw, 20px);
            max-width: 640px;
            margin: 0 auto 36px;
        }

        .hero .open-zoo {
            display: inline-block;
            background: var(--green);
            color: #02130a;
            font-size: clamp(18px, 3vw, 24px);
            font-weight: 900;
            letter-spacing: 3px;
            padding: 18px 46px;
            border-radius: 999px;
            border: none;
            transition: 0.2s;
            box-shadow: 0 0 24px var(--green-glow);
        }

        .hero .open-zoo:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 34px var(--green), 0 0 60px var(--green-glow);
        }

        .hero .scroll-hint {
            margin-top: 46px;
            color: #6b786f;
            font-size: 13px;
            letter-spacing: 2px;
        }

        /* =====================================================
           GALLERY
        ===================================================== */
        .gallery-section {
            max-width: 1450px;
            margin: auto;
            padding: 60px 24px 20px;
        }

        .gallery-title {
            text-align: center;
            font-size: clamp(28px, 5vw, 44px);
            font-weight: 900;
            margin-bottom: 8px;
        }

        .gallery-title span {
            color: var(--green);
        }

        .gallery-hint {
            text-align: center;
            color: var(--gray);
            margin-bottom: 40px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 22px;
            align-items: start;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: 0.25s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--green);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55), 0 0 20px var(--green-glow);
        }

        .card .photo-wrap {
            background: #0a120c;
        }

        .card .photo-wrap img {
            width: 100%;
            height: auto;
            display: block;
            transition: 0.4s;
        }

        .card .card-body {
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .card .card-title {
            font-size: 17px;
            font-weight: 800;
        }

        .card .card-num {
            color: var(--green);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .card .info-btn {
            margin-top: 4px;
            background: transparent;
            border: 1px solid var(--green);
            color: var(--green);
            border-radius: 999px;
            padding: 7px 18px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        .card .info-btn:hover {
            background: var(--green);
            color: #02130a;
            box-shadow: 0 0 14px var(--green-glow);
        }

        /* Empty slot placeholder (photo not added yet) */
        .photo-wrap.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #2a3a2f;
            background: var(--dark);
        }

        .photo-wrap.empty .empty-box {
            text-align: center;
            color: #4f5a52;
        }

        .photo-wrap.empty .empty-num {
            font-size: 44px;
            font-weight: 900;
            color: #2f3d33;
            line-height: 1;
        }

        .photo-wrap.empty .empty-plus {
            font-size: 18px;
            font-weight: 800;
            color: var(--green);
            opacity: 0.6;
            margin-top: 6px;
        }

        .modal-img.hidden {
            display: none;
        }

        /* =====================================================
           INFO MODAL
        ===================================================== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10000;
            backdrop-filter: blur(6px);
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: var(--dark);
            border: 1px solid var(--green);
            border-radius: 20px;
            width: 100%;
            max-width: 560px;
            max-height: 88vh;
            overflow-y: auto;
            padding: 26px;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.18), 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .modal .modal-img {
            width: 100%;
            max-height: 60vh;
            object-fit: contain;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .modal h3 {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 4px;
        }

        .modal .modal-tag {
            color: var(--green);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 14px;
        }

        .modal ul {
            list-style: none;
            margin-bottom: 22px;
        }

        .modal ul li {
            display: flex;
            gap: 12px;
            margin-bottom: 14px;
            align-items: flex-start;
            color: #d5ded8;
            font-size: 15px;
            line-height: 1.55;
        }

        .modal ul li::before {
            content: "•";
            color: var(--green);
            font-weight: 900;
            flex-shrink: 0;
        }

        .modal .close-btn {
            width: 100%;
            background: var(--green);
            color: #02130a;
            border: none;
            border-radius: 999px;
            padding: 13px;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 2px;
            transition: 0.2s;
        }

        .modal .close-btn:hover {
            box-shadow: 0 0 18px var(--green-glow);
        }

        /* =====================================================
           FOOTER
        ===================================================== */
        footer {
            text-align: center;
            padding: 40px 24px;
            color: #4f5a52;
            border-top: 1px solid var(--border);
            margin-top: 50px;
            font-size: 14px;
        }

        /* =====================================================
           MOBILE
        ===================================================== */
        @media (max-width: 700px) {
            .site-header {
                top: 8px;
                padding: 0 10px;
            }

            .header-inner {
                padding: 10px 14px;
                gap: 10px;
                flex-wrap: wrap;
                border-radius: 18px;
            }

            .logo {
                font-size: 21px;
            }

            .lang-toggle .opt {
                padding: 5px 10px;
                font-size: 13px;
            }

            .all-projects {
                padding: 8px 14px;
                font-size: 13px;
            }

            .hero {
                min-height: 100vh;
                padding: 44px 18px;
            }

            .hero .open-zoo {
                padding: 15px 34px;
            }

            .gallery-section {
                padding: 40px 14px 10px;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .card .card-body {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
                padding: 12px;
            }

            .card .info-btn {
                width: 100%;
            }

            .modal {
                padding: 20px;
            }
        }

        @media (max-width: 380px) {
            .header-inner {
                justify-content: center;
            }

            .all-projects {
                width: 100%;
                text-align: center;
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

    <!-- ===================== HEADER ===================== -->
    <header class="site-header">
        <div class="header-inner">

            <!-- Language toggle Th | En -->
            <div class="lang-toggle" id="lang-toggle" role="button" aria-label="Switch language">
                <span class="opt" id="lang-th">Th</span>
                <span class="pipe">|</span>
                <span class="opt" id="lang-en">En</span>
            </div>

            <!-- Logo -->
            <div class="logo">
                <span data-i18n="logo">Zoo</span>
            </div>

            <!-- All projects -->
            <a class="all-projects" data-i18n="allProjects" href="../index.html">
                All Projects
            </a>
        </div>
    </header>

    <!-- ===================== HERO ===================== -->
    <section class="hero">
        <div class="hero-inner">
            <span class="eyebrow" data-i18n="eyebrow">Welcome</span>
            <h1 data-i18n="heroTitle">Pictures of the Zoo</h1>
            <p data-i18n="heroSub">
                Tap OPEN ZOO, then press INFO on any picture to learn something fun.
            </p>
            <button class="open-zoo" data-i18n="openZoo" id="open-zoo-btn">
                OPEN ZOO
            </button>
            <div class="scroll-hint" data-i18n="scrollHint">scroll down</div>
        </div>
    </section>

    <!-- ===================== GALLERY ===================== -->
    <section class="gallery-section" id="gallery">
        <h2 class="gallery-title" data-i18n="galleryTitle">The <span>Pictures</span></h2>
        <p class="gallery-hint" data-i18n="galleryHint">Press INFO on a picture to hear about it.</p>

        <div class="gallery" id="gallery-grid">
            <!-- cards are built by JS -->
        </div>
    </section>

    <!-- ===================== INFO MODAL ===================== -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <img class="modal-img" id="modal-img" src="" alt="Zoo photo">
            <h3 id="modal-title">Zoo Snapshot</h3>
            <div class="modal-tag" id="modal-tag" data-i18n="didYouKnow">DID YOU KNOW?</div>
            <ul id="modal-facts"></ul>
            <button class="close-btn" data-i18n="close" id="modal-close">CLOSE</button>
        </div>
    </div>

    <!-- ===================== FOOTER ===================== -->
    <footer data-i18n="footer">
        Zoo Project • Made by Jake
    </footer>

    <script>
        /* =====================================================
           THE ZOO PICTURES + FUN FACTS
        ===================================================== */
        /* =====================================================
           THE PICTURES INSIDE THE pictures/ FOLDER
           (I add each new picture here when you put it in)
        ===================================================== */
        const ALL_PICTURES = [
            "pictures/1.jpg",
            "pictures/2.jpg",
            "pictures/3.jpg",
            "pictures/4.jpg",
            "pictures/5.jpg",
            "pictures/6.jpg",
            "pictures/7.jpg",
            "pictures/8.jpg",
            "pictures/9.jpg",
            "pictures/10.jpg"
        ];

        // Picture number -> animal. (You told me: 1-4 deer, 5-7 capybara,
        // 8 horse, 9 koala, 10 the zoo map.)
        const SLOT_ANIMALS = {
            1: "deer", 2: "deer", 3: "deer", 4: "deer",
            5: "capybara", 6: "capybara", 7: "capybara",
            8: "horse",
            9: "koala",
            10: "map"
        };

        // Facts + names are picked automatically from the file name.
        const ZOO_NAMES = {
            deer:     { en: "Deer", th: "กวาง" },
            capybara: { en: "Capybara", th: "คาปิบารา" },
            horse:    { en: "Horse", th: "ม้า" },
            koala:    { en: "Koala", th: "โคอาลา" },
            map:      { en: "Zoo Map", th: "แผนที่สวนสัตว์" }
        };

        const ZOO_FACTS = {
            deer: {
                en: [
                    "Deer can run really fast to escape from danger.",
                    "A baby deer is called a fawn.",
                    "Male deer grow brand-new antlers every single year."
                ],
                th: [
                    "กวางวิ่งได้เร็วมากเพื่อหนีจากอันตราย",
                    "ลูกกวางเรียกว่า fawn",
                    "กวางตัวผู้เขาจะงอกใหม่ทุกปี"
                ]
            },
            capybara: {
                en: [
                    "Capybaras are the biggest rodents in the world.",
                    "They love water and can hold their breath underwater.",
                    "Capybaras are super friendly and make friends with lots of animals."
                ],
                th: [
                    "คาปิบาราเป็นสัตว์ฟันแทะที่ใหญ่ที่สุดในโลก",
                    "พวกมันชอบน้ำมากและกลั้นหายใจใต้น้ำได้",
                    "คาปิบาราเป็นมิตรมากและเป็นเพื่อนกับสัตว์หลายชนิด"
                ]
            },
            horse: {
                en: [
                    "Horses can run very fast and are great at jumping.",
                    "There are many different breeds and colors of horses.",
                    "Horses are smart and can learn lots of tricks."
                ],
                th: [
                    "ม้าวิ่งได้เร็วมากและเก่งในการกระโดด",
                    "ม้ามีหลายสายพันธุ์และหลายสี",
                    "ม้าฉลาดและเรียนรู้ทริกต่างๆ ได้มาก"
                ]
            },
            koala: {
                en: [
                    "Koalas carry their babies in a pouch.",
                    "Koalas eat eucalyptus leaves and sleep up to 20 hours a day.",
                    "Koalas are not bears — they are their very own special animal."
                ],
                th: [
                    "โคอาลาอุ้มลูกไว้ในกระเป๋าหน้าท้อง",
                    "โคอาลากินใบยูคาลิปตัสและนอนได้ถึง 20 ชั่วโมงต่อวัน",
                    "โคอาลาไม่ใช่หมี แต่เป็นสัตว์พิเศษของมันเอง"
                ]
            },
            map: {
                en: [
                    "This is the zoo map! Use it to find all the animals.",
                    "The map shows where every animal home is in the zoo.",
                    "Follow the paths on the map to visit every animal."
                ],
                th: [
                    "นี่คือแผนที่สวนสัตว์! ใช้เพื่อหาสัตว์ทุกตัว",
                    "แผนที่แสดงว่าบ้านของสัตว์แต่ละตัวอยู่ตรงไหนในสวนสัตว์",
                    "ตามเส้นทางบนแผนที่เพื่อไปเที่ยวชมสัตว์ทุกตัว"
                ]
            }
        };

        const DEFAULT_FACTS = {
            en: ["Have fun exploring the zoo!", "Every zoo picture has a story to tell."],
            th: ["สนุกกับการสำรวจสวนสัตว์!", "ทุกรูปที่สวนสัตว์มีเรื่องราวของมัน"]
        };

        function prettyName(fileName) {
            const name = fileName.replace(/\.(jpg|jpeg|png|webp|gif)$/i, "").replace(/_/g, " ");
            return name.charAt(0).toUpperCase() + name.slice(1);
        }

        function matchPicture(fileName) {
            const name = fileName.toLowerCase();
            for (const key of Object.keys(ZOO_NAMES)) {
                if (name.includes(key)) return key;
            }
            return null;
        }

        /* =====================================================
           TRANSLATIONS
        ===================================================== */
        const STRINGS = {
            logo:          { en: "Zoo", th: "สวนสัตว์" },
            allProjects:   { en: "All Projects", th: "โครงการทั้งหมด" },
            eyebrow:       { en: "Welcome", th: "ยินดีต้อนรับ" },
            heroTitle:     { en: "Pictures of the Zoo", th: "รูปภาพของสวนสัตว์" },
            heroSub:       { en: "Tap OPEN ZOO, then press INFO on any picture to learn something fun.", th: "กดเปิดสวนสัตว์ แล้วกดปุ่มข้อมูลบนรูป เพื่อดูเรื่องสนุกๆ" },
            openZoo:       { en: "OPEN ZOO", th: "เปิดสวนสัตว์" },
            scrollHint:    { en: "scroll down", th: "เลื่อนลง" },
            galleryTitle:  { en: "The <span>Pictures</span>", th: "รูปภาพ<span>ทั้งหมด</span>" },
            galleryHint:   { en: "Press INFO on a picture to hear about it.", th: "กดปุ่มข้อมูลบนรูป เพื่อฟังเรื่องราวของรูปนั้น" },
            didYouKnow:    { en: "DID YOU KNOW?", th: "รู้หรือไม่?" },
            close:         { en: "CLOSE", th: "ปิด" },
            footer:        { en: "Zoo Project • Made by Jake", th: "โปรเจกต์สวนสัตว์ • ทำโดยเจค" },
            infoBtn:       { en: "Info", th: "ข้อมูล" },
            photo:         { en: "PHOTO", th: "รูป" }
        };

        let lang = localStorage.getItem("zoo-lang") || "en";

        /* =====================================================
           BUILD THE GALLERY CARDS
        ===================================================== */
        const grid = document.getElementById("gallery-grid");

        if (ALL_PICTURES.length === 0) {
            grid.innerHTML =
                '<div class="empty-state">' +
                    '<div class="empty-emoji">+</div>' +
                    '<div data-i18n="emptyHint">Put your pictures into the pictures folder, then refresh this page.</div>' +
                '</div>';
        } else {
            ALL_PICTURES.forEach(function(src, index) {
                const fileName = src.replace("pictures/", "");
                const slotNum = index + 1;
                const matchKey = (SLOT_ANIMALS[slotNum] || matchPicture(fileName)) || null;
                const names = matchKey ? ZOO_NAMES[matchKey] : { en: prettyName(fileName), th: prettyName(fileName) };
                const facts = (matchKey ? ZOO_FACTS[matchKey] : DEFAULT_FACTS).en.map(function(f, i) {
                    return {
                        en: f,
                        th: (matchKey ? ZOO_FACTS[matchKey] : DEFAULT_FACTS).th[i] || f
                    };
                });

                const card = document.createElement("div");
                card.className = "card";

                const photoWrap = document.createElement("div");
                photoWrap.className = "photo-wrap";

                const img = document.createElement("img");
                img.src = src;
                img.alt = names.en;
                img.loading = "lazy";
                photoWrap.appendChild(img);

                const body = document.createElement("div");
                body.className = "card-body";

                const titleBlock = document.createElement("div");
                const num = document.createElement("div");
                num.className = "card-num";
                num.setAttribute("data-photo-num", index + 1);
                num.textContent = STRINGS.photo[lang] + " " + (index + 1);
                const title = document.createElement("div");
                title.className = "card-title";
                title.setAttribute("data-name-en", names.en);
                title.setAttribute("data-name-th", names.th);
                title.textContent = names[lang];
                titleBlock.appendChild(num);
                titleBlock.appendChild(title);

                const infoBtn = document.createElement("button");
                infoBtn.className = "info-btn";
                infoBtn.textContent = STRINGS.infoBtn[lang];
                infoBtn.addEventListener("click", function() {
                    openModal({ img: src, name: names, facts: facts });
                });

                body.appendChild(titleBlock);
                body.appendChild(infoBtn);

                card.appendChild(photoWrap);
                card.appendChild(body);
                grid.appendChild(card);
            });
        }

        /* =====================================================
           MODAL
        ===================================================== */
        const overlay = document.getElementById("modal-overlay");
        const modalImg = document.getElementById("modal-img");
        const modalTitle = document.getElementById("modal-title");
        const modalFacts = document.getElementById("modal-facts");

        function openModal(photo) {
            modalImg.src = photo.img;
            modalImg.alt = photo.name[lang];
            modalImg.onload = function() { modalImg.classList.remove("hidden"); };
            modalImg.onerror = function() { modalImg.classList.add("hidden"); };
            modalTitle.textContent = photo.name[lang];
            modalTitle.setAttribute("data-name-en", photo.name.en);
            modalTitle.setAttribute("data-name-th", photo.name.th);

            modalFacts.innerHTML = "";
            photo.facts.forEach(function(fact) {
                const li = document.createElement("li");
                li.textContent = fact[lang];
                li.setAttribute("data-fact-en", fact.en);
                li.setAttribute("data-fact-th", fact.th);
                modalFacts.appendChild(li);
            });

            overlay.classList.add("open");
            document.body.style.overflow = "hidden";
        }

        function closeModal() {
            overlay.classList.remove("open");
            document.body.style.overflow = "";
        }

        document.getElementById("modal-close").addEventListener("click", closeModal);
        overlay.addEventListener("click", function(e) {
            if (e.target === overlay) closeModal();
        });

        document.addEventListener("keydown", function(e) {
            if (e.key === "Escape") closeModal();
        });

        /* =====================================================
           LANGUAGE TOGGLE (Th | En) WITH GREEN LIGHT
        ===================================================== */
        const thOpt = document.getElementById("lang-th");
        const enOpt = document.getElementById("lang-en");
        const toggle = document.getElementById("lang-toggle");

        function setLanguage(next) {
            lang = next === "th" ? "th" : "en";
            localStorage.setItem("zoo-lang", lang);
            document.documentElement.lang = lang;

            // Green light on the active side
            if (lang === "th") {
                thOpt.classList.add("active");
                enOpt.classList.remove("active");
            } else {
                enOpt.classList.add("active");
                thOpt.classList.remove("active");
            }

            // Translate static text
            document.querySelectorAll("[data-i18n]").forEach(function(el) {
                const key = el.getAttribute("data-i18n");
                if (STRINGS[key] && STRINGS[key][lang]) {
                    el.innerHTML = STRINGS[key][lang];
                }
            });

            // Translate dynamic card + modal text
            document.querySelectorAll(".card-title").forEach(function(el) {
                el.textContent = lang === "th" ? el.getAttribute("data-name-th") : el.getAttribute("data-name-en");
            });

            document.querySelectorAll(".info-btn").forEach(function(el) {
                el.textContent = STRINGS.infoBtn[lang];
            });

            document.querySelectorAll(".card-num").forEach(function(el) {
                el.textContent = STRINGS.photo[lang] + " " + el.getAttribute("data-photo-num");
            });

            if (overlay.classList.contains("open")) {
                modalTitle.textContent = lang === "th" ? modalTitle.getAttribute("data-name-th") : modalTitle.getAttribute("data-name-en");
                document.querySelectorAll("#modal-facts li").forEach(function(li) {
                    li.textContent = lang === "th" ? li.getAttribute("data-fact-th") : li.getAttribute("data-fact-en");
                });
            }
        }

        // Tapping anywhere on the pill toggles to the other language
        toggle.addEventListener("click", function() {
            setLanguage(lang === "en" ? "th" : "en");
        });

        /* =====================================================
           OPEN ZOO -> scroll to the gallery
        ===================================================== */
        document.getElementById("open-zoo-btn").addEventListener("click", function() {
            document.getElementById("gallery").scrollIntoView({ behavior: "smooth" });
        });

        // Start on the saved language
        setLanguage(lang);
    </script>

</body>
</html>
