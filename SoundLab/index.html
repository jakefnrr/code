<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound Lab</title>
<style>
:root{--bg:#050706;--bg2:#090d0a;--panel:#0d120f;--panel2:#111812;--panel3:#172019;--border:#223027;--green:#00ff88;--greenSoft:rgba(0,255,136,.12);--text:#f3f7f4;--muted:#87958b;--danger:#ff5268}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 20% 10%,rgba(0,255,136,.06),transparent 40%),var(--bg);color:var(--text);min-height:100vh;padding-bottom:90px}
#allProjectsBtn{position:fixed;top:14px;right:16px;z-index:4000;background:var(--panel);border:1px solid rgba(0,255,136,.35);color:var(--green);font-size:11px;font-weight:bold;letter-spacing:1px;padding:8px 14px;border-radius:20px;text-decoration:none;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#allProjectsBtn:hover{background:var(--green);color:#001b0e}
header{max-width:1250px;margin:0 auto;padding:35px 20px 15px}
.brand{display:flex;align-items:center;gap:14px}
.brandIcon{width:56px;height:56px;border-radius:16px;background:var(--greenSoft);border:1px solid rgba(0,255,136,.3);display:flex;align-items:center;justify-content:center;font-size:28px}
.brand h1{color:var(--green);font-size:30px;letter-spacing:.5px}
.brand p{color:var(--muted);font-size:13px;margin-top:4px}
main{max-width:1250px;margin:0 auto;padding:0 20px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:18px}
.searchWrap{position:relative}
.searchWrap input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:13px 16px 13px 40px;border-radius:11px;font-size:15px}
.searchWrap input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--greenSoft)}
.searchIcon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
.cats{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.catBtn{padding:8px 15px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);border-radius:22px;font-size:13px;cursor:pointer;transition:all .2s}
.catBtn:hover{color:var(--green);border-color:var(--green)}
.catBtn.active{background:var(--greenSoft);color:var(--green);border-color:rgba(0,255,136,.35);font-weight:bold}
.sectionHead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sectionHead h2{font-size:14px;color:var(--green);text-transform:uppercase;letter-spacing:1px}
.sectionHead .countText{color:var(--muted);font-size:12px}
.sectionHead .spacer{flex:1}
.lib{max-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;scrollbar-color:var(--green) var(--bg)}
.libRow{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:8px 12px}
.libRow .li{font-size:24px}
.libRow .ln{flex:1;min-width:0}
.libRow .ln strong{display:block;font-size:14px}
.libRow .ln small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.addBtn{padding:8px 16px;border-radius:9px;border:1px solid rgba(0,255,136,.35);background:var(--greenSoft);color:var(--green);font-weight:bold;font-size:13px;cursor:pointer}
.addBtn:hover{background:var(--green);color:#001b0e}
.addBtn.done{background:rgba(255,82,104,.1);border-color:rgba(255,82,104,.3);color:var(--danger)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.pad{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--green);border-radius:14px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;color:var(--text);transition:transform .12s,box-shadow .12s,border-color .12s}
.pad:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.pad.playing{border-color:var(--green);background:var(--greenSoft);box-shadow:0 0 0 2px var(--green)}
.pad .pi{font-size:30px;line-height:1}
.pad .pn{font-size:13px;font-weight:bold;text-align:center;line-height:1.25}
.pad .pc{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.padRow{display:flex;gap:6px;align-items:center}
.padBtn{font-size:13px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);border-radius:8px;padding:5px 10px;cursor:pointer}
.padBtn:hover{color:var(--green);border-color:var(--green)}
.padBtn.on{background:var(--green);color:#001b0e;border-color:var(--green)}
.rmBtn{font-size:15px;border:1px solid rgba(255,82,104,.35);background:rgba(255,82,104,.1);color:var(--danger);border-radius:8px;padding:5px 10px;cursor:pointer}
.rmBtn:hover{background:var(--danger);color:white}
.emptyMsg{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:14px;grid-column:1/-1}
.controlsRow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.control{display:flex;align-items:center;gap:8px}
.control label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.control input[type=range]{accent-color:var(--green);width:110px}
.clearAll{padding:9px 16px;background:rgba(255,82,104,.12);color:var(--danger);border:1px solid rgba(255,82,104,.4);border-radius:9px;font-weight:bold;font-size:13px;cursor:pointer}
.clearAll:hover{background:rgba(255,82,104,.25)}
.stopAll{padding:9px 16px;background:rgba(255,82,104,.12);color:var(--danger);border:1px solid rgba(255,82,104,.4);border-radius:9px;font-weight:bold;font-size:13px;cursor:pointer}
.stopAll:hover{background:rgba(255,82,104,.25)}
.mixerbar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--green);box-shadow:0 -15px 50px rgba(0,0,0,.5);z-index:100}
.mixerHead{max-width:1250px;margin:0 auto;padding:10px 20px 0;display:flex;align-items:center;gap:10px}
.mixerHead h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.mixerBody{max-width:1250px;margin:0 auto;padding:10px 20px 14px;overflow-x:auto;white-space:nowrap;display:flex;gap:9px}
.mx{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--border);border-radius:22px;padding:6px 8px 6px 12px}
.mx .mxi{font-size:16px}
.mxn{font-size:12px;font-weight:bold;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx input[type=range]{accent-color:var(--green);width:80px}
.mxstop{width:22px;height:22px;border-radius:50%;border:none;background:rgba(255,82,104,.15);color:var(--danger);font-size:14px;cursor:pointer;line-height:1}
.mxstop:hover{background:var(--danger);color:white}
.mxempty{color:var(--muted);font-size:12px;padding:6px 2px}
.mxbarBtn{padding:7px 14px;background:rgba(255,82,104,.1);color:var(--danger);border:1px solid rgba(255,82,104,.3);border-radius:20px;font-size:11px;font-weight:bold;cursor:pointer}
.mxbarBtn:hover{background:var(--danger);color:white}
@media(max-width:560px){.brand h1{font-size:24px}.board{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
</style>
</head>
<body>
<a href="../index.html" id="allProjectsBtn">ALL PROJECTS</a>
<header>
<div class="brand">
<div class="brandIcon">🔊</div>
<div><h1>Sound Lab</h1><p>Search the sound library and build your own board</p></div>
</div>
</header>
<main>
<div class="panel">
<div class="searchWrap">
<span class="searchIcon">🔍</span>
<input id="searchInput" type="text" placeholder="Search sounds... farts, cats, lasers, anything" oninput="renderLibrary()">
</div>
<div class="cats" id="cats"></div>
</div>
<div class="panel">
<div class="sectionHead"><h2>Sound Library</h2><span class="countText" id="libCount"></span></div>
<div class="lib" id="library"></div>
</div>
<div class="panel">
<div class="sectionHead">
<h2>My Board</h2>
<span class="countText" id="boardCount"></span>
<span class="spacer"></span>
<div class="controlsRow" style="margin:0">
<div class="control"><label>Pad Vol</label><input type="range" min="0" max="100" value="90" oninput="setPad(this.value)"></div>
<div class="control"><label>Master</label><input id="masterVol" type="range" min="0" max="100" value="90" oninput="setMaster(this.value)"></div>
<button class="stopAll" onclick="stopAll()">■ Stop</button>
<button class="clearAll" onclick="clearBoard()">🗑 Clear</button>
</div>
</div>
<div class="board" id="board"></div>
</div>
</main>
<div class="mixerbar">
<div class="mixerHead">
<h2>🎛 Mixer</h2>
<span style="flex:1"></span>
<button class="mxbarBtn" onclick="stopAll()">Stop All</button>
</div>
<div class="mixerBody" id="mixerBody"></div>
</div>
<script>

function toneP(o){var cfg={freq:440,dur:.3,type:'sine',vol:.4,attack:.01,release:.1,glideTo:null,when:0,pan:0};for(var k in o)cfg[k]=o[k];var t=audio().currentTime+cfg.when;var osc=audio().createOscillator();osc.type=cfg.type;osc.frequency.setValueAtTime(Math.max(20,cfg.freq),t);if(cfg.glideTo)osc.frequency.exponentialRampToValueAtTime(Math.max(20,cfg.glideTo),t+cfg.dur);var env=audio().createGain();env.gain.setValueAtTime(.0001,t);env.gain.exponentialRampToValueAtTime(cfg.vol,t+cfg.attack);env.gain.exponentialRampToValueAtTime(.0001,t+cfg.dur+cfg.release);osc.connect(env);var node=env;if(audio().createStereoPanner){var p=audio().createStereoPanner();p.pan.value=cfg.pan;env.connect(p);node=p;}node.connect(cfg.out||out);osc.start(t);osc.stop(t+cfg.dur+cfg.release+.05);return t+cfg.dur+cfg.release;}
function noiseP(o){var cfg={dur:.5,vol:.5,type:'white',filter:'lowpass',freq:800,sweepTo:null,when:0,q:1,pan:0};for(var k in o)cfg[k]=o[k];var now=audio().currentTime,t=now+cfg.when,n=Math.floor(audio().sampleRate*cfg.dur),buf=audio().createBuffer(1,n,audio().sampleRate),d=buf.getChannelData(0),last=0;for(var i=0;i<n;i++){if(cfg.type==='brown'){last=(last+.04*(Math.random()*2-1))/1.04;d[i]=last*3.5;}else{d[i]=Math.random()*2-1;}}var src=audio().createBufferSource();src.buffer=buf;var f=audio().createBiquadFilter();f.type=cfg.filter;f.Q.value=cfg.q;f.frequency.setValueAtTime(Math.max(40,cfg.freq),t);if(cfg.sweepTo)f.frequency.exponentialRampToValueAtTime(Math.max(40,cfg.sweepTo),t+cfg.dur);var env=audio().createGain();env.gain.setValueAtTime(.0001,t);env.gain.exponentialRampToValueAtTime(cfg.vol,t+cfg.dur*.1);env.gain.exponentialRampToValueAtTime(.0001,t+cfg.dur);src.connect(f);f.connect(env);var node=env;if(audio().createStereoPanner){var p=audio().createStereoPanner();p.pan.value=cfg.pan;env.connect(p);node=p;}node.connect(cfg.out||out);src.start(t);return t+cfg.dur;}
function ton(o){o.out=out;return toneP(o);}
function noz(o){o.out=out;return noiseP(o);}
function findB(bid){for(var i=0;i<board.length;i++)if(board[i].bid===bid)return board[i];return null;}
function saveBoard(){var data=board.map(function(b){return{id:b.id,name:b.name,icon:b.icon,cat:b.cat,repeat:b.repeat};});try{localStorage.setItem(STORE_KEY,JSON.stringify(data));}catch(e){}}
function loadBoard(){var raw=null;try{raw=localStorage.getItem(STORE_KEY);}catch(e){return;}if(!raw)return;try{var arr=JSON.parse(raw);arr.forEach(function(d){if(byId[d.id]){board.push({bid:'b'+(++seq),id:d.id,name:d.name,icon:d.icon,cat:d.cat,repeat:!!d.repeat,playing:false,gain:null,stopTimer:null,token:0});}});}catch(e){ }renderBoard();}
function clearBoard(){board.forEach(function(b){stopPad(b,true);});board=[];saveBoard();renderBoard();renderMixer();}
function renderCats(){document.getElementById('cats').innerHTML=CATS.map(function(c){return '<button class="catBtn'+(c===activeCat?' active':'')+'" onclick="setCat(\''+c+'\')">'+c+'</button>';}).join('');}
function setCat(c){activeCat=c;renderCats();renderLibrary();}
function renderLibrary(){var q=document.getElementById('searchInput').value.toLowerCase();var list=SOUNDS.filter(function(s){return (activeCat==='All'||s.cat===activeCat)&&(!q||s.name.toLowerCase().indexOf(q)>=0);});document.getElementById('library').innerHTML=list.length?list.map(function(s){var on=board.some(function(b){return b.id===s.id;});return '<div class="libRow"><span class="li">'+s.icon+'</span><span class="ln"><strong>'+s.name+'</strong><small>'+s.cat+'</small></span><button class="addBtn'+(on?' done':'')+'" '+(on?'':'onclick="addToBoard(\''+s.id+'\')"')+'>'+(on?'Added ✓':'+ Add')+'</button></div>';}).join(''):'<div class="emptyMsg">No sounds found. Try another search.</div>';document.getElementById('libCount').textContent=list.length+' in library';}
function addToBoard(id){var s=byId[id];if(!s||board.some(function(b){return b.id===id;}))return;board.push({bid:'b'+(++seq),id:s.id,name:s.name,icon:s.icon,cat:s.cat,repeat:false,playing:false,gain:null,stopTimer:null,token:0});saveBoard();renderLibrary();renderBoard();}
function removeFromBoard(bid){var i=-1;for(var k=0;k<board.length;k++)if(board[k].bid===bid){i=k;break;}if(i<0)return;stopPad(board[i],true);board.splice(i,1);saveBoard();renderLibrary();renderBoard();renderMixer();}
function renderBoard(){var el=document.getElementById('board');if(!board.length){el.innerHTML='<div class="emptyMsg">Your board is empty — search the library above and tap + Add to fill it.</div>';}else{el.innerHTML=board.map(function(b){return '<div class="pad'+(b.playing?' playing':'')+'" onclick="padPlay(\''+b.bid+'\')"><span class="pi">'+b.icon+'</span><span class="pn">'+b.name+'</span><span class="pc">'+b.cat+'</span><span class="padRow"><button class="padBtn'+(b.repeat?' on':'')+'" title="Repeat (loop)" onclick="event.stopPropagation();toggleRepeat(\''+b.bid+'\')">🔁</button><button class="rmBtn" title="Delete" onclick="event.stopPropagation();removeFromBoard(\''+b.bid+'\')">×</button></span></div>';}).join('');}document.getElementById('boardCount').textContent=board.length+' sound'+(board.length===1?'':'s');}
function padPlay(bid){var b=findB(bid);if(!b)return;if(b.playing){stopPad(b);return;}startPad(b);}
function startPad(b){audio();b.playing=true;b.token++;var s=byId[b.id];var g=audio().createGain();g.gain.value=padVol;g.connect(getMaster());b.gain=g;var tok=b.token;out=g;var end=playOnce(s);var now=audio().currentTime;if(!end||end<=now)end=now+.5;b.endTime=end;if(b.repeat){scheduleNext(b,s,tok);}else{b.stopTimer=setTimeout(function(){if(b.token===tok){stopPad(b,true);}},Math.max(60,(end-now)*1000+80));}renderBoard();renderMixer();}
function playOnce(s){var e;try{e=s.fn();}catch(err){e=null;}if(!e||e<=audio().currentTime)e=audio().currentTime+.5;return e;}
function scheduleNext(b,s,tok){var ms=Math.max(60,(b.endTime-audio().currentTime)*1000+40);setTimeout(function(){if(b.token!==tok||!b.playing)return;if(!b.repeat){stopPad(b,true);return;}out=b.gain;b.endTime=playOnce(s);scheduleNext(b,s,tok);},ms);}
function toggleRepeat(bid){var b=findB(bid);if(!b)return;b.repeat=!b.repeat;if(b.repeat&&b.playing){if(b.stopTimer){clearTimeout(b.stopTimer);b.stopTimer=null;}out=b.gain;var s=byId[b.id];scheduleNext(b,s,b.token);}saveBoard();renderBoard();}
function stopPad(b,auto){b.playing=false;b.token++;if(b.stopTimer){clearTimeout(b.stopTimer);b.stopTimer=null;}try{if(b.gain){var ctx=b.gain.context;var nw=ctx.currentTime;b.gain.gain.cancelScheduledValues(nw);b.gain.gain.setValueAtTime(b.gain.gain.value,nw);b.gain.gain.linearRampToValueAtTime(0,nw+.05);setTimeout(function(){try{b.gain.disconnect();}catch(e){}},80);}}catch(e){}b.gain=null;if(!auto){renderBoard();}renderMixer();}
function stopAll(){board.forEach(function(b){stopPad(b,true);});renderBoard();renderMixer();}
function renderMixer(){var pb=board.filter(function(b){return b.playing;});var el=document.getElementById('mixerBody');el.innerHTML=pb.length?pb.map(function(b){return '<div class="mx"><span class="mxi">'+b.icon+'</span><span class="mxn">'+b.name+'</span><input type="range" min="0" max="100" value="'+Math.round((b.gain?b.gain.gain.value:padVol)*100)+'" oninput="mixVol(\''+b.bid+'\',this.value)"><button class="mxstop" onclick="stopPad(findB(\''+b.bid+'\'))">×</button></div>';}).join(''):'<span class="mxempty">Nothing playing</span>';}
function mixVol(bid,v){var b=findB(bid);if(b&&b.gain){b.gain.gain.value=v/100;}}
function setMaster(v){masterVol=v/100;if(master)master.gain.value=masterVol;}
function setPad(v){padVol=v/100;}
renderCats();
renderLibrary();
renderBoard();
loadBoard();
</script>
