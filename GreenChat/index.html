<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenChat - Real-time Chat App</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <div id="app">
        <!-- Login Page -->
        <div id="loginPage" class="page active">
            <div class="login-container">
                <h1>GreenChat</h1>
                <p>Real-time messaging</p>
                <div class="login-options">
                    <button class="btn google" onclick="loginWithGoogle()">Continue with Google</button>
                    <button class="btn email" onclick="showEmailLogin()">Email & Username</button>
                </div>
            </div>
        </div>

        <!-- Chat Page -->
        <div id="chatPage" class="page">
            <div class="header">
                <button id="menuBtn" class="menu-btn">☰</button>
                <span id="currentUser">Loading...</span>
                <div class="header-actions">
                    <button id="addFriendBtn" class="btn-small">Add Friend</button>
                </div>
            </div>

            <div class="sidebar">
                <div class="sidebar-header">
                    <h3>Friends</h3>
                </div>
                <div id="friendsList" class="friends-list">
                    <p class="empty-state">Loading friends...</p>
                </div>
            </div>

            <div class="main-chat">
                <div class="chat-header">
                    <span id="currentChat">Select a friend to chat</span>
                </div>
                <div id="messages" class="messages">
                    <p class="empty-state">Start a conversation</p>
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Type a message...">
                <button id="sendBtn" class="btn-small">Send</button>
            </div>
        </div>
    </div>

    <script src="src/js/app.js"></script>
</body>
</html>
