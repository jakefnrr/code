<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notes</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #000;
    color: white;

    font-family: Arial, sans-serif;
}

button {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
}

/* ================================= */
/* HOME */
/* ================================= */

.notes-app {
    width: 100%;
    min-height: 100vh;

    padding: 14px;

    background: #000;
}

/* ================================= */
/* HOME TOP */
/* ================================= */

.top-bar {
    width: 100%;
    min-height: 60px;

    display: flex;
    align-items: center;

    position: relative;
}

h1 {
    margin: 0;

    color: cyan;

    font-size: 27px;

    text-shadow:
        0 0 5px cyan,
        0 0 15px cyan;
}

/* ================================= */
/* NEW BUTTON */
/* ================================= */

.new-button {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    padding: 12px 22px;

    background: cyan;
    color: black;

    border: none;
    border-radius: 11px;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.new-button:active {
    transform:
        translate(-50%, -50%)
        scale(0.94);
}

/* ================================= */
/* ALL PROJECTS */
/* ================================= */

.all-projects-button {
    position: absolute;

    right: 0;
    top: 50%;

    transform: translateY(-50%);

    padding: 10px 12px;

    background: #111;
    color: cyan;

    border: 2px solid cyan;
    border-radius: 10px;

    font-size: 10px;
    font-weight: bold;

    cursor: pointer;
}

/* ================================= */
/* NOTES */
/* ================================= */

.notes-container {
    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(280px, 1fr));

    gap: 15px;

    margin-top: 18px;
}

/* ================================= */
/* NOTE CARD */
/* ================================= */

.note-card {
    position: relative;

    background: #111;

    border: 2px solid cyan;

    border-radius: 12px;

    padding: 18px;

    min-height: 180px;

    box-shadow:
        0 0 8px rgba(0, 255, 255, 0.25);
}

.note-title {
    color: cyan;

    font-size: 21px;
    font-weight: bold;

    margin-right: 70px;
    margin-bottom: 12px;

    word-break: break-word;
}

.note-preview {
    color: #aaa;

    font-size: 15px;

    line-height: 1.4;

    min-height: 55px;

    white-space: pre-wrap;

    word-break: break-word;

    margin-bottom: 15px;
}

.open-button {
    padding: 10px 20px;

    background: cyan;
    color: black;

    border: none;
    border-radius: 8px;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;
}

.delete-button {
    position: absolute;

    top: 12px;
    right: 12px;

    padding: 7px 10px;

    background: #330000;
    color: #ff4444;

    border: 2px solid #ff3333;

    border-radius: 8px;

    font-size: 11px;
    font-weight: bold;

    cursor: pointer;
}

.empty-message {
    grid-column: 1 / -1;

    text-align: center;

    color: #666;

    font-size: 18px;

    margin-top: 40px;
}

/* ================================= */
/* DELETE POPUP */
/* ================================= */

.popup-overlay {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.82);

    display: none;

    justify-content: center;
    align-items: center;

    z-index: 99999;

    padding: 20px;
}

.popup-box {
    width: 100%;
    max-width: 430px;

    background: #071522;

    border: 2px solid #00aaff;

    border-radius: 15px;

    padding: 25px;

    text-align: center;

    box-shadow:
        0 0 10px #008cff,
        0 0 30px rgba(0, 140, 255, 0.35);
}

.popup-box h2 {
    margin-top: 0;

    color: #00b7ff;

    text-shadow:
        0 0 8px #008cff;
}

.popup-box p {
    color: #aaa;

    line-height: 1.4;

    margin-bottom: 20px;
}

.popup-buttons {
    display: flex;

    justify-content: center;

    gap: 10px;

    flex-wrap: wrap;
}

.popup-cancel,
.delete-confirm {
    min-height: 48px;

    padding: 10px 22px;

    border-radius: 9px;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
}

.popup-cancel {
    background: #111;

    color: #aaa;

    border: 2px solid #444;
}

.delete-confirm {
    background: #cc2222;

    color: white;

    border: 2px solid #ff4444;
}

/* ================================= */
/* EDITOR */
/* ================================= */

#editorPage {
    display: none;

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;

    z-index: 9000;

    overflow-y: auto;
}

/* ================================= */
/* EDITOR TOP */
/* ================================= */

.editor-top {
    position: sticky;

    top: 0;

    width: 100%;

    min-height: 75px;

    padding: 9px;

    background: #050505;

    border-bottom: 2px solid #222;

    display: flex;

    align-items: center;

    gap: 8px;

    z-index: 20;
}

/* ================================= */
/* TITLE INPUT */
/* ================================= */

.editor-title-input {
    flex: 0 1 auto;

    width: 240px;
    min-width: 130px;
    height: 58px;

    padding: 0 16px;

    background: #0a0a0a;
    color: cyan;

    border: 2px solid #008f9c;
    border-radius: 12px;

    font-size: 17px;
    font-weight: bold;
    font-family: Arial, sans-serif;

    outline: none;
}

.editor-title-input::placeholder {
    color: #555;
}

.editor-title-input:focus {
    border-color: cyan;
    box-shadow: 0 0 8px rgba(0, 255, 255, 0.2);
}

/* ================================= */
/* TOOLBAR */
/* ================================= */

.editor-toolbar {
    flex: 1;

    display: flex;

    align-items: center;

    gap: 8px;

    overflow-x: auto;

    scrollbar-width: none;
}

.editor-toolbar::-webkit-scrollbar {
    display: none;
}

/* ================================= */
/* TOOL BUTTONS */
/* ================================= */

.tool-button {
    flex: 0 0 auto;

    width: 56px;
    height: 56px;

    background: #111;

    color: cyan;

    border: 2px solid #008f9c;

    border-radius: 12px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 25px;

    font-weight: bold;

    cursor: pointer;
}

.tool-button:active {
    background: cyan;

    color: black;

    transform: scale(0.93);
}

.tool-button.bold-on {
    background: cyan;

    color: black;
}

/* ================================= */
/* EDITOR BACK BUTTON */
/* ================================= */

.back-button {
    flex: 0 0 auto;

    width: 58px;
    height: 56px;

    background: #111;

    color: cyan;

    border: 2px solid cyan;

    border-radius: 12px;

    font-size: 25px;

    font-weight: bold;

    cursor: pointer;
}

.back-button:active {
    background: cyan;

    color: black;

    transform: scale(0.93);
}

/* ================================= */
/* EDITOR AREA */
/* ================================= */

.editor-area {
    width: 100%;

    padding: 9px;
}

/* ================================= */
/* EDITOR */
/* ================================= */

#noteEditor {
    width: 100%;

    min-height: calc(100vh - 105px);

    background: #050505;

    color: white;

    border: 2px solid #111;

    border-radius: 10px;

    padding: 16px;

    font-family: Arial, sans-serif;

    font-size: 18px;

    line-height: 1.6;

    outline: none;

    overflow-y: auto;

    -webkit-user-select: text;
    user-select: text;
}

#noteEditor:focus {
    border-color: cyan;

    box-shadow:
        0 0 10px rgba(0, 255, 255, 0.15);
}

/* ================================= */
/* TITLE */
/* ================================= */

.note-editor-title {
    font-size: 30px;

    font-weight: bold;

    color: white;

    line-height: 1.25;

    min-height: 38px;

    margin-bottom: 8px;
}

.note-editor-title:empty::before {
    content: "Note title";

    color: #555;
}

/* ================================= */
/* NORMAL LINE */
/* ================================= */

.note-editor-line {
    font-size: inherit;

    font-weight: normal;

    color: white;

    min-height: 29px;

    line-height: 1.6;
}

/* ================================= */
/* CHECKLIST */
/* ================================= */

.checklist-line,
.bullet-line {
    display: flex;

    align-items: flex-start;

    width: 100%;

    min-height: 30px;

    line-height: 1.6;
}

.list-content {
    flex: 1;

    min-width: 0;

    min-height: 29px;

    outline: none;

    cursor: text;
}

/* ================================= */
/* CHECK CIRCLE */
/* ================================= */

.check-circle {
    flex: 0 0 auto;

    width: 1.35em;
    height: 1.35em;

    margin-top: 0.3em;
    margin-right: 0.55em;

    border: 0.12em solid white;

    border-radius: 50%;

    background: transparent;

    display: flex;

    align-items: center;
    justify-content: center;

    color: transparent;

    font-size: inherit;

    font-weight: bold;

    cursor: pointer;
}

.check-circle.checked {
    background: #18c75a;

    border-color: #18c75a;

    color: white;
}

.check-circle.checked::after {
    content: "✓";

    font-size: 0.82em;

    line-height: 1;
}

.check-circle.checked + .list-content {
    color: #777;

    text-decoration: line-through;
}

/* ================================= */
/* BULLET */
/* ================================= */

.bullet-circle {
    flex: 0 0 auto;

    width: 0.72em;
    height: 0.72em;

    margin-top: 0.5em;

    margin-left: 0.33em;
    margin-right: 0.88em;

    border: 0.13em solid white;

    border-radius: 50%;

    background: transparent;

    font-size: inherit;

    pointer-events: none;
}

/* ================================= */
/* MEDIUM SCREENS */
/* ================================= */

@media (max-width: 1200px) {

    .editor-title-input {
        width: 200px;
    }

    .tool-button,
    .back-button {
        width: 52px;
        height: 52px;
    }

    .editor-top {
        gap: 7px;
    }

}

@media (max-width: 900px) {

    .editor-title-input {
        width: 165px;

        font-size: 15px;
    }

    .tool-button,
    .back-button {
        width: 47px;
        height: 47px;

        font-size: 21px;
    }

    .editor-top {
        gap: 6px;
    }

}

@media (max-width: 700px) {

    .editor-title-input {
        width: 130px;

        font-size: 14px;
    }

    .tool-button,
    .back-button {
        width: 44px;
        height: 44px;

        font-size: 20px;
    }

}


/* ================================= */
/* MOBILE */
/* ================================= */

@media (max-width: 600px) {

    .notes-app {
        padding: 12px;
    }

    h1 {
        font-size: 25px;
    }

    .new-button {
        padding: 11px 18px;

        font-size: 15px;
    }

    .all-projects-button {
        padding: 8px 7px;

        font-size: 9px;
    }

    .notes-container {
        grid-template-columns: 1fr;
    }

    .editor-top {
        padding: 8px;

        gap: 6px;
    }

    .editor-title-input {
        width: 110px;
        height: 44px;

        font-size: 13px;
    }

    .tool-button {
        width: 44px;
        height: 44px;

        font-size: 20px;
    }

    .back-button {
        width: 44px;
        height: 44px;

        font-size: 20px;
    }

    #noteEditor {
        font-size: 17px;

        padding: 15px;
    }

    .note-editor-line {
        font-size: inherit;
    }

    .note-editor-title {
        font-size: 28px;
    }
}

</style>
</head>

<body>


<!-- ================================= -->
<!-- HOME -->
<!-- ================================= -->

<div
    class="notes-app"
    id="notesHome">

    <div class="top-bar">

        <h1>📝 Notes</h1>


        <button
            type="button"
            class="new-button"
            onclick="createNote(); return false;">

            + NEW

        </button>


        <button
            type="button"
            class="all-projects-button"
            onclick="location.href='../index.html'; return false;">

            ALL PROJECTS

        </button>

    </div>


    <div
        class="notes-container"
        id="notesContainer">
    </div>

</div>


<!-- ================================= -->
<!-- DELETE POPUP -->
<!-- ================================= -->

<div
    class="popup-overlay"
    id="deletePopup">

    <div class="popup-box">

        <h2>⚠️ Delete Note?</h2>

        <p>
            Are you sure you want to delete this note?
            This cannot be undone.
        </p>


        <div class="popup-buttons">

            <button
                type="button"
                class="delete-confirm"
                onclick="confirmDelete(); return false;">

                Yes, Delete

            </button>


            <button
                type="button"
                class="popup-cancel"
                onclick="closeDeletePopup(); return false;">

                Cancel

            </button>

        </div>

    </div>

</div>


<!-- ================================= -->
<!-- EDITOR -->
<!-- ================================= -->

<div id="editorPage">


    <div class="editor-top">


        <input
            type="text"
            id="editorTitleInput"
            class="editor-title-input"
            placeholder="Note title"
            maxlength="100"
            autocomplete="off">


        <div class="editor-toolbar">


            <!-- NOTE UNDO ONLY -->

            <button
                type="button"
                class="tool-button"
                id="undoButton"
                aria-label="Undo note change">

                ←

            </button>


            <!-- NOTE REDO ONLY -->

            <button
                type="button"
                class="tool-button"
                id="redoButton"
                aria-label="Redo note change">

                →

            </button>


            <!-- CHECKLIST -->

            <button
                type="button"
                class="tool-button"
                onclick="toggleChecklist(); return false;"
                aria-label="Checklist">

                ☑

            </button>


            <!-- BULLETS -->

            <button
                type="button"
                class="tool-button"
                onclick="toggleBullets(); return false;"
                aria-label="Bullets">

                ○

            </button>


            <!-- BOLD -->

            <button
                type="button"
                class="tool-button"
                id="boldButton"
                onclick="toggleBold(); return false;"
                onmousedown="return false;"
                aria-label="Bold">

                B

            </button>


            <!-- INCREASE TEXT -->

            <button
                type="button"
                class="tool-button"
                onclick="increaseText(); return false;"
                onmousedown="return false;"
                aria-label="Increase text size">

                +

            </button>


            <!-- DECREASE TEXT -->

            <button
                type="button"
                class="tool-button"
                onclick="decreaseText(); return false;"
                onmousedown="return false;"
                aria-label="Decrease text size">

                −

            </button>


        </div>


        <!-- CLOSE EDITOR -->

        <button
            type="button"
            class="back-button"
            onclick="closeEditor(); return false;"
            aria-label="Close note">

            ✕

        </button>


    </div>


    <div class="editor-area">

        <div
            id="noteEditor"
            contenteditable="true"
            spellcheck="true">
        </div>

    </div>

</div>


<script>

/* ================================= */
/* STORAGE */
/* ================================= */

let notes =
    JSON.parse(
        localStorage.getItem("jakeNotes")
    ) || [];


let currentNoteId = null;

let noteToDeleteId = null;


/* ================================= */
/* NOTE HISTORY */
/* ================================= */

/*
    This is a separate undo/redo history
    for the current note.

    It is NOT browser history.

    Pressing ← or → therefore can never
    send Safari to another webpage.
*/

let historyStack = [];

let historyPosition = -1;

let historyTimer = null;

let restoringHistory = false;


/* ================================= */
/* SAVE NOTES */
/* ================================= */

function saveNotes() {

    localStorage.setItem(
        "jakeNotes",
        JSON.stringify(notes)
    );

}


/* ================================= */
/* PLAIN TEXT */
/* ================================= */

/*
    Pull text out of element children,
    turning <br> into line breaks.
*/

function extractText(node) {

    let text = "";

    node.childNodes.forEach(
        function(child) {

            if (
                child.nodeType === 3
            ) {

                text += child.nodeValue;

                return;

            }

            if (
                child.nodeType !== 1
            ) {

                return;

            }

            if (
                child.tagName === "BR"
            ) {

                text += "\n";

                return;

            }

            text += extractText(child);

        }
    );

    return text;

}


function getPlainText(html) {

    if (!html) {

        return "";

    }


    const temp =
        document.createElement("div");

    temp.innerHTML = html;


    const blocks = [];

    let node = null;

    const walker =
        document.createTreeWalker(
            temp,
            NodeFilter.SHOW_ELEMENT
        );

    while ((node = walker.nextNode())) {

        if (
            node.classList.contains(
                "note-editor-line"
            ) ||
            node.classList.contains(
                "checklist-line"
            ) ||
            node.classList.contains(
                "bullet-line"
            )
        ) {

            blocks.push(node);

        }

    }


    const lines =
        blocks.map(function(block) {

            if (
                block.classList.contains(
                    "checklist-line"
                )
            ) {

                const circle =
                    block.querySelector(
                        ".check-circle"
                    );

                const content =
                    block.querySelector(
                        ".list-content"
                    ) || block;

                const prefix =
                    circle &&
                    circle.classList.contains(
                        "checked"
                    )
                        ? "☑ "
                        : "☐ ";

                return (
                    prefix +
                    extractText(content)
                );

            }

            if (
                block.classList.contains(
                    "bullet-line"
                )
            ) {

                const content =
                    block.querySelector(
                        ".list-content"
                    ) || block;

                return (
                    "• " +
                    extractText(content)
                );

            }

            return extractText(block);

        });


    return lines
        .join("\n")
        .replace(/\n{3,}/g, "\n\n")
        .replace(/\s+$/g, "");

}


/* ================================= */
/* RENDER NOTES */
/* ================================= */

function renderNotes() {

    const container =
        document.getElementById(
            "notesContainer"
        );


    container.innerHTML = "";


    if (notes.length === 0) {

        container.innerHTML = `
            <div class="empty-message">
                No notes yet.<br>
                Press <b>+ NEW</b> to create one.
            </div>
        `;

        return;

    }


    notes.forEach(function(note) {

        const card =
            document.createElement("div");

        card.className =
            "note-card";


        const title =
            document.createElement("div");

        title.className =
            "note-title";

        title.textContent =
            note.name || "Untitled";


        const preview =
            document.createElement("div");

        preview.className =
            "note-preview";


        let previewText =
            getPlainText(note.content);


        if (!previewText.trim()) {

            previewText =
                "Empty note";

        }


        const previewLines =
            previewText.split("\n");


        if (previewLines.length > 10) {

            previewText =
                previewLines
                    .slice(0, 10)
                    .join("\n")
                + "\n...";

        }


        preview.textContent =
            previewText;


        const openButton =
            document.createElement("button");

        openButton.type = "button";

        openButton.className =
            "open-button";

        openButton.textContent =
            "Open";


        openButton.onclick =
            function(event) {

                event.preventDefault();

                openEditor(note.id);

            };


        const deleteButton =
            document.createElement("button");

        deleteButton.type = "button";

        deleteButton.className =
            "delete-button";

        deleteButton.textContent =
            "DELETE";


        deleteButton.onclick =
            function(event) {

                event.preventDefault();

                openDeletePopup(note.id);

            };


        card.appendChild(title);

        card.appendChild(preview);

        card.appendChild(openButton);

        card.appendChild(deleteButton);

        container.appendChild(card);

    });

}


/* ================================= */
/* CREATE NOTE */
/* ================================= */

function createNote() {

    const newNote = {

        id:
            Date.now().toString()
            +
            Math.random()
                .toString(36)
                .substring(2),

        name: "",

        content:
            '<div class="note-editor-line"><br></div>'

    };


    notes.unshift(newNote);


    saveNotes();

    renderNotes();


    /* Open immediately */

    openEditor(
        newNote.id,
        true
    );

}


/* ================================= */
/* OPEN DELETE */
/* ================================= */

function openDeletePopup(id) {

    noteToDeleteId = id;


    document.getElementById(
        "deletePopup"
    ).style.display = "flex";

}


/* ================================= */
/* CLOSE DELETE */
/* ================================= */

function closeDeletePopup() {

    noteToDeleteId = null;


    document.getElementById(
        "deletePopup"
    ).style.display = "none";

}


/* ================================= */
/* DELETE */
/* ================================= */

function confirmDelete() {

    if (
        noteToDeleteId === null
    ) {

        return;

    }


    notes =
        notes.filter(function(note) {

            return note.id !== noteToDeleteId;

        });


    saveNotes();

    renderNotes();

    closeDeletePopup();

}


/* ================================= */
/* OPEN EDITOR */
/* ================================= */

function openEditor(
    id,
    newNote = false
) {

    const note =
        notes.find(function(note) {

            return note.id === id;

        });


    if (!note) {

        return;

    }


    currentNoteId = id;


    const editor =
        document.getElementById(
            "noteEditor"
        );


    const titleInput =
        document.getElementById(
            "editorTitleInput"
        );


    titleInput.value =
        note.name || "";


    if (note.content) {

        editor.innerHTML =
            note.content;

    }

    else {

        editor.innerHTML =
            '<div class="note-editor-line"><br></div>';

    }


    /*
        Backward compat: if the content
        still has an old embedded title div,
        extract it into the input.
    */

    const oldTitle =
        editor.querySelector(
            ".note-editor-title"
        );


    if (oldTitle) {

        if (!titleInput.value) {

            titleInput.value =
                oldTitle.innerText.trim();

        }

        oldTitle.remove();

    }


    normalizeEditor();


    document.getElementById(
        "notesHome"
    ).style.display = "none";


    document.getElementById(
        "editorPage"
    ).style.display = "block";


    /*
        Create a fresh note history.

        This history belongs ONLY to this note.
    */

    startNoteHistory();


    if (newNote) {

        setTimeout(function() {

            titleInput.focus();

        }, 50);

    }

    else {

        setTimeout(function() {

            placeCursorAtEnd(
                editor
            );

        }, 50);

    }

}


/* ================================= */
/* NORMALIZE */
/* ================================= */

function normalizeEditor() {

    const editor =
        document.getElementById(
            "noteEditor"
        );


    if (!editor.firstElementChild) {

        editor.innerHTML =
            '<div class="note-editor-line"><br></div>';

        return;

    }


    /*
        Remove any leftover title divs.
    */

    const oldTitle =
        editor.querySelector(
            ".note-editor-title"
        );


    if (oldTitle) {

        const titleInput =
            document.getElementById(
                "editorTitleInput"
            );


        if (!titleInput.value) {

            titleInput.value =
                oldTitle.innerText.trim();

        }

        oldTitle.remove();

    }


    /*
        Repair list lines that got wrapped
        inside font-size spans, so the
        bullet/check circles are never stuck
        inside a foreign span.
    */

    const stuckLines =
        editor.querySelectorAll(
            "span .checklist-line," +
            "span .bullet-line," +
            "span > .note-editor-line"
        );


    stuckLines.forEach(function(line) {

        const span =
            line.parentNode;

        const holder =
            span.parentNode;

        if (!holder) {

            return;

        }

        holder.insertBefore(
            line,
            span
        );

        if (
            !span.firstChild
        ) {

            span.remove();

        }

    });


    /*
        Ensure first child is always
        a normal line.
    */

    const first =
        editor.firstElementChild;


    first.classList.remove(
        "note-editor-title"
    );

    first.classList.remove(
        "note-editor-line"
    );

    first.classList.add(
        "note-editor-line"
    );


    /*
        Safety net: any bare <div> the
        browser created (e.g. from Enter)
        must get the line class, otherwise
        multi-line selection won't find it.
    */

    const bare =
        editor.querySelectorAll(
            ":scope > div"
        );

    bare.forEach(function(div) {

        if (
            div.classList.contains(
                "checklist-line"
            ) ||
            div.classList.contains(
                "bullet-line"
            )
        ) {

            return;

        }

        div.classList.add(
            "note-editor-line"
        );

    });

}


/* ================================= */
/* SAVE CURRENT NOTE */
/* ================================= */

function saveCurrentNote() {

    if (
        currentNoteId === null
    ) {

        return;

    }


    const note =
        notes.find(function(note) {

            return note.id === currentNoteId;

        });


    if (!note) {

        return;

    }


    const editor =
        document.getElementById(
            "noteEditor"
        );


    const titleInput =
        document.getElementById(
            "editorTitleInput"
        );


    normalizeEditor();


    note.name =
        titleInput.value.trim();


    note.content =
        editor.innerHTML;


    saveNotes();

}


/* ================================= */
/* SAVE HISTORY STATE */
/* ================================= */

function saveHistoryState() {

    if (
        restoringHistory ||
        currentNoteId === null
    ) {

        return;

    }


    const editor =
        document.getElementById(
            "noteEditor"
        );


    const html =
        editor.innerHTML;


    /*
        Do not add duplicate states.
    */

    if (
        historyStack[
            historyPosition
        ] === html
    ) {

        return;

    }


    /*
        If the user undid something and
        then types something new, remove
        the old redo states.
    */

    historyStack =
        historyStack.slice(
            0,
            historyPosition + 1
        );


    historyStack.push(
        html
    );


    /*
        Keep history reasonably small
        for mobile.
    */

    if (
        historyStack.length > 100
    ) {

        historyStack.shift();

    }


    historyPosition =
        historyStack.length - 1;

}


/* ================================= */
/* START NOTE HISTORY */
/* ================================= */

function startNoteHistory() {

    const editor =
        document.getElementById(
            "noteEditor"
        );


    historyStack = [
        editor.innerHTML
    ];


    historyPosition = 0;

}


/* ================================= */
/* RECORD EDIT */
/* ================================= */

function recordEdit() {

    if (
        restoringHistory
    ) {

        return;

    }


    clearTimeout(
        historyTimer
    );


    /*
        Small delay groups individual
        typing actions naturally.
    */

    historyTimer =
        setTimeout(
            function() {

                saveHistoryState();

            },
            250
        );

}


/* ================================= */
/* UNDO NOTE ONLY */
/* ================================= */

function undoNoteOnly() {

    /*
        NEVER call history.back().

        This function only changes the
        HTML inside the note editor.
    */

    clearTimeout(
        historyTimer
    );


    if (
        historyPosition <= 0
    ) {

        return;

    }


    historyPosition--;


    restoreHistoryState(
        historyStack[
            historyPosition
        ]
    );

}


/* ================================= */
/* REDO NOTE ONLY */
/* ================================= */

function redoNoteOnly() {

    /*
        NEVER call history.forward().

        This function only changes the
        HTML inside the note editor.
    */

    clearTimeout(
        historyTimer
    );


    if (
        historyPosition >=
        historyStack.length - 1
    ) {

        return;

    }


    historyPosition++;


    restoreHistoryState(
        historyStack[
            historyPosition
        ]
    );

}


/* ================================= */
/* RESTORE NOTE STATE */
/* ================================= */

function restoreHistoryState(html) {

    restoringHistory = true;


    const editor =
        document.getElementById(
            "noteEditor"
        );


    editor.innerHTML =
        html;


    normalizeEditor();

    saveCurrentNote();


    /*
        Put the cursor back into the
        note without touching browser
        history.
    */

    setTimeout(function() {

        placeCursorAtEnd(
            editor
        );


        restoringHistory = false;

    }, 0);

}

            );

    }
);

/* ================================= */
/* ENTER HANDLER */
/* ================================= */

function handleEnter(event) {

    const line =
        getCurrentLine();


    if (!line) {

        return;

    }


    /* CHECKLIST */

    if (
        line.classList.contains(
            "checklist-line"
        )
    ) {

        event.preventDefault();


        const content =
            line.querySelector(
                ".list-content"
            );


        if (
            !content.innerText.trim()
        ) {

            exitList(line);

        }

        else {

            createListItem(
                "checklist",
                line
            );

        }


        return;

    }


    /* BULLET */

    if (
        line.classList.contains(
            "bullet-line"
        )
    ) {

        event.preventDefault();


        const content =
            line.querySelector(
                ".list-content"
            );


        if (
            !content.innerText.trim()
        ) {

            exitList(line);

        }

        else {

            createListItem(
                "bullet",
                line
            );

        }


        return;

    }


    /* NORMAL LINE */

    /*
        Let the browser split the line
        natively (creates a sibling <div>).
        normalizeEditor then classes it in
        the input handler.
    */

}


/* ================================= */
/* EXIT LIST */
/* ================================= */

function exitList(line) {

    const normal =
        document.createElement(
            "div"
        );


    normal.className =
        "note-editor-line";


    normal.innerHTML =
        "<br>";


    line.parentNode.insertBefore(
        normal,
        line.nextSibling
    );


    placeCursorAtStart(
        normal
    );


    saveCurrentNote();

    saveHistoryState();

}


/* ================================= */
/* CURRENT LINE */
/* ================================= */

function getCurrentLine() {

    const selection =
        window.getSelection();


    if (
        !selection.rangeCount
    ) {

        return null;

    }


    let node =
        selection.anchorNode;


    if (!node) {

        return null;

    }


    if (
        node.nodeType === 3
    ) {

        node =
            node.parentElement;

    }


    return node.closest(
        ".note-editor-line," +
        ".checklist-line," +
        ".bullet-line"
    );

}


/* ================================= */
/* CREATE LIST ITEM */
/* ================================= */

function createListItem(
    type,
    currentLine
) {

    const line =
        document.createElement(
            "div"
        );


    const content =
        document.createElement(
            "span"
        );


    content.className =
        "list-content";

    content.contentEditable =
        "true";

    content.innerHTML =
        "<br>";


    if (
        type === "checklist"
    ) {

        line.className =
            "checklist-line";


        const circle =
            document.createElement(
                "span"
            );


        circle.className =
            "check-circle";


        circle.contentEditable =
            "false";


        circle.onclick =
            function(event) {

                event.preventDefault();

                event.stopPropagation();

                toggleCheck(
                    circle
                );

            };


        line.appendChild(
            circle
        );

        line.appendChild(
            content
        );

    }

    else {

        line.className =
            "bullet-line";


        const bullet =
            document.createElement(
                "span"
            );


        bullet.className =
            "bullet-circle";


        bullet.contentEditable =
            "false";


        line.appendChild(
            bullet
        );

        line.appendChild(
            content
        );

    }


    currentLine.parentNode.insertBefore(
        line,
        currentLine.nextSibling
    );


    placeCursorAtStart(
        content
    );


    saveCurrentNote();

    saveHistoryState();

}


/* ================================= */
/* CHECKLIST TOOL */
/* ================================= */

function toggleChecklist() {

    const line =
        getCurrentLine();


    if (!line) {

        return;

    }


    const editor =
        document.getElementById(
            "noteEditor"
        );


    if (
        line === editor.firstElementChild
    ) {

        return;

    }


    if (
        line.classList.contains(
            "checklist-line"
        )
    ) {

        placeCursorInsideLine(
            line
        );

        return;

    }


    if (
        line.classList.contains(
            "bullet-line"
        )
    ) {

        convertBulletToChecklist(
            line
        );

        return;

    }


    convertLineToChecklist(
        line
    );

}


/* ================================= */
/* BULLET TOOL */
/* ================================= */

function toggleBullets() {

    const line =
        getCurrentLine();


    if (!line) {

        return;

    }


    const editor =
        document.getElementById(
            "noteEditor"
        );


    if (
        line === editor.firstElementChild
    ) {

        return;

    }


    if (
        line.classList.contains(
            "bullet-line"
        )
    ) {

        placeCursorInsideLine(
            line
        );

        return;

    }


    if (
        line.classList.contains(
            "checklist-line"
        )
    ) {

        convertChecklistToBullet(
            line
        );

        return;

    }


    convertLineToBullet(
        line
    );

}


/* ================================= */
/* BOLD TOOL */
/* ================================= */

function toggleBold() {

    document.execCommand(
        "bold", false, null
    );


    const btn =
        document.getElementById(
            "boldButton"
        );


    const active =
        document.queryCommandState(
            "bold"
        );


    if (active) {

        btn.classList.add(
            "bold-on"
        );

    }

    else {

        btn.classList.remove(
            "bold-on"
        );

    }


    document.getElementById(
        "noteEditor"
    ).focus();

}


/* ================================= */
/* TEXT SIZE HELPERS */
/* ================================= */

function clampFontSize(size) {

    if (size < 10) {

        return 10;

    }

    if (size > 48) {

        return 48;

    }

    return size;

}


function getFontSize(el) {

    if (!el) {

        return null;

    }


    const inline =
        parseFloat(el.style.fontSize);

    if (inline) {

        return inline;

    }


    const computed =
        window.getComputedStyle(el).fontSize;

    return (
        parseFloat(computed) || null
    );

}


/* ================================= */
/* LINE BLOCK */
/* ================================= */

function getLineBlock(node) {

    const el =
        node && node.nodeType === 3
            ? node.parentElement
            : node;

    return el
        ? el.closest(
            ".note-editor-line," +
            ".list-content"
        )
        : null;

}


/* ================================= */
/* RANGE INTERSECTION */
/* ================================= */

function rangeTouches(range, node) {

    try {

        if (
            typeof range.intersectsNode
                === "function"
        ) {

            return (
                range.intersectsNode(node)
            );

        }

    }

    catch (err) {

        /* fall through */

    }


    try {

        const nodeRange =
            document.createRange();

        nodeRange.selectNode(node);

        if (
            nodeRange.compareBoundaryPoints(
                Range.END_TO_START,
                range
            ) <= 0
        ) {

            return false;

        }

        if (
            nodeRange.compareBoundaryPoints(
                Range.START_TO_END,
                range
            ) >= 0
        ) {

            return false;

        }

        return true;

    }

    catch (err) {

        return false;

    }

}


/* ================================= */
/* SELECTED TEXT SIZE */
/* ================================= */

function changeSelectedFontSize(delta) {

    const editor =
        document.getElementById(
            "noteEditor"
        );


    const sel =
        window.getSelection();


    if (
        !sel.rangeCount ||
        sel.isCollapsed
    ) {

        editor.focus();

        changeAllFontSize(delta);

        return;

    }


    const range =
        sel.getRangeAt(0);


    if (!range.toString().trim()) {

        editor.focus();

        changeAllFontSize(delta);

        return;

    }


    const startBlock =
        getLineBlock(
            range.startContainer
        );

    const endBlock =
        getLineBlock(
            range.endContainer
        );


    /* SINGLE LINE */

    if (
        startBlock &&
        endBlock &&
        startBlock === endBlock
    ) {

        let node =
            range.commonAncestorContainer;

        let el =
            node.nodeType === 3
                ? node.parentElement
                : node;


        let current =
            getFontSize(el);

        if (
            current === null
        ) {

            current =
                getFontSize(editor);

        }

        if (
            current === null
        ) {

            current = 18;

        }


        const size =
            clampFontSize(
                current + delta
            );


        const sizeSpan =
            document.createElement(
                "span"
            );

        sizeSpan.style.fontSize =
            size + "px";


        const fragment =
            range.extractContents();

        sizeSpan.appendChild(
            fragment
        );

        range.insertNode(
            sizeSpan
        );


        const after =
            window.getSelection();

        const keep =
            document.createRange();

        keep.selectNodeContents(
            sizeSpan
        );

        after.removeAllRanges();

        after.addRange(keep);


        saveCurrentNote();

        recordEdit();

        return;

    }


    /* MULTIPLE LINES */

    const blocks =
        editor.querySelectorAll(
            ".note-editor-line," +
            ".list-content"
        );


    /*
        Collect every touched line FIRST,
        before changing anything. Mutating
        mid-loop can invalidate the range.
    */

    const touched = [];

    blocks.forEach(function(block) {

        if (
            rangeTouches(
                range,
                block
            )
        ) {

            touched.push(block);

        }

    });


    const resizedSpans = [];


    touched.forEach(function(block) {

        let cur =
            getFontSize(block);

        if (
            cur === null
        ) {

            cur = getFontSize(editor);

        }

        if (
            cur === null
        ) {

            cur = 18;

        }


        const size =
            clampFontSize(
                cur + delta
            );


        /*
            Wrap ONLY the block's contents,
            never the block itself, so the
            bullet/check circles stay put.
        */

        const wrap =
            document.createElement(
                "span"
            );

        wrap.style.fontSize =
            size + "px";


        while (block.firstChild) {

            wrap.appendChild(
                block.firstChild
            );

        }

        block.appendChild(wrap);

        resizedSpans.push(wrap);

    });


    /*
        Keep the highlight across all the
        resized lines.
    */

    if (resizedSpans.length) {

        const keep =
            document.createRange();

        keep.selectNodeContents(
            resizedSpans[0]
        );


        const last =
            document.createRange();

        last.selectNodeContents(
            resizedSpans[
                resizedSpans.length - 1
            ]
        );

        keep.setEnd(
            last.endContainer,
            last.endOffset
        );


        const after =
            window.getSelection();

        after.removeAllRanges();

        after.addRange(keep);

    }


    saveCurrentNote();

    recordEdit();

}


/* ================================= */
/* ALL TEXT SIZE */
/* ================================= */

function changeAllFontSize(delta) {

    const editor =
        document.getElementById(
            "noteEditor"
        );


    /*
        Shift the base editor font size by
        delta. Regular text inherits this.
    */

    let current =
        getFontSize(editor);

    if (
        current === null
    ) {

        current = 18;

    }


    editor.style.fontSize =
        clampFontSize(
            current + delta
        ) + "px";


    /*
        Shift each individually-sized span by
        the same delta, so big text stays
        bigger, small text stays smaller.
    */

    const sized =
        editor.querySelectorAll(
            "[style*='font-size']"
        );


    sized.forEach(function(el) {

        const elSize =
            parseFloat(el.style.fontSize);

        if (!elSize) {

            return;

        }

        el.style.fontSize =
            clampFontSize(
                elSize + delta
            ) + "px";

    });


    saveCurrentNote();

    recordEdit();

}


/* ================================= */
/* INCREASE TEXT */
/* ================================= */

function increaseText() {

    changeSelectedFontSize(2);

}


/* ================================= */
/* DECREASE TEXT */
/* ================================= */

function decreaseText() {

    changeSelectedFontSize(-2);

}


/* ================================= */
/* NORMAL -> CHECKLIST */
/* ================================= */

function convertLineToChecklist(line) {

    const text =
        line.innerText;


    const newLine =
        document.createElement(
            "div"
        );


    newLine.className =
        "checklist-line";


    const circle =
        document.createElement(
            "span"
        );


    circle.className =
        "check-circle";


    circle.contentEditable =
        "false";


    circle.onclick =
        function(event) {

            event.preventDefault();

            event.stopPropagation();

            toggleCheck(
                circle
            );

        };


    const content =
        document.createElement(
            "span"
        );


    content.className =
        "list-content";


    content.contentEditable =
        "true";


    content.textContent =
        text;


    newLine.appendChild(
        circle
    );


    newLine.appendChild(
        content
    );


    line.parentNode.replaceChild(
        newLine,
        line
    );


    placeCursorAtEnd(
        content
    );


    saveCurrentNote();

    saveHistoryState();

}

    const content =
        document.createElement(

        "click",
        function(event) {

            const content =
                event.target.closest(
                    ".list-content"
                );


            if (content) {

            }

        }
    );


/* ================================= */
/* COPY WITH MARKERS */
/* ================================= */

/*
    When copying selection that includes
    checklist or bullet lines, include the
    ☐/☑/• markers in the copied text.
*/

document
    .getElementById("noteEditor")
    .addEventListener(
        "copy",
        function(event) {

            const selection =
                window.getSelection();

            if (
                !selection.rangeCount ||
                selection.isCollapsed
            ) {

                return;

            }


            const range =
                selection.getRangeAt(0);


            const editor =
                document.getElementById(
                    "noteEditor"
                );


            const lines =
                editor.querySelectorAll(
                    ".note-editor-line," +
                    ".checklist-line," +
                    ".bullet-line"
                );


            const pieces = [];

            let hasList = false;


            lines.forEach(function(line) {

                if (
                    !rangeTouches(
                        range,
                        line
                    )
                ) {

                    return;

                }


                let prefix = "";


                if (
                    line.classList.contains(
                        "checklist-line"
                    )
                ) {

                    hasList = true;


                    const circle =
                        line.querySelector(
                            ".check-circle"
                        );


                    const checked =
                        circle &&
                        circle.classList.contains(
                            "checked"
                        );


                    prefix =
                        checked
                            ? "☑ "
                            : "☐ ";

                }

                else if (
                    line.classList.contains(
                        "bullet-line"
                    )
                ) {

                    hasList = true;

                    prefix =
                        "• ";

                }


                const contentEl =
                    line.querySelector(
                        ".list-content"
                    ) || line;


                pieces.push(
                    prefix +
                    contentEl.innerText
                );

            });


            if (
                !hasList ||
                pieces.length === 0
            ) {

                return;

            }


            event.preventDefault();

            event.clipboardData.setData(
                "text/plain",
                pieces.join("\n")
            );

        }
    );


/* ================================= */
/* BOLD BUTTON STATE */
/* ================================= */

document
    .addEventListener(
        "selectionchange",
        function() {

            const editor =
                document.getElementById(
                    "noteEditor"
                );


            if (
                !editor ||
                document.activeElement
                    !== editor
            ) {

                return;

            }


            const btn =
                document.getElementById(
                    "boldButton"
                );


            const active =
                document.queryCommandState(
                    "bold"
                );


            if (active) {

                btn.classList.add(
                    "bold-on"
                );

            }

            else {

                btn.classList.remove(
                    "bold-on"
                );

            }

        }
    );


/* ================================= */
/* PLACE CURSOR START */
/* ================================= */

function placeCursorAtStart(
    element
) {

    if (!element) {

        return;

    }


    const range =
        document.createRange();


    const selection =
        window.getSelection();


    range.selectNodeContents(
        element
    );


    range.collapse(true);


    selection.removeAllRanges();

    selection.addRange(range);


    element.focus();

}


/* ================================= */
/* PLACE CURSOR END */
/* ================================= */

function placeCursorAtEnd(
    element
) {

    if (!element) {

        return;

    }


    const range =
        document.createRange();


    const selection =
        window.getSelection();


    range.selectNodeContents(
        element
    );


    range.collapse(false);


    selection.removeAllRanges();

    selection.addRange(range);


    element.focus();

}


/* ================================= */
/* CLOSE EDITOR */
/* ================================= */

function closeEditor() {

    saveCurrentNote();


    clearTimeout(
        historyTimer
    );


    currentNoteId = null;


    document.getElementById(
        "editorPage"
    ).style.display = "none";


    document.getElementById(
        "notesHome"
    ).style.display = "block";


    renderNotes();

}


/* ================================= */
/* INITIAL LOAD */
/* ================================= */

renderNotes();

</script>
