<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Projects - Green Neon Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        :root {
            --bg: #0a0e17;
            --bg-secondary: #111827;
            --primary: #00ff88;
            --primary-dark: #00c96b;
            --primary-glow: rgba(0, 255, 136, 0.3);
            --accent: #00ff88;
            --text: #e8fdf5;
            --text-muted: #88a8a0;
            --card: #1a252f;
            --border: #2a3a4a;
            --radius: 12px;
        }

        /* ========== Green Neon Animated Background ========== */
        .bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-canvas::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 300%;
            height: 300%;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(0, 255, 136, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(0, 255, 136, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 15% 70%, rgba(0, 255, 136, 0.05) 0%, transparent 50%);
            z-index: -1;
            animation: bgFlow 20s ease-in-out infinite;
        }

        @keyframes bgFlow {
            0%, 100% { transform: rotate(0deg) translate(0, 0); }
            50% { transform: rotate(90deg) translate(50px, -50px); }
        }

        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVQYV2N89XrYQBBAC07e1L8AAAAASUVORK5CYII=");
            opacity: 0.03;
            animation: noiseAnimate 20s infinite linear;
        }

        @keyframes noiseAnimate {
            0% { opacity: 0.02; }
            50% { opacity: 0.04; }
            100% { opacity: 0.02; }
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 8s ease-in-out infinite;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--primary);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: #0066ff;
            bottom: -50px;
            right: -50px;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }

        /* ========== Main Content ========== */
        .main-content {
            position: relative;
            z-index: 10;
            padding: 80px 20px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ========== Tabs ========== */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab-btn {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 14px 28px;
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .tab-btn:hover {
            background: var(--primary);
            color: var(--bg);
            box-shadow: 0 0 30px var(--primary-glow);
        }

        .tab-btn.active {
            background: var(--primary);
            color: var(--bg);
            box-shadow: 0 0 40px var(--primary-glow), 0 0 20px var(--primary-dark);
        }

        /* ========== Projects Grid ========== */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            padding: 0;
            list-style: none;
            z-index: 100;
        }

        .project-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 0%;
            background: var(--primary);
            border-radius: var(--radius) 0 0 var(--radius);
            transition: height 0.3s ease;
        }

        .project-card:hover {
            border-color: var(--primary);
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 255, 136, 0.2);
        }

        .project-card:hover::before {
            height: 100%;
        }

        .project-card.h Japanese-btn {
            border-color: var(--primary);
        }

        .project-card:hover .project-title {
            color: var(--bg);
        }

        .project-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        .project-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .tag {
            font-size: 0.65rem;
            padding: 4px 8px;
            background: rgba(0, 255, 136, 0.15);
            border: 1px solid var(--primary);
            border-radius: 20px;
            color: var(--primary);
            font-weight: 500;
        }

        /* ========== Japanese Button ========== */
        .japanese-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: var(--primary);
            color: var(--bg);
            border: none;
            border-radius: 50px;
            padding: 16px 32px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 30px var(--primary-glow), 0 0 10px var(--primary-dark);
            transition: all 0.3s ease;
            animation: pulse 2s ease-in-out infinite;
        }

        .japanese-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px var(--primary-glow), 0 0 20px var(--primary-dark);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 30px var(--primary-glow), 0 0 10px var(--primary-dark); }
            50% { box-shadow: 0 0 50px var(--primary-glow), 0 0 25px var(--primary-dark); }
        }

        /* ========== Modal ========== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px;
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        .modal-title {
            font-size: 2rem;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .modal-text {
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: var(--primary);
            color: var(--bg);
        }

        /* ========== Responsive ========== */
        @media (max-width: 768px) {
            .japanese-btn {
                top: 16px;
                right: 16px;
                padding: 14px 24px;
                font-size: 0.85rem;
            }

            .main-content {
                padding: 60px 16px 16px;
            }

            .tab-btn {
                padding: 12px 20px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-canvas"></div>
    <div class="noise"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <!-- Japanese Button for Mom -->
    <button class="japanese-btn" onclick="openJapanese()" aria-label="Japanese Learning App for Mom">
        日本語 (Japanese)
    </button>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Tabs -->
        <div class="tabs" role="tablist">
            <button class="tab-btn active" data-tab="main">Main Projects</button>
            <button class="tab-btn" data-tab="other">Other Projects</button>
        </div>

        <!-- Projects Grid -->
        <ul class="projects-grid" id="projectsGrid">
            <!-- Main Projects will be populated by JS -->
        </ul>
    </div>

    <!-- Japanese Modal -->
    <div class="modal" id="japaneseModal">
        <div class="modal-content">
            <div class="close-btn" onclick="closeJapanese()">&times;</div>
            <h2 class="modal-title">Sakura Japanese - For Mom</h2>
            <p class="modal-text">
                Comprehensive Japanese learning app with grammar lessons (N5→N1), vocabulary with kanji, translator, flashcards, quizzes, voice recognition, and progress tracking. Designed to help learn Japanese in an engaging way.
            </p>
            <p>
                <a href="Japanese/index.html" style="color: var(--primary); text-decoration: underline;">Open Sakura Japanese App</a>
            </p>
        </div>
    </div>

    <script>
        // Project data - all projects not in .gitignore
        const allProjects = [
            // Main Projects (excluding Type and Chat2 to put them in Other)
            { name: 'Money Tracker', path: 'Money/index.html', tags: ['finance', 'tracking'], description: 'Money tracker with IndexedDB storage, earnings/bank/mommy tracking' },
            { name: 'Green Chat', path: 'GreenChat/index.html', tags: ['chat', 'real-time'], description: 'Real-time chat application' },
            { name: 'Blue Chat', path: 'bluechat/', tags: ['chat', 'messaging'], description: 'Blue-themed chat variant' },
            { name: 'Notes', path: 'Notes/index.html', tags: ['notes', 'editor'], description: 'Notes app with editor, checklists, and search' },
            { name: 'Massage Tracker', path: 'Massage/index.html', tags: ['tracking', 'health'], description: 'Massage tracking project' },
            { name: 'AI Assistant', path: 'ai.html', tags: ['ai', 'assistant'], description: 'Jake AI assistant with chat, model selection, language preference' },
            { name: 'App Ideas Generator', path: 'appmaker.html', tags: ['generator', 'ideas'], description: 'Standalone app ideas generator' },
            { name: 'Siam Smart Home', path: 'SiamSmartHome/index.html', tags: ['smart-home', 'info'], description: 'Smart home information dashboard' },

            // Other Projects (includes Type, Chat2/Chat3, Zoo, and small things)
            { name: 'Type - Typing Speed Test', path: 'Type/index.html', tags: ['typing', 'test'], description: 'Typing speed test with accuracy tracking' },
            { name: 'Chat2 - Neon Chat', path: 'Chat2/index.html', tags: ['chat', 'neon'], description: 'Neon chat application with modern UI' },
            { name: 'Zoo', path: 'Zoo/index.html', tags: ['pictures', 'animals'], description: 'Zoo pictures with animal facts' },
            { name: 'Language Learning', path: 'language/index.html', tags: ['learning', 'languages'], description: 'Kotonoha language learning tool with Japanese support' },
            { name: 'Japanese - Sakura Japanese', path: 'Japanese/index.html', tags: ['japanese', 'learning'], description: 'Comprehensive learn Japanese app (N5→N1, vocab, kanji, grammar, translator, flashcards, quiz, voice)' },
            { name: 'Grind Hub', path: 'GrindHub/index.html', tags: ['tasks', 'productivity'], description: 'Task/grind management with dashboard, lists, and tasks' },
            { name: 'My Grind Hub', path: 'MyGrindHub/index.html', tags: ['private', 'tasks'], description: 'Password-protected grind hub with money tracking' },
            { name: 'Arcade', path: 'Arcade/index.html', tags: ['games', 'collection'], description: 'Collection of 33+ classic arcade games' },
        ];

        // Categorize projects
        const mainProjects = allProjects.filter((_, i) => i < 8);
        const otherProjects = allProjects.filter((_, i) => i >= 8);

        // Render projects function
        function renderProjects(projects, containerId) {
            const grid = document.getElementById(containerId);
            grid.innerHTML = '';
            
            projects.forEach(project => {
                const card = document.createElement('li');
                card.className = 'project-card';
                card.innerHTML = `
                    <h3 class="project-title">${project.name}</h3>
                    <p class="project-subtitle">${project.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</p>
                    <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 8px; line-height: 1.4;">${project.description}</p>
                    <a href="${project.path}" style="color: var(--primary); text-decoration: underline; font-weight: 500;">View Project</a>
                `;
                grid.appendChild(card);
            });
        }

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const tab = btn.dataset.tab;
                if (tab === 'main') {
                    renderProjects(mainProjects, 'projectsGrid');
                } else {
                    renderProjects(otherProjects, 'projectsGrid');
                }
            });
        });

        // Initialize with main projects
        document.addEventListener('DOMContentLoaded', () => {
            renderProjects(mainProjects, 'projectsGrid');
        });

        // Japanese modal functionality
        function openJapanese() {
            const modal = document.getElementById('japaneseModal');
            modal.classList.add('active');
        }

        function closeJapanese() {
            const modal = document.getElementById('japaneseModal');
            modal.classList.remove('active');
        }

        // Close modal on overlay click
        document.getElementById('japaneseModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('japaneseModal')) {
                closeJapanese();
            }
        });
    </script>
</body>
</html>
