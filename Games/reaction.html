<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Time</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        h1 { margin-bottom: 20px; color: #00d4ff; }
        #area { width: 300px; height: 300px; background: #ff0055; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; border-radius: 15px; transition: background 0.2s; user-select: none; }
        #area.waiting { background: #ff0055; }
        #area.ready { background: #ffff00; color: #1a1a2e; }
        #area.go { background: #00ff88; color: #1a1a2e; }
        #result { font-size: 20px; margin-top: 20px; min-height: 30px; }
        button { padding: 10px 20px; font-size: 16px; background: #00d4ff; border: none; border-radius: 5px; cursor: pointer; color: #1a1a2e; font-weight: bold; margin-top: 10px; }
        button:hover { background: #00aacc; }
    </style>
</head>
<body>
    <h1>Reaction Time Test</h1>
    <div id="area" class="waiting" onclick="clicked()">Click to start</div>
    <div id="result"></div>
    <button onclick="resetGame()">Try Again</button>
    <script>
        let state = 'idle', startTime, timeout;

        function resetGame() {
            state = 'idle';
            document.getElementById('area').className = 'waiting';
            document.getElementById('area').textContent = 'Click to start';
            document.getElementById('result').textContent = '';
        }

        function clicked() {
            if (state === 'idle') {
                state = 'waiting';
                document.getElementById('area').className = 'ready';
                document.getElementById('area').textContent = 'Wait for green...';
                timeout = setTimeout(() => {
                    state = 'go';
                    document.getElementById('area').className = 'go';
                    document.getElementById('area').textContent = 'CLICK NOW!';
                    startTime = Date.now();
                }, Math.random() * 3000 + 1000);
            } else if (state === 'waiting') {
                clearTimeout(timeout);
                document.getElementById('result').textContent = 'Too early! Click to try again.';
                state = 'idle';
                document.getElementById('area').className = 'waiting';
                document.getElementById('area').textContent = 'Click to start';
            } else if (state === 'go') {
                const time = Date.now() - startTime;
                document.getElementById('result').textContent = `${time}ms - ${time < 200 ? 'Lightning fast!' : time < 300 ? 'Great!' : time < 500 ? 'Good' : 'Keep practicing!'}`;
                state = 'idle';
                document.getElementById('area').className = 'waiting';
                document.getElementById('area').textContent = 'Click to play again';
            }
        }
    </script>
</body>
</html>
