<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        h1 { margin-bottom: 10px; color: #00ff88; }
        canvas { border: 2px solid #00ff88; background: #0f0f23; }
        #score { font-size: 20px; margin: 10px 0; }
        button { padding: 10px 20px; font-size: 16px; background: #00ff88; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #00cc6a; }
    </style>
</head>
<body>
    <h1>Snake</h1>
    <div id="score">Score: 0</div>
    <canvas id="game" width="400" height="400"></canvas>
    <button onclick="startGame()">Start Game</button>
    <p style="margin-top:10px">Use arrow keys to move</p>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const box = 20;
        let snake, food, dir, score, game;

        function startGame() {
            snake = [{x: 9*box, y: 9*box}];
            dir = {x: 1, y: 0};
            score = 0;
            placeFood();
            document.getElementById('score').textContent = 'Score: ' + score;
            if (game) clearInterval(game);
            game = setInterval(draw, 100);
        }

        function placeFood() {
            food = {x: Math.floor(Math.random()*20)*box, y: Math.floor(Math.random()*20)*box};
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp' && dir.y === 0) dir = {x:0,y:-1};
            else if (e.key === 'ArrowDown' && dir.y === 0) dir = {x:0,y:1};
            else if (e.key === 'ArrowLeft' && dir.x === 0) dir = {x:-1,y:0};
            else if (e.key === 'ArrowRight' && dir.x === 0) dir = {x:1,y:0};
        });

        function draw() {
            ctx.fillStyle = '#0f0f23';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#ff0055';
            ctx.fillRect(food.x, food.y, box-2, box-2);

            snake.forEach((s, i) => {
                ctx.fillStyle = i === 0 ? '#00ff88' : '#00cc6a';
                ctx.fillRect(s.x, s.y, box-2, box-2);
            });

            const head = {x: snake[0].x + dir.x*box, y: snake[0].y + dir.y*box};

            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height || snake.some(s => s.x === head.x && s.y === head.y)) {
                clearInterval(game);
                alert('Game Over! Score: ' + score);
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = 'Score: ' + score;
                placeFood();
            } else {
                snake.pop();
            }
        }
    </script>
</body>
</html>
