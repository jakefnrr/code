<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        h1 { margin-bottom: 10px; color: #bf00ff; }
        #score { font-size: 20px; margin: 10px 0; }
        .grid { display: grid; grid-template-columns: repeat(4, 80px); gap: 5px; background: #16213e; padding: 5px; border-radius: 8px; }
        .cell { width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; border-radius: 5px; }
        button { padding: 10px 20px; font-size: 16px; background: #bf00ff; border: none; border-radius: 5px; cursor: pointer; margin-top: 15px; color: white; }
        button:hover { background: #9900cc; }
    </style>
</head>
<body>
    <h1>2048</h1>
    <div id="score">Score: 0</div>
    <div class="grid" id="grid"></div>
    <button onclick="startGame()">New Game</button>
    <p style="margin-top:10px">Use arrow keys to slide tiles</p>
    <script>
        let grid, score;

        function startGame() {
            grid = Array(4).fill(null).map(() => Array(4).fill(0));
            score = 0;
            addTile();
            addTile();
            render();
        }

        function addTile() {
            const empty = [];
            grid.forEach((row, r) => row.forEach((cell, c) => { if (cell === 0) empty.push({r, c}); }));
            if (empty.length) {
                const {r, c} = empty[Math.floor(Math.random() * empty.length)];
                grid[r][c] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function render() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';
            const colors = {0:'#16213e',2:'#00d4ff',4:'#00aacc',8:'#00ff88',16:'#ffff00',32:'#ff6600',64:'#ff0055',128:'#bf00ff',256:'#ff00ff',512:'#00ff88',1024:'#ffff00',2048:'#ff6600'};
            grid.forEach(row => row.forEach(cell => {
                const div = document.createElement('div');
                div.className = 'cell';
                div.textContent = cell || '';
                div.style.background = colors[cell] || '#16213e';
                div.style.color = cell > 4 ? '#1a1a2e' : 'white';
                gridEl.appendChild(div);
            }));
            document.getElementById('score').textContent = 'Score: ' + score;
        }

        function slide(row) {
            let arr = row.filter(x => x);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i+1]) { arr[i] *= 2; score += arr[i]; arr.splice(i+1, 1); }
            }
            while (arr.length < 4) arr.push(0);
            return arr;
        }

        function move(dir) {
            let moved = false;
            const old = JSON.stringify(grid);
            if (dir === 'left') grid = grid.map(row => slide(row));
            else if (dir === 'right') grid = grid.map(row => slide([...row].reverse()).reverse());
            else if (dir === 'up') { grid = transpose(grid); grid = grid.map(row => slide(row)); grid = transpose(grid); }
            else if (dir === 'down') { grid = transpose(grid); grid = grid.map(row => slide([...row].reverse()).reverse()); grid = transpose(grid); }
            if (JSON.stringify(grid) !== old) { moved = true; addTile(); }
            render();
            if (grid.flat().every(x => x)) alert('Game Over! Score: ' + score);
        }

        function transpose(arr) { return arr[0].map((_, i) => arr.map(row => row[i])); }

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') move('left');
            else if (e.key === 'ArrowRight') move('right');
            else if (e.key === 'ArrowUp') move('up');
            else if (e.key === 'ArrowDown') move('down');
        });

        startGame();
    </script>
</body>
</html>
