<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Mole</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        h1 { margin-bottom: 10px; color: #ffff00; }
        #stats { font-size: 18px; margin: 10px 0; }
        .grid { display: grid; grid-template-columns: repeat(3, 100px); gap: 10px; margin: 20px 0; }
        .hole { width: 100px; height: 100px; background: #16213e; border: 2px solid #ffff00; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; cursor: pointer; }
        .hole.active { background: #3a3a5e; }
        button { padding: 10px 20px; font-size: 16px; background: #ffff00; border: none; border-radius: 5px; cursor: pointer; color: #1a1a2e; font-weight: bold; }
        button:hover { background: #cccc00; }
    </style>
</head>
<body>
    <h1>Whack-a-Mole</h1>
    <div id="stats">Score: 0 | Time: 30s</div>
    <div class="grid" id="grid"></div>
    <button onclick="startGame()">Start Game</button>
    <p style="margin-top:10px">Click the moles!</p>
    <script>
        let score, timeLeft, game, moleTimer, activeMole = -1;

        function startGame() {
            score = 0;
            timeLeft = 30;
            document.getElementById('stats').textContent = `Score: ${score} | Time: ${timeLeft}s`;
            render();
            if (game) clearInterval(game);
            if (moleTimer) clearInterval(moleTimer);
            game = setInterval(() => {
                timeLeft--;
                document.getElementById('stats').textContent = `Score: ${score} | Time: ${timeLeft}s`;
                if (timeLeft <= 0) { clearInterval(game); clearInterval(moleTimer); alert('Time Up! Score: ' + score); }
            }, 1000);
            moleTimer = setInterval(() => {
                activeMole = Math.floor(Math.random() * 9);
                render();
                setTimeout(() => { activeMole = -1; render(); }, 800);
            }, 1000);
        }

        function render() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const div = document.createElement('div');
                div.className = 'hole' + (i === activeMole ? ' active' : '');
                div.textContent = i === activeMole ? '🐹' : '';
                div.onclick = () => whack(i);
                grid.appendChild(div);
            }
        }

        function whack(i) {
            if (i === activeMole) {
                score += 10;
                activeMole = -1;
                document.getElementById('stats').textContent = `Score: ${score} | Time: ${timeLeft}s`;
                render();
            }
        }

        startGame();
    </script>
</body>
</html>
