<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        h1 { margin-bottom: 20px; color: #ff00ff; }
        #status { font-size: 24px; margin-bottom: 20px; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 5px; }
        .cell { width: 100px; height: 100px; background: #16213e; border: 2px solid #ff00ff; display: flex; align-items: center; justify-content: center; font-size: 48px; cursor: pointer; }
        .cell:hover { background: #1a1a40; }
        button { padding: 10px 20px; font-size: 16px; background: #ff00ff; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px; color: white; }
        button:hover { background: #cc00cc; }
    </style>
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div id="status">Player X's turn</div>
    <div class="board" id="board"></div>
    <button onclick="resetGame()">New Game</button>
    <script>
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;
        const winCombos = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

        function createBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            board.forEach((cell, i) => {
                const div = document.createElement('div');
                div.className = 'cell';
                div.textContent = cell;
                div.onclick = () => makeMove(i);
                boardEl.appendChild(div);
            });
        }

        function makeMove(i) {
            if (board[i] || !gameActive) return;
            board[i] = currentPlayer;
            createBoard();
            if (checkWin()) {
                document.getElementById('status').textContent = 'Player ' + currentPlayer + ' wins!';
                gameActive = false;
            } else if (board.every(c => c)) {
                document.getElementById('status').textContent = "It's a tie!";
                gameActive = false;
            } else {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                document.getElementById('status').textContent = "Player " + currentPlayer + "'s turn";
            }
        }

        function checkWin() {
            return winCombos.some(combo => combo.every(i => board[i] === currentPlayer));
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            gameActive = true;
            document.getElementById('status').textContent = "Player X's turn";
            createBoard();
        }

        createBoard();
    </script>
</body>
</html>
