<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nightmare Breakout — Coming Soon</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#020604;
    color:#eafff1;
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
    text-align:center;
    padding:20px;
}
body::before{
    content:"";
    position:fixed;inset:0;pointer-events:none;
    background:
        radial-gradient(circle at 50% 30%,rgba(60,255,150,.08),transparent 45%),
        radial-gradient(circle at 50% 110%,rgba(0,80,30,.25),transparent 55%);
}
.eyebrow{
    font-size:10px;font-weight:800;letter-spacing:4px;
    color:#4dff9d;text-transform:uppercase;margin-bottom:18px;
}
h1{
    font-size:clamp(30px,6vw,58px);
    font-weight:900;letter-spacing:4px;text-transform:uppercase;
    color:#f2fff6;
    text-shadow:0 0 15px rgba(60,255,150,.8),0 0 55px rgba(60,255,150,.3);
}
h1 .accent{color:#3dff8f}
.coming{
    margin-top:26px;
    display:inline-block;
    padding:12px 34px;
    border:1px solid rgba(60,255,145,.5);
    border-radius:99px;
    color:#0a1f10;
    background:linear-gradient(180deg,#54ff9d,#2ee071);
    font-size:13px;font-weight:900;letter-spacing:4px;text-transform:uppercase;
    box-shadow:0 0 25px rgba(60,255,145,.4);
    animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
    0%,100%{box-shadow:0 0 25px rgba(60,255,145,.4)}
    50%{box-shadow:0 0 45px rgba(80,255,160,.7)}
}
p{margin-top:22px;font-size:11px;letter-spacing:2px;color:rgba(210,255,228,.45);text-transform:uppercase}
a.back{
    margin-top:44px;
    color:#6bffab;text-decoration:none;
    font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;
    border:1px solid rgba(60,255,140,.4);border-radius:10px;
    padding:10px 22px;background:rgba(0,20,8,.6);
    transition:.2s ease;
}
a.back:hover{background:rgba(20,60,30,.7);border-color:#4cff9a;box-shadow:0 0 18px rgba(50,255,140,.35)}
</style>
</head>
<body>
    <div class="eyebrow">Godot Games Hub</div>
    <h1>Nightmare <span class="accent">Breakout</span></h1>
    <div class="coming">Coming Soon</div>
    <p>3D First-Person Horror Escape Room</p>
    <a class="back" href="../index.html">← Back to Godot Games</a>
</body>
</html>
